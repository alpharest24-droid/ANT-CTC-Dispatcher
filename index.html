      if (!t.path.length || t.path[t.path.length - 1] !== tb) continue;
      if (!this.g.createAutoRoute(b, path)) return;
      t.appendExitPath(path);
      return;
    }
  }
  sameTrackSignalAhead(b, tb, down) {
    const geo = this.g.geo;
    const my = geo.sigProgress(b, tb, down);
    let best = null, bp = Infinity;
    for (const s of geo.onTrack(tb)) {
      if (s === b) continue;
      const t = sigType(s);
      if (t === 'DISTANT' || t === 'REPEATER') continue;
      if (sigDown(s) !== down) continue;
      const p = geo.sigProgress(s, tb, down);
      if (p > my + 0.01 && p < bp) { bp = p; best = J.str(s, 'id', ''); }
    }
    return best;
  }
  extendUnsignaled(trains, occupied) {
    const geo = this.g.geo, pb = this.g.pb;
    for (const t of trains) {
      if (t.finished || t.manual || t.stopped) continue;
      const p = t.path;
      if (!p.length || t.idx !== p.length - 1) continue;
      const last = p[p.length - 1];
      if (!pb.has(last)) continue;
      if (t.isStopPlatform(last)) continue;
      if (t.turnback && !t.reversed) continue;
      if (t.terminate) continue;
      const down = t.mode === 'NORMAL';
      let hasSignal = false;
      for (const s of geo.onTrack(last)) {
        const ty = sigType(s);
        if (ty === 'DISTANT' || ty === 'REPEATER') continue;
        if (sigDown(s) === down) { hasSignal = true; break; }
      }
      if (hasSignal || geo.isEnd(last)) continue;
      const ext = pb.extendFrom(p, down);
      if (ext.length <= p.length) continue;
      const add = ext.slice(p.length);
      if (add.some(id => occupied.has(id))) continue;
      t.appendExitPath(add);
    }
  }
}

// =====================================================================
//  AspectCascadeManager
// =====================================================================
class AspectCascade {
  constructor(game) { this.g = game; this.tick = 0; }
  dirSignal(tid, mode) {
    const down = mode === 'NORMAL';
    for (const s of this.g.geo.onTrack(tid)) {
      if (isAutoSig(s)) continue;
      if (down === !sigDown(s)) continue;
      return J.str(s, 'id', null);
    }
    return null;
  }
  blockSignal(tid, mode) {
    const down = mode !== 'REVERSE';
    for (const s of this.g.geo.onTrack(tid)) {
      if (sigType(s) !== 'BLOCK') continue;
      if (sigDown(s) === down) return J.str(s, 'id', null);
    }
    return null;
  }
  set(route, id, state) { if (route.isReleased(id)) return; this.g.setSignal(id, state); }
  updateRoutes(routes, trains) {
    const geo = this.g.geo;
    for (const r of routes) {
      if (r.locking || r.cancelling) continue;
      if (J.eqi(r.sigType, 'BLOCK')) continue;
      const cur = r.signalId, path = r.path;
      if (cur == null || !path.length) continue;
      let owner = null;
      for (const t of trains) if (path.includes(t.curId)) { owner = t; break; }
      let other = false;
      for (const t of trains) { if (t === owner) continue; if (path.includes(t.curId)) { other = true; break; } }
      if (other) { this.set(r, cur, 'RED'); continue; }
      if (J.eqi(r.sigType, 'SHUNT')) { this.set(r, cur, 'GREEN'); continue; }
      const dest = path[path.length - 1];
      if (J.eqi(r.sigType, 'LANGSUNG') || geo.isEnd(dest)) {
        this.set(r, cur, 'GREEN');
        for (let i = 0; i < path.length - 1; i++) {
          const ex = this.dirSignal(path[i], r.mode);
          if (ex != null && !J.eqi(ex, cur)) this.set(r, ex, 'GREEN');
        }
      } else {
        let next = this.dirSignal(dest, r.mode);
        if (next == null) next = this.blockSignal(dest, r.mode);
        if (next != null && !J.eqi(next, cur)) {
          const ns = this.g.sigState(next);
          this.set(r, cur, (J.eqi(ns, 'GREEN') || J.eqi(ns, 'YELLOW')) ? 'GREEN' : 'YELLOW');
        } else this.set(r, cur, 'YELLOW');
      }
    }
  }
  updateDistant() {
    if (++this.tick % 5 !== 0) return;
    for (const d of (J.arr(this.g.geo.data, 'signals') || [])) {
      if (!d) continue;
      const t = sigType(d), distant = t === 'DISTANT', rep = t === 'REPEATER';
      if (!distant && !rep) continue;
      let ahead = J.str(d, 'protects', '');
      if (!ahead) ahead = this.g.pb.findSignalAhead(d);
      let aspect = distant ? 'GREEN' : 'RED';
      if (ahead) {
        const m = this.g.geo.signal(ahead);
        if (m) {
          const ms = J.str(m, 'state', 'RED').toUpperCase();
          if (rep) aspect = ms; else if (ms !== 'GREEN') aspect = 'YELLOW';
        }
      }
      d.state = aspect;
    }
  }
}

// =====================================================================
//  ActiveRoute
// =====================================================================
class ActiveRoute {
  constructor(id, signalId, sigType, target, path, conflicts) {
    this.id = id; this.signalId = signalId; this.sigType = sigType; this.target = target;
    this.path = path || []; this.conflicts = conflicts || [];
    this.locking = false; this.mode = 'NORMAL'; this.entered = false; this.cancelling = false; this.cancelStart = -1;
    this.released = new Set(); this.lockUntil = 0;
  }
  get cancelPending() { return this.cancelStart >= 0; }
  isReleased(id) { return id != null && this.released.has(String(id).toUpperCase()); }
  markReleased(id) { if (id != null) this.released.add(String(id).toUpperCase()); }
  toJson() { return { id: this.id, sig: this.signalId, type: this.sigType, target: this.target, path: this.path.slice(), conf: this.conflicts.slice(), mode: this.mode, entered: this.entered, cancelStart: this.cancelStart, released: [...this.released] }; }
  static fromJson(o) {
    const r = new ActiveRoute(J.str(o, 'id', ''), J.has(o, 'sig') ? J.str(o, 'sig') : null, J.str(o, 'type', 'ENTRY'), J.int(o, 'target', -1),
      (J.arr(o, 'path') || []).map(Number), (J.arr(o, 'conf') || []).map(String));
    r.mode = J.str(o, 'mode', 'NORMAL'); r.entered = J.bool(o, 'entered', false); r.cancelStart = J.num(o, 'cancelStart', -1);
    for (const s of (J.arr(o, 'released') || [])) r.released.add(String(s).toUpperCase());
    return r;
  }
}

// =====================================================================
//  Bagian 4: TrainSpawner
// =====================================================================
class Spawner {
  constructor(game) { this.g = game; this.rakesSpawned = new Set(); this.rakeTick = 0; this.warned = new Set(); this.warnSink = null; }
  get geo() { return this.g.geo; }
  get pb() { return this.g.pb; }
  spawnArr() { const d = this.geo.data; return J.arr(d, 'spawn-track') || J.arr(d, 'spawn_tracks'); }
  lenOf(id) { const t = this.geo.track(id); if (!t) return -1; const m = J.num(t, 'length', 50); return m > 0 ? m : 50; }
  speedOf(id) { const t = this.geo.track(id); const v = t ? J.int(t, 'speed', 30) : 30; return v > 0 ? v : 30; }
  buildSpawnPath(id, mode) { return this.pb.buildFromTrack(id, !J.eqi(mode, 'REVERSE')); }
  warn(time, no, msg) {
    if (this.warnSink) { this.warnSink.push(msg); return; }
    const k = no + msg;
    if (!this.warned.has(k)) { this.warned.add(k); this.g.log(time, '[' + no + '] Standby gagal: ' + msg, 'red'); }
  }
  applyConsist(t, sch) {
    if (!t || !sch) return;
    const cat = J.str(sch, 'category', J.str(sch, 'type', ''));
    t.setFreight(J.eqi(cat, 'FREIGHT'));
    const cars = J.int(sch, 'cars', -1);
    if (cars >= 0) t.setCarCount(cars);
    t.setLengths(J.num(sch, 'loco_length', 0), J.num(sch, 'car_length', 0), J.num(sch, 'car_gap', -1));
    t.terminate = J.bool(sch, 'terminate', false);
    t.markScheduled();
  }
  isStandby(sch) {
    if (J.bool(sch, 'is_leg', false)) return false;
    return J.bool(sch, 'start_at_platform', false) || J.bool(sch, 'sb', false);
  }
  isSpawnDue(cur, sp) { const d = timeDiff(cur, sp); return d <= 0 && d >= -1200; }
  centerY(id) { const c = this.geo.c(id); return c ? (c[1] + c[3]) / 2 : NaN; }
  inferMode(spawnId, joinId) {
    const a = this.centerY(spawnId), b = this.centerY(joinId);
    if (Number.isNaN(a) || Number.isNaN(b)) return 'NORMAL';
    return a > b ? 'REVERSE' : 'NORMAL';
  }

  checkByTime(time, trains, processed) {
    this.spawnRakes(time, trains);
    const schedules = J.arr(this.geo.data, 'schedules');
    if (!schedules) return;
    for (const sch of schedules) {
      if (!this.isStandby(sch)) continue;
      const n = J.str(sch, 'train_number', '');
      if (!processed.includes(n)) this.spawnStandby(sch, time, trains, processed);
    }
    const active = trains.map(t => t.no);
    for (const sch of schedules) {
      const no = J.str(sch, 'train_number', ''), name = J.str(sch, 'train_name', 'KA');
      const spawnTime = J.str(sch, 'spawn_time', ''), arr = J.str(sch, 'arr_time', '--:--'), dep = J.str(sch, 'dep_time', '--:--');
      const entry = J.int(sch, 'entry_track', -1), plat = J.int(sch, 'target_platform', -1);
      if (processed.includes(no) || active.includes(no)) continue;
      if (!spawnTime || !this.isSpawnDue(time, spawnTime)) continue;
      let spawnId = entry, joinId = entry, spawnMode = null;
      for (const sp of (this.spawnArr() || [])) {
        const id = J.int(sp, 'id', -1), jw = J.int(sp, 'joinWith', -1);
        if (id === entry || jw === entry) { spawnId = id; joinId = jw; spawnMode = J.str(sp, 'mode', 'NORMAL'); break; }
      }
      const mode = spawnMode != null ? spawnMode : this.inferMode(spawnId, joinId);
      let path = this.buildSpawnPath(spawnId, mode);
      if (!path) { path = [spawnId]; if (joinId !== spawnId && joinId !== -1) path.push(joinId); }
      if (trains.some(o => path.includes(o.curId))) continue;
      const t = new Train(no, name, arr, dep, path.slice(), mode, plat);
      t.setTurnback(J.bool(sch, 'turnback', false), J.int(sch, 'exit_track', -1));
      this.applyConsist(t, sch);
      processed.push(no);
      if (this.isStandby(sch)) continue;
      t.startAtLineSpeed(this.geo, this.speedOf(path[0]));
      this.g.score.logSpawn(no, time);
      this.g.log(time, `[${no} ${name}] Auto-Spawn di track ${spawnId} (${Math.round(t.speed)} km/j)`, 'cyan');
      this.g.onTrainSpawned(t);
      break;
    }
  }

  spawnForRoute(route, mode, target, time, processed) {
    let name = null, no = null, arr = '--:--', dep = '--:--', tb = false, exit = -1, plat = target, matched = null;
    const schedules = J.arr(this.geo.data, 'schedules');
    if (schedules) {
      for (const sch of schedules) {
        const tNum = J.str(sch, 'train_number', ''), spawnTime = J.str(sch, 'spawn_time', ''), aTime = J.str(sch, 'arr_time', '00:00');
        const entry = J.int(sch, 'entry_track', -1), schPlat = J.int(sch, 'target_platform', -1);
        if (processed.includes(tNum)) continue;
        let match = false, prepend = null;
        const first = route.path.length ? route.path[0] : -1;
        if (route.path.includes(entry)) match = true;
        else for (const sp of (this.spawnArr() || [])) {
          const spId = J.int(sp, 'id', -1);
          const pre = this.buildSpawnPath(spId, J.str(sp, 'mode', 'NORMAL'));
          if (!pre || first !== pre[pre.length - 1]) continue;
          if (entry === spId || pre.includes(entry)) { match = true; prepend = pre; break; }
        }
        if (match && target !== -1) {
          if (schPlat !== target && schPlat > 0 && !SN.isAllowedPlatform(tNum, target)) match = false;
        }
        if (match) {
          const tt = spawnTime ? spawnTime : aTime;
          const d = timeDiff(time, tt);
          if (d <= 0 && d >= -1200) {
            matched = sch;
            if (prepend) for (let k = prepend.length - 2; k >= 0; k--) { const id = prepend[k]; if (!route.path.includes(id)) route.path.unshift(id); }
            break;
          }
        }
      }
    }
    if (!matched) return false;
    name = J.str(matched, 'train_name', 'KA Express'); no = J.str(matched, 'train_number', 'KA 100');
    arr = J.str(matched, 'arr_time', arr); dep = J.str(matched, 'dep_time', dep);
    tb = J.bool(matched, 'turnback', false); exit = J.int(matched, 'exit_track', -1); plat = J.int(matched, 'target_platform', target);
    if (!processed.includes(no)) processed.push(no);
    this.g.score.logSpawn(no, time);
    this.g.log(time, `[${no} ${name}] Masuk seksi ${route.path.length ? route.path[0] : -1}`, 'cyan');
    const t = new Train(no, name, arr, dep, route.path.slice(), mode, plat);
    t.setTurnback(tb, exit);
    this.applyConsist(t, matched);
    if (route.path.length) t.startAtLineSpeed(this.geo, this.speedOf(route.path[0]));
    this.g.onTrainSpawned(t);
    return true;
  }

  spawnStandby(sch, time, trains, processed) {
    const no = J.str(sch, 'train_number', J.str(sch, 'no', '?'));
    try {
      const name = J.str(sch, 'train_name', J.str(sch, 'n', 'KA'));
      const arr = J.str(sch, 'arr_time', '--:--'), dep = J.str(sch, 'dep_time', '--:--');
      const primary = J.int(sch, 'target_platform', J.int(sch, 'tT', -1));
      const mode = J.eqi(J.str(sch, 'mode', J.str(sch, 'm', 'NORMAL')), 'REVERSE') ? 'REVERSE' : 'NORMAL';
      const cands = SN.platformsOf(sch);
      if (!cands.length && primary > 0) cands.push(primary);
      if (!cands.length) { this.warn(time, no, 'target_platform tidak valid'); return; }
      const t = new Train(no, name, arr, dep, [], mode, cands[0]);
      t.lastSim = time;
      t.setTurnback(J.bool(sch, 'turnback', J.bool(sch, 'tb', false)), J.int(sch, 'exit_track', J.int(sch, 'xT', -1)));
      this.applyConsist(t, sch);
      let where = null;
      const fails = [];
      this.warnSink = fails;
      try { for (const p of cands) { where = this.placeStandby(t, no, p, mode, time, trains); if (where) break; } }
      finally { this.warnSink = null; }
      if (!where) { fails.forEach(f => this.warn(time, no, f)); return; }
      processed.push(no);
      this.g.score.logSpawn(no, arr);
      this.g.score.logArrival(no, arr);
      this.g.log(time, `[${no} ${name}] Standby di ${where}`, 'yellow');
      this.g.onTrainSpawned(t);
    } catch (e) { console.warn(e); this.warn(time, no, 'error ' + e); }
  }
  placeStandby(t, no, platform, mode, time, trains) {
    const geo = this.geo;
    if (platform <= 0) { this.warn(time, no, 'target_platform tidak valid'); return null; }
    const isPlat = !!geo.platform(platform), onBuf = !isPlat && geo.hasBuffer(platform);
    if (!isPlat && !onBuf) { this.warn(time, no, 'tT ' + platform + ' bukan track peron atau track ber-buffer'); return null; }
    if (onBuf) return this.placeAtBuffer(t, no, platform, mode, time, trains) ? 'track ' + platform + ' (buffer stop)' : null;
    for (const o of trains) if (o.curId === platform) { this.warn(time, no, 'peron ' + platform + ' terisi'); return null; }
    if (!t.placeAtPlatform(geo, platform, this.pb)) { this.warn(time, no, 'gagal menempatkan di peron ' + platform); return null; }
    for (const o of trains) {
      const occ = o.occupied(geo);
      for (const tid of t.path) if (occ.includes(tid)) { this.warn(time, no, 'track ' + tid + ' terisi kereta lain'); return null; }
    }
    return geo.platLabel(platform);
  }
  endPoint(tid, down, front) {
    const c = this.geo.c(tid);
    const flip = !down && c[1] < c[3];
    return (front !== flip) ? [c[2], c[3]] : [c[0], c[1]];
  }
  isFreeEnd(self, p) {
    for (const [id, c] of this.geo.coords) {
      if (id === self) continue;
      if ((Math.abs(c[0] - p[0]) < 0.002 && Math.abs(c[1] - p[1]) < 0.002) || (Math.abs(c[2] - p[0]) < 0.002 && Math.abs(c[3] - p[1]) < 0.002)) return false;
    }
    return true;
  }
  headCap(tid, down) {
    let cap = 0.97;
    const c = this.geo.c(tid);
    if (!c) return cap;
    const m = this.geo.meters(tid);
    for (const s of this.geo.onTrack(tid)) {
      const ty = sigType(s);
      if (ty === 'DISTANT' || ty === 'REPEATER') continue;
      if (sigDown(s) !== down) continue;
      const pf = this.geo.sigProgress(s, tid, down);
      if (pf < 0.25) continue;
      cap = Math.min(cap, pf - 2 / m);
    }
    return cap;
  }
  placeAtBuffer(t, no, tid, mode, time, trains) {
    const geo = this.geo, down = mode !== 'REVERSE';
    if (this.lenOf(tid) <= 0 || !geo.c(tid)) { this.warn(time, no, 'track ' + tid + ' tidak ditemukan'); return false; }
    const len = geo.meters(tid), gap = BUFFER_STOP_M, need = t.totalLen();
    const behind = this.isFreeEnd(tid, this.endPoint(tid, down, false));
    const ahead = this.isFreeEnd(tid, this.endPoint(tid, down, true));
    const path = [];
    let head;
    if (behind) {
      head = (need + gap) / len;
      if (head > this.headCap(tid, down)) { this.warn(time, no, `track ${tid} (${Math.round(len)} m) terlalu pendek untuk rangkaian ${Math.round(need)} m`); return false; }
      path.push(tid);
    } else if (ahead) {
      head = Math.max(0, 1 - gap / len);
      const missing = need + 5 - head * len;
      if (missing > 0) path.push(...this.pb.backPath(tid, down, missing));
      path.push(tid);
      let rest = 0;
      for (let k = 0; k < path.length - 1; k++) rest += geo.meters(path[k]);
      if (rest + head * len < need) { this.warn(time, no, `rel di belakang track ${tid} kurang panjang untuk rangkaian ${Math.round(need)} m`); return false; }
    } else { this.warn(time, no, `ujung buffer track ${tid} tidak ditemukan (kedua ujung tersambung)`); return false; }
    for (const o of trains) {
      const occ = o.occupied(geo);
      for (const id of path) if (occ.includes(id)) { this.warn(time, no, 'track ' + id + ' terisi kereta lain'); return false; }
    }
    t.placeStandbyOnTrack(geo, path, head, tid);
    return true;
  }

  spawnRakes(time, trains) {
    const arr = J.arr(this.geo.data, 'rakes');
    if (!arr || !arr.length) return;
    if ((this.rakeTick++ % 2) !== 0) return;
    arr.forEach((r, i) => {
      if (!r) return;
      const id = J.str(r, 'no', J.str(r, 'id', 'RANGKAIAN ' + (i + 1)));
      if (this.rakesSpawned.has(id)) return;
      let sw = J.str(r, 'sW', J.str(r, 'spawn_time', ''));
      if (sw) { sw = toHHmm(sw); if (timeDiff(time, sw) > 0) return; }
      this.spawnRake(r, id, time, trains);
    });
  }
  spawnRake(r, id, time, trains) {
    const geo = this.geo;
    try {
      const name = J.str(r, 'n', J.str(r, 'name', 'Rangkaian'));
      const freight = J.eqi(J.str(r, 't', J.str(r, 'category', 'PASSENGER')), 'FREIGHT');
      const mode = J.eqi(J.str(r, 'm', J.str(r, 'mode', 'NORMAL')), 'REVERSE') ? 'REVERSE' : 'NORMAL';
      const down = mode !== 'REVERSE';
      const t = new Train(id, name, '--:--', '--:--', [], mode, -1);
      t.setFreight(freight);
      t.setLengths(J.num(r, 'll', 0), J.num(r, 'cl', J.num(r, 'car_length', 0)), J.num(r, 'cg', J.num(r, 'car_gap', -1)));
      const defCars = (freight ? FREIGHT_CARS : PASSENGER_CARS) - 1;
      t.makeRake(J.int(r, 'nc', J.int(r, 'cars', defCars)));
      let path = [];
      const pa = J.arr(r, 'path');
      let head;
      if (pa && pa.length) { path = pa.map(v => Number(v)); head = path[path.length - 1]; }
      else head = J.int(r, 'track', J.int(r, 'onTrack', -1));
      const headLen = this.lenOf(head);
      if (headLen <= 0) { this.warn(time, id, 'track ' + head + ' tidak ditemukan'); this.rakesSpawned.add(id); return; }
      for (const tid of path) if (this.lenOf(tid) <= 0) { this.warn(time, id, 'track ' + tid + ' pada path tidak ditemukan'); this.rakesSpawned.add(id); return; }
      let p = J.num(r, 'pos', J.num(r, 'p', 0.5));
      if (Number.isNaN(p)) p = 0.5;
      p = Math.max(0.05, Math.min(0.97, p));
      const need = t.totalLen() + 5;
      if (!path.length) { path.push(head); const miss = need - p * headLen; if (miss > 0) path.unshift(...this.pb.backPath(head, down, miss)); }
      let rest = 0;
      for (let k = 0; k < path.length - 1; k++) rest += this.lenOf(path[k]);
      if (rest + p * headLen < need) {
        p = Math.min(0.97, p + (need - rest - p * headLen) / headLen);
        if (rest + p * headLen < need) this.warn(time, id, 'rel di belakang kurang panjang, ekor terpotong');
      }
      for (const o of trains) { const occ = o.occupied(geo); for (const tid of path) if (occ.includes(tid)) { this.warn(time, id, 'track ' + tid + ' terisi kereta lain'); return; } }
      t.placeStandby(path, p);
      this.rakesSpawned.add(id);
      this.g.log(time, `[${id} ${name}] Rangkaian standby di track ${head}`, 'yellow');
      this.g.onTrainSpawned(t);
    } catch (e) { console.warn(e); this.warn(time, id, 'error ' + e); this.rakesSpawned.add(id); }
  }
}

// =====================================================================
//  Bagian 5: Game (port RouteManager) - inti simulasi
// =====================================================================
const STEP_MS = 33, MAX_STEPS = 48, YX = 2.0;   // YX: skala sumbu Y layar (sama rasio dengan HP potret)
const SHUNT_KMH = 15, DIVERGE_KMH = 30, CANCEL_DELAY_SEC = 120, CANCEL_STEP_MS = 400, SWITCH_MOVE_MS = 1500, SWITCH_ZONE_M = 25;

class Game {
  constructor() {
    this.logger = new TrainLogger();
    this.power = new PowerSupply();
    this.data = null;
    this.hooks = { sound() {}, announce() {}, changed() {} };
    this.reset0();
  }
  reset0() {
    this.routes = []; this.trains = []; this.processed = []; this.timers = [];
    this.moving = new Map(); this.lockedSw = new Set(); this.occSw = new Set();
    this.pendingRoute = null; this.pendingPath = null; this.pendingDesc = ''; this.pendingWrongWay = false;
    this.selSig = null; this.selSigType = null; this.selSigTrack = null;
    this.pendingCancel = null; this.pendingCancelDesc = '';
    this.lastError = null; this.selLoco = null; this.selectedSwitch = null;
    this.collision = false; this.collisionX = 0; this.collisionY = 0; this.collisionText = ''; this.derail = false; this.collCounter = 0;
    this.finished = false; this.lastTrackSeen = new Map();
    this.heldCount = new Map(); this.alertStations = new Set(); this.heldSeen = new Set(); this.ackedHeld = new Set();
    this.upcoming = []; this.spawnTick = 0; this.stepCount = 0; this.speed = 1;
    this.crossings = [];
  }

  // ---------- data ----------
  setTrackData(data) {
    this.reset0();
    this.data = data;
    SN.normalize(data); SpawnTrackBuilder.ensure(data); SN.expandLegs(data); SN.normalize(data);
    for (const s of (J.arr(data, 'signals') || [])) if (s && !J.has(s, 'state')) s.state = 'RED';
    this.geo = new Geo(data);
    this.pb = new PathBuilder(this.geo);
    this.logger.clear();
    this.score = new ScoreManager(this.logger);
    this.power.load(data);
    this.spawner = new Spawner(this);
    this.block = new BlockSignalManager(this);
    this.cascade = new AspectCascade(this);
    this.initClock();
    for (const sch of (J.arr(data, 'schedules') || [])) {
      const num = J.str(sch, 'train_number', ''), name = J.str(sch, 'train_name', '');
      const spawn = J.str(sch, 'spawn_time', J.str(sch, 'leg_spawn', J.str(sch, 'arr_time', '00:00')));
      const arr = J.str(sch, 'arr_time', '00:00'), dep = J.str(sch, 'dep_time', '00:00');
      const through = this.platformLabel(sch) === 'LANGSUNG';
      const plat = J.int(sch, 'target_platform', -1), fin = J.bool(sch, 'terminate', false);
      const exitT = through ? plat : (fin ? -1 : J.int(sch, 'exit_track', -1));
      const p = this.score.register(num, name, spawn, arr, dep, through ? -1 : plat, exitT > 0 ? exitT : -1, through);
      if (J.bool(sch, 'partial', false)) p.partial = true;
    }
    this.initCrossings();
    this.validateEntrySignals();
    this.validateSignalPlacement();
    this.updateSwitchLocks();
  }
  initClock() {
    const st = J.str(this.data, 'startTime', '');
    let sec = 0;
    if (st) sec = parseSec(toHHmm(st));
    else {
      let earliest = '23:59';
      for (const s of (J.arr(this.data, 'schedules') || [])) { const sp = J.str(s, 'spawn_time', ''); if (sp && sp < earliest) earliest = sp; }
      sec = parseSec(earliest) - 120;
      if (sec < 0) sec += 86400;
    }
    this.simMs = sec * 1000;
  }
  simSec() { return Math.floor(this.simMs / 1000); }
  time() { return fmtTime(this.simSec(), true); }
  timeHHmm() { return fmtTime(this.simSec(), false); }
  log(time, text, color) { this.logger.add(time || this.timeHHmm(), text, color); }
  err(m) { this.lastError = m; }
  consumeError() { const e = this.lastError; this.lastError = null; return e; }
  sigState(id) { const s = this.geo.signal(id); return s ? J.str(s, 'state', 'RED') : 'RED'; }
  setSignal(id, st) { const s = this.geo.signal(id); if (s) s.state = st; }
  later(ms, fn) { this.timers.push({ at: this.simMs + ms, fn }); }
  findSchedule(no) { return (J.arr(this.data, 'schedules') || []).find(s => s && J.eqi(no, J.str(s, 'train_number', ''))) || null; }
  stationName(code) { const m = this.data && this.data.station_names; if (m && m[code]) return m[code]; const s = (J.arr(this.data, 'stations') || []).find(x => J.eqi(J.str(x, 'code', ''), code)); return s ? J.str(s, 'name', code) : code; }

  platformLabel(sch) {
    const p = J.int(sch, 'target_platform', -1);
    const through = J.bool(sch, 'is_through', false) || J.eqi(J.str(sch, 'type', ''), 'LANGSUNG') || p <= 0 || J.eqi(this.geo.type(p), 'END') || J.eqi(this.geo.type(p), 'EXIT');
    if (through) return 'LANGSUNG';
    return this.geo.platLabel(p) + (J.bool(sch, 'turnback', false) ? ' (BALIK)' : '');
  }

  validateEntrySignals() {
    const codes = (J.arr(this.data, 'stations') || []).map(o => { let c = J.str(o, 'code', '').trim(); if (!c) c = Game.stationCode(J.str(o, 'name', '')); return c.toUpperCase(); });
    for (const s of (J.arr(this.data, 'signals') || [])) {
      if (!s || sigType(s) !== 'ENTRY') continue;
      const id = J.str(s, 'id', '?'), code = J.str(s, 'station', '').trim().toUpperCase();
      if (!code) this.log(null, `Sinyal masuk ${id} tidak punya field "station"`, 'red');
      else if (!codes.includes(code)) this.log(null, `Sinyal masuk ${id}: stasiun "${code}" tidak ada di daftar stations`, 'red');
    }
  }
  validateSignalPlacement() {
    for (const s of (J.arr(this.data, 'signals') || [])) {
      if (!s) continue;
      const id = J.str(s, 'id', '?'), tid = J.int(s, 'onTrack', -1), c = this.geo.c(tid);
      if (!c) { this.log(null, `Sinyal ${id}: onTrack ${tid} tidak ada`, 'red'); continue; }
      const dx = c[2] - c[0], dy = c[3] - c[1], l2 = dx * dx + dy * dy;
      if (l2 === 0) continue;
      const raw = ((J.num(s, 'x') - c[0]) * dx + (J.num(s, 'y') - c[1]) * dy) / l2;
      const px = c[0] + dx * Math.max(0, Math.min(1, raw)), py = c[1] + dy * Math.max(0, Math.min(1, raw));
      const dist = Math.hypot(J.num(s, 'x') - px, J.num(s, 'y') - py);
      if (dist > 0.04) this.log(null, `Sinyal ${id}: jauh dari track ${tid} (${dist.toFixed(3)})`, 'red');
      if (raw < -0.02 || raw > 1.02) this.log(null, `Sinyal ${id}: di luar rentang track ${tid}`, 'red');
    }
  }
  static stationCode(name) { const a = name.lastIndexOf('('), b = name.lastIndexOf(')'); if (a >= 0 && b > a) return name.substring(a + 1, b).trim().toUpperCase(); return name.trim().toUpperCase(); }

  // ---------- kereta muncul ----------
  onTrainSpawned(t) {
    t.game = this;
    if (t.hasLoco && !t.isDwelling()) this.hooks.sound('spawn');
    this.trains.push(t);
    t.updateCoords(this.geo);
    this.attachWaitingRoutes(t);
  }
  onArrived(t) { this.score.logArrival(t.no, t.lastSim); }
  onFinished(t) { this.score.logExitTime(t.no, t.lastSim); }

  // ---------- loop ----------
  advance(wallMs) {
    if (!this.data || this.finished || this.speed <= 0) return 0;
    this.acc = (this.acc || 0) + Math.min(250, wallMs) * this.speed;
    let steps = 0;
    while (this.acc >= STEP_MS && steps < MAX_STEPS) {
      this.step();
      this.acc -= STEP_MS; steps++;
      if (this.finished) break;
    }
    if (steps >= MAX_STEPS) this.acc = 0;
    return steps;
  }
  step() {
    this.simMs += STEP_MS;
    this.stepCount++;
    // timer permainan
    if (this.timers.length) {
      const due = this.timers.filter(x => x.at <= this.simMs);
      if (due.length) { this.timers = this.timers.filter(x => x.at > this.simMs); due.forEach(x => { try { x.fn(); } catch (e) { console.warn(e); } }); }
    }
    const time = this.time();
    if ((this.spawnTick++ % 15) === 0) this.spawner.checkByTime(this.timeHHmm(), this.trains, this.processed);
    this.checkMissionEnd(time);
    this.block.update(this.trains);
    this.cascade.updateRoutes(this.routes, this.trains);
    this.cascade.updateDistant();
    this.power.update(parseSec(time));
    const pm = this.power.consume();
    if (pm) this.log(null, pm, 'red');

    const dt = 0.033, geo = this.geo, toRemove = [];
    for (const tr of this.trains) {
      this.attachWaitingRoutes(tr);
      let cap = this.shuntCap(tr);
      const dc = this.divergeCap(tr);
      if (dc > 0 && (cap <= 0 || dc < cap)) cap = dc;
      tr.speedCap = cap;
    }
    for (const t of this.trains.slice()) {
      if (t.manual) { this.manualStep(t, dt, time); if (t.finished) toRemove.push(t); continue; }
      if (this.checkTerminate(t, time)) { toRemove.push(t); continue; }
      const cur = t.curId, next = t.nextId;
      t.followSwitches(this.pb);
      let nextOcc = false;
      if (next !== -1) for (const o of this.trains) if (o !== t && o.curId === next) { nextOcc = true; break; }
      if (cur !== -1) {
        const len = Math.round(geo.meters(cur)) || 50;
        const tk = geo.track(cur);
        const sp = tk ? J.int(tk, 'speed', 30) : 30;
        t.advanceProgress(len, sp, dt, nextOcc, geo, time);
        t.updateCoords(geo);
        if (t.speed < 0.5 && !t.isDwelling() && !t.stopped) t.held += dt;
        if (t.consumeArrived()) {
          this.score.logPlatform(t.no, t.arrPlat, t.arrOver, time);
          if (this.speed <= 2) this.hooks.announce(t, this.findSchedule(t.no), t.arrPlat);
        }
        if (t.consumeDeparted()) {
          this.score.logDeparture(t.no, time);
          this.hooks.sound('horn');
          this.startNextLeg(t, time);
        }
      }
      if (t.finished) toRemove.push(t);
    }
    this.attachReverseRoutes();
    this.releaseRoutesBehindTrains();
    this.updateCancelTimers();
    if (this.stepCount % 5 === 0) this.updateArrivalIndicators();
    if (this.stepCount % 30 === 0) this.checkUpcomingArrivals();
    for (const t of toRemove) {
      const i = this.trains.indexOf(t);
      if (i >= 0) this.trains.splice(i, 1);
      const exitTrack = t.path.length ? t.path[t.path.length - 1] : -1;
      this.score.logExit(t.no, time, exitTrack, t.held);
      this.hooks.sound('exit');
      const rm = this.routes.filter(r => this.isRouteOwnedBy(t, r));
      for (const r of rm) { if (r.signalId) this.setSignal(r.signalId, 'RED'); }
      this.routes = this.routes.filter(r => !rm.includes(r));
      if (this.selLoco === t) this.selLoco = null;
    }
    this.checkCollisions(time);
    this.checkDerailment(time);
    if (this.stepCount % 6 === 0) { this.updateSwitchLocks(); this.updateCrossings(); }
  }

  shuntCap(t) { for (const r of this.routes) { if (r.locking || !J.eqi(r.sigType, 'SHUNT')) continue; if (this.isRouteOwnedBy(t, r)) return SHUNT_KMH; } return 0; }
  divergeCap(t) { for (const r of this.routes) { if (r.locking || !J.eqi(r.sigType, 'ENTRY')) continue; if (this.isRouteOwnedBy(t, r) && this.routeDiverges(r.path)) return DIVERGE_KMH; } return 0; }
  routeDiverges(path) {
    if (!path || !path.length) return false;
    for (const s of (J.arr(this.data, 'switches') || [])) {
      if (!s) continue;
      const br = this.geo.branches(s);
      const used = this.geo.usedBranch(path, br, this.geo.pivot(br));
      if (used === -1) continue;
      const idx = br.indexOf(used);
      const straight = br.length === 3 ? idx === 1 : idx === 0;
      if (!straight) return true;
    }
    return false;
  }
  routeIndicator(sigId) {
    for (const r of this.routes) {
      if (r.locking || !J.eqi(sigId, r.signalId)) continue;
      return this.routeDiverges(r.path) ? String(Math.trunc(DIVERGE_KMH / 10)) : null;
    }
    return null;
  }

  checkTerminate(t, time) {
    if (!t.terminate || t.manual || t.stopped || t.finished) return false;
    if (!t.isDwelling()) return false;
    const dep = t.dep;
    if (dep && dep !== '--:--' && timeDiff(time, dep) > 0) return false;
    const plat = t.curId;
    this.score.logDeparture(t.no, time);
    this.score.logExit(t.no, time, plat, t.held);
    this.log(null, `[${t.no}] Perjalanan berakhir di ${this.geo.platLabel(plat)}`, 'cyan');
    this.lastTrackSeen.delete(t);
    return true;
  }
  startNextLeg(t, time) {
    const cur = this.findSchedule(t.no);
    if (!cur) return;
    const nextNo = J.str(cur, 'next_leg', '');
    const nx = nextNo ? this.findSchedule(nextNo) : null;
    if (!nx) return;
    const oldNo = t.no, newNo = J.str(nx, 'train_number', nextNo);
    t.startLeg(newNo, J.str(nx, 'train_name', t.name), J.str(nx, 'arr_time', '--:--'), J.str(nx, 'dep_time', '--:--'),
      J.int(nx, 'target_platform', -1), J.bool(nx, 'turnback', false), J.int(nx, 'exit_track', -1));
    t.terminate = J.bool(nx, 'terminate', false);
    if (!this.processed.includes(newNo)) this.processed.push(newNo);
    this.score.logSpawn(newNo, time);
    this.log(time, `[${oldNo}] berangkat sebagai [${newNo}]`, 'cyan');
  }
  checkMissionEnd(time) {
    if (this.finished) return;
    const sch = J.arr(this.data, 'schedules');
    if (!sch || !sch.length) return;
    let running = 0;
    for (const t of this.trains) if (t.hasLoco || !t.stopped) running++;
    const allDone = this.processed.length >= sch.length && running === 0;
    let timeUp = false;
    let end = J.str(this.data, 'endTime', '');
    if (end) { if (!end.includes(':') && end.length === 4) end = end.substring(0, 2) + ':' + end.substring(2); timeUp = timeDiff(time, end) <= 0; }
    if (allDone || timeUp) { this.finished = true; this.score.finalizeAll(); this.hooks.changed('finished'); }
  }
  endMission() { if (this.finished) return; this.finished = true; this.score.finalizeAll(); this.hooks.changed('finished'); }

  // ---------- manual ----------
  manualStep(t, dt, time) {
    t.manualPrepare(this.geo);
    const g = Coupling.nearestAhead(t, this.trains, this.geo);
    const couplable = t.coachCount() === 0 && g.other && !g.other.hasLoco && g.other.stopped;
    const tk = this.geo.track(t.curId);
    const limit = tk ? J.int(tk, 'speed', 30) : 30;
    t.advanceManual(this.geo, this.pb, limit, dt, g.other ? g.meters : Infinity, couplable, time);
    t.updateCoords(this.geo);
    if (t.consumeRanOff()) { this.onRunOff(t, time); return; }
    const spad = t.consumeSpad();
    if (spad) this.log(time, `[${t.no}] Menerobos sinyal ${spad}`, 'red');
  }
  selectLoco(t) { if (this.selLoco) this.selLoco.setManualDir(0); this.selLoco = t === this.selLoco ? null : t; }
  startManual(t) {
    if (!t || !this.trains.includes(t) || !t.hasLoco) return;
    if (t.speed > 0.5) { this.err('Kereta harus berhenti dulu'); return; }
    if (!t.manual) t.beginManual();
    if (this.selLoco && this.selLoco !== t) this.selLoco.setManualDir(0);
    this.selLoco = t;
  }
  manualCommand(cmd) {
    const l = this.selLoco;
    if (!l || !this.trains.includes(l)) { this.selLoco = null; return; }
    switch (cmd) {
      case 0: l.changeManualKmh(-5); break;
      case 1: l.setManualDir(-1); break;
      case 2: l.setManualDir(0); break;
      case 3: l.setManualDir(1); break;
      case 4: l.changeManualKmh(5); break;
      case 5: if (l.coachCount() >= 1) this.decouple(l); else this.coupleSelected(l); break;
      case 6:
        if (l.coachCount() < 1) break;
        if (l.speed > 0.5) { this.err('Kereta harus berhenti dulu'); break; }
        if (!l.endManual()) { this.err('Loko harus di depan (tekan MAJU dulu)'); break; }
        this.selLoco = null; break;
    }
  }
  contextReady() {
    const l = this.selLoco;
    if (!l || l.speed > 0.5) return false;
    if (l.coachCount() >= 1) return true;
    const g = Coupling.nearestAhead(l, this.trains, this.geo);
    return g.other && !g.other.hasLoco && g.other.stopped && g.meters <= Coupling.GAP_M;
  }
  decouple(t) {
    if (!t.hasLoco || t.coachCount() < 1) { this.err('Tidak ada gerbong yang bisa dilepas'); return; }
    if (t.speed > 0.5) { this.err('Kereta harus berhenti dulu'); return; }
    const loco = t.splitLoco(this.geo);
    if (!loco) { this.err('Gagal melepas lokomotif'); return; }
    loco.game = this;
    this.trains.push(loco);
    if (this.selLoco) this.selLoco.setManualDir(0);
    this.selLoco = loco;
    t.updateCoords(this.geo); loco.updateCoords(this.geo);
    this.log(null, `[${t.no}] Lokomotif dilepas`, 'yellow');
  }
  coupleSelected(l) {
    if (l.coachCount() !== 0) { this.err('Lokomotif sudah tersambung'); return; }
    if (l.speed > 0.5) { this.err('Berhenti dulu untuk menyambung'); return; }
    const g = Coupling.nearestAhead(l, this.trains, this.geo);
    if (!g.other || g.other.hasLoco || !g.other.stopped) { this.err('Tidak ada rangkaian tanpa loko di depan'); return; }
    if (g.meters > Coupling.GAP_M) { this.err('Terlalu jauh (' + Math.round(g.meters) + ' m), dekatkan lagi'); return; }
    const rake = g.other;
    const takeId = l.scheduled;
    const info = { no: l.no, name: l.name, arr: l.arr, dep: l.dep, plat: l.schedPlat, exit: l.exitTrack, tb: l.turnback };
    const rakeNo = rake.no;
    if (!Coupling.couple(l, g, this.geo)) { this.err('Gagal menyambung'); return; }
    this.trains.splice(this.trains.indexOf(l), 1);
    this.selLoco = null;
    if (takeId) {
      rake.startLeg(info.no, info.name, info.arr, info.dep, info.plat, info.tb, info.exit);
      this.log(null, `[${rakeNo}] tersambung loko, menjadi [${info.no} ${info.name}]`, 'cyan');

  // ---------- anjlok & tabrakan ----------

  // ---------- wesel ----------

  // ---------- perlintasan ----------
  initCrossings() {

      const ta = J.arr(o, 'tracks');

      const c = { id: J.str(o, 'id', 'JPL' + (i + 1)), tracks: ta.map(v => Number(v)), manual: false, sawTrain: false, routeOn: false };
      const no = J.str(o, 'no', '');

      c.sound = J.str(o, 'sound', 'crossing');

  // ---------- simpan / muat ----------

  captureState() {

    for (const s of (J.arr(this.data, 'switches') || [])) { if (!s) continue; const v = { state: J.str(s, 'state', 'NORMAL') }; if (J.has(s, 'pos')) v.pos = J.int(s, 'pos', 0); sw[J.str(s, 'id', '')] = v; }

      routes: this.routes.map(r => r.toJson()), trains: this.trains.map(t => t.toJson()), selLoco: this.trains.indexOf(this.selLoco),

      for (const s of (J.arr(this.data, 'switches') || [])) { const v = sw[J.str(s, 'id', '')]; if (!v) continue; if (J.has(v, 'pos')) s.pos = J.int(v, 'pos', 0); if (J.has(v, 'state')) s.state = v.state; }

const ANTD = { VER: 1, HEAD: 5, IV: 12, MAGIC: [0x41, 0x4E, 0x54, 0x44], MAGIC_S: [0x41, 0x4E, 0x54, 0x53] };
function antdKind(b) {
  if (!b || b.length < ANTD.HEAD + ANTD.IV) return null;
  const m = [b[0], b[1], b[2], b[3]].join();
  if (m === ANTD.MAGIC.join()) return 'antd';
  if (m === ANTD.MAGIC_S.join()) return 'ants';
  return null;
}
async function streamBytes(bytes, stream) {
  const out = new Blob([bytes]).stream().pipeThrough(stream);
  return new Uint8Array(await new Response(out).arrayBuffer());
}
async function antdDecrypt(bytes, secret) {
  if (!window.crypto || !crypto.subtle) throw new Error('Web Crypto tidak tersedia. Buka halaman lewat https:// atau localhost (bukan file:// di sebagian browser).');
  if (typeof DecompressionStream === 'undefined') throw new Error('Browser tidak mendukung GZIP (DecompressionStream).');
  if (bytes[4] !== ANTD.VER) throw new Error('Versi berkas tidak didukung.');
  const iv = bytes.slice(ANTD.HEAD, ANTD.HEAD + ANTD.IV), ct = bytes.slice(ANTD.HEAD + ANTD.IV);
  const raw = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('antd-v1|' + secret));
  const key = await crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']);
  let gz;
  try { gz = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: bytes.slice(0, ANTD.HEAD), tagLength: 128 }, key, ct)); }
  catch (_) { const e = new Error('Secret salah atau berkas rusak.'); e.wrong = true; throw e; }
  const plain = await streamBytes(gz, new DecompressionStream('gzip'));
  return JSON.parse(new TextDecoder().decode(plain));
}

const Sound = {
  ctx: null, on: true, tts: true, lastBell: 0,

  },
  noise(dur, vol = 0.2, delay = 0, freq = 800) {

  },
  play(name) {
    if (!this.on || !this.ctx) return;
    switch (name) {
      case 'horn': this.tone(311, 0.9, 'sawtooth', 0.06); this.tone(392, 0.9, 'sawtooth', 0.05); break;
      case 'spawn': this.tone(660, 0.12, 'square', 0.05); this.tone(880, 0.14, 'square', 0.05, 0.13); break;
      case 'exit': this.tone(784, 0.18, 'sine', 0.08); this.tone(587, 0.25, 'sine', 0.08, 0.16); break;
      case 'switch': this.noise(0.06, 0.25, 0, 2500); this.tone(110, 1.3, 'sawtooth', 0.025, 0.05, 30); this.noise(0.08, 0.25, 1.4, 1800); break;

};

// Struktur statis per peta (ujung buffer, label END/SPAWN)
let Static = null;
function buildStatic() {
  const geo = game.geo;
  const ends = [];
  const free = (self, p) => { for (const [id, c] of geo.coords) { if (id === self) continue; if ((Math.abs(c[0] - p[0]) < 0.002 && Math.abs(c[1] - p[1]) < 0.002) || (Math.abs(c[2] - p[0]) < 0.002 && Math.abs(c[3] - p[1]) < 0.002)) return false; } return true; };
  for (const [id, t] of geo.tracks) {
    const c = geo.c(id);
    if (!c || c.some(Number.isNaN)) continue;
    const ty = J.str(t, 'type', '').toUpperCase();
    const buf = J.bool(t, 'buffer', false);
    for (const k of [0, 1]) {
      const p = [c[k * 2], c[k * 2 + 1]], q = [c[(1 - k) * 2], c[(1 - k) * 2 + 1]];
      if (!free(id, p)) continue;
      ends.push({ id, p, q, buf, label: (ty === 'END' || ty === 'SPAWN') ? (J.str(t, 'name', '') || (ty === 'END' ? 'KELUAR' : 'MASUK')) : '', ty });
    }
  }
  Static = { ends };
}

function trackColorMap() {

    if (r.locking) { if (blink) r.path.forEach(x => lock.add(x)); }
    else if (!J.eqi(r.sigType, 'BLOCK')) r.path.forEach(x => act.add(x));
  }
  if (game.pendingPath) game.pendingPath.forEach(x => pend.add(x));
  return { occ, act, lock, pend };
}

function draw() {
  const ctx = View.ctx, V = View;
  ctx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, V.w, V.h);
  if (!game.geo) return;
  const geo = game.geo, S = V.S;
  const z = Math.max(0.3, Math.min(1.8, S / 520));
  const lw = Math.max(2, Math.min(6, S / 140));
  const vis = (ax, ay, bx, by, m = 60) => !(Math.max(ax, bx) < -m || Math.min(ax, bx) > V.w + m || Math.max(ay, by) < -m || Math.min(ay, by) > V.h + m);
  const P = (x, y) => [V.sx(x, y), V.sy(x, y)];
  const labels = S > 260;

  // ---- gedung stasiun ----
  ctx.font = `600 ${Math.round(11 * z)}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const b of (J.arr(game.data, 'building') || [])) {
    const x = J.num(b, 'x'), t = J.num(b, 'topY'), bt = J.num(b, 'botY');
    if ([x, t, bt].some(Number.isNaN)) continue;
    const [ax, ay] = P(x + 0.025, t), [bx, by] = P(x - 0.025, bt);
    if (!vis(ax, ay, bx, by)) continue;
    ctx.fillStyle = COL.bld; ctx.strokeStyle = COL.bldEdge; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.rect(Math.min(ax, bx), Math.min(ay, by), Math.abs(bx - ax), Math.abs(by - ay)); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7f97b0';
    ctx.fillText(J.str(b, 'name', ''), (ax + bx) / 2, (ay + by) / 2);
  }
  // ---- peron ----
  for (const p of (J.arr(game.data, 'platforms') || [])) {
    const x = J.num(p, 'x'), t = J.num(p, 'topY'), bt = J.num(p, 'botY');
    if ([x, t, bt].some(Number.isNaN)) continue;
    const [ax, ay] = P(x + 0.042, t), [bx, by] = P(x + 0.022, bt);
    if (!vis(ax, ay, bx, by)) continue;
    ctx.fillStyle = COL.plat; ctx.strokeStyle = COL.platEdge;
    ctx.beginPath(); ctx.rect(Math.min(ax, bx), Math.min(ay, by), Math.abs(bx - ax), Math.abs(by - ay)); ctx.fill(); ctx.stroke();
    if (labels) {
      ctx.fillStyle = '#c7d6e6'; ctx.font = `600 ${Math.round(10 * z)}px system-ui`; ctx.textAlign = 'left';
      ctx.fillText(J.str(p, 'station', '') + ' ' + J.str(p, 'name', J.str(p, 'no', '')), Math.min(ax, bx) + 4, (ay + by) / 2);
      ctx.textAlign = 'center';
    }
  }

  // ---- track ----
  const cm = trackColorMap();
  for (const [id, t] of geo.tracks) {
    const c = geo.c(id);
    if (!c || c.some(Number.isNaN)) continue;
    const [ax, ay] = P(c[0], c[1]), [bx, by] = P(c[2], c[3]);
    if (!vis(ax, ay, bx, by)) continue;
    const ty = J.str(t, 'type', '').toUpperCase();
    let col = COL.track;
    if (cm.occ.has(id)) col = COL.occ;
    else if (cm.lock.has(id)) col = COL.lock;
    else if (cm.act.has(id)) col = COL.route;
    else if (cm.pend.has(id)) col = COL.pending;
    else if (ty === 'END' || ty === 'SPAWN') col = COL.spawn;
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'butt';
    if ((ty === 'END' || ty === 'SPAWN') && col === COL.spawn) ctx.setLineDash([lw * 2.2, lw * 1.6]); else ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    // panah arah ("dir")
    const dir = J.str(t, 'dir', '').toUpperCase();
    if ((dir === 'NORMAL' || dir === 'REVERSE') && S > 180) {
      const down = dir === 'NORMAL';
      let vx = bx - ax, vy = by - ay; const L = Math.hypot(vx, vy) || 1; vx /= L; vy /= L;
      const sgn = ((c[3] - c[1]) >= 0) === down ? 1 : -1; vx *= sgn; vy *= sgn;
      const mx = (ax + bx) / 2, my = (ay + by) / 2, a = 6 * z;
      ctx.setLineDash([]); ctx.strokeStyle = '#5f7187'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(mx - vx * a - vy * a, my - vy * a + vx * a); ctx.lineTo(mx + vx * a * 0.4, my + vy * a * 0.4); ctx.lineTo(mx - vx * a + vy * a, my - vy * a - vx * a); ctx.stroke();
    }
    if (V.showIds && S > 300) {
      ctx.fillStyle = '#6c7f93'; ctx.font = `${Math.round(9 * z)}px ui-monospace,monospace`;
      ctx.fillText(String(id), (ax + bx) / 2, (ay + by) / 2 - 8 * z);
    }
  }
  ctx.setLineDash([]);
  // ---- ujung buntu / buffer / label END-SPAWN ----
  if (Static) for (const e of Static.ends) {
    const [ax, ay] = P(e.p[0], e.p[1]), [bx, by] = P(e.q[0], e.q[1]);
    if (!vis(ax, ay, ax, ay)) continue;
    let vx = ax - bx, vy = ay - by; const L = Math.hypot(vx, vy) || 1; vx /= L; vy /= L;
    if (e.buf) {
      ctx.strokeStyle = COL.buffer; ctx.lineWidth = Math.max(3, lw);
      const a = 7 * z;
      ctx.beginPath(); ctx.moveTo(ax - vy * a, ay + vx * a); ctx.lineTo(ax + vy * a, ay - vx * a); ctx.stroke();
    }
    if (e.label && labels) {
      ctx.fillStyle = COL.spawn; ctx.font = `600 ${Math.round(10 * z)}px system-ui`;
      ctx.textAlign = vx > 0 ? 'left' : 'right';
      ctx.fillText(e.label, ax + vx * 6, ay + vy * 6 - 10 * z);
      ctx.textAlign = 'center';
    }
  }

  // ---- wesel ----
  const blinkSw = Math.floor(performance.now() / 250) % 2 === 0;
  for (const sw of (J.arr(game.data, 'switches') || [])) {
    const br = geo.branches(sw), pv = geo.pivot(br);
    if (!pv) continue;
    const [px, py] = P(pv[0], pv[1]);
    if (!vis(px, py, px, py)) continue;
    const moving = game.isSwitchMoving(sw), locked = game.isSwitchLocked(sw);
    const act = geo.activeBranch(sw);
    for (const b of br) {
      const fe = geo.farEnd(b, pv);
      if (!fe) continue;
      const [fx, fy] = P(fe[0], fe[1]);
      const k = Math.min(1, (14 * z) / (Math.hypot(fx - px, fy - py) || 1));
      const ex = px + (fx - px) * k, ey = py + (fy - py) * k;
      if (b === act && !moving) { ctx.strokeStyle = locked ? '#ffe08a' : '#ffffff'; ctx.lineWidth = lw + 1.5; }
      else if (moving && blinkSw) { ctx.strokeStyle = COL.lock; ctx.lineWidth = lw + 1; }
      else { ctx.strokeStyle = COL.bg; ctx.lineWidth = lw + 2; }
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.stroke();
    }
    const sx0 = J.num(sw, 'x'), sy0 = J.num(sw, 'y');
    const [dx, dy] = Number.isNaN(sx0) ? [px, py] : P(sx0, sy0);
    sw._sx = dx; sw._sy = dy;
    ctx.fillStyle = moving ? COL.lock : (locked ? '#c9a227' : '#4c6075');
    ctx.beginPath(); ctx.arc(dx, dy, 3.2 * z + 1, 0, Math.PI * 2); ctx.fill();
    if (labels && S > 420) {
      ctx.fillStyle = '#8aa0b6'; ctx.font = `${Math.round(9 * z)}px ui-monospace,monospace`;
      ctx.fillText(J.str(sw, 'id', ''), dx, dy + 10 * z);
    }
    if (game.selectedSwitch && J.eqi(game.selectedSwitch, J.str(sw, 'id', '')) && moving) {
      ctx.strokeStyle = COL.lock; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(dx, dy, 9 * z, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // ---- perlintasan ----
  const blinkX = Math.floor(performance.now() / 500) % 2 === 0;
  for (const c of game.crossings) {
    const [ax, ay] = P(c.x1, c.y), [bx, by] = P(c.x2, c.y);
    c._vis = vis(ax, ay, bx, by, 0);
    if (!vis(ax, ay, bx, by)) continue;
    const on = game.crossingActive(c);
    ctx.strokeStyle = on && blinkX ? '#FF1744' : '#ffffff'; ctx.lineWidth = Math.max(2, 3 * z);
    ctx.setLineDash([8 * z, 6 * z]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); ctx.setLineDash([]);
    if (on) {
      ctx.fillStyle = blinkX ? '#FF1744' : '#661A1A';
      for (const [x, y] of [[ax, ay], [bx, by]]) { ctx.beginPath(); ctx.arc(x + 12 * z, y, 5 * z, 0, Math.PI * 2); ctx.fill(); }
    }
    const lx = Math.min(ax, bx), ly = Math.min(ay, by) - 14 * z;
    c._hx = (ax + bx) / 2; c._hy0 = Math.min(ay, by) - 24 * z; c._hy1 = Math.max(ay, by);
    if (S > 150) {
      ctx.font = `700 ${Math.round(10 * z)}px system-ui`;
      const tw = ctx.measureText(c.label).width;
      ctx.fillStyle = on ? '#5a1418' : '#E0E0E0';
      ctx.fillRect((ax + bx) / 2 - tw / 2 - 5, ly - 8 * z, tw + 10, 15 * z);
      ctx.fillStyle = on ? '#fff' : '#212121';
      ctx.fillText(c.label, (ax + bx) / 2, ly);
    }
  }

  // ---- sinyal ----
  for (const s of (J.arr(game.data, 'signals') || [])) drawSignal(ctx, s, z, P, vis);

  // ---- kereta ----
  for (const t of game.trains) drawTrain(ctx, t, z, P, vis);

  // ---- tabrakan ----
  if (game.collision) {
    const [cx, cy] = P(game.collisionX, game.collisionY);
    const r = 16 + 6 * Math.sin(performance.now() / 150);
    ctx.strokeStyle = '#ff2d2d'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 10, cy - 10); ctx.lineTo(cx + 10, cy + 10); ctx.moveTo(cx + 10, cy - 10); ctx.lineTo(cx - 10, cy + 10); ctx.stroke();
    ctx.fillStyle = '#ff6b6b'; ctx.font = '700 13px system-ui'; ctx.fillText(game.derail ? 'ANJLOK' : 'TABRAKAN', cx, cy - r - 10);
  }
}

const LAMP = { RED: '#ff2d2d', YELLOW: '#ffd000', GREEN: '#20e060', WHITE: '#f4f4f4', OFF: '#2a2f36' };
function drawSignal(ctx, s, z, P, vis) {
  const x = J.num(s, 'x'), y = J.num(s, 'y');
  if (Number.isNaN(x) || Number.isNaN(y)) return;
  const [px, py] = P(x, y);
  s._sx = px; s._sy = py;
  if (!vis(px, py, px, py, 30)) return;
  const type = sigType(s), state = J.str(s, 'state', 'RED').toUpperCase(), down = sigDown(s);
  const dirx = down ? 1 : -1;               // arah gerak kereta di layar
  const r = 3.6 * z, gap = 8.2 * z;
  let lamps;
  if (type === 'SHUNT') lamps = [state === 'RED' ? 'RED' : 'OFF', state !== 'RED' ? 'WHITE' : 'OFF'];
  else if (type === 'DISTANT') lamps = [state === 'GREEN' ? 'OFF' : 'YELLOW', state === 'GREEN' ? 'GREEN' : 'OFF'];
  else if (type === 'REPEATER') lamps = null;
  else lamps = [state === 'RED' ? 'RED' : 'OFF', state === 'YELLOW' ? 'YELLOW' : 'OFF', state === 'GREEN' ? 'GREEN' : 'OFF'];
  const n = lamps ? lamps.length : 2;
  const wBox = n * gap + 3 * z, hBox = 10 * z;
  // tiang: dari kepala sinyal menuju arah datang
  const headX = px, headY = py;
  ctx.strokeStyle = '#7d8a97'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(headX + dirx * (wBox / 2), headY); ctx.lineTo(headX + dirx * (wBox / 2 + 5 * z), headY);
  ctx.moveTo(headX + dirx * (wBox / 2 + 5 * z), headY - 4 * z); ctx.lineTo(headX + dirx * (wBox / 2 + 5 * z), headY + 4 * z); ctx.stroke();
  // rumah sinyal
  const bx = headX - wBox / 2, by = headY - hBox / 2;
  ctx.fillStyle = type === 'BLOCK' ? '#1b2a20' : (type === 'DISTANT' ? '#2a2614' : '#14181d');
  ctx.strokeStyle = J.eqi(game.selSig, J.str(s, 'id', '')) ? '#00e5ff' : '#56616d';
  ctx.lineWidth = J.eqi(game.selSig, J.str(s, 'id', '')) ? 2 : 1;
  roundRect(ctx, bx, by, wBox, hBox, 3 * z); ctx.fill(); ctx.stroke();
  if (lamps) {
    // urutan lampu: yang paling "bahaya" di sisi arah datang kereta
    for (let i = 0; i < n; i++) {
      const k = down ? i : n - 1 - i;
      const lx = bx + 1.5 * z + gap * (k + 0.5);
      const c = LAMP[lamps[i]];
      ctx.fillStyle = c;
      if (lamps[i] !== 'OFF') { ctx.shadowColor = c; ctx.shadowBlur = 8 * z; }
      ctx.beginPath(); ctx.arc(lx, headY, r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  } else {
    // repeater: batang horizontal (merah) / miring (aman)
    const col = state === 'RED' ? '#cfd8e0' : (state === 'YELLOW' ? LAMP.YELLOW : LAMP.GREEN);
    ctx.strokeStyle = col; ctx.lineWidth = 2.5 * z;
    ctx.beginPath();
    if (state === 'RED') { ctx.moveTo(bx + 3 * z, headY); ctx.lineTo(bx + wBox - 3 * z, headY); }
    else { ctx.moveTo(bx + 3 * z, headY + 3 * z); ctx.lineTo(bx + wBox - 3 * z, headY - 3 * z); }
    ctx.stroke();
  }
  // ujung penunjuk arah hadap
  ctx.fillStyle = '#56616d';
  const tipX = headX - dirx * (wBox / 2);
  ctx.beginPath(); ctx.moveTo(tipX - dirx * 4 * z, headY); ctx.lineTo(tipX, headY - 3 * z); ctx.lineTo(tipX, headY + 3 * z); ctx.fill();
  // indikator rute (diverge) untuk sinyal masuk
  if (type === 'ENTRY') {
    const ind = game.routeIndicator(J.str(s, 'id', ''));
    const ix = headX, iy = headY + (down ? 1 : -1) * 11 * z;
    ctx.fillStyle = '#0d0f12'; ctx.strokeStyle = '#56616d'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ix, iy - 5 * z); ctx.lineTo(ix + 5 * z, iy); ctx.lineTo(ix, iy + 5 * z); ctx.lineTo(ix - 5 * z, iy); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = ind ? '#ffffff' : '#333a42'; ctx.font = `700 ${Math.round(7 * z)}px ui-monospace,monospace`;
    ctx.fillText(ind || '3', ix, iy + 0.5);
  }
  // nama sinyal & sisa waktu batal
  if (View.S > 330) {
    ctx.fillStyle = '#9fb0c2'; ctx.font = `${Math.round(8.5 * z)}px ui-monospace,monospace`;
    ctx.fillText(J.str(s, 'id', ''), headX, headY + (down ? -1 : 1) * 10 * z);
  }
  const rem = game.cancelRemainingFor(J.str(s, 'id', ''));
  if (rem >= 0) {
    ctx.fillStyle = '#ffb347'; ctx.font = `700 ${Math.round(10 * z)}px ui-monospace,monospace`;
    ctx.fillText(rem + 's', headX, headY - 18 * z);
  }
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function drawTrain(ctx, t, z, P, vis) {
  const geo = game.geo, S = View.S;
  const cars = t.carPositions(geo);
  t._cars = [];
  const wid = Math.max(4, Math.min(11, 7 * z));
  const sel = game.selLoco === t;
  let headPos = null;
  for (let i = 0; i < cars.length; i++) {
    const c = cars[i];
    const [px, py] = P(c.x, c.y);
    t._cars.push([px, py]);
    if (!vis(px, py, px, py)) continue;
    // arah layar
    let vx = c.dy * YX, vy = -c.dx; const L = Math.hypot(vx, vy) || 1; vx /= L; vy /= L;
    const cc = geo.c(c.trackId);
    const pxm = cc ? S * Math.hypot(cc[2] - cc[0], (cc[3] - cc[1]) * YX) / geo.meters(c.trackId) : S * 0.001;
    const len = Math.max(3, c.body * pxm - 1.2);
    ctx.save(); ctx.translate(px, py); ctx.rotate(Math.atan2(vy, vx));
    ctx.fillStyle = c.loco ? COL.loco : (!t.hasLoco ? COL.rake : (t.freight ? COL.freight : COL.coach));
    if (t.manual && c.loco) ctx.fillStyle = '#ffe14d';
    roundRect(ctx, -len / 2, -wid / 2, len, wid, Math.min(3, wid / 3)); ctx.fill();
    if (sel) { ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2; ctx.stroke(); }
    if (c.loco) { ctx.fillStyle = '#3a2a00'; const fx = (t.locoRear ? -1 : 1) * (len / 2 - 3); ctx.fillRect(fx - 1.5, -wid / 2 + 1, 3, wid - 2); }
    ctx.restore();
    if (i === 0) headPos = [px, py];
  }
  if (headPos && S > 120) {
    const label = t.no + (t.speed > 0.5 ? ` · ${Math.round(t.speed)}` : '');
    ctx.font = `700 ${Math.round(10 * z)}px ui-monospace,monospace`;
    const tw = ctx.measureText(label).width;
    const lx = headPos[0], ly = headPos[1] - 14 * z;
    ctx.fillStyle = t.waitSig && t.speed < 0.5 ? '#6b1a1a' : (t.isDwelling() ? '#0f3a44' : (t.hasLoco ? '#1b2836' : '#2a2f36'));
    ctx.strokeStyle = sel ? '#00e5ff' : '#3a4b5e'; ctx.lineWidth = 1;
    roundRect(ctx, lx - tw / 2 - 4, ly - 7 * z, tw + 8, 14 * z, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillText(label, lx, ly + 0.5);
  }
}

// =====================================================================
//  UI bagian 3: input, panel, dialog kereta, berkas, simpan, loop utama
// =====================================================================
const game = new Game();
const App = { raw: null, name: '', mapId: '', tab: 'jadwal', routeDlg: null, cancelDlg: null, infoDlg: null, summaryShown: false, lastAuto: 0, logVer: -1 };

game.hooks.sound = n => Sound.play(n);
game.hooks.announce = (t, sch, plat) => {
  if (!Sound.tts) return;
  const geo = game.geo;
  const dari = sch ? game.stationName(J.str(sch, 'dari', '')) : '', tujuan = sch ? game.stationName(J.str(sch, 'tujuan', '')) : '';
  const st = geo.platStation(plat), stName = st ? game.stationName(st) : '';
  let txt = `Perhatian para penumpang. Kereta api ${t.name}${dari ? ' dari ' + dari : ''}${tujuan ? ' tujuan ' + tujuan : ''}, telah tiba di jalur ${geo.platName(plat)}${stName ? ' stasiun ' + stName : ''}.`;
  if (t.terminate) txt += ' Kereta ini berakhir di stasiun ini. Periksa kembali barang bawaan Anda.';
  else txt += ' Bagi penumpang yang akan naik, dipersilakan.';

};
game.hooks.changed = () => {};

// ---------- input kanvas ----------
const Input = { ptrs: new Map(), downAt: 0, moved: false, startX: 0, startY: 0, pinch: null };
function setupInput() {
  const cv = View.cv;
  cv.addEventListener('pointerdown', e => {
    Sound.init();
    cv.setPointerCapture(e.pointerId);
    Input.ptrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
    if (Input.ptrs.size === 1) { Input.downAt = performance.now(); Input.moved = false; Input.startX = e.offsetX; Input.startY = e.offsetY; }
    if (Input.ptrs.size === 2) { const [a, b] = [...Input.ptrs.values()]; Input.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; Input.moved = true; }
    cv.classList.add('drag');
  });
  cv.addEventListener('pointermove', e => {
    const p = Input.ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.offsetX - p.x, dy = e.offsetY - p.y;
    p.x = e.offsetX; p.y = e.offsetY;
    if (Input.ptrs.size === 1) {
      if (Math.hypot(e.offsetX - Input.startX, e.offsetY - Input.startY) > 7) Input.moved = true;
      if (Input.moved) { View.ox += dx; View.oy += dy; }
    } else if (Input.ptrs.size === 2 && Input.pinch) {
      const [a, b] = [...Input.ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (Input.pinch.d > 0) View.zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / Input.pinch.d);
      View.ox += dx / 2; View.oy += dy / 2;
      Input.pinch.d = d;
    }
  });
  const up = e => {
    const had = Input.ptrs.has(e.pointerId);
    Input.ptrs.delete(e.pointerId);
    if (Input.ptrs.size < 2) Input.pinch = null;
    if (!Input.ptrs.size) cv.classList.remove('drag');
    if (had && e.type === 'pointerup' && !Input.moved && Input.ptrs.size === 0 && performance.now() - Input.downAt < 600) onTap(e.offsetX, e.offsetY);
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); View.zoomAt(e.offsetX, e.offsetY, Math.pow(1.0015, -e.deltaY)); }, { passive: false });
  $('#zIn').onclick = () => View.zoomAt(View.w / 2, View.h / 2, 1.3);
  $('#zOut').onclick = () => View.zoomAt(View.w / 2, View.h / 2, 1 / 1.3);
  $('#zFit').onclick = () => View.fit();
  window.addEventListener('resize', () => View.resize());
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape') { Dlg.top() && Dlg.top().close(); return; }
    if (Dlg.top()) return;
    if (e.key === ' ') { e.preventDefault(); setSpeed(game.speed > 0 ? 0 : (App.lastSpeed || 1)); }
    else if (['1', '2', '4', '8'].includes(e.key)) setSpeed(+e.key);
    else if (e.key === '0') setSpeed(0);

    else if (e.key === '-') View.zoomAt(View.w / 2, View.h / 2, 1 / 1.2);
  });
}
function onTap(x, y) {
  if (!game.geo || Dlg.top()) return;
  const z = Math.max(0.3, Math.min(1.8, View.S / 520));
  let best = null, bd = 22 * Math.max(1, z);
  const consider = (kind, obj, px, py, bonus = 0) => { if (px == null) return; const d = Math.hypot(px - x, py - y) - bonus; if (d < bd) { bd = d; best = { kind, obj }; } };
  for (const s of (J.arr(game.data, 'signals') || [])) consider('signal', s, s._sx, s._sy, 2);
  for (const sw of (J.arr(game.data, 'switches') || [])) consider('switch', sw, sw._sx, sw._sy);
  for (const t of game.trains) for (const c of (t._cars || [])) consider('train', t, c[0], c[1], 3);
  for (const c of game.crossings) if (c._hx != null && y >= c._hy0 - 6 && y <= c._hy1 + 6) consider('crossing', c, c._hx, Math.max(c._hy0, Math.min(c._hy1, y)));
  if (!best) { if (game.selectedSwitch) game.selectedSwitch = null; return; }
  Sound.play('click');
  if (best.kind === 'signal') { game.handleSignalTouch(J.str(best.obj, 'id', '')); afterAction(); }
  else if (best.kind === 'switch') { game.handleSwitchTouch(J.str(best.obj, 'id', '')); afterAction(); }
  else if (best.kind === 'train') onTrainTapped(best.obj);
  else if (best.kind === 'crossing') { const m = game.toggleCrossing(best.obj.id); if (m) toast(m); game.updateCrossings(); }
}
function afterAction() {
  const e = game.consumeError();
  if (e) toast(e);
  if (game.pendingRoute && !App.routeDlg) showRouteDialog();
  if (game.pendingCancel && !App.cancelDlg) showCancelDialog();
}

    buttons: [{ label: 'BATAL', fn: () => game.cancelPendingRoute() }, { label: 'AKTIFKAN', cls: 'primary', fn: () => { game.confirmPendingRoute(); setTimeout(afterAction, 0); } }],
    onClose: () => { App.routeDlg = null; if (game.pendingRoute) game.cancelPendingRoute(); },

    onClose: () => { App.cancelDlg = null; if (game.pendingCancel) game.dismissCancel(); },

function onTrainTapped(t) {

function legChain(no) {
  let first = game.findSchedule(no);
  if (!first) return [];
  for (let g = 0; g < 50; g++) {
    const prev = (J.arr(game.data, 'schedules') || []).find(s => J.eqi(J.str(s, 'next_leg', ''), J.str(first, 'train_number', '')));
    if (!prev) break;
    first = prev;
  }
  const out = [];
  for (let s = first, g = 0; s && g < 50; g++) { out.push(s); const n = J.str(s, 'next_leg', ''); s = n ? game.findSchedule(n) : null; }
  return out;
}
function pfText(sch) {
  const list = SN.platformsOf(sch);
  const lab = game.platformLabel(sch);
  if (lab === 'LANGSUNG') return 'LANGSUNG';
  if (list.length > 1) return game.geo.platStation(list[0]) + ' P' + list.map(id => game.geo.platName(id)).join('/');
  return lab;
}
function trainStatus(t) {

  if (t.waitSig && t.speed < 0.5) { const s = t.nextSignalObject(game.geo); return ['Tertahan sinyal' + (s ? ' ' + J.str(s, 'id', '') : ''), 'st-held']; }

}

// ---------- berkas ----------
async function readFileObj(f) {
  const buf = new Uint8Array(await f.arrayBuffer());
  const kind = antdKind(buf);
  if (kind) {
    let secret = '', wrong = false;
    for (;;) {
      try { const o = await antdDecrypt(buf, secret); return { obj: o, kind, name: f.name }; }
      catch (e) {
        if (!e.wrong) throw e;
        secret = await askSecret(f.name, wrong);
        if (secret == null) throw new Error('Dibatalkan: ' + f.name);
        wrong = true;
      }
    }
  }
  const text = new TextDecoder().decode(buf).replace(/^﻿/, '');
  return { obj: JSON.parse(text), kind: 'json', name: f.name };
}
async function openFiles(files) {
  if (!files || !files.length) return;
  try {
    const items = [];
    for (const f of files) items.push(await readFileObj(f));
    const layouts = items.filter(i => isLayout(i.obj)), scheds = items.filter(i => !isLayout(i.obj) && (Array.isArray(i.obj.schedules) || Array.isArray(i.obj.rakes)));
    let base = null, name = '';
    if (layouts.length) { base = layouts[0].obj; name = layouts[0].name; }
    else if (App.raw && scheds.length) { base = App.raw; name = App.name; }
    else throw new Error('Tidak ada layout peta (tracks). Buka berkas .antd/.json peta, boleh bersama .ants.');
    let merged = JSON.parse(JSON.stringify(base));
    for (const s of scheds) merged = mergeLayoutSchedule(merged, s.obj);
    if (!Array.isArray(merged.schedules) || !merged.schedules.length) toast('Peta tidak berisi jadwal. Buka juga berkas jadwal .ants agar kereta muncul.', 4500);
    startGame(merged, merged.station_name || name.replace(/\.(antd|ants|json)$/i, ''));
  } catch (e) { console.error(e); Dlg.open({ title: 'Gagal membuka berkas', text: e.message || String(e), buttons: [{ label: 'OK' }] }); }
}
function startGame(raw, name, state) {
  Dlg.closeAll();
  App.raw = JSON.parse(JSON.stringify(raw));
  App.name = name || 'Peta';
  App.mapId = J.str(raw, 'map_id', '') || ('NAMA-' + App.name);
  App.summaryShown = false;
  game.setTrackData(JSON.parse(JSON.stringify(raw)));
  buildStatic();
  $('#mapName').textContent = App.name;
  $('#start').style.display = 'none';
  View.resize(); View.fit();
  if (state) {
    const e = game.restoreState(state);
    if (e) toast(e); else toast('Permainan dilanjutkan (jeda). Tekan 1X untuk jalan.', 3500);
    setSpeed(0);
  } else setSpeed(1);
  setTab(App.tab);
}

// ---------- simpan ----------
const SAVE_PREFIX = 'antctc_save_';
function saveGame(silent) {
  const why = game.checkSavable();
  if (why) { if (!silent) toast('Tidak bisa menyimpan: ' + why); return false; }
  try {
    const rec = { name: App.name, mapId: App.mapId, savedAt: Date.now(), simTime: game.time(), score: game.score.total, raw: App.raw, state: game.captureState() };
    localStorage.setItem(SAVE_PREFIX + App.mapId, JSON.stringify(rec));
    if (!silent) toast('Permainan disimpan (' + game.time() + ')');
    return true;
  } catch (e) { if (!silent) toast('Gagal menyimpan: ' + e.message); return false; }
}
function listSaves() {
  const out = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(SAVE_PREFIX)) { try { const r = JSON.parse(localStorage.getItem(k)); out.push({ key: k, ...r }); } catch (_) {} } } } catch (_) {}
  return out.sort((a, b) => b.savedAt - a.savedAt);
}
function renderSaves() {
  const box = $('#saves');
  const saves = listSaves();
  if (!saves.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<h4 style="margin:6px 0 2px">Lanjutkan permainan</h4>' + saves.map((s, i) => `<div class="sv"><button data-i="${i}">▶ ${esc(s.name)} <span class="muted">· ${esc(s.simTime)} · ★${s.score} · ${new Date(s.savedAt).toLocaleString('id-ID')}</span></button><button class="danger" data-del="${i}" title="Hapus">✕</button></div>`).join('');
  box.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { Sound.init(); const s = saves[+b.dataset.i]; startGame(s.raw, s.name, s.state); });
  box.querySelectorAll('button[data-del]').forEach(b => b.onclick = () => { try { localStorage.removeItem(saves[+b.dataset.del].key); } catch (_) {} renderSaves(); });
}
function bestKey() { return 'antctc_best_' + App.mapId; }

// ---------- ringkasan dinas ----------
function showSummary() {
  if (App.summaryShown) return;
  App.summaryShown = true;
  game.speed = 0;
  const s = game.score;
  let best = 0;
  try { best = +localStorage.getItem(bestKey()) || 0; if (!s.failed && s.total > best) { localStorage.setItem(bestKey(), s.total); } } catch (_) {}
  const nb = !s.failed && s.total > best;
  let h = `<div style="text-align:center;margin-bottom:10px">${s.failed ? `<div class="c-red" style="font-weight:700;font-size:16px">DINAS GAGAL</div><div>${esc(s.failReason)}</div>` : ''}
    <div style="font:700 30px var(--mono);margin-top:6px">${s.total} <span class="muted" style="font-size:16px">/ ${s.maxScore()}</span></div>
    <div>${s.percent()}% · <b>${esc(s.grade())}</b></div><div class="muted">Skor terbaik: ${Math.max(best, nb ? s.total : 0)}${nb ? ' · <b class="c-green">REKOR BARU!</b>' : ''}</div></div>`;
  h += renderScore();
  try { localStorage.removeItem(SAVE_PREFIX + App.mapId); } catch (_) {}
  Dlg.open({ title: '🏁 Ringkasan dinas', html: h, buttons: [{ label: 'Tutup' }, { label: 'Menu awal', fn: () => { $('#start').style.display = 'flex'; renderSaves(); } }, { label: 'Main lagi', cls: 'primary', fn: () => startGame(App.raw, App.name) }] });
}

// ---------- menu ----------
function openMenu() {
  const m = document.createElement('div');
  m.className = 'menu';
  const r = $('#btnMenu').getBoundingClientRect();
  m.style.left = r.left + 'px'; m.style.top = (r.bottom + 6) + 'px';
  const items = [
    ['📂 Buka berkas peta / jadwal…', () => $('#file').click()],
    ['🚆 Peta contoh DAOP 1', () => loadSample()],
    null,
    ['💾 Simpan permainan', () => saveGame(false)],
    ['↻ Mulai ulang peta ini', () => App.raw && Dlg.open({ title: 'Mulai ulang?', text: 'Progres dinas sekarang akan hilang.', buttons: [{ label: 'Batal' }, { label: 'Mulai ulang', cls: 'danger', fn: () => startGame(App.raw, App.name) }] })],
    ['🏠 Menu awal', () => { saveGame(true); $('#start').style.display = 'flex'; renderSaves(); setSpeed(0); }],
    null,
    [(Sound.on ? '🔊 Suara: AKTIF' : '🔇 Suara: MATI'), () => { Sound.on = !Sound.on; Sound.init(); savePrefs(); }],
    [(Sound.tts ? '📢 Pengumuman: AKTIF' : '📢 Pengumuman: MATI'), () => { Sound.tts = !Sound.tts; savePrefs(); }],
    [(View.showIds ? '🔢 Nomor track: TAMPIL' : '🔢 Nomor track: SEMBUNYI'), () => { View.showIds = !View.showIds; savePrefs(); }],
  ];
  for (const it of items) {
    if (!it) { m.appendChild(document.createElement('hr')); continue; }
    const b = document.createElement('button'); b.textContent = it[0];
    b.onclick = () => { close(); it[1](); };
    m.appendChild(b);
  }
  const cover = document.createElement('div');
  cover.style.cssText = 'position:fixed;inset:0;z-index:54';
  const close = () => { m.remove(); cover.remove(); };
  cover.onpointerdown = close;
  document.body.append(cover, m);
}
function savePrefs() { try { localStorage.setItem('antctc_prefs', JSON.stringify({ on: Sound.on, tts: Sound.tts, ids: View.showIds })); } catch (_) {} }
function loadPrefs() { try { const p = JSON.parse(localStorage.getItem('antctc_prefs') || '{}'); if (p.on != null) Sound.on = p.on; if (p.tts != null) Sound.tts = p.tts; if (p.ids != null) View.showIds = p.ids; } catch (_) {} }
function loadSample() {
  const el = document.getElementById('sample-map');
  if (!el) { toast('Peta contoh tidak tersedia'); return; }
  const o = JSON.parse(el.textContent);
  startGame(o, J.str(o, 'station_name', 'DAOP 1'));
}

// ---------- loop utama ----------
let lastFrame = performance.now(), lastUi = 0, lastPanel = 0;
function frame(now) {
  const dt = now - lastFrame; lastFrame = now;
  if (game.data && !game.finished) {
    game.advance(dt);
    const e = game.consumeError(); if (e) toast(e);
  }
  if (game.finished && game.data && !App.summaryShown && !App.summaryPending) { App.summaryPending = true; setTimeout(() => { App.summaryPending = false; showSummary(); }, 600); }
  // bel perlintasan
  if (Sound.on && game.speed > 0 && now - Sound.lastBell > 600 && game.crossings.some(c => c._vis && game.crossingActive(c))) { Sound.lastBell = now; Sound.play('bell'); }
  try { draw(); } catch (err) { console.error(err); }
  if (now - lastUi > 200) { lastUi = now; updateTop(); updateManual(); }
  if (now - lastPanel > 700 && !$('#panel').classList.contains('min')) { lastPanel = now; renderPanel(false); }
  if (game.data && !game.finished && game.speed > 0 && now - App.lastAuto > 60000) { App.lastAuto = now; saveGame(true); }
  requestAnimationFrame(frame);
}

// ---------- inisialisasi ----------
function init() {
  View.cv = $('#cv'); View.ctx = View.cv.getContext('2d');
  loadPrefs();
  View.resize();
  setupInput();
  document.querySelectorAll('#speeds button').forEach(b => b.onclick = () => { Sound.init(); setSpeed(+b.dataset.s); });
  document.querySelectorAll('#tabs button[data-t]').forEach(b => b.onclick = () => setTab(b.dataset.t));
  $('#panelToggle').onclick = () => { $('#panel').classList.toggle('min'); $('#panelToggle').textContent = $('#panel').classList.contains('min') ? '▴' : '▾'; setTimeout(() => View.resize(), 220); };
  $('#tabBody').addEventListener('click', e => {
    if (e.target.id === 'btnAck') { game.resetArrivalAlerts(); renderPanel(true); return; }
    const tr = e.target.closest('tr[data-no]');
    if (tr) { const t = game.trains.find(x => J.eqi(x.no, tr.dataset.no)); if (t) showTrainInfo(t); }
  });
  $('#hud').addEventListener('click', e => { const c = e.target.closest('[data-go]'); if (c) setTab(c.dataset.go); });
  $('#btnMenu').onclick = () => { Sound.init(); openMenu(); };
  $('#btnEnd').onclick = () => { if (!game.data || game.finished) return; Dlg.open({ title: 'Selesaikan dinas?', text: 'Jadwal yang belum terlayani akan dihitung sebagai penalti.', buttons: [{ label: 'Batal' }, { label: 'SELESAIKAN', cls: 'danger', fn: () => { game.endMission(); } }] }); };
  document.querySelectorAll('#manual button[data-m]').forEach(b => b.onclick = () => {
    const m = +b.dataset.m;
    if (m === 9) { game.selectLoco(game.selLoco); return; }
    game.manualCommand(m); const e = game.consumeError(); if (e) toast(e);
  });
  $('#file').onchange = e => { Sound.init(); openFiles([...e.target.files]); e.target.value = ''; };
  $('#sOpen').onclick = () => { Sound.init(); $('#file').click(); };
  $('#sSample').onclick = () => { Sound.init(); loadSample(); };
  if (!document.getElementById('sample-map')) $('#sSample').style.display = 'none';
  const dz = document.body;
  dz.addEventListener('dragover', e => { e.preventDefault(); $('#start').classList.add('drop'); });
  dz.addEventListener('dragleave', () => $('#start').classList.remove('drop'));
  dz.addEventListener('drop', e => { e.preventDefault(); $('#start').classList.remove('drop'); openFiles([...e.dataTransfer.files]); });
  window.addEventListener('beforeunload', () => { if (game.data && !game.finished) saveGame(true); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && game.data && !game.finished) saveGame(true); });
  renderSaves();
  renderPanel(true);
  requestAnimationFrame(frame);
}
init();

</script>
</body>
</html>
