  View.resize(); View.fit();
  if (state) {
    const e = game.restoreState(state);
    if (e) toast(e); else toast('Permainan dilanjutkan (jeda). Tekan 1X untuk jalan.', 3500);
    setSpeed(0);
  } else setSpeed(1);
  setTab(App.tab);
}

// ---------- simpan ----------
const SAVE_PREFIX = 'antctc_save_';
function saveGame(silent) {
  const why = game.checkSavable();
  if (why) { if (!silent) toast('Tidak bisa menyimpan: ' + why); return false; }
  try {
    const rec = { name: App.name, mapId: App.mapId, savedAt: Date.now(), simTime: game.time(), score: game.score.total, raw: App.raw, state: game.captureState() };
    localStorage.setItem(SAVE_PREFIX + App.mapId, JSON.stringify(rec));
    if (!silent) toast('Permainan disimpan (' + game.time() + ')');
    return true;
  } catch (e) { if (!silent) toast('Gagal menyimpan: ' + e.message); return false; }
}
function listSaves() {
  const out = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(SAVE_PREFIX)) { try { const r = JSON.parse(localStorage.getItem(k)); out.push({ key: k, ...r }); } catch (_) {} } } } catch (_) {}
  return out.sort((a, b) => b.savedAt - a.savedAt);
}
function renderSaves() {
  const box = $('#saves');
  const saves = listSaves();
  if (!saves.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<h4 style="margin:6px 0 2px">Lanjutkan permainan</h4>' + saves.map((s, i) => `<div class="sv"><button data-i="${i}">▶ ${esc(s.name)} <span class="muted">· ${esc(s.simTime)} · ★${s.score} · ${new Date(s.savedAt).toLocaleString('id-ID')}</span></button><button class="danger" data-del="${i}" title="Hapus">✕</button></div>`).join('');
  box.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { Sound.init(); const s = saves[+b.dataset.i]; startGame(s.raw, s.name, s.state); });
  box.querySelectorAll('button[data-del]').forEach(b => b.onclick = () => { try { localStorage.removeItem(saves[+b.dataset.del].key); } catch (_) {} renderSaves(); });
}
function bestKey() { return 'antctc_best_' + App.mapId; }

// ---------- ringkasan dinas ----------
function showSummary() {
  if (App.summaryShown) return;
  App.summaryShown = true;
  game.speed = 0;
  Dlg.closeAll();
  const s = game.score;
  let best = 0;
  try { best = +localStorage.getItem(bestKey()) || 0; if (!s.failed && s.total > best) localStorage.setItem(bestKey(), s.total); } catch (_) {}
  try { localStorage.removeItem(SAVE_PREFIX + App.mapId); } catch (_) {}
  const rep = {
    failed: s.failed, failReason: s.failReason || '', total: s.total, max: s.maxScore(), percent: s.percent(), grade: s.grade(),
    station: J.str(game.data, 'station_name', App.name), time: game.time(),
    best: Math.max(best, s.failed ? best : s.total), prevBest: best, newRecord: !s.failed && s.total > best,
    trains: s.list.map(p => ({ no: p.no, name: p.name || '', score: p.score, max: p.maxScore(), onTime: p.isOnTime(), through: p.through, partial: p.partial,
      served: p.spawn !== -1, platform: p.plat, targetPlatform: p.target, heldSec: Math.round(p.heldSec), bonus: p.bonus, items: p.fb.slice() })),
  };
  if (s.failed) rep.crash = (game.derail ? 'Anjlok: ' : 'Tabrakan: ') + game.collisionText;
  // layar "Dinas Selesai" sama dengan versi Android (hasil_dinas.html) di dalam iframe
  const fr = document.createElement('iframe');
  fr.id = 'sumFrame';
  const close = () => { fr.remove(); window.ANT_SUMMARY_BRIDGE = null; };
  window.ANT_SUMMARY_BRIDGE = {
    data: () => JSON.stringify(rep),
    retry: () => { close(); startGame(App.raw, App.name); },
    close: () => { close(); },
  };
  fr.srcdoc = SUMMARY_HTML;
  document.body.appendChild(fr);
}

// ---------- menu ----------
function openMenu() {
  const m = document.createElement('div');
  m.className = 'menu';
  const r = $('#btnMenu').getBoundingClientRect();
  m.style.left = r.left + 'px'; m.style.top = (r.bottom + 6) + 'px';
  const items = [
    ['📂 Buka berkas peta / jadwal…', () => $('#file').click()],
    null,
    ['💾 Simpan permainan', () => saveGame(false)],
    ['↻ Mulai ulang peta ini', () => App.raw && Dlg.open({ title: 'Mulai ulang?', text: 'Progres dinas sekarang akan hilang.', buttons: [{ label: 'Batal' }, { label: 'Mulai ulang', cls: 'danger', fn: () => startGame(App.raw, App.name) }] })],
    ['🏠 Menu awal', () => { saveGame(true); $('#start').style.display = 'flex'; renderSaves(); setSpeed(0); }],
    null,
    [(Sound.on ? '🔊 Suara: AKTIF' : '🔇 Suara: MATI'), () => { Sound.on = !Sound.on; Sound.init(); savePrefs(); }],
    [(Sound.tts ? '📢 Pengumuman: AKTIF' : '📢 Pengumuman: MATI'), () => { Sound.tts = !Sound.tts; savePrefs(); }],
    [(View.showIds ? '🔢 Nomor track: TAMPIL' : '🔢 Nomor track: SEMBUNYI'), () => { View.showIds = !View.showIds; savePrefs(); }],
  ];
  for (const it of items) {
    if (!it) { m.appendChild(document.createElement('hr')); continue; }
    const b = document.createElement('button'); b.textContent = it[0];
    b.onclick = () => { close(); it[1](); };
    m.appendChild(b);
  }
  const cover = document.createElement('div');
  cover.style.cssText = 'position:fixed;inset:0;z-index:54';
  const close = () => { m.remove(); cover.remove(); };
  cover.onpointerdown = close;
  document.body.append(cover, m);
}
function savePrefs() { try { localStorage.setItem('antctc_prefs', JSON.stringify({ on: Sound.on, tts: Sound.tts, ids: View.showIds })); } catch (_) {} }
function loadPrefs() { try { const p = JSON.parse(localStorage.getItem('antctc_prefs') || '{}'); if (p.on != null) Sound.on = p.on; if (p.tts != null) Sound.tts = p.tts; if (p.ids != null) View.showIds = p.ids; } catch (_) {} }
function loadSample() {
  const el = document.getElementById('sample-map');
  if (!el) { toast('Peta contoh tidak tersedia'); return; }
  const o = JSON.parse(el.textContent);
  startGame(o, J.str(o, 'station_name', 'DAOP 1'));
}

// ---------- loop utama ----------
let lastFrame = performance.now(), lastUi = 0, lastPanel = 0;
function frame(now) {
  const dt = now - lastFrame; lastFrame = now;
  if (game.data && !game.finished) {
    game.advance(dt);
    const e = game.consumeError(); if (e) toast(e);
  }
  if (game.finished && game.data && !App.summaryShown && !App.summaryPending) { App.summaryPending = true; setTimeout(() => { App.summaryPending = false; showSummary(); }, 600); }
  // bel perlintasan
  if (Sound.on && game.speed > 0 && now - Sound.lastBell > 600 && game.crossings.some(c => c._vis && game.crossingActive(c))) { Sound.lastBell = now; Sound.play('bell'); }
  try { draw(); } catch (err) { console.error(err); }
  if (now - lastUi > 200) { lastUi = now; updateTop(); updateManual(); }
  if (now - lastPanel > 700 && !$('#panel').classList.contains('min')) { lastPanel = now; renderPanel(false); }
  if (game.data && !game.finished && game.speed > 0 && now - App.lastAuto > 60000) { App.lastAuto = now; saveGame(true); }
  requestAnimationFrame(frame);
}

// ---------- inisialisasi ----------
function init() {
  View.cv = $('#cv'); View.ctx = View.cv.getContext('2d');
  loadPrefs();
  View.resize();
  setupInput();
  document.querySelectorAll('#speeds button').forEach(b => b.onclick = () => { Sound.init(); setSpeed(+b.dataset.s); });
  document.querySelectorAll('#tabs button[data-t]').forEach(b => b.onclick = () => setTab(b.dataset.t));
  $('#panelToggle').onclick = () => { $('#panel').classList.toggle('min'); $('#panelToggle').textContent = $('#panel').classList.contains('min') ? '▴' : '▾'; setTimeout(() => View.resize(), 220); };
  $('#tabBody').addEventListener('click', e => {
    if (e.target.id === 'btnAck') { game.resetArrivalAlerts(); renderPanel(true); return; }
    if (e.target.closest('#btnVdu')) { showVdu(); return; }
    const tr = e.target.closest('tr[data-no]');
    if (tr) { const t = game.trains.find(x => J.eqi(x.no, tr.dataset.no)); if (t) showTrainInfo(t); else showVdu(tr.dataset.no); }
  });
  // sentuhan / gulir di panel: tahan pembaruan isi panel sebentar
  const busy = ms => { App.touchBusy = performance.now() + ms; };
  const tb = $('#tabBody');
  tb.addEventListener('pointerdown', () => busy(1500), { passive: true });
  tb.addEventListener('touchstart', () => busy(1500), { passive: true });
  tb.addEventListener('scroll', () => busy(900), { passive: true });
  tb.addEventListener('wheel', () => busy(900), { passive: true });
  $('#hud').addEventListener('click', e => { const c = e.target.closest('[data-go]'); if (c) setTab(c.dataset.go); });
  $('#btnMenu').onclick = () => { Sound.init(); openMenu(); };
  $('#btnEnd').onclick = () => { if (!game.data || game.finished) return; Dlg.open({ title: 'Selesaikan dinas?', text: 'Jadwal yang belum terlayani akan dihitung sebagai penalti.', buttons: [{ label: 'Batal' }, { label: 'SELESAIKAN', cls: 'danger', fn: () => { game.endMission(); } }] }); };
  document.querySelectorAll('#manual button[data-m]').forEach(b => b.onclick = () => {
    const m = +b.dataset.m;
    if (m === 9) { game.selectLoco(game.selLoco); return; }
    game.manualCommand(m); const e = game.consumeError(); if (e) toast(e);
  });
  $('#file').onchange = e => { Sound.init(); openFiles([...e.target.files]); e.target.value = ''; };
  $('#sOpen').onclick = () => { Sound.init(); $('#file').click(); };
  const dz = document.body;
  dz.addEventListener('dragover', e => { e.preventDefault(); $('#start').classList.add('drop'); });
  dz.addEventListener('dragleave', () => $('#start').classList.remove('drop'));
  dz.addEventListener('drop', e => { e.preventDefault(); $('#start').classList.remove('drop'); openFiles([...e.dataTransfer.files]); });
  window.addEventListener('beforeunload', () => { if (game.data && !game.finished) saveGame(true); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && game.data && !game.finished) saveGame(true); });
  renderSaves();
  renderPanel(true);
  requestAnimationFrame(frame);
}
init();

visible}\n  .list{min-height:60vh}\n}\n.heroRow{display:flex; align-items:center; gap:14px; margin-top:10px}\n.heroRow .gauge{width:118px; height:118px; margin:0}\n.heroRow .letter{font-size:44px}\n.hcol{flex:1; min-width:0}\n.hcol .gradeTxt{text-align:left}\n.hcol .scoreLine{justify-content:flex-start; margin-top:6px; white-space:nowrap}\n.hcol .score small{display:block; font-size:11.5px; margin-top:4px}\n.hcol .score{font-size:26px}\n.hcol .recWrap{text-align:left}\n.hcol .rec{margin-top:8px}\n.hero::after{left:22%; top:44%}\n@media (max-height:380px) and (min-width:641px){\n  .hero-in{padding-top:12px}\n  .station{font-size:15px}\n  .heroRow{margin-top:8px}\n  .heroRow .gauge{width:100px;height:100px}\n  .heroRow .letter{font-size:38px}\n  .hcol .score{font-size:23px}\n  .stats{margin:10px 0}\n  .st{padding:6px 3px 5px} .st b{font-size:14px}\n  .actions{padding:8px 16px 10px} .btn{height:38px}\n}\n@media (max-width:640px){\n  .heroRow{justify-content:center}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <section class=\"hero\">\n    <div class=\"hero-in\">\n      <div class=\"kicker\"><span class=\"dot\"><\/span><span id=\"kick\">Dinas selesai<\/span><\/div>\n      <div class=\"station\" id=\"station\">—<\/div>\n      <div class=\"time\" id=\"time\"><\/div>\n\n      <div class=\"heroRow\">\n      <div class=\"gauge\">\n        <svg viewBox=\"0 0 120 120\">\n          <circle class=\"trk\" cx=\"60\" cy=\"60\" r=\"52\"/>\n          <circle class=\"val\" id=\"arc\" cx=\"60\" cy=\"60\" r=\"52\"/>\n          <circle class=\"tick\" cx=\"60\" cy=\"60\" r=\"52\"/>\n        <\/svg>\n        <div class=\"gcenter\"><div class=\"letter\" id=\"letter\">–<\/div><div class=\"pct\" id=\"pct\">0%<\/div><\/div>\n      <\/div>\n      <div class=\"hcol\">\n        <div class=\"gradeTxt\" id=\"gradeTxt\"><\/div>\n        <div class=\"scoreLine\"><div class=\"score\"><span id=\"score\">0<\/span><small>dari <span id=\"max\">0<\/span> poin<\/small><\/div><\/div>\n        <div class=\"recWrap\"><div class=\"rec\" id=\"rec\"><\/div><\/div>\n      <\/div>\n      <\/div>\n      <div id=\"failBox\"><\/div>\n\n      <div class=\"stats\">\n        <div class=\"st\"><b id=\"sTr\">0<\/b><span>Kereta<\/span><\/div>\n        <div class=\"st ok\"><b id=\"sOn\">0<\/b><span>Tepat<\/span><\/div>\n        <div class=\"st warn\"><b id=\"sBonus\">0<\/b><span>Combo<\/span><\/div>\n        <div class=\"st bad\"><b id=\"sPen\">0<\/b><span>Penalti<\/span><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"actions\">\n      <button class=\"btn\" id=\"bRetry\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 3-6.7\"/><path d=\"M3 3v6h6\"/><\/svg>ULANGI<\/button>\n      <button class=\"btn pri\" id=\"bClose\">TUTUP<\/button>\n    <\/div>\n  <\/section>\n\n  <section class=\"list\">\n    <div class=\"lhead\">\n      <h2>Rincian per kereta<em id=\"cnt\"><\/em><\/h2>\n      <div class=\"seg\" id=\"seg\">\n        <button data-f=\"all\" class=\"on\">Semua<i id=\"fAll\"><\/i><\/button>\n        <button data-f=\"bad\">Bermasalah<i id=\"fBad\"><\/i><\/button>\n      <\/div>\n    <\/div>\n    <div class=\"rows\" id=\"rows\"><\/div>\n  <\/section>\n<\/div>\n\n<script>\n// Contoh data saat dibuka di browser biasa (tanpa aplikasi)\nvar DEMO = {\n  station:\"DAOP 1 THB-JNG\", time:\"07:05:02\", best:20119, newRecord:false,\n  failed:false, failReason:\"\", total:9369, max:11500, percent:81, grade:\"A (EXCELLENT)\",\n  trains:[\n    {no:\"KA 114\",name:\"Sawunggalih\",score:424,max:450,onTime:false,partial:true,items:[\"Muncul tepat waktu (+50)\",\"Tiba tepat waktu (+150)\",\"Peron benar (+100)\",\"Berangkat terlambat 26s (+124)\"]},\n    {no:\"KA 114 (2)\",name:\"Sawunggalih\",score:450,max:600,onTime:true,items:[\"Muncul tepat waktu (+50)\",\"Tiba awal 344s (+0)\",\"Peron benar (+100)\",\"Berangkat tepat waktu (+150)\",\"Keluar seksi (+100)\",\"Keluar lewat track benar (T278) (+50)\"]},\n    {no:\"CL 6005\",name:\"CL Biru via PSE\",score:438,max:450,onTime:true,bonus:25,items:[\"Muncul tepat waktu (+50)\",\"Tiba terlambat 12s (+150)\",\"Peron benar (+100)\",\"Combo tepat waktu (+25)\"]},\n    {no:\"KA 245 (2)\",name:\"Majapahit\",score:120,max:600,onTime:false,items:[\"Muncul terlambat 71s (+36)\",\"Tiba terlambat 200s (+0)\",\"Salah peron (T527, jadwal T532) (-50)\",\"Rangkaian keluar peron 12 m (-45)\",\"Tertahan sinyal 140 s (-36)\"]},\n    {no:\"KA 6\",name:\"Argo Semeru\",score:-100,max:200,served:false,items:[\"Tidak terlayani (-100)\"]}\n  ]\n};\n\nvar bridge = window.Android || (window.parent && window.parent.ANT_SUMMARY_BRIDGE) || null;\nvar D;\ntry { D = bridge && bridge.data ? JSON.parse(bridge.data()) : DEMO; } catch (e) { D = DEMO; }\n\nfunction $(id){ return document.getElementById(id); }\nfunction esc(s){ return String(s == null ? \"\" : s).replace(/[&<>\"]/g, function(c){ return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nfunction fmt(n){ return (n < 0 ? \"−\" : \"\") + Math.abs(Math.round(n)).toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g, \".\"); }\n\n// \"Berangkat terlambat 26s (+124)\" -> {lb, pts}\nfunction parseItem(s){\n  var m = /\\s*\\(([+\\-]?\\d+)\\)\\s*$/.exec(s);\n  return m ? { lb: s.slice(0, m.index), pts: parseInt(m[1], 10) } : { lb: s, pts: 0 };\n}\n\nvar COLORS = { S:[\"#ffd76a\",\"rgba(255,215,106,.38)\"], A:[\"#3ddc97\",\"rgba(61,220,151,.35)\"],\n  B:[\"#4fb3ff\",\"rgba(79,179,255,.35)\"], C:[\"#ffb547\",\"rgba(255,181,71,.35)\"], D:[\"#ff8a5c\",\"rgba(255,138,92,.35)\"],\n  X:[\"#ff5d6c\",\"rgba(255,93,108,.38)\"] };\n\nfunction render(){\n  var grade = String(D.grade || \"\");\n  var letter = D.failed ? \"X\" : (grade.charAt(0) || \"–\");\n  var col = COLORS[letter] || COLORS.A;\n  document.documentElement.style.setProperty(\"--acc\", col[0]);\n  document.documentElement.style.setProperty(\"--accGlow\", col[1]);\n\n  $(\"kick\").textContent = D.failed ? \"Dinas gagal\" : \"Dinas selesai\";\n  $(\"station\").textContent = D.station || \"Stasiun\";\n  $(\"time\").textContent = D.time ? \"Selesai pukul \" + D.time : \"\";\n  var L = $(\"letter\");\n  if (D.failed) { L.textContent = \"\\u2715\"; }\n  else L.textContent = letter;\n  var gt = grade.indexOf(\"(\") >= 0 ? grade.slice(grade.indexOf(\"(\") + 1, grade.lastIndexOf(\")\")) : grade;\n  $(\"gradeTxt\").textContent = D.failed ? \"Gagal\" : gt;\n  if (D.failed) document.querySelector(\".stats\").style.display = \"none\";\n  $(\"max\").textContent = fmt(D.max || 0);\n\n  var rec = $(\"rec\");\n  if (D.failed) rec.style.display = \"none\";\n  else if (D.newRecord) { rec.className = \"rec new\"; rec.innerHTML = \"★ REKOR BARU\"; }\n  else rec.textContent = \"Rekor \" + fmt(D.best || 0);\n\n  if (D.failed) {\n    $(\"failBox\").innerHTML = '<div class=\"fail\"><b>PENYEBAB<\/b>' + esc(D.crash || D.failReason || \"Kecelakaan\") + \"<\/div>\";\n  }\n\n  // statistik\n  var trains = D.trains || [], on = 0, pen = 0, bonus = 0;\n  trains.forEach(function(t){\n    if (t.onTime) on++;\n    (t.items || []).forEach(function(s){ var p = parseItem(s).pts; if (p < 0) pen += p; });\n    bonus += (t.bonus || 0);\n  });\n  $(\"sTr\").textContent = trains.length;\n  $(\"sOn\").textContent = on;\n  $(\"sBonus\").textContent = \"+\" + bonus;\n  $(\"sPen\").textContent = pen ? fmt(pen) : \"0\";\n\n  // busur & hitung naik\n  var pct = Math.max(0, Math.min(100, D.percent || 0));\n  var C = 2 * Math.PI * 52, arc = $(\"arc\");\n  arc.style.strokeDasharray = C; arc.style.strokeDashoffset = C;\n  requestAnimationFrame(function(){ requestAnimationFrame(function(){ arc.style.strokeDashoffset = C * (1 - pct / 100); }); });\n  countUp($(\"score\"), D.total || 0, 1300);\n  countUp($(\"pct\"), pct, 1300, \"%\");\n\n  renderRows(\"all\");\n}\n\nfunction countUp(el, to, ms, suf){\n  var t0 = null; suf = suf || \"\";\n  function f(ts){\n    if (!t0) t0 = ts;\n    var k = Math.min(1, (ts - t0) / ms), e = 1 - Math.pow(1 - k, 3);\n    el.textContent = fmt(to * e) + suf;\n    if (k < 1) requestAnimationFrame(f);\n  }\n  requestAnimationFrame(f);\n}\n\nfunction isBad(t){\n  if (t.served === false) return true;\n  return (t.items || []).some(function(s){ return parseItem(s).pts < 0; }) || (t.max > 0 && t.score / t.max < .6);\n}\n\nfunction renderRows(filter){\n  var trains = (D.trains || []).slice();\n  var bad = trains.filter(isBad);\n  $(\"fAll\").textContent = trains.length;\n  $(\"fBad\").textContent = bad.length;\n  $(\"cnt\").textContent = \"\";\n  var list = filter === \"bad\" ? bad : trains;\n  var box = $(\"rows\");\n  if (!list.length) {\n    box.innerHTML = '<div class=\"empty\">' + (filter === \"bad\" ? \"Tidak ada kereta bermasalah. Mantap, PPKA!\" : \"Tidak ada data kereta.\") + \"<\/div>\";\n    return;\n  }\n  var html = \"\";\n  list.forEach(function(t, i){\n    var ratio = t.max > 0 ? Math.max(0, t.score) / t.max : 0;\n    var cls = t.served === false || ratio < .5 ? \"bad\" : (ratio < .85 ? \"mid\" : \"ok\");\n    var tags = [];\n    if (t.served === false) tags.push('<span class=\"tag bad\">TIDAK TERLAYANI<\/span>');\n    else {\n      if (t.max > 0 && t.score >= t.max) tags.push('<span class=\"tag gold\">SEMPURNA<\/span>');\n      else if (t.onTime) tags.push('<span class=\"tag ok\">TEPAT WAKTU<\/span>');\n      if (t.through) tags.push('<span class=\"tag info\">LANGSUNG<\/span>');\n      if (t.partial) tags.push('<span class=\"tag\">LANJUT<\/span>');\n      var neg = (t.items || []).filter(function(s){ return parseItem(s).pts < 0; }).length;\n      if (neg) tags.push('<span class=\"tag bad\">' + neg + \" PENALTI<\/span>\");\n    }\n    var items = (t.items || []).map(function(s){\n      var p = parseItem(s), k = p.pts > 0 ? \"p\" : (p.pts < 0 ? \"n\" : \"z\");\n      var ic = p.pts > 0 ? \"+\" : (p.pts < 0 ? \"!\" : \"·\");\n      return '<div class=\"it ' + k + '\"><span class=\"ic\">' + ic + '<\/span><span class=\"lb\">' + esc(p.lb) +\n        '<\/span><span class=\"pt\">' + (p.pts > 0 ? \"+\" : \"\") + (p.pts < 0 ? \"−\" + Math.abs(p.pts) : p.pts) + \"<\/span><\/div>\";\n    }).join(\"\") || '<div class=\"it z\"><span class=\"lb\">Belum ada penilaian<\/span><\/div>';\n    var barCol = cls === \"ok\" ? \"var(--ok)\" : (cls === \"mid\" ? \"var(--warn)\" : \"var(--bad)\");\n    html += '<div class=\"tr\" style=\"animation-delay:' + Math.min(i * 40, 600) + 'ms\">' +\n      '<div class=\"trh\"><div class=\"badge ' + cls + '\">' + Math.round(ratio * 100) + '<\/div>' +\n      '<div class=\"tn\"><div class=\"no\">' + esc(t.no) + '<\/div><div class=\"nm\">' + esc(t.name) + \"<\/div><\/div>\" +\n      '<div class=\"tags\">' + tags.join(\"\") + \"<\/div>\" +\n      '<div class=\"ts\"><b>' + fmt(t.score) + '<\/b> <small>/ ' + fmt(t.max) + '<\/small>' +\n      '<div class=\"bar\"><i data-w=\"' + (ratio * 100).toFixed(1) + '\" style=\"background:' + barCol + '\"><\/i><\/div><\/div>' +\n      '<\/div><div class=\"det\">' + items + \"<\/div><\/div>\";\n  });\n  box.innerHTML = html;\n  box.scrollTop = 0;\n  requestAnimationFrame(function(){ requestAnimationFrame(function(){\n    Array.prototype.forEach.call(box.querySelectorAll(\".bar i\"), function(b){ b.style.width = b.getAttribute(\"data-w\") + \"%\"; });\n  }); });\n}\n\n$(\"rows\").addEventListener(\"click\", function(e){\n  var h = e.target.closest(\".trh\");\n  if (h) h.parentNode.classList.toggle(\"open\");\n});\n$(\"seg\").addEventListener(\"click\", function(e){\n  var b = e.target.closest(\"button\"); if (!b) return;\n  Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle(\"on\", x === b); });\n  renderRows(b.getAttribute(\"data-f\"));\n});\n$(\"bRetry\").onclick = function(){ if (bridge && bridge.retry) bridge.retry(); else location.reload(); };\n$(\"bClose\").onclick = function(){ if (bridge && bridge.close) bridge.close(); };\n\nrender();\n<\/script>\n<\/body>\n<\/html>\n";
