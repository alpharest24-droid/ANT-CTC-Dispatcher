    const lastIdx = tp.indexOf(rp[rp.length - 1]);

  }
  dirSignalId(tid, mode) {
    const down = !J.eqi(mode, 'REVERSE');
    for (const s of this.geo.onTrack(tid)) { if (isAutoSig(s)) continue; if (sigDown(s) === down) return J.str(s, 'id', null); }
    return null;
  }
  anyTrainOn(r) { for (const t of this.trains) { if (t.finished) continue; const occ = t.occupied(this.geo); if (r.path.some(id => occ.includes(id))) return true; } return false; }
  releaseRoutesBehindTrains() {
    const finished = [];

      if (r.locking || r.cancelling) continue;
      if (!r.entered) {
        for (const t of this.trains) {
          if (t.finished) continue;
          const occ = t.occupied(this.geo);

  attachReverseRoutes() {

      if (!match) continue;

      this.routes = this.routes.filter(o => !mine.includes(o));

  }

    }
  }
  routeHasTrainInside(r) {

  // ---------- perlintasan ----------

      const no = J.str(o, 'no', '');

      c.sound = J.str(o, 'sound', 'crossing');

    if (this.pendingRoute || this.pendingCancel) return 'Selesaikan dialog rute dulu';
    if (this.moving.size) return 'Tunggu wesel selesai bergerak';
    for (const r of this.routes) { if (r.locking) return 'Tunggu rute selesai dikunci'; if (r.cancelling) return 'Tunggu pembatalan rute selesai'; }

      routes: this.routes.map(r => r.toJson()), trains: this.trains.map(t => t.toJson()), selLoco: this.trains.indexOf(this.selLoco),
      processed: this.processed.slice(), score: this.score.toJson(), log: this.logger.toJson(), power: this.power.toJson(),

        if (this.blocked.has(nx)) continue;
        const tc = this.transCost(n.track, nx);
        if (tc === Infinity) continue;
        relax({ track: nx, down: n.down, cost: n.cost + this.meters(nx) + tc, revs: n.revs, prev: n, viaReverse: false });
      }
      const inPlace = !n.prev && n.viaReverse;
      if (!inPlace && n.revs < SP_MAX_REVERSALS && !this.blocked.has(n.track)) {
        const pre = ShuntPlanner.pathTo(n);
        let room = this.meters(n.track);
        for (const id of this.pullOut(pre, n.down, len + 2 * SP_CLEAR_M)) room += this.meters(id);
        if (room >= len + 2 * SP_CLEAR_M) relax({ track: n.track, down: !n.down, cost: n.cost + SP_REVERSE_COST + len, revs: n.revs + 1, prev: n, viaReverse: true });
      }

  }

    return l;
  }

    let cur = { down: chain[0].down, tracks: [chain[0].track], stopIdx: -1, stopProg: 1, last: false, reverseTrack: -1 };
    for (let i = 1; i < chain.length; i++) {

        cur.tracks.push(...this.pullOut(cur.tracks, cur.down, len + 2 * SP_CLEAR_M));
        const ri = cur.tracks.indexOf(r);

          need -= l; si = k; sp = 1;
        }
        cur.stopIdx = si; cur.stopProg = Math.min(0.99, sp);
        plan.moves.push(cur);
        cur = { down: n.down, tracks: [r], stopIdx: -1, stopProg: 1, last: false, reverseTrack: -1 };
      } else cur.tracks.push(n.track);
    }
    cur.last = true;
    cur.stopIdx = cur.tracks.length - 1;
    const tl = this.meters(target);
    cur.stopProg = Math.max(0.3, Math.min(0.97, (tl - SP_CLEAR_M) / tl));
    plan.moves.push(cur);
    return plan;
  }

    let s = '', k = 1;
    if (p.flipFirst) s += '0. Balik arah di tempat\n';
    for (const m of p.moves) {
      s += (k++) + '. ' + (m.down ? 'Ke bawah (DN)' : 'Ke atas (UP)') + ': ' + m.tracks.slice(0, m.stopIdx + 1).join(' → ');
      if (!m.last) s += '\n    lalu balik arah setelah ekor melewati pangkal T' + m.reverseTrack;
      s += '\n';
    }
    s += '\nBalik arah: ' + p.reversals + 'x, kecepatan langsir maks 15 km/j.';
    s += '\nMasinis berhenti di sinyal merah dan di wesel yang belum mengarah ke jalur ini: pasang rute langsir / atur wesel sesuai rencana.';
    return s;
  }
}

    t.sightCap = room <= 0 ? 0 : this.brakeCurve(t, room);
  },
  // Sinyal utama merah di depan kepala (track sekarang, atau awal track berikutnya ≤ 50 m)
  redSignalAhead(t) {
    const cur = t.curId;
    if (cur === -1) return null;
    const sg = t.nextMainSignal(this.geo);
    if (sg) return isRedSig(sg) ? { sig: sg, trackId: cur } : null;
    const down = t.mode === 'NORMAL';
    let nx = t.nextId;
    if (nx === -1) nx = this.pb.nextAfter(t.path, down);
    if (nx === -1) return null;
    const s2 = t.firstMainSignalOn(this.geo, nx);
    if (!s2 || !isRedSig(s2)) return null;
    const dist = (1 - t.prog) * this.geo.meters(cur) + this.geo.sigProgress(s2, nx, t.mode !== 'REVERSE') * this.geo.meters(nx);
    return dist <= PERMIT_LOOKAHEAD_M ? { sig: s2, trackId: nx } : null;
  },
  permitExtension(t, ra) {
    if (!ra) return null;
    const p = t.path, ci = t.idx;
    if (!p.length || ci < 0 || ci >= p.length) return null;
    let si = -1;
    for (let i = ci; i < p.length; i++) if (p[i] === ra.trackId) { si = i; break; }
    if (si !== -1 && si < p.length - 1) return [];
    const down = t.mode === 'NORMAL';
    const prefix = p.slice(0, ci + 1);
    if (ra.trackId !== p[ci]) prefix.push(ra.trackId);
    const nx = this.pb.nextAfter(prefix, down);
    if (nx === -1) return null;
    prefix.push(nx);
    const ext = this.pb.extendFrom(prefix, down), add = [];
    for (let i = ci + 1; i < ext.length; i++) { const id = ext[i]; if (!p.includes(id) && !add.includes(id)) add.push(id); }
    return add;
  },
  permitCheck(t) {
    if (!this.data || !t || !this.trains.includes(t)) return 'Kereta tidak ditemukan';
    if (this.finished) return 'Dinas sudah selesai';
    if (!t.hasLoco) return 'Rangkaian tanpa lokomotif';
    if (t.manual) return 'Kereta sedang dikendalikan manual';
    if (t.stopped || t.finished) return 'Kereta tidak bisa berjalan';
    if (t.hasPermit()) return 'Izin sudah diberikan (sinyal ' + t.permitSig + ')';
    if (t.speed > 0.5) return 'Kereta belum berhenti';
    const ra = this.redSignalAhead(t);
    if (!ra) return 'Tidak ada sinyal merah di depan kereta';
    if (this.permitExtension(t, ra) == null) return 'Tidak ada jalur di depan sinyal';
    return null;
  },
  describePermit(t) {
    const ra = this.redSignalAhead(t), ext = this.permitExtension(t, ra);
    if (!ra || ext == null) return 'Izin tidak bisa diberikan.';
    const run = t.path.slice(t.idx);
    for (const id of ext) if (!run.includes(id)) run.push(id);
    let s = `Sinyal ${J.str(ra.sig, 'id', '?')} MERAH di depan ${t.no}.\n\nKereta melewati sinyal dengan kecepatan maks ${PERMIT_KMH} km/j dan berjalan atas pandangan (berhenti sendiri di belakang kereta lain).\n\nJalur: ${run.join(' → ')}`;
    const warn = [];
    for (const sw of (J.arr(this.data, 'switches') || [])) {
      if (!sw) continue;
      const br = this.geo.branches(sw);
      const used = this.geo.usedBranch(run, br, this.geo.pivot(br));
      if (used !== -1 && used !== this.geo.activeBranch(sw)) warn.push(`⚠ Wesel ${J.str(sw, 'id', '?')} tidak mengarah ke jalur ini: kereta bisa ANJLOK!`);
    }
    for (const o of this.trains) {
      if (o === t || o.finished) continue;
      for (const id of o.occupied(this.geo)) if (run.indexOf(id) > 0) { warn.push(`⚠ Track ${id} terisi ${o.no}`); break; }
    }
    for (const r of this.routes) for (let k = 1; k < run.length; k++) if (r.path.includes(run[k])) { warn.push(`⚠ Track ${run[k]} dipakai rute sinyal ${r.signalId}`); break; }
    if (warn.length) s += '\n\n' + warn.join('\n');
    if (t.dwell && !String(t.dep).includes('-')) s += `\n\nKereta tetap berangkat sesuai jadwal (${t.dep}).`;
    return s + '\n\nKeselamatan perjalanan menjadi tanggung jawab PPKA.';
  },
  grantPassRed(t) {
    const why = this.permitCheck(t);
    if (why) { this.err(why); return false; }
    const ra = this.redSignalAhead(t), ext = this.permitExtension(t, ra), sid = J.str(ra.sig, 'id', '?');
    t.grantPermit(sid, ra.trackId, ext);
    this.updateSightCap(t);
    this.log(null, `[${t.no}] Diizinkan melewati sinyal ${sid} (maks ${PERMIT_KMH} km/j, atas pandangan)`, 'yellow');
    return true;
  },

  // ---------- langsir otomatis ----------
  planner(t) {
    if (!this._planner || this._plannerFor !== this.data) { this._planner = new ShuntPlanner(this.geo, this.pb); this._plannerFor = this.data; }
    const occ = new Set();
    for (const o of this.trains) { if (o === t || o.finished) continue; o.occupied(this.geo).forEach(x => occ.add(x)); }
    if (t) t.occupied(this.geo).forEach(x => occ.delete(x));
    this._planner.setBlocked(occ);
    this.updateSwitchLocks();
    this._planner.setFixed(sw => this.isSwitchOccupied(sw) || this.isSwitchMoving(sw));
    return this._planner;
  },
  tailTrackOf(t) { const ti = t.tailPos(this.geo)[0]; return ti >= 0 && ti < t.path.length ? t.path[ti] : -1; },
  shuntCheck(t) {
    if (!this.data || !t || !this.trains.includes(t)) return 'Kereta tidak ditemukan';
    if (this.finished) return 'Dinas sudah selesai';
    if (!t.hasLoco) return 'Rangkaian tanpa lokomotif';
    if (t.manual) return 'Kereta sedang dikendalikan manual';
    if (t.stopped || t.finished) return 'Kereta tidak bisa berjalan';
    if (t.isShunting()) return 'Kereta sedang langsir';
    if (t.speed > 0.5) return 'Kereta belum berhenti';
    return null;
  },
  shuntTargets(t, max) {
    if (this.shuntCheck(t)) return [];
    const all = this.planner(t).reachable(t.curId, t.mode === 'NORMAL', this.tailTrackOf(t), t.totalLen(), 4000);
    const plat = [], other = [];
    for (const id of all) {
      const ty = this.geo.type(id).toUpperCase();
      if (ty === 'END' || ty === 'SPAWN') continue;
      (this.geo.platform(id) ? plat : other).push(id);
    }
    return plat.concat(other).slice(0, max);
  },
  shuntTargetLabel(id) { return this.geo.platform(id) ? this.geo.platLabel(id) + '  (T' + id + ')' : 'Track ' + id; },
  planShunt(t, target) {
    if (this.shuntCheck(t)) return null;
    return this.planner(t).plan(t.curId, t.mode === 'NORMAL', this.tailTrackOf(t), t.totalLen(), target);
  },
  describeShunt(t, p) {
    if (!p) return 'Tidak ada jalur langsir ke track itu.';
    return `Langsir ${t.no} ke ${this.shuntTargetLabel(p.target)}\n\n` + this.planner(t).describe(p);
  },
  startShunt(t, target) {
    const why = this.shuntCheck(t);
    if (why) { this.err(why); return false; }
    const p = this.planShunt(t, target);
    if (!p) { this.err('Tidak ada jalur langsir ke ' + this.shuntTargetLabel(target)); return false; }
    t.startShunt(p);
    this.log(null, `[${t.no}] Langsir ke ${this.shuntTargetLabel(target)} (${p.reversals}x balik arah)`, 'cyan');
    return true;
  },
  cancelShunt(t) {
    if (!t || !t.isShunting()) return;
    t.endShunt();
    if (this.runRoundRake.delete(t)) {   // loko pindah ujung dihentikan: lanjut dengan kontrol manual
      t.beginManual();
      if (this.selLoco && this.selLoco !== t) this.selLoco.setManualDir(0);
      this.selLoco = t;
    }
    this.log(null, `[${t.no}] Langsir dihentikan`, 'cyan');
  },
  distAlong(t, idx, prog) {
    const p = t.path, cur = t.idx;
    if (idx < cur) return 0;
    if (idx === cur) return Math.max(0, (prog - t.prog) * this.geo.meters(p[cur]));
    let d = (1 - t.prog) * this.geo.meters(p[cur]);
    for (let i = cur + 1; i < idx && i < p.length; i++) d += this.geo.meters(p[i]);
    if (idx < p.length) d += prog * this.geo.meters(p[idx]);
    return d;
  },
  shuntStep(t, time) {
    const plan = t.shuntPlan;
    if (!plan) return;
    if (t.shuntHold) { t.shuntCap = 0; return; }
    if (t.shuntMove >= plan.moves.length) { t.endShunt(); return; }
    const m = plan.moves[t.shuntMove];
    if (!t.shuntStarted) {
      if (t.speed > 0.1) { t.shuntCap = 0; return; }
      if (m.down !== (t.mode === 'NORMAL')) { t.flip(this.geo); this.lastTrackSeen.set(t, t.curId); }
      const k = m.tracks.indexOf(t.curId);
      if (k < 0) { t.endShunt(); this.log(time, `[${t.no}] Langsir dibatalkan: posisi kereta tidak sesuai rencana`, 'red'); return; }
      const platformFinal = m.last && t.isStopPlatform(plan.target);
      t.applyShuntMove(m.tracks.slice(k), platformFinal ? -1 : m.stopIdx - k, m.stopProg);
    }
    let cap = SHUNT_KMH_T, wait = null;
    const stopIdx = t.shuntStopIdx;
    if (stopIdx >= 0) { const d = this.distAlong(t, stopIdx, t.shuntStopProg); cap = Math.min(cap, d <= 0.3 ? 0 : Math.max(3, this.brakeCurve(t, d))); }
    const p = t.path, cur = t.idx;
    let ahead = (1 - t.prog) * this.geo.meters(p[cur]);
    for (let i = cur; i + 1 < p.length && ahead < 250; i++) {
      const a = p[i], b = p[i + 1];
      const cand = this.switchesOn(a).slice();
      for (const x of this.switchesOn(b)) if (!cand.includes(x)) cand.push(x);
      for (const sw of cand) {
        const br = this.geo.branches(sw), ia = br.includes(a), ib = br.includes(b);
        if (ia === ib) continue;
        const pv = this.geo.pivot(br);
        if (!pv || !this.geo.touches(a, pv) || !this.geo.touches(b, pv)) continue;
        const planned = ia ? a : b, swId = J.str(sw, 'id', '?');
        if (planned !== this.geo.activeBranch(sw) || this.isSwitchMoving(sw)) {
          const room = ahead - ((J.num(sw, 'zone', SWITCH_ZONE_M) || SWITCH_ZONE_M) + 5);
          cap = Math.min(cap, room <= 0.3 ? 0 : Math.max(3, this.brakeCurve(t, room)));
          if (!wait) wait = `Menunggu wesel ${swId} ${this.geo.posLabel(br.indexOf(planned), br.length)}`;
        }
      }
      ahead += this.geo.meters(b);
    }
    const g = Coupling.nearestAhead(t, this.trains, this.geo);
    const myRake = this.runRoundRake.get(t);
    const coupling = m.last && plan.couple && myRake && g.other === myRake;
    if (coupling) {
      // mendekati rangkaian sendiri untuk menyambung: pelan sampai menempel
      const room = g.meters - 0.6;
      cap = Math.min(cap, room <= 0 ? 0 : Math.min(COUPLE_MAX_KMH, Math.max(2, this.brakeCurve(t, room))));
      if (room <= 0) cap = 0;
      if (!wait && g.meters < 40) wait = `Mendekat untuk menyambung (${Math.round(g.meters)} m)`;
      if (g.meters <= Coupling.GAP_M && t.speed <= 0.05) { t.shuntCap = 0; this.finishRunRound(t, g, time); return; }
    } else if (g.other) {
      const room = g.meters - SHUNT_GAP_M;
      cap = Math.min(cap, room <= 0 ? 0 : this.brakeCurve(t, room));
      if (room < 30 && !wait) wait = `Tertahan ${g.other.no} di depan`;
    }
    t.shuntCap = cap;
    if (!wait && t.waitSig) { const sg = t.nextMainSignal(this.geo); wait = 'Menunggu sinyal' + (sg ? ' ' + J.str(sg, 'id', '') : '') + ' (pasang rute langsir)'; }
    if (!wait && t.dwell) wait = 'Menunggu jam berangkat ' + t.dep;
    t.shuntStatus = (plan.couple ? `Pindah ke ujung lain (T${plan.target})` : `Langsir ke T${plan.target}`) + ` · gerakan ${t.shuntMove + 1}/${plan.moves.length}` + (m.last ? '' : ' (lalu balik arah)') + (wait ? ' · ' + wait : '');
    if (t.speed > 0.05) return;
    if (m.last && stopIdx < 0) {
      if (t.dwell && t.curId === plan.target) this.finishShunt(t, false, time);
      return;
    }
    const reached = stopIdx >= 0 && (cur > stopIdx || (cur === stopIdx && t.prog >= t.shuntStopProg - 0.01));
    if (!reached) return;
    this.releasePassedRoutes(t, m);
    if (m.last) this.finishShunt(t, true, time); else t.nextShuntMove();
  },
  finishShunt(t, hold, time) {
    const target = t.shuntTarget();
    this.log(time, `[${t.no}] Langsir selesai di ${this.shuntTargetLabel(target)}`, 'cyan');
    if (hold) t.holdShunt(`Langsir selesai di T${target}, menunggu perintah (tekan STOP LANGSIR untuk melepas)`);
    else t.endShunt();
  },
  // ---------- pindah loko otomatis (loko memutari rangkaian) ----------
  isRunRoundLoco(t) { return !!t && this.runRoundRake.has(t); },
  runRoundCheck(t) {
    if (!this.data || !t || !this.trains.includes(t)) return 'Kereta tidak ditemukan';
    if (this.finished) return 'Dinas sudah selesai';
    if (!t.hasLoco) return 'Rangkaian tanpa lokomotif';
    if (t.mu) return t.trId + ' punya kabin di kedua ujung: gunakan balik arah (tb), bukan pindah loko';
    if (t.coachCount() < 1) return 'Lokomotif tanpa rangkaian';
    if (t.locoRear) return 'Lokomotif sudah di belakang (mendorong)';
    if (t.manual) return 'Kereta sedang dikendalikan manual';
    if (t.stopped || t.finished) return 'Kereta tidak bisa berjalan';
    if (t.isShunting()) return 'Kereta sedang langsir';
    if (t.speed > 0.5) return 'Kereta belum berhenti';
    return null;
  },
  // Loko: dari kepala kereta memutari rangkaian, tiba di track A di belakang ekor dengan arah semula,
  // lalu masuk track ekor dan menyambung.
  planRunRound(t) {
    if (this.runRoundCheck(t)) return null;
    const down = t.mode === 'NORMAL', head = t.curId, tail = this.tailTrackOf(t);
    if (tail === -1) return null;
    const sp = this.planner(t);
    const blocked = new Set();   // rangkaian sendiri juga penghalang
    for (const o of this.trains) if (!o.finished) o.occupied(this.geo).forEach(x => blocked.add(x));
    sp.setBlocked(blocked);
    let best = null;
    for (const a of sp.successors(tail, !down)) {
      if (blocked.has(a)) continue;
      if (!sp.successors(a, down).includes(tail)) continue;
      const p = sp.planArrive(head, down, -1, t.locoM, a, down);
      if (p && (!best || p.meters < best.meters)) best = p;
    }
    if (!best) return null;
    const last = best.moves[best.moves.length - 1];
    last.tracks.push(tail);
    last.stopIdx = last.tracks.length - 1;
    last.stopProg = 1;
    const beyond = this.pb.nextAfter(last.tracks.slice(), down);   // supaya jalur tidak habis di track ekor
    if (beyond !== -1 && !last.tracks.includes(beyond)) last.tracks.push(beyond);
    best.target = tail;
    best.couple = true;
    return best;
  },
  describeRunRound(t, p) {
    if (!p) return 'Tidak ada jalur untuk memutar lokomotif: perlu jalur lain (sepur simpan / peron kosong) yang menghubungkan kedua ujung rangkaian.';
    let s = `Lokomotif ${t.no} dilepas, lalu memutari rangkaian:\n\n`, k = 1;
    for (const m of p.moves) {
      s += (k++) + '. ' + (m.down ? 'Ke bawah (DN): ' : 'Ke atas (UP): ') + m.tracks.slice(0, m.stopIdx + 1).join(' → ');
      if (!m.last) s += '\n    lalu balik arah setelah melewati pangkal T' + m.reverseTrack;
      s += '\n';
    }
    s += `\nLoko menyambung di ujung rangkaian di T${p.target}. Setelah itu kereta menghadap arah sebaliknya dengan loko di depan dan menunggu jadwal berangkat.`;
    s += '\n\nMasinis berhenti di sinyal merah dan di wesel yang belum mengarah ke jalur ini: pasang rute langsir / atur wesel untuk lokonya.';
    return s;
  },
  startRunRound(t) {
    const why = this.runRoundCheck(t);
    if (why) { this.err(why); return false; }
    const p = this.planRunRound(t);
    if (!p) { this.err('Tidak ada jalur untuk memutar lokomotif'); return false; }
    const loco = t.splitLoco(this.geo);
    if (!loco) { this.err('Gagal melepas lokomotif'); return false; }
    loco.endManual();   // dijalankan masinis, bukan kontrol manual
    this.trains.push(loco);
    this.lastTrackSeen.set(loco, loco.curId);
    t.updateCoords(this.geo); loco.updateCoords(this.geo);
    this.runRoundRake.set(loco, t);
    loco.startShunt(p);
    this.log(null, `[${t.no}] Lokomotif dilepas untuk pindah ke ujung lain (${p.reversals}x balik arah)`, 'cyan');
    return true;
  },
  finishRunRound(loco, g, time) {
    const rake = this.runRoundRake.get(loco);
    this.runRoundRake.delete(loco);
    loco.endShunt();
    if (!Coupling.couple(loco, g, this.geo)) { this.log(time, `[${loco.no}] Gagal menyambung, lanjutkan dengan kontrol manual`, 'red'); return; }
    const i = this.trains.indexOf(loco);
    if (i >= 0) this.trains.splice(i, 1);
    if (this.selLoco === loco) this.selLoco = null;
    this.lastTrackSeen.set(rake, rake.curId);
    rake.updateCoords(this.geo);
    this.log(time, `[${rake.no}] Lokomotif sudah pindah ke ujung lain dan tersambung`, 'cyan');
  },
  releasePassedRoutes(t, m) {
    const passed = t.path.slice(0, t.idx + 1);
    const drop = this.routes.filter(r => {
      if (r.locking || r.cancelling || J.eqi(r.sigType, 'BLOCK')) return false;
      if (!r.path.length || !passed.includes(r.path[0]) || !m.tracks.includes(r.path[0])) return false;
      return !this.trains.some(o => o !== t && this.isRouteOwnedBy(o, r));
    });
    for (const r of drop) if (r.signalId) this.setSignal(r.signalId, 'RED');
    if (drop.length) this.routes = this.routes.filter(r => !drop.includes(r));
  },
});

// =====================================================================
//  TrackGeometry: sudut sambungan dibuat melengkung (Bezier kubik) untuk GAMBAR dan GERAK kereta.
//  - Track yang punya pasangan segaris di sambungan tetap lurus.
//  - Pasangan lurus -> hanya track ini melengkung (seperti cabang belok wesel);
//    keduanya belok -> lengkungan dibagi dua.
//  - Track peron tidak pernah melengkung. Di titik pangkal wesel hanya cabang wesel yang melengkung.
//  Dihitung di ruang layar (y × YX) supaya lengkungan bulat di layar.
// =====================================================================
const TG = {
  TOL: 0.003, COS_STRAIGHT: Math.cos(4 * Math.PI / 180), COS_MAX_TURN: Math.cos(80 * Math.PI / 180),
  R_MAX: 0.12, R_FRAC: 0.45, HANDLE: 0.55, SAMPLES: 12,
  cachedFor: null, cache: new Map(),
  get(geo, id) { if (geo.data !== this.cachedFor) this.build(geo); return this.cache.get(id) || null; },
  // titik pada pecahan panjang f (0 = start, 1 = end): {x, y, tx, ty}; di luar 0..1 diperpanjang lurus
  pointAt(geo, id, f) {
    const s = this.get(geo, id);
    if (!s || s.xs.length < 2) return null;
    const n = s.xs.length;
    if (f <= 0 || f >= 1 || s.total <= 0) {
      const atEnd = f >= 1, a = atEnd ? n - 2 : 0, b = atEnd ? n - 1 : 1;
      let dx = s.xs[b] - s.xs[a], dy = s.ys[b] - s.ys[a], l = Math.hypot(dx, dy);
      if (l <= 0) { dx = 0; dy = 1; l = 1; }
      const ux = dx / l, uy = dy / l, ex = (atEnd ? f - 1 : f) * s.total;
      const bx = atEnd ? s.xs[n - 1] : s.xs[0], by = atEnd ? s.ys[n - 1] : s.ys[0];
      return { x: bx + ux * ex, y: by + uy * ex, tx: ux, ty: uy };
    }
    const target = f * s.total;
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (s.cum[mid] <= target) lo = mid; else hi = mid; }
    const seg = s.cum[hi] - s.cum[lo], t = seg > 0 ? (target - s.cum[lo]) / seg : 0;
    const dx = s.xs[hi] - s.xs[lo], dy = s.ys[hi] - s.ys[lo], l = Math.hypot(dx, dy);
    return { x: s.xs[lo] + dx * t, y: s.ys[lo] + dy * t, tx: l > 0 ? dx / l : 0, ty: l > 0 ? dy / l : 1 };
  },
  build(geo) {
    const Y = YX;
    this.cachedFor = geo.data; this.cache = new Map();
    const segs = [];
    for (const [id, c] of geo.coords) {
      if (!c || c.some(Number.isNaN)) continue;
      const s = { id, sx: c[0], sy: c[1] * Y, ex: c[2], ey: c[3] * Y, endCurve: [null, null] };
      s.len = Math.hypot(s.ex - s.sx, s.ey - s.sy);
      if (s.len > 1e-9) segs.push(s);
    }
    const platformTracks = new Set();
    for (const p of (J.arr(geo.data, 'platforms') || [])) if (p && J.has(p, 'onTrack')) platformTracks.add(J.int(p, 'onTrack', -1));
    const pivots = [];
    for (const sw of (J.arr(geo.data, 'switches') || [])) {
      if (!sw) continue;
      const br = geo.branches(sw), pv = geo.pivot(br);
      if (pv) pivots.push({ x: pv[0], y: pv[1] * Y, br: new Set(br) });
    }
    const mayCurve = (id, jx, jy) => {
      if (platformTracks.has(id)) return false;
      for (const p of pivots) {
        if (Math.abs(p.x - jx) > this.TOL || Math.abs(p.y - jy) > this.TOL * Y) continue;
        if (!p.br.has(id)) return false;
      }
      return true;
    };

async function antdDecrypt(bytes, secret) {
  if (!window.crypto || !crypto.subtle) throw new Error('Web Crypto tidak tersedia. Buka halaman lewat https:// atau localhost (bukan file:// di sebagian browser).');
  if (typeof DecompressionStream === 'undefined') throw new Error('Browser tidak mendukung GZIP (DecompressionStream).');
  if (bytes[4] !== ANTD.VER) throw new Error('Versi berkas tidak didukung.');
  const iv = bytes.slice(ANTD.HEAD, ANTD.HEAD + ANTD.IV), ct = bytes.slice(ANTD.HEAD + ANTD.IV);
  const raw = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('antd-v1|' + secret));
  const key = await crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']);
  let gz;
  try { gz = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: bytes.slice(0, ANTD.HEAD), tagLength: 128 }, key, ct)); }
  catch (_) { const e = new Error('Secret salah atau berkas rusak.'); e.wrong = true; throw e; }
  const plain = await streamBytes(gz, new DecompressionStream('gzip'));
  return JSON.parse(new TextDecoder().decode(plain));
}

// ---------- suara (WebAudio sintetis, tanpa berkas mp3) ----------
const Sound = {
  ctx: null, on: true, tts: true, lastBell: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  tone(freq, dur, type = 'sine', vol = 0.15, delay = 0, slide = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(dur, vol = 0.2, delay = 0, freq = 800) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); s.start(c.currentTime + delay);
  },
  play(name) {
    if (!this.on || !this.ctx) return;
    switch (name) {
      case 'horn': this.tone(311, 0.9, 'sawtooth', 0.06); this.tone(392, 0.9, 'sawtooth', 0.05); break;
      case 'spawn': this.tone(660, 0.12, 'square', 0.05); this.tone(880, 0.14, 'square', 0.05, 0.13); break;
      case 'exit': this.tone(784, 0.18, 'sine', 0.08); this.tone(587, 0.25, 'sine', 0.08, 0.16); break;
      case 'switch': this.noise(0.06, 0.25, 0, 2500); this.tone(110, 1.3, 'sawtooth', 0.025, 0.05, 30); this.noise(0.08, 0.25, 1.4, 1800); break;
      case 'alarm': for (let i = 0; i < 3; i++) this.tone(1046, 0.12, 'square', 0.06, i * 0.22); break;
      case 'crash': this.noise(1.2, 0.5, 0, 300); this.tone(80, 1, 'sawtooth', 0.15, 0, -40); break;
      case 'bell': this.tone(1320, 0.35, 'triangle', 0.05); this.tone(2640, 0.2, 'sine', 0.015); break;
      case 'click': this.tone(1200, 0.03, 'square', 0.03); break;
    }
  },
  // ---- horn per jenis loko ----
  // File opsional di folder "suara" di samping file HTML (mp3): horn_<horn jadwal>, horn_<lk> (horn_cc206, horn_krl, ...),
  // horn_emu, horn_freight, horn. Bila tidak ada file, dipakai horn sintetis yang berbeda per jenis.
  fileOk: new Map(), lastHorn: new Map(),
  hornKey(s) { s = String(s || '').trim().toLowerCase().replace(/[^a-z0-9_]/g, ''); return s.startsWith('horn_') ? s.slice(5) : s; },
  hornNames(t) {
    const out = [], c = this.hornKey(t.horn), id = this.hornKey(t.trId);
    if (c) out.push('horn_' + c);
    if (id) out.push('horn_' + id);
    if (t.mu) out.push('horn_emu');
    if (t.freight) out.push('horn_freight');
    out.push('horn');
    return out;
  },
  horn(t) {
    if (!this.on) return;
    const names = this.hornNames(t), now = Date.now();
    if (now - (this.lastHorn.get(names[0]) || 0) < 800) return;
    this.lastHorn.set(names[0], now);
    const tryAt = i => {
      if (i >= names.length) { this.synthHorn(t); return; }
      const n = names[i];
      if (this.fileOk.get(n) === false) { tryAt(i + 1); return; }
      const a = new Audio('suara/' + n + '.mp3');
      a.play().then(() => this.fileOk.set(n, true)).catch(e => {
        if (e && e.name === 'NotAllowedError') { this.synthHorn(t); return; }   // browser belum mengizinkan suara
        this.fileOk.set(n, false); tryAt(i + 1);
      });
    };
    if (location.protocol === 'http:' || location.protocol === 'https:' || location.protocol === 'file:') tryAt(0); else this.synthHorn(t);
  },
  // horn sintetis: nada & pola berbeda per jenis loko
  SYNTH: {
    CC201: [[311, 392], 1.0, 'sawtooth'], CC203: [[294, 370], 1.0, 'sawtooth'], CC204: [[330, 415], 0.9, 'sawtooth'],
    CC206: [[349, 440], 0.8, 'square'], CC300: [[370, 466], 0.7, 'square'], CC205: [[220, 277], 1.3, 'sawtooth'],
    BB303: [[392, 494], 0.8, 'sawtooth'], BB304: [[415, 523], 0.8, 'sawtooth'], D301: [[523, 659], 0.5, 'square'],
    KRL: [[659, 784], 0.35, 'triangle', 2], KRD: [[440, 554], 0.45, 'square', 2],
  },
  synthHorn(t) {
    if (!this.ctx) return;
    const p = this.SYNTH[String(t.trId || '').toUpperCase()] || (t.freight ? [[262, 330], 1.1, 'sawtooth'] : [[311, 392], 0.9, 'sawtooth']);
    const [fr, dur, type, rep = 1] = p;
    for (let k = 0; k < rep; k++) for (let j = 0; j < fr.length; j++) this.tone(fr[j], dur, type, j ? 0.05 : 0.06, k * (dur + 0.12));
  },
  announce(text) {
    if (!this.tts || !('speechSynthesis' in window)) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'id-ID'; u.rate = 0.95;
      const v = speechSynthesis.getVoices().find(v => /^id/i.test(v.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (_) {}
  },
};

let toastTimer = 0;

const Dlg = {
  stack: [],
  open({ title, text, html, node, buttons = [], warn = false, onClose, cls = '' }) {
    const m = document.createElement('div');
    m.className = 'modal';
    const d = document.createElement('div');
    d.className = 'dlg ' + (warn ? 'warn ' : '') + cls;
    const h = document.createElement('header'); h.innerHTML = title || '';
    const b = document.createElement('div'); b.className = 'body' + (html || node ? ' html' : '');
    if (node) b.appendChild(node); else if (html) b.innerHTML = html; else b.textContent = text || '';
    const f = document.createElement('footer');
    const obj = { m, d, body: b, header: h, closed: false, close: () => { if (obj.closed) return; obj.closed = true; m.remove(); Dlg.stack = Dlg.stack.filter(x => x !== obj); if (onClose) onClose(); } };
    for (const bt of buttons) {
      const e = document.createElement('button');
      e.textContent = bt.label; if (bt.cls) e.className = bt.cls;
      e.onclick = () => { Sound.play('click'); const keep = bt.fn && bt.fn(obj) === false; if (!keep) obj.close(); };
      f.appendChild(e);
      if (bt.ref) obj[bt.ref] = e;
    }
    d.append(h, b); if (buttons.length) d.append(f);
    m.appendChild(d);
    m.addEventListener('pointerdown', e => { if (e.target === m && obj.dismiss !== false) { obj.dismissed = true; obj.close(); } });
    document.body.appendChild(m);
    this.stack.push(obj);
    return obj;
  },
  top() { return this.stack[this.stack.length - 1] || null; },
  closeAll() { this.stack.slice().forEach(o => o.close()); },
};
function askSecret(fileName, wrong) {
  return new Promise(res => {
    const wrap = document.createElement('div');
    wrap.innerHTML = `<p style="margin:0 0 8px">${wrong ? '<b class="c-red">Secret salah.</b> ' : ''}Berkas <b>${esc(fileName)}</b> terkunci. Masukkan secret:</p><input type="password" autocomplete="off">`;
    const inp = wrap.querySelector('input');
    const d = Dlg.open({ title: '🔒 Secret berkas', node: wrap, buttons: [{ label: 'Batal', fn: () => res(null) }, { label: 'Buka', cls: 'primary', fn: () => res(inp.value) }] });
    d.dismiss = false;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { d.close(); res(inp.value); } });
    setTimeout(() => inp.focus(), 50);
  });
}

// =====================================================================
//  UI bagian 2: Renderer kanvas (tampilan diputar 90°: arah NORMAL = ke kanan)
// =====================================================================
const COL = {
  bg: '#0b1016', track: '#B7B7B7', occ: '#ff3b3b', route: '#2ee66b', lock: '#FF7711', pending: '#E49199', spawn: '#00E5FF',
  buffer: '#FF5252', plat: '#3a4656', platEdge: '#5f7187', bld: '#1a2735', bldEdge: '#2f4560', text: '#c9d6e2',
  loco: '#ffb300', coach: '#8fc1ff', freight: '#b08d6a', rake: '#8a9aa8',
};
const View = {
  S: 400, ox: 0, oy: 0, w: 0, h: 0, dpr: 1, cv: null, ctx: null, showIds: false,
  sx(x, y) { return y * YX * this.S + this.ox; },
  sy(x, y) { return -x * this.S + this.oy; },
  toWorld(px, py) { return { y: (px - this.ox) / (YX * this.S), x: -(py - this.oy) / this.S }; },
  resize() {
    const r = this.cv.getBoundingClientRect();
    this.dpr = Math.min(2.5, window.devicePixelRatio || 1);
    const W = Math.max(1, Math.round(r.width * this.dpr)), H = Math.max(1, Math.round(r.height * this.dpr));
    if (this.cv.width !== W || this.cv.height !== H) { this.cv.width = W; this.cv.height = H; }
    const cx = this.w ? (this.w / 2 - this.ox) : null, cy = this.h ? (this.h / 2 - this.oy) : null;
    this.w = r.width; this.h = r.height;
    if (cx != null) { this.ox = this.w / 2 - cx; this.oy = this.h / 2 - cy; }
  },
  fit() {
    if (!game.geo) return;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const c of game.geo.coords.values()) {
      if (c.some(Number.isNaN)) continue;
      x0 = Math.min(x0, c[0], c[2]); x1 = Math.max(x1, c[0], c[2]); y0 = Math.min(y0, c[1], c[3]); y1 = Math.max(y1, c[1], c[3]);
    }
    if (!Number.isFinite(x0)) return;
    const pad = 40, ww = Math.max(1e-3, (y1 - y0) * YX), hh = Math.max(1e-3, x1 - x0);
    this.S = Math.max(20, Math.min((this.w - pad * 2) / ww, (this.h - pad * 2) / hh));
    this.ox = this.w / 2 - ((y0 + y1) / 2) * YX * this.S;
    this.oy = this.h / 2 + ((x0 + x1) / 2) * this.S;
  },
  zoomAt(px, py, f) {
    const ns = Math.max(15, Math.min(20000, this.S * f));
    f = ns / this.S;
    this.ox = px - (px - this.ox) * f; this.oy = py - (py - this.oy) * f; this.S = ns;
  },
};

// Struktur statis per peta (ujung buffer, label END/SPAWN)
let Static = null;
function buildStatic() {
  const geo = game.geo;
  const ends = [];
  const free = (self, p) => { for (const [id, c] of geo.coords) { if (id === self) continue; if ((Math.abs(c[0] - p[0]) < 0.002 && Math.abs(c[1] - p[1]) < 0.002) || (Math.abs(c[2] - p[0]) < 0.002 && Math.abs(c[3] - p[1]) < 0.002)) return false; } return true; };
  for (const [id, t] of geo.tracks) {
    const c = geo.c(id);
    if (!c || c.some(Number.isNaN)) continue;
    const ty = J.str(t, 'type', '').toUpperCase();
    const buf = J.bool(t, 'buffer', false);
    for (const k of [0, 1]) {
      const p = [c[k * 2], c[k * 2 + 1]], q = [c[(1 - k) * 2], c[(1 - k) * 2 + 1]];
      if (!free(id, p)) continue;
      ends.push({ id, p, q, buf, label: (ty === 'END' || ty === 'SPAWN') ? (J.str(t, 'name', '') || (ty === 'END' ? 'KELUAR' : 'MASUK')) : '', ty });
    }
  }
  Static = { ends };
}

function trackColorMap() {
  const occ = new Set(), act = new Set(), lock = new Set(), pend = new Set();
  for (const t of game.trains) if (!t.finished) t.occupied(game.geo).forEach(x => occ.add(x));
  const blink = Math.floor(performance.now() / 250) % 2 === 0;
  for (const r of game.routes) {
    if (r.locking) { if (blink) r.path.forEach(x => lock.add(x)); }
    else if (!J.eqi(r.sigType, 'BLOCK')) r.path.forEach(x => act.add(x));
  }
  if (game.pendingPath) game.pendingPath.forEach(x => pend.add(x));
  return { occ, act, lock, pend };
}

function draw() {
  const ctx = View.ctx, V = View;
  ctx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, V.w, V.h);
  if (!game.geo) return;
  const geo = game.geo, S = V.S;
  const z = Math.max(0.3, Math.min(1.8, S / 520));
  const lw = Math.max(2, Math.min(6, S / 140));
  const vis = (ax, ay, bx, by, m = 60) => !(Math.max(ax, bx) < -m || Math.min(ax, bx) > V.w + m || Math.max(ay, by) < -m || Math.min(ay, by) > V.h + m);
  const P = (x, y) => [V.sx(x, y), V.sy(x, y)];
  const labels = S > 260;

  // ---- gedung stasiun ----
  ctx.font = `600 ${Math.round(11 * z)}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const b of (J.arr(game.data, 'building') || [])) {
    const x = J.num(b, 'x'), t = J.num(b, 'topY'), bt = J.num(b, 'botY');
    if ([x, t, bt].some(Number.isNaN)) continue;
    const [ax, ay] = P(x + 0.025, t), [bx, by] = P(x - 0.025, bt);
    if (!vis(ax, ay, bx, by)) continue;
    ctx.fillStyle = COL.bld; ctx.strokeStyle = COL.bldEdge; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.rect(Math.min(ax, bx), Math.min(ay, by), Math.abs(bx - ax), Math.abs(by - ay)); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7f97b0';
    ctx.fillText(J.str(b, 'name', ''), (ax + bx) / 2, (ay + by) / 2);
  }
  // ---- peron ----
  for (const p of (J.arr(game.data, 'platforms') || [])) {
    const x = J.num(p, 'x'), t = J.num(p, 'topY'), bt = J.num(p, 'botY');
    if ([x, t, bt].some(Number.isNaN)) continue;
    const [ax, ay] = P(x + 0.042, t), [bx, by] = P(x + 0.022, bt);
    if (!vis(ax, ay, bx, by)) continue;
    ctx.fillStyle = COL.plat; ctx.strokeStyle = COL.platEdge;
    ctx.beginPath(); ctx.rect(Math.min(ax, bx), Math.min(ay, by), Math.abs(bx - ax), Math.abs(by - ay)); ctx.fill(); ctx.stroke();
    if (labels) {
      ctx.fillStyle = '#c7d6e6'; ctx.font = `600 ${Math.round(10 * z)}px system-ui`; ctx.textAlign = 'left';
      ctx.fillText(J.str(p, 'station', '') + ' ' + J.str(p, 'name', J.str(p, 'no', '')), Math.min(ax, bx) + 4, (ay + by) / 2);
      ctx.textAlign = 'center';
    }
  }

  // ---- track ----
  const cm = trackColorMap();
  for (const [id, t] of geo.tracks) {
    const c = geo.c(id);
    if (!c || c.some(Number.isNaN)) continue;
    const [ax, ay] = P(c[0], c[1]), [bx, by] = P(c[2], c[3]);
    if (!vis(ax, ay, bx, by)) continue;
    const ty = J.str(t, 'type', '').toUpperCase();
    let col = COL.track;
    if (cm.occ.has(id)) col = COL.occ;
    else if (cm.lock.has(id)) col = COL.lock;
    else if (cm.act.has(id)) col = COL.route;
    else if (cm.pend.has(id)) col = COL.pending;
    else if (ty === 'END' || ty === 'SPAWN') col = COL.spawn;
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'butt';
    if ((ty === 'END' || ty === 'SPAWN') && col === COL.spawn) ctx.setLineDash([lw * 2.2, lw * 1.6]); else ctx.setLineDash([]);
    const shp = TG.get(geo, id);
    ctx.beginPath();
    if (shp && shp.curved) { ctx.moveTo(V.sx(shp.xs[0], shp.ys[0]), V.sy(shp.xs[0], shp.ys[0])); for (let i = 1; i < shp.xs.length; i++) ctx.lineTo(V.sx(shp.xs[i], shp.ys[i]), V.sy(shp.xs[i], shp.ys[i])); }
    else { ctx.moveTo(ax, ay); ctx.lineTo(bx, by); }
    ctx.stroke();
    // panah arah ("dir")
    const dir = J.str(t, 'dir', '').toUpperCase();
    if ((dir === 'NORMAL' || dir === 'REVERSE') && S > 180) {
      const down = dir === 'NORMAL';
      let vx = bx - ax, vy = by - ay; const L = Math.hypot(vx, vy) || 1; vx /= L; vy /= L;
      const sgn = ((c[3] - c[1]) >= 0) === down ? 1 : -1; vx *= sgn; vy *= sgn;
      const mx = (ax + bx) / 2, my = (ay + by) / 2, a = 6 * z;
      ctx.setLineDash([]); ctx.strokeStyle = '#5f7187'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(mx - vx * a - vy * a, my - vy * a + vx * a); ctx.lineTo(mx + vx * a * 0.4, my + vy * a * 0.4); ctx.lineTo(mx - vx * a + vy * a, my - vy * a - vx * a); ctx.stroke();
    }
    if (V.showIds && S > 300) {
      ctx.fillStyle = '#6c7f93'; ctx.font = `${Math.round(9 * z)}px ui-monospace,monospace`;
      ctx.fillText(String(id), (ax + bx) / 2, (ay + by) / 2 - 8 * z);
    }
  }
  ctx.setLineDash([]);
  // ---- ujung buntu / buffer / label END-SPAWN ----
  if (Static) for (const e of Static.ends) {
    const [ax, ay] = P(e.p[0], e.p[1]), [bx, by] = P(e.q[0], e.q[1]);
    if (!vis(ax, ay, ax, ay)) continue;
    let vx = ax - bx, vy = ay - by; const L = Math.hypot(vx, vy) || 1; vx /= L; vy /= L;
    if (e.buf) {
      ctx.strokeStyle = COL.buffer; ctx.lineWidth = Math.max(3, lw);
      const a = 7 * z;
      ctx.beginPath(); ctx.moveTo(ax - vy * a, ay + vx * a); ctx.lineTo(ax + vy * a, ay - vx * a); ctx.stroke();
    }
    if (e.label && labels) {
      ctx.fillStyle = COL.spawn; ctx.font = `600 ${Math.round(10 * z)}px system-ui`;
      ctx.textAlign = vx > 0 ? 'left' : 'right';
      ctx.fillText(e.label, ax + vx * 6, ay + vy * 6 - 10 * z);
      ctx.textAlign = 'center';
    }
  }

  // ---- wesel ----
  const blinkSw = Math.floor(performance.now() / 250) % 2 === 0;
  for (const sw of (J.arr(game.data, 'switches') || [])) {
    const br = geo.branches(sw), pv = geo.pivot(br);
    if (!pv) continue;
    const [px, py] = P(pv[0], pv[1]);
    if (!vis(px, py, px, py)) continue;
    const moving = game.isSwitchMoving(sw), locked = game.isSwitchLocked(sw);
    const act = geo.activeBranch(sw);
    for (const b of br) {
      const cb = geo.c(b);
      if (!cb) continue;
      // lidah wesel: potongan awal cabang dari titik pangkal, mengikuti bentuk (lengkung) track
      const startAtPv = Math.hypot(cb[0] - pv[0], cb[1] - pv[1]) <= Math.hypot(cb[2] - pv[0], cb[3] - pv[1]);
      const shp = TG.get(geo, b);
      const lenPx = shp ? shp.total * S * 1.6 : 100;   // perkiraan panjang di layar
      const fr = Math.min(1, (14 * z) / Math.max(1, lenPx));
      if (b === act && !moving) { ctx.strokeStyle = locked ? '#ffe08a' : '#ffffff'; ctx.lineWidth = lw + 1.5; }
      else if (moving && blinkSw) { ctx.strokeStyle = COL.lock; ctx.lineWidth = lw + 1; }
      else { ctx.strokeStyle = COL.bg; ctx.lineWidth = lw + 2; }
      ctx.beginPath(); ctx.moveTo(px, py);
      for (let k = 1; k <= 4; k++) {
        const f = fr * k / 4, q = TG.pointAt(geo, b, startAtPv ? f : 1 - f);
        if (q) ctx.lineTo(V.sx(q.x, q.y), V.sy(q.x, q.y));
      }
      ctx.stroke();
    }
    const sx0 = J.num(sw, 'x'), sy0 = J.num(sw, 'y');
    const [dx, dy] = Number.isNaN(sx0) ? [px, py] : P(sx0, sy0);
    sw._sx = dx; sw._sy = dy;
    ctx.fillStyle = moving ? COL.lock : (locked ? '#c9a227' : '#4c6075');
    ctx.beginPath(); ctx.arc(dx, dy, 3.2 * z + 1, 0, Math.PI * 2); ctx.fill();
    if (labels && S > 420) {
      ctx.fillStyle = '#8aa0b6'; ctx.font = `${Math.round(9 * z)}px ui-monospace,monospace`;
      ctx.fillText(J.str(sw, 'id', ''), dx, dy + 10 * z);
    }
    if (game.selectedSwitch && J.eqi(game.selectedSwitch, J.str(sw, 'id', '')) && moving) {
      ctx.strokeStyle = COL.lock; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(dx, dy, 9 * z, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // ---- perlintasan ----
  const blinkX = Math.floor(performance.now() / 500) % 2 === 0;
  for (const c of game.crossings) {
    const [ax, ay] = P(c.x1, c.y), [bx, by] = P(c.x2, c.y);
    c._vis = vis(ax, ay, bx, by, 0);
    if (!vis(ax, ay, bx, by)) continue;
    const on = game.crossingActive(c);
    ctx.strokeStyle = on && blinkX ? '#FF1744' : '#ffffff'; ctx.lineWidth = Math.max(2, 3 * z);
    ctx.setLineDash([8 * z, 6 * z]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); ctx.setLineDash([]);
    if (on) {
      ctx.fillStyle = blinkX ? '#FF1744' : '#661A1A';
      for (const [x, y] of [[ax, ay], [bx, by]]) { ctx.beginPath(); ctx.arc(x + 12 * z, y, 5 * z, 0, Math.PI * 2); ctx.fill(); }
    }
    const lx = Math.min(ax, bx), ly = Math.min(ay, by) - 14 * z;
    c._hx = (ax + bx) / 2; c._hy0 = Math.min(ay, by) - 24 * z; c._hy1 = Math.max(ay, by);
    if (S > 150) {
      ctx.font = `700 ${Math.round(10 * z)}px system-ui`;
      const tw = ctx.measureText(c.label).width;
      ctx.fillStyle = on ? '#5a1418' : '#E0E0E0';
      ctx.fillRect((ax + bx) / 2 - tw / 2 - 5, ly - 8 * z, tw + 10, 15 * z);
      ctx.fillStyle = on ? '#fff' : '#212121';
      ctx.fillText(c.label, (ax + bx) / 2, ly);
    }
  }

  // ---- sinyal ----
  for (const s of (J.arr(game.data, 'signals') || [])) drawSignal(ctx, s, z, P, vis);

  // ---- kereta ----
  for (const t of game.trains) drawTrain(ctx, t, z, P, vis);

  // ---- tabrakan ----
  if (game.collision) {
    const [cx, cy] = P(game.collisionX, game.collisionY);
    const r = 16 + 6 * Math.sin(performance.now() / 150);
    ctx.strokeStyle = '#ff2d2d'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 10, cy - 10); ctx.lineTo(cx + 10, cy + 10); ctx.moveTo(cx + 10, cy - 10); ctx.lineTo(cx - 10, cy + 10); ctx.stroke();
    ctx.fillStyle = '#ff6b6b'; ctx.font = '700 13px system-ui'; ctx.fillText(game.derail ? 'ANJLOK' : 'TABRAKAN', cx, cy - r - 10);
  }
}

const LAMP = { RED: '#ff2d2d', YELLOW: '#ffd000', GREEN: '#20e060', WHITE: '#f4f4f4', OFF: '#2a2f36' };
function drawSignal(ctx, s, z, P, vis) {
  const x = J.num(s, 'x'), y = J.num(s, 'y');
  if (Number.isNaN(x) || Number.isNaN(y)) return;
  const [px, py] = P(x, y);
  s._sx = px; s._sy = py;
  if (!vis(px, py, px, py, 30)) return;
  const type = sigType(s), state = J.str(s, 'state', 'RED').toUpperCase(), down = sigDown(s);
  const dirx = down ? -1 : 1;               // gambar sinyal dibalik (cermin)
  const r = 3.6 * z, gap = 8.2 * z;
  let lamps;
  if (type === 'SHUNT') lamps = [state === 'RED' ? 'RED' : 'OFF', state !== 'RED' ? 'WHITE' : 'OFF'];
  else if (type === 'DISTANT') lamps = [state === 'GREEN' ? 'OFF' : 'YELLOW', state === 'GREEN' ? 'GREEN' : 'OFF'];
  else if (type === 'REPEATER') lamps = null;
  else lamps = [state === 'RED' ? 'RED' : 'OFF', state === 'YELLOW' ? 'YELLOW' : 'OFF', state === 'GREEN' ? 'GREEN' : 'OFF'];
  const n = lamps ? lamps.length : 2;
  const wBox = n * gap + 3 * z, hBox = 10 * z;
  // tiang: dari kepala sinyal menuju arah datang
  const headX = px, headY = py;
  ctx.strokeStyle = '#7d8a97'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(headX + dirx * (wBox / 2), headY); ctx.lineTo(headX + dirx * (wBox / 2 + 5 * z), headY);
  ctx.moveTo(headX + dirx * (wBox / 2 + 5 * z), headY - 4 * z); ctx.lineTo(headX + dirx * (wBox / 2 + 5 * z), headY + 4 * z); ctx.stroke();
  // rumah sinyal
  const bx = headX - wBox / 2, by = headY - hBox / 2;
  ctx.fillStyle = type === 'BLOCK' ? '#1b2a20' : (type === 'DISTANT' ? '#2a2614' : '#14181d');
  ctx.strokeStyle = J.eqi(game.selSig, J.str(s, 'id', '')) ? '#00e5ff' : '#56616d';
  ctx.lineWidth = J.eqi(game.selSig, J.str(s, 'id', '')) ? 2 : 1;
  roundRect(ctx, bx, by, wBox, hBox, 3 * z); ctx.fill(); ctx.stroke();
  if (lamps) {
    // urutan lampu: yang paling "bahaya" di sisi arah datang kereta
    for (let i = 0; i < n; i++) {
      const k = down ? n - 1 - i : i;
      const lx = bx + 1.5 * z + gap * (k + 0.5);
      const c = LAMP[lamps[i]];
      ctx.fillStyle = c;
      if (lamps[i] !== 'OFF') { ctx.shadowColor = c; ctx.shadowBlur = 8 * z; }
      ctx.beginPath(); ctx.arc(lx, headY, r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  } else {
    // repeater: batang horizontal (merah) / miring (aman)
    const col = state === 'RED' ? '#cfd8e0' : (state === 'YELLOW' ? LAMP.YELLOW : LAMP.GREEN);
    ctx.strokeStyle = col; ctx.lineWidth = 2.5 * z;
    ctx.beginPath();
    if (state === 'RED') { ctx.moveTo(bx + 3 * z, headY); ctx.lineTo(bx + wBox - 3 * z, headY); }
    else { ctx.moveTo(bx + 3 * z, headY + 3 * z); ctx.lineTo(bx + wBox - 3 * z, headY - 3 * z); }
    ctx.stroke();
  }
  // ujung penunjuk arah hadap
  ctx.fillStyle = '#56616d';
  const tipX = headX - dirx * (wBox / 2);
  ctx.beginPath(); ctx.moveTo(tipX - dirx * 4 * z, headY); ctx.lineTo(tipX, headY - 3 * z); ctx.lineTo(tipX, headY + 3 * z); ctx.fill();
  // indikator rute (diverge) untuk sinyal masuk
  if (type === 'ENTRY') {
    const ind = game.routeIndicator(J.str(s, 'id', ''));
    const ix = headX, iy = headY + (down ? 1 : -1) * 11 * z;
    ctx.fillStyle = '#0d0f12'; ctx.strokeStyle = '#56616d'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ix, iy - 5 * z); ctx.lineTo(ix + 5 * z, iy); ctx.lineTo(ix, iy + 5 * z); ctx.lineTo(ix - 5 * z, iy); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = ind ? '#ffffff' : '#333a42'; ctx.font = `700 ${Math.round(7 * z)}px ui-monospace,monospace`;
    ctx.fillText(ind || '3', ix, iy + 0.5);
  }
  // nama sinyal & sisa waktu batal
  if (View.S > 330) {
    ctx.fillStyle = '#9fb0c2'; ctx.font = `${Math.round(8.5 * z)}px ui-monospace,monospace`;
    ctx.fillText(J.str(s, 'id', ''), headX, headY + (down ? -1 : 1) * 10 * z);
  }
  const rem = game.cancelRemainingFor(J.str(s, 'id', ''));
  if (rem >= 0) {
    ctx.fillStyle = '#ffb347'; ctx.font = `700 ${Math.round(10 * z)}px ui-monospace,monospace`;
    ctx.fillText(rem + 's', headX, headY - 18 * z);
  }
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function drawTrain(ctx, t, z, P, vis) {
  const geo = game.geo, S = View.S;
  const bodies = t.carBodies(geo);
  t._cars = [];
  const wid = Math.max(4, Math.min(11, 7 * z));
  const sel = game.selLoco === t;
  let headPos = null, prevRear = null;
  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    const [fx, fy] = P(b.fx, b.fy), [rx, ry] = P(b.rx, b.ry);
    const cx = (fx + rx) / 2, cy = (fy + ry) / 2;
    t._cars.push([cx, cy], [fx, fy]);
    if (i === 0) headPos = [fx, fy];
    const dx = rx - fx, dy = ry - fy, span = Math.hypot(dx, dy);
    if (span < 0.5 || !vis(cx, cy, cx, cy)) { prevRear = null; continue; }
    // panjang badan dari panjang rel di antara bogie (bukan garis lurusnya)
    let arc = 0, ax = rx, ay = ry;
    for (const jp of b.joints) { const [jx, jy] = P(jp[0], jp[1]); arc += Math.hypot(jx - ax, jy - ay); ax = jx; ay = jy; }
    arc += Math.hypot(fx - ax, fy - ay);
    const len = Math.max(3, arc * b.len / Math.max(0.1, b.span) - 1.2);
    const ux = dx / span, uy = dy / span;   // arah ke belakang
    const frontX = cx - ux * len / 2, frontY = cy - uy * len / 2;
    if (prevRear && Math.hypot(frontX - prevRear[0], frontY - prevRear[1]) < wid * 1.5) {
      ctx.strokeStyle = '#7d8a97'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(prevRear[0], prevRear[1]); ctx.lineTo(frontX, frontY); ctx.stroke();
    }
    prevRear = [cx + ux * len / 2, cy + uy * len / 2];
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.atan2(-uy, -ux));   // sumbu +x lokal = depan
    let col = b.loco ? COL.loco : (!t.hasLoco ? COL.rake : (t.freight ? COL.freight : COL.coach));
    if (t.manual && b.loco) col = '#ffe14d';
    ctx.fillStyle = col;
    roundRect(ctx, -len / 2, -wid / 2, len, wid, Math.min(3, wid / 3, len / 6)); ctx.fill();
    ctx.strokeStyle = sel ? '#00e5ff' : 'rgba(255,255,255,0.55)'; ctx.lineWidth = sel ? 2 : 1; ctx.stroke();
    if (len > 10) {   // titik bogie
      ctx.fillStyle = 'rgba(11,16,22,0.7)';
      ctx.beginPath(); ctx.arc(span / 2, 0, 1.6, 0, Math.PI * 2); ctx.arc(-span / 2, 0, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    if (b.loco) {   // kabin masinis di sisi depan
      ctx.fillStyle = '#3a2a00'; const k = (t.locoRear ? -1 : 1) * (len / 2 - 3);
      ctx.fillRect(k - 1.5, -wid / 2 + 1, 3, wid - 2);
      if (t.speed > 0.5 && !t.locoRear) {   // lampu sorot
        ctx.fillStyle = 'rgba(255,241,118,0.18)';
        ctx.beginPath(); ctx.moveTo(len / 2, 0); ctx.lineTo(len / 2 + 26 * z, -7 * z); ctx.lineTo(len / 2 + 26 * z, 7 * z); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#FFEE58'; ctx.beginPath(); ctx.arc(len / 2, 0, 2.4, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }
  if (headPos && S > 120) {
    let label = t.no + (t.speed > 0.5 ? ` · ${Math.round(t.speed)}` : '');
    if (t.isShunting()) label += game.isRunRoundLoco(t) ? ' · PINDAH UJUNG' : ' · LANGSIR';
    else if (t.hasPermit()) label += ' · IZIN';
    ctx.font = `700 ${Math.round(10 * z)}px ui-monospace,monospace`;
    const tw = ctx.measureText(label).width;
    const lx = headPos[0], ly = headPos[1] - 14 * z;
    ctx.fillStyle = t.waitSig && t.speed < 0.5 ? '#5a1a22' : (t.isShunting() ? '#123a40' : (t.isDwelling() ? '#123a2c' : (t.hasLoco ? '#131D28' : '#1a2230')));
    ctx.strokeStyle = sel ? '#00e5ff' : (t.hasPermit() ? '#F5B841' : '#2E4153'); ctx.lineWidth = 1;
    roundRect(ctx, lx - tw / 2 - 5, ly - 7 * z, tw + 10, 14 * z, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#E6EDF3'; ctx.fillText(label, lx, ly + 0.5);
  }
}

const game = new Game();
const App = { raw: null, name: '', mapId: '', tab: 'jadwal', routeDlg: null, cancelDlg: null, infoDlg: null, summaryShown: false, lastAuto: 0, logVer: -1 };

game.hooks.sound = n => Sound.play(n);
game.hooks.horn = t => Sound.horn(t);
game.hooks.announce = (t, sch, plat) => {
  if (!Sound.tts) return;
  const geo = game.geo;
  const dari = sch ? game.stationName(J.str(sch, 'dari', '')) : '', tujuan = sch ? game.stationName(J.str(sch, 'tujuan', '')) : '';
  const st = geo.platStation(plat), stName = st ? game.stationName(st) : '';
  let txt = `Perhatian para penumpang. Kereta api ${t.name}${dari ? ' dari ' + dari : ''}${tujuan ? ' tujuan ' + tujuan : ''}, telah tiba di jalur ${geo.platName(plat)}${stName ? ' stasiun ' + stName : ''}.`;
  if (t.terminate) txt += ' Kereta ini berakhir di stasiun ini. Periksa kembali barang bawaan Anda.';
  else txt += ' Bagi penumpang yang akan naik, dipersilakan.';

};
game.hooks.changed = () => {};

// ---------- input kanvas ----------
const Input = { ptrs: new Map(), downAt: 0, moved: false, startX: 0, startY: 0, pinch: null };
function setupInput() {
  const cv = View.cv;
  cv.addEventListener('pointerdown', e => {
    Sound.init();
    cv.setPointerCapture(e.pointerId);
    Input.ptrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
    if (Input.ptrs.size === 1) { Input.downAt = performance.now(); Input.moved = false; Input.startX = e.offsetX; Input.startY = e.offsetY; }
    if (Input.ptrs.size === 2) { const [a, b] = [...Input.ptrs.values()]; Input.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; Input.moved = true; }
    cv.classList.add('drag');
  });
  cv.addEventListener('pointermove', e => {
    const p = Input.ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.offsetX - p.x, dy = e.offsetY - p.y;
    p.x = e.offsetX; p.y = e.offsetY;
    if (Input.ptrs.size === 1) {
      if (Math.hypot(e.offsetX - Input.startX, e.offsetY - Input.startY) > 7) Input.moved = true;
      if (Input.moved) { View.ox += dx; View.oy += dy; }
    } else if (Input.ptrs.size === 2 && Input.pinch) {
      const [a, b] = [...Input.ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (Input.pinch.d > 0) View.zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / Input.pinch.d);
      View.ox += dx / 2; View.oy += dy / 2;
      Input.pinch.d = d;
    }
  });
  const up = e => {
    const had = Input.ptrs.has(e.pointerId);
    Input.ptrs.delete(e.pointerId);
    if (Input.ptrs.size < 2) Input.pinch = null;
    if (!Input.ptrs.size) cv.classList.remove('drag');
    if (had && e.type === 'pointerup' && !Input.moved && Input.ptrs.size === 0 && performance.now() - Input.downAt < 600) onTap(e.offsetX, e.offsetY);
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); View.zoomAt(e.offsetX, e.offsetY, Math.pow(1.0015, -e.deltaY)); }, { passive: false });
  $('#zIn').onclick = () => View.zoomAt(View.w / 2, View.h / 2, 1.3);
  $('#zOut').onclick = () => View.zoomAt(View.w / 2, View.h / 2, 1 / 1.3);
  $('#zFit').onclick = () => View.fit();
  window.addEventListener('resize', () => View.resize());
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape') { Dlg.top() && Dlg.top().close(); return; }
    if (Dlg.top()) return;
    if (e.key === ' ') { e.preventDefault(); setSpeed(game.speed > 0 ? 0 : (App.lastSpeed || 1)); }
    else if (['1', '2', '4', '8'].includes(e.key)) setSpeed(+e.key);
    else if (e.key === '0') setSpeed(0);
    else if (e.key === '+' || e.key === '=') View.zoomAt(View.w / 2, View.h / 2, 1.2);
    else if (e.key === '-') View.zoomAt(View.w / 2, View.h / 2, 1 / 1.2);
  });
}
function onTap(x, y) {
  if (!game.geo || Dlg.top()) return;
  const z = Math.max(0.3, Math.min(1.8, View.S / 520));
  let best = null, bd = 22 * Math.max(1, z);
  const consider = (kind, obj, px, py, bonus = 0) => { if (px == null) return; const d = Math.hypot(px - x, py - y) - bonus; if (d < bd) { bd = d; best = { kind, obj }; } };
  for (const s of (J.arr(game.data, 'signals') || [])) consider('signal', s, s._sx, s._sy, 2);
  for (const sw of (J.arr(game.data, 'switches') || [])) consider('switch', sw, sw._sx, sw._sy);
  for (const t of game.trains) for (const c of (t._cars || [])) consider('train', t, c[0], c[1], 3);
  for (const c of game.crossings) if (c._hx != null && y >= c._hy0 - 6 && y <= c._hy1 + 6) consider('crossing', c, c._hx, Math.max(c._hy0, Math.min(c._hy1, y)));
  if (!best) { if (game.selectedSwitch) game.selectedSwitch = null; return; }
  Sound.play('click');
  if (best.kind === 'signal') { game.handleSignalTouch(J.str(best.obj, 'id', '')); afterAction(); }
  else if (best.kind === 'switch') { game.handleSwitchTouch(J.str(best.obj, 'id', '')); afterAction(); }
  else if (best.kind === 'train') onTrainTapped(best.obj);
  else if (best.kind === 'crossing') { const m = game.toggleCrossing(best.obj.id); if (m) toast(m); game.updateCrossings(); }
}
function afterAction() {
  const e = game.consumeError();
  if (e) toast(e);
  if (game.pendingRoute && !App.routeDlg) showRouteDialog();
  if (game.pendingCancel && !App.cancelDlg) showCancelDialog();
}
function showRouteDialog() {
  App.routeDlg = Dlg.open({
    title: game.pendingWrongWay ? '⚠ Konfirmasi rute (melawan arah)' : 'Aktifkan rute?', text: game.pendingDesc, warn: game.pendingWrongWay,
    buttons: [{ label: 'BATAL', fn: () => game.cancelPendingRoute() }, { label: 'AKTIFKAN', cls: 'primary', fn: () => { game.confirmPendingRoute(); setTimeout(afterAction, 0); } }],
    onClose: () => { App.routeDlg = null; if (game.pendingRoute) game.cancelPendingRoute(); },
  });
}
function showCancelDialog() {
  App.cancelDlg = Dlg.open({
    title: 'Batalkan rute?', text: game.pendingCancelDesc,
    buttons: [{ label: 'KEMBALI', fn: () => game.dismissCancel() }, { label: 'BATALKAN RUTE', cls: 'danger', fn: () => { game.confirmCancelRoute(); setTimeout(afterAction, 0); } }],
    onClose: () => { App.cancelDlg = null; if (game.pendingCancel) game.dismissCancel(); },
  });
}

// ---------- dialog jadwal kereta (TrainInfoDialog) ----------
function onTrainTapped(t) {
  if (t.manual) { game.selectLoco(t); return; }
  showTrainInfo(t);
}
function legChain(no) {
  let first = game.findSchedule(no);
  if (!first) return [];
  for (let g = 0; g < 50; g++) {
    const prev = (J.arr(game.data, 'schedules') || []).find(s => J.eqi(J.str(s, 'next_leg', ''), J.str(first, 'train_number', '')));
    if (!prev) break;
    first = prev;
  }
  const out = [];
  for (let s = first, g = 0; s && g < 50; g++) { out.push(s); const n = J.str(s, 'next_leg', ''); s = n ? game.findSchedule(n) : null; }
  return out;
}
function pfText(sch) {
  const list = SN.platformsOf(sch);
  const lab = game.platformLabel(sch);
  if (lab === 'LANGSUNG') return 'LANGSUNG';
  if (list.length > 1) return game.geo.platStation(list[0]) + ' P' + list.map(id => game.geo.platName(id)).join('/');
  return lab;
}
function trainStatus(t) {
  if (t.manual) return ['Kontrol manual', 'st-wait', 'a'];
  if (!t.hasLoco) return ['Rangkaian tanpa loko', 'st-done', ''];
  if (t.stopped) return ['Berhenti (darurat)', 'st-held', 'r'];
  if (t.isShunting()) return [game.isRunRoundLoco(t) ? 'Pindah ke ujung lain (T' + t.shuntTarget() + ')' : (t.shuntHold ? 'Langsir selesai' : 'Langsir ke T' + t.shuntTarget()), 'st-shunt', 'c'];
  if (t.isDwelling()) return [t.waitDep ? 'Menunggu sinyal berangkat' : 'Di ' + game.geo.platLabel(t.curId), t.waitDep ? 'st-wait' : 'st-plat', t.waitDep ? 'a' : 'b'];
  if (t.waitSig && t.speed < 0.5) { const s = t.nextMainSignal(game.geo); return ['Tertahan sinyal' + (s ? ' ' + J.str(s, 'id', '') : ''), 'st-wait', 'a']; }
  return [`Berjalan ${Math.round(t.speed)} km/j` + (t.hasPermit() ? ' (izin lewat)' : ''), 'st-run', 'g'];
}
function showTrainInfo(t) {
  if (App.infoDlg) App.infoDlg.close();
  const wrap = document.createElement('div');
  const keep = fn => () => { fn(); return false; };
  const d = Dlg.open({
    title: '', node: wrap, cls: 'wide',
    buttons: [
      { label: 'TUTUP' },
      { label: 'LANGSIR', cls: 'cyan', ref: 'btnShunt', fn: keep(() => pickShuntTarget(t)) },
      { label: 'PINDAH LOKO', cls: 'cyan', ref: 'btnRunRound', fn: keep(() => confirmRunRound(t)) },
      { label: 'STOP LANGSIR', cls: 'danger', ref: 'btnStopShunt', fn: keep(() => { game.cancelShunt(t); toastErr(); }) },
      { label: 'IZINKAN LEWAT', cls: 'amber', ref: 'btnPermit', fn: keep(() => confirmPermit(t)) },

// ---------- tab Peta (peta jaringan mini) ----------
const Mini = { data: null, lines: [], x0: 0, x1: 1, y0: 0, y1: 1, k: 1, offX: 0, offY: 0, st: [] };
function miniBase(x, y) { return [y * YX, -x]; }   // sama dengan View.sx/sy pada S = 1
function ensureMini() {
  if (Mini.data === game.data) return;
  Mini.data = game.data; Mini.lines = []; Mini.st = [];
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const [id, c] of game.geo.coords) {
    if (c.some(Number.isNaN)) continue;
    const a = miniBase(c[0], c[1]), b = miniBase(c[2], c[3]);
    Mini.lines.push([id, a[0], a[1], b[0], b[1]]);
    x0 = Math.min(x0, a[0], b[0]); x1 = Math.max(x1, a[0], b[0]); y0 = Math.min(y0, a[1], b[1]); y1 = Math.max(y1, a[1], b[1]);
  }
  Object.assign(Mini, { x0, x1, y0, y1 });
  // stasiun: pusat peron berkode stasiun itu (cadangan: topY/botY di "stations")
  for (const s of (J.arr(game.data, 'stations') || [])) {
    if (!s) continue;
    const code = J.str(s, 'code', '') || J.str(s, 'name', '').slice(0, 3).toUpperCase();
    let sx = 0, sy = 0, n = 0;
    for (const p of (J.arr(game.data, 'platforms') || [])) {
      if (!p || !J.eqi(J.str(p, 'station', ''), code)) continue;
      const b = miniBase(J.num(p, 'x', 0), (J.num(p, 'topY', 0) + J.num(p, 'botY', 0)) / 2); sx += b[0]; sy += b[1]; n++;
    }
    if (!n && J.has(s, 'topY')) { const b = miniBase(0.5, (J.num(s, 'topY', 0) + J.num(s, 'botY', 0)) / 2); sx = b[0]; sy = (y0 + y1) / 2; n = 1; }
    if (n) Mini.st.push({ code, name: J.str(s, 'name', code), bx: sx / n, by: sy / n });
  }
}
function centerOnBase(bx, by, zoomIn) {
  // lompat ke stasiun dari peta yang sedang diperkecil: perbesar ke skala stasiun (± 0,5 satuan peta selebar layar)
  if (zoomIn) { const s = View.w / (0.5 * YX); if (View.S < s) View.S = s; }
  View.ox = View.w / 2 - bx * View.S; View.oy = View.h / 2 - by * View.S;
}
function renderPetaTab(force) {
  const body = $('#tabBody');
  if (!game.geo) return;
  ensureMini();
  if (force || !$('#pmCv')) {
    body.innerHTML = '<div id="pmWrap"><div id="pmBox"><canvas id="pmCv"></canvas></div><div id="pmSt"></div></div>';
    body._html = null;
    const st = $('#pmSt');
    Mini.st.forEach((s, i) => { const b = document.createElement('button'); b.textContent = s.code; b.title = s.name; b.dataset.i = i; b.onclick = () => { centerOnBase(s.bx, s.by, true); renderPetaTab(false); }; st.appendChild(b); });
    if (!Mini.st.length) st.innerHTML = '<p class="muted" style="grid-column:1/-1">Peta tidak punya daftar stasiun.</p>';
    const box = $('#pmBox');
    let drag = false;
    const go = e => { const r = $('#pmCv').getBoundingClientRect(); centerOnBase((e.clientX - r.left - Mini.offX) / Mini.k, (e.clientY - r.top - Mini.offY) / Mini.k); renderPetaTab(false); };
    box.addEventListener('pointerdown', e => { drag = true; box.setPointerCapture(e.pointerId); go(e); });
    box.addEventListener('pointermove', e => { if (drag) go(e); });
    box.addEventListener('pointerup', () => { drag = false; });
    box.addEventListener('pointercancel', () => { drag = false; });
  }
  const cv = $('#pmCv'), r = cv.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, r.width, r.height);
  const rx = Math.max(1e-6, Mini.x1 - Mini.x0), ry = Math.max(1e-6, Mini.y1 - Mini.y0);
  Mini.k = Math.min((r.width - 16) / rx, (r.height - 16) / ry);
  Mini.offX = (r.width - rx * Mini.k) / 2 - Mini.x0 * Mini.k; Mini.offY = (r.height - ry * Mini.k) / 2 - Mini.y0 * Mini.k;
  const X = v => v * Mini.k + Mini.offX, Y = v => v * Mini.k + Mini.offY;
  const occ = new Set(); for (const t of game.trains) if (!t.finished) t.occupied(game.geo).forEach(id => occ.add(id));
  const rt = new Set(); for (const ro of game.routes) ro.path.forEach(id => rt.add(id));
  c.lineCap = 'round';
  for (const [id, a, b, cx, d] of Mini.lines) {
    c.strokeStyle = occ.has(id) ? '#FF5A5A' : (rt.has(id) ? '#3DDC97' : '#4A5B6C'); c.lineWidth = occ.has(id) || rt.has(id) ? 3 : 2;

  }
  c.fillStyle = '#22D3EE';
  for (const t of game.trains) { if (t.finished) continue; const b = miniBase(t.x, t.y); c.beginPath(); c.arc(X(b[0]), Y(b[1]), 4, 0, Math.PI * 2); c.fill(); }

  for (const s of Mini.st) { c.fillStyle = '#FFB74D'; c.beginPath(); c.arc(X(s.bx), Y(s.by), 4, 0, Math.PI * 2); c.fill(); c.fillText(s.code, X(s.bx), Y(s.by) - 8); }
  // kotak area yang sedang terlihat di layar
  const vx1 = (0 - View.ox) / View.S, vx2 = (View.w - View.ox) / View.S, vy1 = (0 - View.oy) / View.S, vy2 = (View.h - View.oy) / View.S;
  c.strokeStyle = '#F5B841'; c.lineWidth = 2; c.strokeRect(X(vx1), Y(vy1), X(vx2) - X(vx1), Y(vy2) - Y(vy1));
  // tombol stasiun terdekat dengan pusat tampilan
  const cx = (vx1 + vx2) / 2, cy = (vy1 + vy2) / 2;
  let near = -1, bd = Infinity;
  Mini.st.forEach((s, i) => { const dd = Math.hypot(s.bx - cx, s.by - cy); if (dd < bd) { bd = dd; near = i; } });
  document.querySelectorAll('#pmSt button').forEach(b => b.classList.toggle('near', +b.dataset.i === near));
}

// ---------- papan jadwal stasiun (VDU), sama dengan ScheduleVdu Android ----------
function vduStations() {
  const out = [];
  for (const s of (J.arr(game.data, 'stations') || [])) if (s) out.push({ name: J.str(s, 'name', 'STASIUN'), code: J.str(s, 'code', ''), top: J.num(s, 'topY', -1e9), bot: J.num(s, 'botY', 1e9) });
  if (!out.length) out.push({ name: J.str(game.data, 'station_name', 'STASIUN'), code: '', top: -1e9, bot: 1e9 });
  return out;
}
function vduStationOf(st, pf) {
  const code = game.geo.platStation(pf);
  if (code) { const i = st.findIndex(s => J.eqi(s.code, code)); if (i >= 0) return i; }
  const c = game.geo.c(pf), y = c ? (c[1] + c[3]) / 2 : 0;
  let best = 0, bd = Infinity;
  st.forEach((s, i) => { const d = y < s.top ? s.top - y : (y > s.bot ? y - s.bot : 0); if (d < bd) { bd = d; best = i; } });
  return best;
}
const vduPf = id => game.geo.platform(id) ? game.geo.platName(id) : 'T' + id;   // bukan peron: nomor track
function vduRows(st, idx) {
  const rows = [];
  for (const s of (J.arr(game.data, 'schedules') || [])) {
    if (!s) continue;
    const pf = J.int(s, 'target_platform', -1);
    if (pf <= 0 || !game.geo.c(pf)) continue;
    const ty = game.geo.type(pf).toUpperCase();
    if (ty === 'END' || ty === 'EXIT' || J.eqi(J.str(s, 'type', ''), 'LANGSUNG') || J.bool(s, 'is_through', false)) continue;
    if (vduStationOf(st, pf) !== idx) continue;
    const no = J.str(s, 'train_number', ''), t = game.trains.find(x => J.eqi(x.no, no));
    if (t && (t.finished || t.hasDeparted)) continue;
    if (!t && game.processed.includes(no)) continue;
    const dw = !!(t && t.dwell && game.geo.platform(t.curId));
    const pl = SN.platformsOf(s);
    rows.push({ no, name: J.str(s, 'train_name', ''), dir: J.eqi(J.str(s, 'mode', 'NORMAL'), 'REVERSE') ? 'UP' : 'DN',
      arr: J.str(s, 'arr_time', '--:--'), dep: J.str(s, 'dep_time', '--:--'), dw,
      pf: dw ? vduPf(t.curId) : (pl.length > 1 ? pl.map(vduPf).join('/') : vduPf(pf)) });
  }
  return rows.sort((a, b) => a.arr.localeCompare(b.arr));
}
function showVdu(focusNo) {

  const centerNow = () => { const span = st.t1 - st.t0 || 3600, now = game.simSec(); st.t0 = now - span * 0.65; st.t1 = st.t0 + span; };
  centerNow();
  const draw = () => {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    if (r.width < 10) return;
    const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.draw(c, 0, 0, r.width, r.height, st.t0, st.t1, st.y0, st.y1, game.simSec(), 1.05, false);
  };
  const d = Dlg.open({
    title: '<span class="dot g"></span>GAPEKA <span class="muted" style="font-weight:500;font-size:12px">garis putus-putus = rencana · garis tebal = realisasi</span>', node: wrap, cls: 'wide',
    buttons: [
      { label: 'SEKARANG', fn: () => { st.follow = true; st.t1 = st.t0 + 3600; centerNow(); draw(); return false; } },
      { label: 'SEMUA', fn: () => { st.follow = false; st.t0 = g.startSec - 300; st.t1 = Math.max(g.endSec, game.simSec()) + 300; st.y0 = g.yMin - 0.05; st.y1 = g.yMax + 0.05; draw(); return false; } },
      { label: 'TUTUP', cls: 'primary' },
    ],
  });
  d.d.style.maxWidth = '1200px';
  const zoom = (sx, sy, fx, fy) => {
    const r = cv.getBoundingClientRect();
    const ft = st.t0 + (fx / r.width) * (st.t1 - st.t0), fv = st.y0 + (fy / r.height) * (st.y1 - st.y0);
    const nt = Math.max(300, Math.min(6 * 3600, (st.t1 - st.t0) / sx)), ny = Math.max(0.05, Math.min(20, (st.y1 - st.y0) / sy));
    st.t0 = ft - (fx / r.width) * nt; st.t1 = st.t0 + nt; st.y0 = fv - (fy / r.height) * ny; st.y1 = st.y0 + ny;

  cv.addEventListener('pointermove', e => {

    const dx = e.offsetX - p.x, dy = e.offsetY - p.y; p.x = e.offsetX; p.y = e.offsetY;
    const r = cv.getBoundingClientRect();
    if (ptrs.size === 1) {
      if (Math.abs(dx) + Math.abs(dy) > 1) st.follow = false;
      const dt = -dx / r.width * (st.t1 - st.t0), dv = -dy / r.height * (st.y1 - st.y0);
      st.t0 += dt; st.t1 += dt; st.y0 += dv; st.y1 += dv; draw();

      const [a, b] = [...ptrs.values()], nx = Math.abs(a.x - b.x), ny = Math.abs(a.y - b.y);
      st.follow = false;
      zoom(pinch.dx > 10 ? nx / pinch.dx : 1, pinch.dy > 10 ? ny / pinch.dy : 1, (a.x + b.x) / 2, (a.y + b.y) / 2);
      pinch = { dx: nx, dy: ny };
    }

  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); st.follow = false; const f = Math.pow(1.0015, -e.deltaY); if (e.shiftKey) zoom(1, f, e.offsetX, e.offsetY); else zoom(f, 1, e.offsetX, e.offsetY); }, { passive: false });
  const tick = () => { if (d.closed) return; if (st.follow) centerNow(); draw(); setTimeout(tick, 1000); };
  setTimeout(tick, 30);
}

async function readFileObj(f) {
  const buf = new Uint8Array(await f.arrayBuffer());
  const kind = antdKind(buf);
  if (kind) {
    let secret = '', wrong = false;
    for (;;) {
      try { const o = await antdDecrypt(buf, secret); return { obj: o, kind, name: f.name }; }
      catch (e) {
        if (!e.wrong) throw e;
        secret = await askSecret(f.name, wrong);
        if (secret == null) throw new Error('Dibatalkan: ' + f.name);
        wrong = true;
      }
    }
  }
  const text = new TextDecoder().decode(buf).replace(/^﻿/, '');
  return { obj: JSON.parse(text), kind: 'json', name: f.name };
}
async function openFiles(files) {
  if (!files || !files.length) return;
  try {
    const items = [];
    for (const f of files) items.push(await readFileObj(f));
    const layouts = items.filter(i => isLayout(i.obj)), scheds = items.filter(i => !isLayout(i.obj) && (Array.isArray(i.obj.schedules) || Array.isArray(i.obj.rakes)));
    let base = null, name = '';
    if (layouts.length) { base = layouts[0].obj; name = layouts[0].name; }
    else if (App.raw && scheds.length) { base = App.raw; name = App.name; }
    else throw new Error('Tidak ada layout peta (tracks). Buka berkas .antd/.json peta, boleh bersama .ants.');
    let merged = JSON.parse(JSON.stringify(base));
    for (const s of scheds) merged = mergeLayoutSchedule(merged, s.obj);
    if (!Array.isArray(merged.schedules) || !merged.schedules.length) toast('Peta tidak berisi jadwal. Buka juga berkas jadwal .ants agar kereta muncul.', 4500);
    startGame(merged, merged.station_name || name.replace(/\.(antd|ants|json)$/i, ''));
  } catch (e) { console.error(e); Dlg.open({ title: 'Gagal membuka berkas', text: e.message || String(e), buttons: [{ label: 'OK' }] }); }
}
function startGame(raw, name, state) {

  App.summaryShown = false;
