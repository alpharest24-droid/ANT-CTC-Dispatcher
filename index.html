<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpharest Signalling</title>
<style>
:root{--bg:#0d1117;--p:#1a2030;--t:#e8ecf4;--m:#8a94a8;--a:#00e5ff;--l:#2c3548;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9edf3;--p:#f4f6fa;--t:#14181f;--m:#5b6577;--a:#0277bd;--l:#cfd6e2;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9edf3;--p:#f4f6fa;--t:#14181f;--m:#5b6577;--a:#0277bd;--l:#cfd6e2;color-scheme:light}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--t);font:13px system-ui,sans-serif;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--p);border-bottom:1px solid var(--l)}
button,select{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:6px;padding:5px 9px}
button.on{background:var(--a);color:#000;border-color:var(--a)}
#clk{font:600 15px ui-monospace,monospace;color:var(--a)}
main{flex:1;position:relative;min-height:0;background:#0d1117}
canvas{width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#000c;color:#fff;padding:7px 12px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:#cfd6e2;text-align:center;padding:20px}
#empty[hidden]{display:none}
footer{background:var(--p);border-top:1px solid var(--l);padding:4px 8px;height:5.4em;overflow:hidden;font-size:12px;line-height:1.35}
footer div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dlg{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:9}
#dlg[hidden]{display:none}
.box{background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:12px;padding:14px;width:min(92vw,440px);max-height:80vh;display:flex;flex-direction:column;gap:8px}
.box h3{margin:0;font-size:16px}
#dx{white-space:pre-wrap;overflow:auto;font:12px ui-monospace,monospace}
.row{display:flex;gap:8px;justify-content:flex-end}
input{font:inherit;padding:7px;border-radius:6px;border:1px solid var(--l);background:var(--bg);color:var(--t)}
.bad{color:#e5484d}.ok{color:#2fa84f}.inf{color:var(--a)}
</style></head><body>
<header>
<button id="open">Buka peta</button><input id="file" type="file" accept=".antd,.json" hidden>
<select id="st" hidden></select><button id="sch">Jadwal</button><span id="sps"></span>
<b id="clk">--:--:--</b><span id="scr">Skor 0</span><button id="snd">Suara: nyala</button><button id="fit" title="Tampilkan seluruh peta">Semua</button><button id="end">Selesai</button>
</header>
<main><canvas id="c"></canvas><div id="toast"></div>
<div id="empty"><b style="font-size:18px">Pilih file peta untuk mulai</b><span>Format .antd (atau .json). Anda juga bisa menaruh filenya di sini.</span><button id="open2">Buka peta</button></div></main>
<footer id="log"></footer>
<div id="dlg" hidden><div class="box"><h3 id="dt"></h3><div id="dx"></div><input id="di" type="password" autocomplete="off" hidden><div class="row"><button id="dn">Batal</button><button id="dy" class="on">OK</button></div></div></div>
<script>
const ALLOW_JSON=true;
const $=s=>document.querySelector(s),cv=$('#c'),cx=cv.getContext('2d'),S=1000;
let D,T={},N={},SG=[],SW=[],SP={},R=[],TR=[],LG=[],sched=[],done=new Set(),gone=new Set(),occ={},lk=new Set(),bz=new Set(),
mv=new Map(),mvg=new Map(),sim=0,spd=1,sc=0,over=false,endS=1e9,tc=0,dpr=1,view={z:.05,ox:0,oy:0};
const K=(x,y)=>Math.round(x*1000)+'|'+Math.round(y*1000);
const co=i=>{const t=T[i];return t&&[t.sx,t.sy,t.ex,t.ey]};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hm=s=>{if(s==null||s==='')return'';s=String(s);if(!s.includes(':')){s=s.padStart(4,'0');s=s.slice(0,2)+':'+s.slice(2,4)}return s};
const sec=s=>{if(!s||s.includes('-'))return null;const p=s.split(':');return+p[0]*3600+ +p[1]*60+(+p[2]||0)};
const fmt=s=>{s=Math.floor(s%86400);return[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':')};
const isAuto=s=>/^(BLOCK|DISTANT|REPEATER)$/.test(s.type||'');
const dn=s=>(s.facing||'NORMAL')!=='REVERSE';
const touch=(id,p)=>{const c=co(id);return c&&((Math.abs(c[0]-p[0])<.002&&Math.abs(c[1]-p[1])<.002)||(Math.abs(c[2]-p[0])<.002&&Math.abs(c[3]-p[1])<.002))};
const far=(id,p)=>{const c=co(id);return Math.hypot(c[0]-p[0],c[1]-p[1])>Math.hypot(c[2]-p[0],c[3]-p[1])?[c[0],c[1]]:[c[2],c[3]]};
const swi=s=>s.branches?Math.min(s.br.length-1,s.pos??(s.br.length>=3?1:0)):(s.state==='DIVERGE'?1:0);
const swset=(s,i)=>{if(s.branches)s.pos=i;else s.state=i?'DIVERGE':'NORMAL'};
const allows=(t,d)=>t.dir==='NORMAL'?d:t.dir==='REVERSE'?!d:true;
const PL=id=>(D.platforms||[]).find(p=>p.onTrack===id);
const pn=id=>PL(id)?PL(id).name:id;
const sigState=id=>(SG.find(s=>s.id===id)||{}).state||'RED';
const sset=(id,v)=>{const s=SG.find(s=>s.id===id);if(s)s.state=v};
const canStop=p=>!!(p>0&&T[p]&&!/^(END|EXIT)$/.test(T[p].type)&&PL(p));
const tl=t=>t.ll+t.nc*(t.cl+t.cg);
const curve=d=>Math.sqrt(18*Math.max(0,d));
const toS=(id,p,rev)=>(rev&&T[id].sy<T[id].ey)?1-p:p;
const pos=(id,p,mode)=>{const t=T[id];if(mode==='REVERSE'&&t.sy<t.ey)p=1-p;return[t.sx+(t.ex-t.sx)*p,t.sy+(t.ey-t.sy)*p]};

function toast(m){const e=$('#toast');e.textContent=m;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2400)}
function log(m,c){LG.unshift([fmt(sim),m,c||'']);LG.length=Math.min(LG.length,40);$('#log').innerHTML=LG.slice(0,4).map(l=>`<div class="${l[2]}">${l[0]}  ${esc(l[1])}</div>`).join('')}
function dlg(t,x,o={}){return new Promise(res=>{$('#dt').textContent=t;$('#dx').textContent=x;const i=$('#di');i.hidden=!o.input;i.value='';$('#dy').textContent=o.ok||'OK';$('#dn').hidden=!!o.single;$('#dlg').hidden=false;if(o.input)setTimeout(()=>i.focus(),50);
 const c=v=>{$('#dlg').hidden=true;res(v)};$('#dy').onclick=()=>c(o.input?i.value:true);$('#dn').onclick=()=>c(null);i.onkeydown=e=>{if(e.key==='Enter')c(i.value)}})}

/* ---------- suara (disintesis, tanpa file mp3) ---------- */
let AC=null,sndOn=true;const lastP={};
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type,v){const a=ac();if(!a||!sndOn)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
const SND={horn(){tone(311,0,.9,'sawtooth',.12);tone(392,0,.9,'sawtooth',.12);tone(311,.05,.9,'square',.04)},spawn(){tone(660,0,.25,'sine',.15);tone(880,.18,.3,'sine',.15)},exit(){tone(880,0,.2,'sine',.12);tone(588,.15,.3,'sine',.12)},wesel(){tone(140,0,.08,'square',.12);tone(90,.09,.1,'square',.1)}};
const play=n=>{const t=performance.now();if(spd===0||t-(lastP[n]||0)<800)return;lastP[n]=t;SND[n]()};
function announce(t,id){if(!sndOn||spd===0||spd>2||!window.speechSynthesis)return;const p=PL(id),s=sched.find(x=>x.no===t.no)||{},sn=D.station_names||{},st=(D.stations||[]).find(x=>p&&x.code===p.station),
 num=String(t.no).replace(/\(.*?\)/,'').replace(/(\d)(?=[A-Za-z])|([A-Za-z])(?=\d)/g,'$1$2 ').trim();
 const u=new SpeechSynthesisUtterance(`Perhatian para penumpang. Kereta api ${t.name}, nomor ${num}`+(s.dari?', dari '+(sn[s.dari]||s.dari):'')+(s.tuj?', tujuan akhir '+(sn[s.tuj]||s.tuj):'')+`, telah tiba di ${st?'Stasiun '+st.name:'stasiun ini'}, jalur ${p?p.name:id}.`);u.lang='id-ID';u.rate=.9;u.pitch=.9;speechSynthesis.speak(u)}

/* ---------- JPL (perlintasan) ---------- */
let CR=[],bellT=0,bellN=0;const P2=(x,y)=>[view.ox+y*S*view.z,view.oy-x*S*view.z];
function loadCr(){CR=[];(D.crossings||[]).forEach((o,i)=>{const ts=(o.tracks||[]).map(Number).filter(id=>T[id]);if(!ts.length)return;
 let sy=0;ts.forEach(id=>sy+=(T[id].sy+T[id].ey)/2);const y=o.y!=null?o.y:sy/ts.length,pad=o.pad??.02;let mn=1e9,mx=-1e9;
 ts.forEach(id=>{const t=T[id],dy=t.ey-t.sy;let x=t.sx;if(Math.abs(dy)>1e-9){const u=Math.max(0,Math.min(1,(y-t.sy)/dy));x=t.sx+(t.ex-t.sx)*u}mn=Math.min(mn,x);mx=Math.max(mx,x)});
 CR.push({id:o.id||'JPL'+(i+1),label:o.label||o.name||(o.no?'JPL '+o.no:'JPL'),y,x1:mn-pad,x2:mx+pad,ts,man:false,saw:false,rt:false})})}
function crUpdate(){const oc=new Set(),rt=new Set();TR.forEach(t=>{if(!t.fin)occIds(t).forEach(i=>oc.add(i))});R.forEach(r=>r.path.forEach(i=>rt.add(i)));
 CR.forEach(c=>{const o=c.ts.some(i=>oc.has(i));c.rt=c.ts.some(i=>rt.has(i));if(c.man){if(o)c.saw=true;else if(c.saw){c.man=false;c.saw=false}}else c.saw=false})}
function crTap(c){if(c.man){c.man=false;c.saw=false;if(c.rt)toast(c.label+' tetap aktif karena rute')}else{c.man=true;c.saw=false}crUpdate()}
function crBell(now){if(!D||spd===0||!sndOn)return;const W=cv.clientWidth,H=cv.clientHeight;
 const vis=CR.some(c=>{if(!(c.man||c.rt))return false;const a=P2(c.x1,c.y),b=P2(c.x2,c.y);return Math.max(a[1],b[1])>0&&Math.min(a[1],b[1])<H&&a[0]>0&&a[0]<W});
 if(vis&&now-bellT>420){bellT=now;tone(bellN++%2?1250:1000,0,.3,'triangle',.08)}}
function drawCr(c,P,bl){const a=P(c.x1,c.y),b=P(c.x2,c.y),on=c.man||c.rt;cx.setLineDash([10,8]);cx.lineWidth=Math.max(3,5*view.z);cx.strokeStyle=on&&bl?'#FF1744':'#fff';cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke();cx.setLineDash([]);
 if(on)[a,b].forEach(p=>{cx.fillStyle=bl?'#FF1744':'#661A1A';cx.beginPath();cx.arc(p[0]-14,p[1],6,0,7);cx.fill()});
 if(view.z>.15){const mx=a[0]-30,my=(a[1]+b[1])/2,w=cx.measureText(c.label).width+10;cx.fillStyle='#E0E0E0';cx.fillRect(mx-w/2,my-9,w,18);cx.fillStyle='#212121';cx.fillText(c.label,mx,my+4)}}

/* ---------- .antd ---------- */
async function antd(buf,secret){const d=new Uint8Array(buf);
 if(d.length<17||String.fromCharCode(...d.slice(0,4))!=='ANTD')throw Error('Bukan file .antd yang valid');
 if(d[4]!==1)throw Error('Versi .antd tidak didukung');
 const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('antd-v1|'+secret)),key=await crypto.subtle.importKey('raw',h,'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(5,17),additionalData:d.slice(0,5),tagLength:128},key,d.slice(17));
 return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
async function openFile(f){if(!f)return;const buf=await f.arrayBuffer();let txt;
 if(ALLOW_JSON&&/\.json$/i.test(f.name))txt=new TextDecoder().decode(buf).replace(/^\uFEFF/,'');
 else if(/\.antd$/i.test(f.name)){let s='',bad=false;for(;;){try{txt=await antd(buf,s);break}catch(e){if(e.name!=='OperationError')return toast(e.message);
  const r=await dlg('Masukkan secret',bad?'Secret salah, coba lagi.':'File ini terenkripsi (.antd).',{input:true,ok:'Buka'});if(r==null)return;s=r;bad=true}}}
 else return toast('Hanya file .antd yang bisa dibuka');
 try{load(JSON.parse(txt))}catch(e){console.error(e);toast('Isi peta tidak valid')}}

/* ---------- muat peta ---------- */
function load(d){D=d;T={};N={};R=[];TR=[];LG=[];done=new Set();gone=new Set();sc=0;over=false;spd=1;mvg.clear();
 D.tracks.forEach(t=>{const o={id:t.id,sx:t.startX,sy:t.startY,ex:t.endX,ey:t.endY,len:t.length>0?t.length:50,spd:t.speed||30,type:(t.type||'MAIN').toUpperCase(),dir:(t.dir||'BOTH').toUpperCase(),tn:t.teleportNormal,tr:t.teleportReverse,name:t.name||'',spawn:!!t.spawn};T[t.id]=o;
  [K(o.sx,o.sy),K(o.ex,o.ey)].forEach(k=>(N[k]=N[k]||[]).push(o.id))});
 SG=D.signals||[];SW=D.switches||[];
 SG.forEach(s=>s.state=/^(DISTANT|REPEATER)$/.test(s.type)?'GREEN':'RED');
 SW.forEach(s=>{s.br=(s.branches&&s.branches.length>=2?s.branches:[s.normal,s.diverge]).map(Number);const a=co(s.br[0]),b=co(s.br[1]);let best=9;s.pv=null;
  if(a&&b)for(let i=0;i<2;i++)for(let j=0;j<2;j++){const e=Math.hypot(a[i*2]-b[j*2],a[i*2+1]-b[j*2+1]);if(e<best){best=e;s.pv=[a[i*2],a[i*2+1]]}}
  s.zone=s.pv?Object.keys(T).map(Number).filter(id=>s.br.includes(id)||touch(id,s.pv)):s.br});
 SP={};Object.values(T).forEach(t=>{if(!(t.type==='SPAWN'||(t.type==='END'&&t.spawn)))return;
  const a=K(t.sx,t.sy),b=K(t.ex,t.ey),j=[...new Set([...(N[a]||[]),...(N[b]||[])].filter(i=>i!==t.id))];if(j.length!==1)return;
  const near=(N[a]||[]).includes(j[0]),jy=near?t.sy:t.ey,fy=near?t.ey:t.sy;SP[t.id]={join:j[0],down:Math.abs(fy-jy)<1e-6?true:fy<jy}});
 const nm=o=>({no:o.no??o.train_number,name:o.n??o.train_name??'KA',cat:String(o.category||o.t||o.type||'PASSENGER').toUpperCase(),entry:o.sT??o.entry_track,plat:o.tT??o.target_platform,exit:o.xT??o.exit_track,spawn:hm(o.sW??o.spawn_time),arr:hm(o.aT??o.arr_time)||'--:--',dep:hm(o.dT??o.dep_time)||'--:--',nc:o.nc??o.cars,ll:o.ll??o.loco_length,cl:o.cl??o.car_length,cg:o.cg??o.car_gap,dari:o.dari,tuj:o.tujuan});
 sched=[];(D.schedules||[]).forEach(b=>{const L=b.legs;if(!L||!L.length){sched.push(nm(b));return}
  const bn=b.no??b.train_number??'KA',n=L.length,nums=L.map((l,k)=>l.no||(k?bn+' ('+(k+1)+')':bn));let pd='';
  L.forEach((l,k)=>{const s={...b};delete s.legs;if(k)['sT','sW','sb','entry_track','spawn_time'].forEach(x=>delete s[x]);
   if(k<n-1){delete s.xT;delete s.exit_track}Object.assign(s,l);s.no=nums[k];delete s.train_number;
   const o=nm(s);o.isLeg=k>0;o.next=k<n-1?nums[k+1]:null;sched.push(o)})});
 const st=sec(hm(D.startTime)),sp=sched.map(s=>sec(s.spawn)).filter(v=>v!=null);
 sim=st??(sp.length?Math.min(...sp)-120:0);endS=sec(hm(D.endTime))??1e9;
 const sl=$('#st');sl.innerHTML='<option value="">Ke stasiun…</option>'+(D.stations||[]).map(s=>`<option value="${esc(s.code)}">${esc(s.name)}</option>`).join('');sl.hidden=!(D.stations||[]).length;
 loadCr();$('#empty').hidden=true;resize();fit();log('Peta dimuat: '+(D.station_name||''),'inf');toast('Peta dimuat. Tekan sinyal untuk membuat rute.')}

/* ---------- jalur ---------- */
function exitPt(id,down){const t=T[id];let s;if(Math.abs(t.ey-t.sy)<1e-6)s=!down;else s=down?t.sy>t.ey:t.sy<t.ey;return s?[t.sx,t.sy]:[t.ex,t.ey]}
function oth(id,nk){const t=T[id];return K(t.sx,t.sy)===nk?[t.ex,t.ey]:[t.sx,t.sy]}
function next(cur,down,seen){const e=exitPt(cur,down),nk=K(e[0],e[1]),inc=N[nk];if(!inc)return-1;
 const tp=+(down?T[cur].tn:T[cur].tr);if(tp&&T[tp]&&!seen.has(tp)&&allows(T[tp],down))return tp;
 const c=inc.filter(id=>{if(id===cur||seen.has(id)||!allows(T[id],down))return false;const o=oth(id,nk);return down?o[1]>e[1]+1e-6:o[1]<e[1]-1e-6});
 if(!c.length)return-1;if(c.length===1)return c[0];
 for(const s of SW)if(s.br.length>1&&s.br.every(x=>c.includes(x)))return s.br[swi(s)];
 return c.sort((a,b)=>Math.abs(oth(a,nk)[0]-e[0])-Math.abs(oth(b,nk)[0]-e[0]))[0]}
const sigOn=(id,d)=>SG.find(s=>s.onTrack===id&&!/^(DISTANT|REPEATER)$/.test(s.type||'')&&dn(s)===d);
function walk(start,down){if(!T[start])return null;const p=[start],seen=new Set(p);let end='BUNTU',es=null,cur=start;
 for(let g=0;g<999;g++){if(p.length>1){if(T[cur].type==='END'){end='END';break}const s=sigOn(cur,down);if(s){end='SINYAL';es=s.id;break}}
  const n=next(cur,down,seen);if(n<0)break;p.push(n);seen.add(n);cur=n}
 return p.length>=2?{p,end,es}:null}
function sp(s,id,down){const c=co(id);if(!c)return .87;const dx=c[2]-c[0],dy=c[3]-c[1],l=dx*dx+dy*dy;if(!l)return .87;
 const pf=Math.max(0,Math.min(1,((s.x-c[0])*dx+(s.y-c[1])*dy)/l));return(!down&&c[1]<c[3])?1-pf:pf}
function nextSig(t,id){const d=t.mode==='NORMAL';return SG.filter(s=>s.onTrack===id&&!/^(DISTANT|REPEATER)$/.test(s.type||'')&&dn(s)===d&&t.prog<=sp(s,id,d)+.02).sort((a,b)=>sp(a,id,d)-sp(b,id,d))[0]}
const conflict=(sig,path)=>R.some(r=>r.sig!==sig&&r.path.some(t=>path.includes(t)&&!((t===path[0]&&t===r.path[r.path.length-1])||(t===path[path.length-1]&&t===r.path[0]))));

/* ---------- kereta ---------- */
function tail(t){let o=t.prog,i=t.idx,m=tl(t);while(m>0&&i>=0&&i<t.path.length){const l=T[t.path[i]].len,a=o*l;if(m<=a){o-=m/l;m=0}else{m-=a;i--;o=1}}return[i,Math.max(0,o)]}
const occIds=t=>{const[i]=tail(t);return t.path.slice(Math.max(0,i),t.idx+1)};
function calcOcc(){occ={};TR.forEach(t=>{if(t.fin)return;const[ti,tp]=tail(t),rev=t.mode==='REVERSE';
 for(let i=Math.max(0,ti);i<=t.idx&&i<t.path.length;i++){const id=t.path[i],lo=i===ti?tp:0,hi=i===t.idx?t.prog:1,a=toS(id,lo,rev),b=toS(id,hi,rev);(occ[id]=occ[id]||[]).push([Math.min(a,b),Math.max(a,b)])}})}
function platProg(t,id){const tr=T[id],up=t.mode==='REVERSE',p=PL(id);let s=.5;
 if(p&&Math.abs(tr.ey-tr.sy)>1e-6){const ty=up?p.topY+.005:p.botY-.005;s=(ty-tr.sy)/(tr.ey-tr.sy);if(up&&tr.sy<tr.ey)s=1-s;s=Math.max(.05,Math.min(.95,s))}
 const mh=(tl(t)+5)/tr.len;return s<mh?Math.min(mh,.8):s}
function stopPlat(t,id){if(!t.stop||!PL(id))return false;if(id===t.plat)return true;const a=PL(t.plat);return!!a&&a.station===PL(id).station&&!t.path.slice(t.idx+1).includes(t.plat)}
function spawn(){sched.forEach(s=>{if(s.isLeg||!s.spawn||done.has(s.no))return;const ss=sec(s.spawn);if(ss==null||sim<ss||sim>ss+1200)return;
 const sp=SP[s.entry],down=sp?sp.down:true,r=walk(s.entry,down);if(!r)return;
 if(TR.some(t=>!t.fin&&occIds(t).some(i=>r.p.includes(i))))return;
 done.add(s.no);const fr=s.cat==='FREIGHT';
 TR.push({no:s.no,name:s.name,cat:s.cat,arr:s.arr,dep:s.dep,depS:sec(s.dep)||0,plat:s.plat,stop:canStop(s.plat),exit:s.exit,next:s.next,path:r.p,idx:0,prog:0,v:10,mode:down?'NORMAL':'REVERSE',dwell:false,fin:false,
  ll:s.ll||17,cl:s.cl||(fr?15:20),cg:s.cg>=0?s.cg:1,nc:s.nc>=0?s.nc:(fr?15:11)});
 sc+=Math.abs(sim-ss)<=30?50:0;play('spawn');log(`[${s.no} ${s.name}] Masuk seksi T${s.entry}`,'inf')})}
function attach(t){const L=t.path[t.path.length-1];
 for(const r of R){if(r.lock||r.type==='BLOCK'||r.path[0]!==L||r.mode!==t.mode)continue;if(TR.some(o=>o!==t&&r.path.every(x=>o.path.includes(x))))continue;if(r.path.every(x=>t.path.includes(x)))continue;r.path.forEach(x=>{if(!t.path.includes(x))t.path.push(x)});break}}
function arrive(t,id){announce(t,id);const p=PL(id),a=Math.abs(sim-(sec(t.arr)??sim));sc+=a<=30?150:Math.max(0,150-a);
 if(id===t.plat)sc+=100;else{sc-=50;log(`[${t.no}] Salah peron (jadwal P${pn(t.plat)})`,'bad')}
 log(`[${t.no} ${t.name}] Tiba di ${p?p.station+' P'+p.name:'T'+id}`,'ok')}
function depart(t){play('horn');const d=sim-t.depS;sc+=d<=15?150:Math.max(0,150-d);gone.add(t.no);
 const nx=t.next&&sched.find(o=>o.no===t.next);
 if(nx){const old=t.no;Object.assign(t,{no:nx.no,name:nx.name,arr:nx.arr,dep:nx.dep,depS:sec(nx.dep)||0,plat:nx.plat,stop:canStop(nx.plat),next:nx.next,exit:nx.exit});done.add(nx.no);log(`[${old}] berangkat sebagai [${nx.no}]`,'inf')}
 else log(`[${t.no}] Berangkat`,'ok')}
function step(t,dt){if(t.fin)return;const id=t.path[t.idx],tr=T[id],len=tr.len,down=t.mode==='NORMAL';
 const sg=nextSig(t,id),asp=sg?sg.state:'GREEN',end=t.idx+1>=t.path.length&&tr.type!=='END',plat=stopPlat(t,id);
 if(t.dwell){t.v=0;if(sim>=t.depS&&asp!=='RED'&&!end){t.dwell=false;t.stop=false;depart(t)}return}
 let tg=tr.spd,lim=null;if(asp==='YELLOW')tg=Math.min(tg,25);
 if(plat)lim=platProg(t,id);else if(asp==='RED'||end){lim=Math.min(.82,sg?sp(sg,id,down)-.03:.82);if(t.prog>lim+.08)lim=null}
 if(lim!=null){if(t.prog>=lim){t.v=0;if(plat){t.prog=lim;t.dwell=true;arrive(t,id)}else if(t.prog<lim+.08)t.prog=lim;return}
  tg=Math.min(tg,plat?30:99,Math.max(plat?4:3,curve((lim-t.prog)*len)))}
 if(t.v<tg)t.v=Math.min(tg,t.v+3*Math.max(.35,1-t.v/150)*dt);else t.v=Math.max(tg,t.v-5*dt);
 t.prog+=t.v/3.6/len*dt*2;
 if(t.prog>=1){if(t.idx+1>=t.path.length){t.prog=1;t.v=0;if(tr.type==='END'){t.fin=true;play('exit');const last=t.path[t.path.length-1];sc+=100;if(t.exit>0)sc+=last===t.exit?50:-200;gone.add(t.no);log(`[${t.no} ${t.name}] Keluar seksi T${last}`,'ok')}else t.prog=.99}
  else{t.prog=0;t.idx++}}}

/* ---------- sinyal, rute, wesel ---------- */
function blocks(){SG.forEach(b=>{if(b.type!=='BLOCK')return;const down=dn(b),tb=b.onTrack,res=walk(tb,down);let a='RED';
 if(res){const busy=res.p.slice(1).some(i=>occ[i])||TR.some(t=>!t.fin&&t.path[t.idx]===tb&&(t.mode==='NORMAL')===down&&t.prog>sp(b,tb,down)+.02);
  if(!busy){a=res.end==='SINYAL'?(sigState(res.es)==='RED'?'YELLOW':'GREEN'):res.end==='END'?'GREEN':'RED';if(conflict(b.id,res.p))a='RED'}}
 b.state=a;
 if(res&&a!=='RED'){const t=TR.find(t=>!t.fin&&t.path[t.idx]===tb&&t.path[t.path.length-1]===tb&&(t.mode==='NORMAL')===down);
  if(t){t.path.push(...res.p.slice(1));R.push({sig:b.id,type:'BLOCK',path:res.p.slice(),dest:res.p[res.p.length-1],mode:t.mode,lock:false,rel:new Set()})}}})}
function aspects(){R.forEach(r=>{if(r.lock||r.type==='BLOCK'||r.rel.has(r.sig))return;const down=r.mode==='NORMAL';let v='GREEN';
 if(r.type==='ENTRY'&&T[r.dest].type!=='END'){const n=sigOn(r.dest,down);v=n&&n.id!==r.sig&&n.state!=='RED'?'GREEN':'YELLOW'}sset(r.sig,v)})}
function release(){R=R.filter(r=>{if(r.lock)return true;const down=r.mode==='NORMAL';
 [...r.path].forEach(id=>{TR.forEach(t=>{const i=t.path.indexOf(id);if(i<0)return;const[ti]=tail(t);if(t.idx>=i)r.entered=true;
  const sg=sigOn(id,down),clr=i<ti,pas=i<t.idx||(i===t.idx&&sg&&t.prog>sp(sg,id,down)+.025);
  if((clr||pas)&&sg&&!r.rel.has(sg.id)){r.rel.add(sg.id);sg.state='RED'}
  if(clr)r.path=r.path.filter(x=>x!==id)})});
 if(r.entered&&!TR.some(t=>r.path.every(x=>t.path.includes(x)))){r.path.forEach(id=>{const sg=sigOn(id,down);if(sg){r.rel.add(sg.id);sg.state='RED'}});r.path=[]}
 return r.path.length>0})}
function locks(){lk=new Set();bz=new Set();SW.forEach(s=>{const k=s.id;if(R.some(r=>r.path.some(i=>s.br.includes(i))))lk.add(k);
 if(s.pv)for(const id of s.zone){const spn=occ[id];if(!spn)continue;const c=co(id),d0=Math.hypot(c[0]-s.pv[0],c[1]-s.pv[1]),d1=Math.hypot(c[2]-s.pv[0],c[3]-s.pv[1]),e=d0<=d1?0:1,m=(s.zone_m||25)/T[id].len;
  if(spn.some(r=>r[1]>=e-m&&r[0]<=e+m)){lk.add(k);bz.add(k);break}}})}
const check=(s,p)=>R.some(r=>r.sig===s.id)?'Sinyal sudah memiliki rute aktif':conflict(s.id,p)?'Jalur bertabrakan dengan rute aktif':(i=>i==null?null:'Track '+i+' sedang ditempati kereta')(p.slice(1).find(i=>occ[i]));
async function sigTap(s){if(isAuto(s))return toast('Sinyal ini bekerja otomatis');const down=dn(s),ex=R.find(r=>r.sig===s.id&&r.type!=='BLOCK');
 if(ex){const inside=TR.some(t=>occIds(t).some(x=>ex.path.includes(x)&&x!==ex.path[0])||(t.path[t.idx]===ex.path[0]&&t.prog>sp(s,ex.path[0],down)+.025));
  if(inside)return toast('Kereta sudah masuk rute, belum bisa dibatalkan');
  if(!await dlg('Batalkan rute?','Sinyal '+s.id,{ok:'Batalkan rute'}))return;
  R=R.filter(r=>r!==ex);s.state='RED';TR.forEach(t=>{if(ex.path.every(x=>t.path.includes(x)))t.path.length=Math.max(t.path.indexOf(ex.path[0]),t.idx)+1});calcOcc();return}
 const res=walk(s.onTrack,down);if(!res)return toast('Tidak ada jalur di depan sinyal '+s.id);
 const err=check(s,res.p);if(err)return toast(err);const last=res.p[res.p.length-1];
 const w=SW.filter(w=>w.br.some(b=>res.p.includes(b))).map(w=>w.id+(swi(w)?' belok':' lurus')).join(', ');
 const txt=`Sinyal ${s.id} (${down?'ke bawah':'ke atas'})\n\nJalur: ${res.p.join(' → ')}\nTujuan: ${res.end==='END'?'keluar stasiun':res.end==='SINYAL'?'sinyal '+res.es:'ujung jalur'} (T${last})`+(w?`\nWesel: ${w}`:'');
 if(!await dlg('Aktifkan rute?',txt,{ok:'Aktifkan'}))return;
 const e2=check(s,res.p);if(e2)return toast(e2);
 R.push({sig:s.id,type:(s.type||'ENTRY').toUpperCase(),path:res.p.slice(),dest:last,mode:down?'NORMAL':'REVERSE',lock:true,lms:1500,rel:new Set(),entered:false})}
function swTap(s){const g=SW.filter(w=>w===s||w.id===s.pair||w.pair===s.id);calcOcc();locks();
 for(const w of g){if(mvg.has(w.id))return toast('Wesel '+w.id+' sedang bergerak');if(lk.has(w.id))return toast('Wesel '+w.id+' terkunci')}
 play('wesel');const tg=(swi(s)+1)%s.br.length;g.forEach(w=>mvg.set(w.id,{ms:1500,i:Math.min(tg,w.br.length-1),w}))}

/* ---------- loop ---------- */
function tick(dt){calcOcc();spawn();if(++tc%4===0){blocks();locks();crUpdate()}aspects();TR.forEach(t=>{attach(t);step(t,dt)});TR=TR.filter(t=>!t.fin);release();
 if(!over&&(sim>=endS||(sched.length&&sched.every(s=>done.has(s.no))&&!TR.length)))finish()}
async function finish(){if(over)return;over=true;spd=0;sps();
 sched.forEach(s=>{if(!done.has(s.no)&&!s.isLeg)sc-=100});
 await dlg('Dinas selesai',`${D.station_name||''}\nSkor akhir: ${sc}\nKereta terlayani: ${gone.size} dari ${sched.length} jadwal`,{single:true,ok:'Tutup'})}
let last=performance.now();
function frame(now){const w=Math.min(100,now-last);last=now;
 if(D&&!over){const k=w*spd;sim+=k/1000;acc+=k;let n=0;while(acc>=33&&n<24){tick(.033);acc-=33;n++}if(n>=24)acc=0;
  R.forEach(r=>{if(r.lock){r.lms-=k;if(r.lms<=0)r.lock=false}});
  mvg.forEach((m,key)=>{m.ms-=k;if(m.ms<=0){mvg.delete(key);calcOcc();locks();if(lk.has(key))toast('Wesel '+key+' batal: terkunci');else swset(m.w,m.i)}});
  $('#clk').textContent=fmt(sim);$('#scr').textContent='Skor '+sc}
 crBell(now);draw();requestAnimationFrame(frame)}
let acc=0;

/* ---------- gambar ---------- */
const COL={RED:'#ff3b3b',YELLOW:'#eeee22',GREEN:'#3dff6a'};
function draw(){const W=cv.width/dpr,H=cv.height/dpr;cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle='#0d1117';cx.fillRect(0,0,W,H);if(!D)return;
 const z=view.z,P=(x,y)=>[view.ox+y*S*z,view.oy-x*S*z],bl=Math.floor(performance.now()/250)%2,lw=Math.max(2,Math.min(5,4*z));
 cx.font='11px system-ui';cx.textAlign='center';cx.lineCap='round';
 (D.building||[]).forEach(b=>{const a=P(b.x-.05,b.topY),c=P(b.x+.05,b.botY);cx.fillStyle='#B55635';cx.globalAlpha=.85;cx.fillRect(Math.min(a[0],c[0]),Math.min(a[1],c[1]),Math.abs(c[0]-a[0]),Math.abs(c[1]-a[1]));cx.globalAlpha=1;
  if(z>.12){cx.fillStyle='#fff';cx.fillText(b.name,(a[0]+c[0])/2,(a[1]+c[1])/2+4)}});
 (D.platforms||[]).forEach(p=>{const a=P(p.x,p.topY),b=P(p.x,p.botY);cx.strokeStyle='#536DFE';cx.lineWidth=Math.max(3,6*z);cx.setLineDash([]);
  [-1,1].forEach(o=>{cx.beginPath();cx.moveTo(a[0],a[1]+o*Math.max(6,11*z));cx.lineTo(b[0],b[1]+o*Math.max(6,11*z));cx.stroke()});
  if(z>.4){cx.fillStyle='#9fb0ff';cx.fillText('P'+p.name,(a[0]+b[0])/2,a[1]-Math.max(12,20*z))}});
 const ar=new Set(),lr=new Set();R.forEach(r=>r.path.forEach(i=>(r.lock?lr:ar).add(i)));
 for(const id in T){const t=T[id],a=P(t.sx,t.sy),b=P(t.ex,t.ey);let c='#B7B7B7';cx.setLineDash([]);
  if(lr.has(+id))c=bl?'#FF7711':'#B7B7B7';else if(occ[id])c='#FF3030';else if(ar.has(+id))c='#33DD55';else if(t.type==='SPAWN'||t.type==='END'){c='#00E5FF';cx.setLineDash([12,8])}
  cx.strokeStyle=c;cx.lineWidth=lw;cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke();
  if(t.name&&z>.25){cx.fillStyle='#00E5FF';cx.fillText(t.name,(a[0]+b[0])/2,(a[1]+b[1])/2-8)}}
 cx.setLineDash([]);
 CR.forEach(c=>drawCr(c,P,bl));
 [0,1].forEach(pass=>SW.forEach(s=>{if(!s.pv)return;const pp=P(s.pv[0],s.pv[1]),ai=swi(s),lock=lk.has(s.id);
  s.br.forEach((id,k)=>{if((k===ai)!==!!pass||!T[id])return;const q=P(...far(id,s.pv)),d=Math.hypot(q[0]-pp[0],q[1]-pp[1])||1,L=Math.min(30,d);
   cx.strokeStyle=pass?(bz.has(s.id)?'#FF3030':lock?'#33DD55':'#fff'):'#0d1117';cx.lineWidth=pass?5:7;cx.beginPath();cx.moveTo(pp[0],pp[1]);cx.lineTo(pp[0]+(q[0]-pp[0])/d*L,pp[1]+(q[1]-pp[1])/d*L);cx.stroke()})}));
 SW.forEach(s=>{const[x,y]=P(s.x,s.y),m=mvg.has(s.id);cx.fillStyle=m?(bl?'#FFEB3B':'#fff'):bz.has(s.id)?'#FF3030':lk.has(s.id)?'#33DD55':'#fff';
  cx.beginPath();cx.moveTo(x,y-8);cx.lineTo(x+8,y);cx.lineTo(x,y+8);cx.lineTo(x-8,y);cx.fill();
  if(z>.3){cx.fillStyle='#FFD600';cx.fillText(s.id+(swi(s)?' ↗':' │'),x+18,y-10)}});
 SG.forEach(s=>{const[x,y]=P(s.x,s.y),c=co(s.onTrack);
  if(c){const a=P(c[0],c[1]),b=P(c[2],c[3]),dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy||1,u=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/l));cx.strokeStyle='#B0BEC5';cx.lineWidth=2;cx.beginPath();cx.moveTo(a[0]+dx*u,a[1]+dy*u);cx.lineTo(x,y);cx.stroke()}
  const r=Math.max(5,Math.min(9,8*z+3)),shunt=s.type==='SHUNT';cx.fillStyle=shunt&&s.state!=='RED'?'#FFFDE7':(COL[s.state]||COL.RED);
  if(s.type==='REPEATER'){cx.fillRect(x-r,y-r,2*r,2*r)}else{cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}
  cx.strokeStyle=s.type==='BLOCK'?'#fff':'#78909C';cx.lineWidth=2;cx.stroke();
  if(z>.3){cx.fillStyle='#fff';cx.fillText(s.id+(dn(s)?' →':' ←'),x,y-r-4)}});
 TR.forEach(t=>{const[ti,tp]=tail(t);cx.strokeStyle=t.cat==='FREIGHT'?'#8d6e63':'#00E5FF';cx.lineWidth=Math.max(5,9*z);cx.lineCap='butt';
  for(let i=Math.max(0,ti);i<=t.idx&&i<t.path.length;i++){const id=t.path[i],a=P(...pos(id,i===ti?tp:0,t.mode)),b=P(...pos(id,i===t.idx?t.prog:1,t.mode));cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke()}
  cx.lineCap='round';const h=P(...pos(t.path[t.idx],t.prog,t.mode));cx.fillStyle='#FFEE58';cx.beginPath();cx.arc(h[0],h[1],4,0,7);cx.fill();
  cx.fillStyle='#FFEB3B';cx.textAlign='left';cx.fillText(`${t.no}  ${Math.round(t.v)} km/j`+(t.dwell?'  di peron':''),h[0]+10,h[1]-10);cx.textAlign='center'})}

/* ---------- tampilan & input ---------- */
function resize(){dpr=window.devicePixelRatio||1;const m=$('main');cv.width=m.clientWidth*dpr;cv.height=m.clientHeight*dpr}
function fit(){if(!D)return;let a=1e9,b=-1e9,c=1e9,d=-1e9;Object.values(T).forEach(t=>{a=Math.min(a,t.sy,t.ey);b=Math.max(b,t.sy,t.ey);c=Math.min(c,t.sx,t.ex);d=Math.max(d,t.sx,t.ex)});
 const W=cv.clientWidth,H=cv.clientHeight,m=24;view.z=Math.min((W-2*m)/((b-a)*S||1),(H-2*m)/((d-c)*S||1));view.ox=m-a*S*view.z;view.oy=m+d*S*view.z}
function zoomAt(px,py,f){const nz=Math.max(.02,Math.min(6,view.z*f));f=nz/view.z;view.ox=px-(px-view.ox)*f;view.oy=py-(py-view.oy)*f;view.z=nz}
function sps(){$('#sps').innerHTML='';[['Jeda',0],['1x',1],['2x',2],['4x',4],['8x',8]].forEach(([l,v])=>{const b=document.createElement('button');b.textContent=l;b.className=spd===v?'on':'';b.onclick=()=>{if(!over){spd=v;sps()}};$('#sps').appendChild(b)})}
function tap(x,y){if(!D||over)return;const P=(wx,wy)=>[view.ox+wy*S*view.z,view.oy-wx*S*view.z];let best=22,hit=null,kind=null;
 SG.forEach(s=>{const p=P(s.x,s.y),d=Math.hypot(p[0]-x,p[1]-y);if(d<best){best=d;hit=s;kind='s'}});
 if(!hit)SW.forEach(s=>{const p=P(s.x,s.y),d=Math.hypot(p[0]-x,p[1]-y);if(d<best){best=d;hit=s;kind='w'}});
 if(!hit)CR.forEach(c=>{const a=P(c.x1,c.y),b=P(c.x2,c.y),lo=Math.min(a[1],b[1]),hi=Math.max(a[1],b[1]),d=Math.hypot(a[0]-x,y<lo?lo-y:y>hi?y-hi:0);if(d<best){best=d;hit=c;kind='c'}});
 if(kind==='s')sigTap(hit);else if(kind==='w')swTap(hit);else if(kind==='c')crTap(hit)}
cv.onpointerdown=e=>{ac();cv.setPointerCapture(e.pointerId);mv.set(e.pointerId,{x:e.offsetX,y:e.offsetY,x0:e.offsetX,y0:e.offsetY,m:0})};
cv.onpointermove=e=>{const p=mv.get(e.pointerId);if(!p)return;const x=e.offsetX,y=e.offsetY;
 if(mv.size===2){const o=[...mv.values()].find(q=>q!==p),d0=Math.hypot(p.x-o.x,p.y-o.y)||1;p.x=x;p.y=y;p.m=o.m=99;zoomAt((p.x+o.x)/2,(p.y+o.y)/2,Math.hypot(p.x-o.x,p.y-o.y)/d0)}
 else{p.m=Math.max(p.m,Math.hypot(x-p.x0,y-p.y0));if(p.m>=8){view.ox+=x-p.x;view.oy+=y-p.y}p.x=x;p.y=y}};
cv.onpointerup=e=>{const p=mv.get(e.pointerId);mv.delete(e.pointerId);if(p&&p.m<8&&!mv.size)tap(p.x0,p.y0)};
cv.onpointercancel=e=>mv.delete(e.pointerId);
cv.onwheel=e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.15:1/1.15)};
$('#open').onclick=$('#open2').onclick=()=>$('#file').click();
$('#file').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
document.body.ondragover=e=>e.preventDefault();document.body.ondrop=e=>{e.preventDefault();openFile(e.dataTransfer.files[0])};
$('#fit').onclick=fit;
$('#snd').onclick=()=>{sndOn=!sndOn;$('#snd').textContent='Suara: '+(sndOn?'nyala':'mati');if(sndOn)ac();else if(window.speechSynthesis)speechSynthesis.cancel()};
$('#end').onclick=async()=>{if(D&&!over&&await dlg('Selesaikan dinas?','Dinas ditutup dan skor dihitung.',{ok:'Selesai'}))finish()};
$('#st').onchange=e=>{const c=e.target.value;e.target.value='';if(!c)return;const ps=(D.platforms||[]).filter(p=>p.station===c);if(!ps.length)return toast('Stasiun belum punya data peron');
 const x=ps.reduce((a,p)=>a+p.x,0)/ps.length,y=ps.reduce((a,p)=>a+(p.topY+p.botY)/2,0)/ps.length;view.z=.6;view.ox=cv.clientWidth/2-y*S*view.z;view.oy=cv.clientHeight/2+x*S*view.z};
$('#sch').onclick=()=>{if(!D)return;const rows=sched.filter(s=>!gone.has(s.no)).sort((a,b)=>(a.arr>b.arr)-(a.arr<b.arr)).map(s=>`${String(s.no).padEnd(11)}${s.arr}-${s.dep}  P${pn(s.plat)}  ${s.dari||''}${s.tuj?' > '+s.tuj:''}`);
 dlg('Jadwal kereta',rows.join('\n')||'Semua kereta sudah berangkat.',{single:true,ok:'Tutup'})};
new ResizeObserver(resize).observe($('main'));resize();sps();requestAnimationFrame(frame);
</script></body></html>
