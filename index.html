<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<title>ANT Dispatcher CTC</title>
<style>
/* Tema gelap papan panel (sama dengan versi Android / layar Dinas Selesai) */
:root{
  --bg:#0b1118; --card:#0d151e; --card2:#131d28; --hi:#1a2633; --deep:#0a1118;
  --line:#223140; --line2:#2e4153; --div:#1a2531;
  --text:#e6edf3; --sub:#b4c1cd; --muted:#8193a3; --faint:#4f6070;
  --green:#3ddc97; --amber:#f5b841; --red:#ff5c6c; --blue:#5aa9ff; --cyan:#22d3ee; --ink:#06231a;
  --accent:var(--green); --yellow:var(--amber); --orange:#ff8a3d; --pink:#e49199;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 var(--sans);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 11px;cursor:pointer;touch-action:manipulation;transition:background .12s,border-color .12s}
button:hover{border-color:var(--line2);background:var(--hi)}
button:active{transform:translateY(1px)}
button.on{background:var(--hi);border-color:var(--line2);color:#fff}
button.danger{background:rgba(255,92,108,.1);border-color:rgba(255,92,108,.6);color:var(--red);font-weight:700;letter-spacing:.08em}
button.primary{background:var(--green);border-color:var(--green);color:var(--ink);font-weight:800;letter-spacing:.06em}
button.primary:hover{background:#52e5a6}
button.amber{background:rgba(245,184,65,.12);border-color:rgba(245,184,65,.7);color:var(--amber);font-weight:700}
button.cyan{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.6);color:var(--cyan);font-weight:700}
button:disabled{opacity:.38;cursor:default}
.caps{font:700 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.g{background:var(--green);box-shadow:0 0 0 4px rgba(61,220,151,.18)}
.dot.a{background:var(--amber);box-shadow:0 0 0 4px rgba(245,184,65,.18)}
.dot.r{background:var(--red);box-shadow:0 0 0 4px rgba(255,92,108,.18)}
.dot.b{background:var(--blue)} .dot.c{background:var(--cyan)}
.chip{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 8px;border-radius:6px;font:800 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;border:1px solid;background:rgba(255,255,255,.04)}
.chip.g{color:var(--green);border-color:rgba(61,220,151,.55);background:rgba(61,220,151,.1)}
.chip.a{color:var(--amber);border-color:rgba(245,184,65,.55);background:rgba(245,184,65,.1)}
.chip.r{color:var(--red);border-color:rgba(255,92,108,.55);background:rgba(255,92,108,.1)}
.chip.b{color:var(--blue);border-color:rgba(90,169,255,.55);background:rgba(90,169,255,.1)}
.chip.c{color:var(--cyan);border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.1)}
.chip.n{color:var(--muted);border-color:var(--line)}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:0}
#app>*{min-width:0}
/* ---- bar atas ---- */
#top{display:flex;align-items:stretch;gap:8px;padding:8px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bg);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;gap:4px;flex:none;min-height:46px}
#stBox{min-width:0;flex:0 1 auto;max-width:30vw}
#stLine{display:flex;align-items:center;gap:7px}
#mapName{font:800 15px/1.1 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{font:800 22px/1 var(--mono);color:var(--green);letter-spacing:.02em;min-width:104px}
#clock.paused{color:var(--amber)}
#score{display:flex;flex-direction:column;gap:4px;min-width:118px}
#score .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
#score .num{font:800 20px/1 var(--mono)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar>div{height:100%;border-radius:2px;background:var(--green)}
.seg{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--deep);flex:none}
.seg button{border:0;border-radius:9px;padding:0 11px;height:100%;min-height:32px;background:transparent;font:800 12px var(--mono);color:var(--muted)}
.seg button:hover{background:var(--hi)}
.seg button.on{background:var(--green);color:var(--ink)}
.seg button.on[data-s="0"]{background:var(--amber)}
.spacer{flex:1}
.ico{width:46px;padding:0;display:grid;place-items:center;flex:none;border-radius:12px;background:var(--card)}
.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#btnEnd{border-radius:12px;padding:0 16px;font-size:12px}
/* ---- kanvas ---- */
#stage{position:relative;overflow:hidden;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
#hud{position:absolute;left:10px;top:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.pill{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:rgba(13,21,30,.92);border:1px solid var(--line);border-radius:9px;padding:4px 10px;font:700 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:default}
.pill b{color:var(--text);font-family:var(--mono);letter-spacing:0}
.pill.alert{border-color:rgba(255,92,108,.7);color:var(--red);cursor:pointer;animation:blink 1s steps(2) infinite}
.pill.warn{border-color:rgba(245,184,65,.7);color:var(--amber)}
@keyframes blink{50%{background:rgba(255,92,108,.22)}}
#zoomBtns{position:absolute;right:10px;top:8px;display:flex;flex-direction:column;gap:6px}
#zoomBtns button{width:38px;height:38px;padding:0;font-size:18px;background:rgba(13,21,30,.92);border-radius:11px}
/* ---- panel kontrol manual ---- */
#manual{position:absolute;left:10px;right:10px;margin:0 auto;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:none;gap:8px;flex-direction:column;align-items:stretch;max-width:560px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
#manual.show{display:flex}
#manual .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#manual .row button{flex:1;min-width:56px;height:38px;font:800 11.5px var(--sans);letter-spacing:.1em}
#manual .row button.sel{background:var(--green);border-color:var(--green);color:var(--ink)}
#manual .row button.sel.stop{background:var(--amber);border-color:var(--amber)}
#manualInfo{display:flex;align-items:center;gap:10px;font:12px var(--mono);color:var(--muted)}
#manualInfo b{color:var(--green);font-weight:800}
#mTitle{font:800 13px var(--mono);color:var(--text)}
/* ---- panel bawah ---- */
#panel{margin:0 8px 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;height:34vh;min-height:52px;transition:height .2s;overflow:hidden;margin-bottom:max(8px,env(safe-area-inset-bottom))}
#panel.min{height:52px}
#tabs{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--div);flex:none}
#tabSeg{display:flex;flex-wrap:wrap;gap:2px;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--deep);min-width:0}
#tabSeg::-webkit-scrollbar{display:none}
#tabSeg button{border:1px solid transparent;border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;background:transparent;color:var(--muted);position:relative}
#tabSeg button:hover{color:var(--text)}
#tabSeg button.on{background:var(--hi);border-color:var(--line2);color:var(--text);font-weight:800}
#tabSeg button.alert{color:var(--amber)}
#tabSeg button.alert::after{content:"";position:absolute;right:4px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--amber)}
#tabSeg button.alert.flash{background:rgba(245,184,65,.2);border-color:rgba(245,184,65,.65)}
#tabs .grow{flex:1}
#panelToggle{width:34px;height:32px;border-radius:10px}
#tabBody{flex:1;overflow:auto;min-height:0;padding:4px 12px 10px}
#tabBody.flush{padding:8px}
@media (max-width:640px){
  #stBox{display:none}
  #clock{font-size:17px;min-width:86px}
  #score{min-width:92px} #score .num{font-size:16px}
  .seg button{padding:0 7px;font-size:11px}
  #btnEnd .long{display:none}
  #btnEnd{padding:0 10px}
  #top{gap:6px;padding:6px}
  #manual .row button{letter-spacing:.03em;font-size:10.5px;min-width:46px;padding:0 4px;white-space:nowrap}
}
@media (min-width:1000px){
  #app{grid-template-columns:minmax(0,1fr) 440px;grid-template-rows:auto minmax(0,1fr)}
  #top{grid-column:1/3}
  #panel{grid-row:2;grid-column:2;height:auto!important;margin:0 8px 8px 0}
  #panelToggle{display:none}
}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 6px;border-bottom:1px solid var(--div);text-align:left;white-space:nowrap}
th{position:sticky;top:-4px;background:var(--card);color:var(--muted);font:700 10px/1 var(--sans);text-transform:uppercase;letter-spacing:.13em;z-index:1;padding-top:10px}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(255,255,255,.025)}
td.mono{font-family:var(--mono)}
td.no{font:800 12.5px var(--mono)}
td.sub{color:var(--sub)}
.st-run{color:var(--green)} .st-wait{color:var(--amber)} .st-held{color:var(--red)} .st-done{color:var(--muted)} .st-plat{color:var(--blue)} .st-shunt{color:var(--cyan)}
.info{display:inline-flex;align-items:center;gap:7px}
.log{font:12px/1.5 var(--sans)}
.log div{display:flex;gap:10px;align-items:baseline;padding:5px 2px;border-bottom:1px solid var(--div)}
.log .t{font-family:var(--mono);color:var(--muted);flex:none}
.log div:first-child .t{color:var(--text)}
.log .dot{width:6px;height:6px;transform:translateY(-1px)}
.c-red{color:var(--red)}.c-green{color:var(--green)}.c-yellow{color:var(--amber)}.c-cyan{color:var(--cyan)}.c-white{color:var(--sub)}
.secHead{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.secHead .sub{color:var(--faint);font-size:11.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ind{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--card2);display:flex;flex-direction:column;gap:6px}
.ind .top{display:flex;align-items:center;gap:7px}
.ind .code{font:800 14px var(--sans);letter-spacing:.1em}
.ind .n{font:800 20px var(--mono);color:var(--muted)}
.ind .nm{color:var(--faint);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ind.held{border-color:rgba(245,184,65,.6)} .ind.held .n,.ind.held .code{color:var(--amber)}
.ind.alert{animation:blinkA 1s steps(2) infinite}
@keyframes blinkA{50%{background:rgba(245,184,65,.22)}}
.lamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.lamp{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.lamp b{font:800 11px var(--sans);letter-spacing:.12em;color:var(--faint)}
.lamp .s{font-size:11px;color:var(--faint)}
.lamp.ok{border-color:rgba(61,220,151,.7);background:rgba(61,220,151,.1)} .lamp.ok b{color:var(--green)}
.lamp.warn{border-color:rgba(245,184,65,.7);background:rgba(245,184,65,.1)} .lamp.warn b{color:var(--amber)}
.lamp.bad{border-color:rgba(255,92,108,.7);background:rgba(255,92,108,.1);animation:blink 1s steps(2) infinite} .lamp.bad b{color:var(--red)}
.big{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.big>div{height:100%;border-radius:4px;background:var(--green)}
.muted{color:var(--muted)}
h4{margin:14px 0 8px;font:700 10.5px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
#pmWrap{display:flex;gap:10px;height:100%;min-height:150px}
#pmBox{position:relative;flex:1.4;min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--deep);touch-action:none;cursor:crosshair}
#pmBox canvas{position:absolute;inset:0;width:100%;height:100%}
#pmSt{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;align-content:start;overflow:auto}
#pmSt button{padding:7px 4px;font:700 12px var(--mono);letter-spacing:.04em}
#pmSt button.near{border-color:var(--amber);color:var(--amber)}
@media (max-width:560px){#pmWrap{flex-direction:column}#pmBox{flex:none;height:62%}#pmSt{grid-template-columns:repeat(4,1fr)}}
.vduHead{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.vduHead .st{flex:1;min-width:0}.vduHead .st b{display:block;font-size:18px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vduHead .clk{text-align:right}.vduHead .clk b{display:block;font:800 20px var(--mono);color:var(--green)}
#vTbl{overflow-x:auto}.vdu table{width:100%}.vdu th,.vdu td{padding:7px 5px}
.vdu .arIn{display:none}.vdu .sh{display:none}
@media (max-width:560px){.vdu .ar{display:none}.vdu .arIn{display:inline-block;margin-left:4px;padding:0 5px;font-size:10px}.vdu th,.vdu td{padding:6px 3px;font-size:12.5px}.vdu th{font-size:10px;letter-spacing:.03em}.vdu td.pf span{min-width:24px;padding:2px 3px;font-size:13px}.vdu .lg{display:none}.vdu .sh{display:inline}.vdu td.no{white-space:nowrap}.vduHead .st b{font-size:15px}.vduHead .clk b{font-size:16px}}
#btnVdu{white-space:nowrap;padding:6px 10px;font-size:12px}
.vdu td.pf span{display:inline-block;min-width:34px;text-align:center;padding:2px 4px;border:1px solid var(--line);border-radius:7px;background:var(--deep);font:800 15px var(--mono)}
.vdu tr.dw td{color:var(--text)} .vdu tr.dw{background:rgba(90,169,255,.09)} .vdu tr.dw td.pf span{border-color:rgba(90,169,255,.7);color:var(--blue)}
#gpWrap{position:relative;height:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
#gpCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#gpHint{position:absolute;right:8px;bottom:8px;pointer-events:none}
/* ---- dialog ---- */
.modal{position:fixed;inset:0;background:rgba(3,7,11,.66);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:580px;width:100%;max-height:calc(100% - 24px);display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.65);overflow:hidden}
.dlg header{padding:14px 16px 12px;border-bottom:1px solid var(--div);font:800 15px var(--sans);display:flex;align-items:center;gap:10px}
.dlg .body{padding:12px 16px;overflow:auto;white-space:pre-wrap;color:var(--sub)}
.dlg .body.html{white-space:normal;color:var(--text)}
.dlg footer{padding:10px 16px 14px;border-top:1px solid var(--div);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg footer button{height:38px;padding:0 16px;font-weight:700;letter-spacing:.06em}
.dlg.warn{border-color:rgba(255,138,61,.7)}
.dlg.wide{max-width:760px}
.dlg input[type=password],.dlg input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--deep);color:var(--text);font:inherit}
.list button{display:flex;width:100%;text-align:left;margin:0 0 6px;padding:9px 12px;align-items:center;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv span:nth-child(odd){font:700 10px/1.8 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.statusCard{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:calc(34vh + 22px);transform:translateX(-50%);background:var(--card2);color:var(--text);padding:9px 16px;border-radius:12px;border:1px solid var(--line2);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1}
@media (min-width:1000px){#toast{bottom:20px}}
#sumFrame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:70;background:#0b1118}
/* ---- layar awal ---- */
#start{position:fixed;inset:0;z-index:40;background:radial-gradient(1100px 600px at 25% 15%,rgba(61,220,151,.09) 0,transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#start .card{max-width:520px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
#start h1{margin:6px 0 6px;font:800 24px var(--sans);letter-spacing:.02em}
#start h1 span{color:var(--green)}
#start p{color:var(--muted);margin:0 0 14px}
#start .btns{display:flex;flex-direction:column;gap:8px}
#start .btns button{padding:13px;font-size:14px;text-align:center}
#saves{margin-top:12px;display:flex;flex-direction:column;gap:6px}
#saves .sv{display:flex;gap:6px;align-items:center}
#saves .sv button:first-child{flex:1;text-align:left}
.drop{outline:2px dashed var(--green);outline-offset:-10px}
.menu{position:fixed;z-index:55;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;min-width:240px;box-shadow:0 14px 44px rgba(0,0,0,.6)}
.menu button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:9px}
.menu button:hover{background:var(--hi)}
.menu hr{border:0;border-top:1px solid var(--div);margin:4px 0}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ico" id="btnMenu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="box" id="stBox"><div id="stLine"><span class="dot g" id="stDot"></span><span class="caps" id="stCap">CTC Interlocking</span></div><div id="mapName">ANT Dispatcher CTC</div></div>
    <div class="box"><div id="clock">--:--:--</div><div class="caps">Waktu</div></div>
    <div class="box" id="score"></div>
    <div class="seg" id="speeds">
      <button data-s="0">JEDA</button><button data-s="1">1X</button><button data-s="2">2X</button><button data-s="4">4X</button><button data-s="8">8X</button>
    </div>
    <div class="spacer"></div>
    <button id="btnEnd" class="danger" style="white-space:nowrap" title="Selesaikan dinas">🏁 <span class="long">SELESAIKAN DINAS</span></button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="zoomBtns"><button id="zIn">+</button><button id="zOut">−</button><button id="zFit" title="Tampilkan semua">⤢</button></div>
    <div id="manual">
      <div id="manualInfo"><span class="dot g" id="mDot"></span><span id="mTitle">-</span><span><b id="mSpd">0</b> / <b id="mLim">15</b> km/j</span><span class="caps" id="mDir"></span></div>
      <div class="row"><button data-m="0">−5</button><button data-m="1">◀ MUNDUR</button><button data-m="2">■ STOP</button><button data-m="3">MAJU ▶</button><button data-m="4">+5</button></div>
      <div class="row"><button data-m="5" id="mCtx">LEPAS</button><button data-m="6" id="mAuto">OTOMATIS</button><button data-m="9">TUTUP</button></div>
    </div>
  </div>

    <div id="tabs">

<script>
'use strict';
// =====================================================================
//  ANT Dispatcher CTC - versi HTML
//  Port dari kode Java (com.alpharest.signalling.train)
//  Bagian 1: utilitas JSON, normalisasi jadwal, geometri, PathBuilder, Masinis
// =====================================================================

// ---------- Perilaku opt*() org.json ----------
const J = {
  has(o, k) { return o != null && typeof o === 'object' && Object.prototype.hasOwnProperty.call(o, k) && o[k] !== undefined && o[k] !== null; },
  int(o, k, d = -1) {
    if (o == null) return d;
    const v = o[k];
    if (typeof v === 'number') return Number.isFinite(v) ? Math.trunc(v) : d;
    if (typeof v === 'string') { const s = v.trim(); if (s === '') return d; const n = Number(s); return Number.isFinite(n) ? Math.trunc(n) : d; }
    return d;
  },
  num(o, k, d = NaN) {
    if (o == null) return d;
    const v = o[k];
    if (typeof v === 'number') return v;
    if (typeof v === 'string') { const s = v.trim(); if (s === '') return d; const n = Number(s); return Number.isNaN(n) ? d : n; }
    return d;
  },
  str(o, k, d = '') {
    if (o == null) return d;
    const v = o[k];
    if (v === undefined || v === null) return d;
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  },
  bool(o, k, d = false) {
    if (o == null) return d;
    const v = o[k];
    if (typeof v === 'boolean') return v;
    if (typeof v === 'string') { const s = v.toLowerCase(); if (s === 'true') return true; if (s === 'false') return false; }
    return d;
  },
  arr(o, k) { const v = o ? o[k] : null; return Array.isArray(v) ? v : null; },
  eqi(a, b) { return a != null && b != null && String(a).toUpperCase() === String(b).toUpperCase(); },
};

function toHHmm(raw) {
  if (raw == null) return '';
  raw = String(raw).trim();
  if (raw === '' || raw.includes(':')) return raw;
  while (raw.length < 4) raw = '0' + raw;
  return raw.substring(0, 2) + ':' + raw.substring(2, 4);
}

// ScoreManager.parseTimeToSeconds (0 bila gagal)
function parseSec(t) {
  if (t == null) return 0;
  const p = String(t).split(':');
  if (p.length < 2) return 0;
  const a = parseInt(p[0], 10), b = parseInt(p[1], 10);
  if (!/^-?\d+$/.test(p[0].trim()) || !/^-?\d+$/.test(p[1].trim())) return 0;
  let s = a * 3600 + b * 60;
  if (p.length > 2) { const c = parseInt(p[2], 10); if (Number.isNaN(c)) return 0; s += c; }
  return s;
}

// SimulationClock.calculateTimeDiffInSeconds (-999 bila gagal)
function timeDiff(cur, tar) {
  if (cur == null || tar == null) return -999;
  const a = String(cur).split(':'), b = String(tar).split(':');
  if (a.length < 2 || b.length < 2) return -999;
  const ok = x => /^\s*-?\d+\s*$/.test(x);
  if (!ok(a[0]) || !ok(a[1]) || !ok(b[0]) || !ok(b[1])) return -999;
  let cs = parseInt(a[0], 10) * 3600 + parseInt(a[1], 10) * 60;
  if (a.length > 2) { if (!ok(a[2])) return -999; cs += parseInt(a[2], 10); }
  let ts = parseInt(b[0], 10) * 3600 + parseInt(b[1], 10) * 60;
  if (b.length > 2) { if (!ok(b[2])) return -999; ts += parseInt(b[2], 10); }
  return ts - cs;
}

function isTimeReached(cur, tar) {
  if (cur == null || tar == null || tar === '--:--') return true;
  const d = timeDiff(cur, tar.length > 5 ? tar.substring(0, 5) : tar);
  if (d === -999) return true;
  return d <= 0;
}

function fmtTime(sec, withSec) {
  sec = ((Math.floor(sec) % 86400) + 86400) % 86400;
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return withSec ? `${p(h)}:${p(m)}:${p(s)}` : `${p(h)}:${p(m)}`;
}

// =====================================================================
//  ScheduleNormalizer
// =====================================================================
const SN = {
  allowed: new Map(),
  PAIRS: [['nc', 'cars'], ['ll', 'loco_length'], ['cl', 'car_length'], ['cg', 'car_gap'],
    ['no', 'train_number'], ['n', 'train_name'], ['t', 'type'], ['m', 'mode'],
    ['sT', 'entry_track'], ['tT', 'target_platform'], ['xT', 'exit_track'],
    ['sW', 'spawn_time'], ['aT', 'arr_time'], ['dT', 'dep_time'],
    ['tb', 'turnback'], ['sb', 'start_at_platform'],
    ['lk', 'loco'], ['hp', 'power_hp'], ['bk', 'brake'], ['lt', 'loco_ton'], ['ct', 'car_ton']],

  allowedPlatforms(no) {
    if (no == null) return [];
    const l = this.allowed.get(String(no).toUpperCase());
    return l ? l.slice() : [];
  },
  isAllowedPlatform(no, tid) { return tid > 0 && this.allowedPlatforms(no).includes(tid); },
  platformsOf(s) {
    const out = [];
    if (!s) return out;
    const a = J.arr(s, 'target_platforms');
    if (a) for (let i = 0; i < a.length; i++) { const v = J.int(a, i, -1); if (v > 0 && !out.includes(v)) out.push(v); }
    if (!out.length) { const v = J.int(s, 'target_platform', -1); if (v > 0) out.push(v); }
    return out;
  },
  normalize(data) {
    const arr = J.arr(data, 'schedules');
    if (!arr) return;
    this.allowed.clear();
    for (const s of arr) {
      if (!s || typeof s !== 'object') continue;
      const ci = (f, t) => { if (J.has(s, f) && !J.has(s, t)) s[t] = J.int(s, f, -1); };
      const cd = (f, t) => { if (J.has(s, f) && !J.has(s, t)) s[t] = J.num(s, f, 0); };
      const cs = (f, t) => { if (J.has(s, f) && !J.has(s, t)) s[t] = J.str(s, f, ''); };
      const cb = (f, t) => { if (J.has(s, f) && !J.has(s, t)) s[t] = J.bool(s, f, false); };
      const ct = (f, t) => { if (J.has(s, f) && !J.has(s, t)) s[t] = toHHmm(J.str(s, f, '')); };
      ci('nc', 'cars'); cd('ll', 'loco_length'); cd('cl', 'car_length'); cd('cg', 'car_gap');
      cs('lk', 'loco'); cd('hp', 'power_hp'); cd('bk', 'brake'); cd('lt', 'loco_ton'); cd('ct', 'car_ton');
      cs('no', 'train_number'); cs('n', 'train_name'); cs('t', 'type'); cs('m', 'mode');
      ci('sT', 'entry_track');
      // tT: angka atau array
      let list = null;
      const lv = s.target_platform, sv = s.tT;
      if (Array.isArray(lv)) list = lv; else if (lv == null && Array.isArray(sv)) list = sv;
      if (list) {
        const clean = [];
        for (let k = 0; k < list.length; k++) { const v = J.int(list, k, -1); if (v > 0) clean.push(v); }
        s.target_platform = clean.length ? clean[0] : -1;
        s.target_platforms = clean;
      } else ci('tT', 'target_platform');
      ci('xT', 'exit_track');
      ct('sW', 'spawn_time'); ct('aT', 'arr_time'); ct('dT', 'dep_time');
      cb('tb', 'turnback'); cb('sb', 'start_at_platform'); cb('fin', 'terminate');
      if (!J.has(s, 'is_through') && J.eqi(J.str(s, 'type', ''), 'LANGSUNG')) s.is_through = true;
      const pl = this.platformsOf(s);
      const no = J.str(s, 'train_number', '');
      if (pl.length > 1 && no) this.allowed.set(no.toUpperCase(), pl);
    }
  },
  expandLegs(data) {
    const arr = J.arr(data, 'schedules');
    if (!arr) return;
    const out = [];
    for (const base of arr) {
      if (!base || typeof base !== 'object') continue;
      const legs = J.arr(base, 'legs');
      if (!legs || legs.length === 0) { out.push(base); continue; }
      const baseNo = J.str(base, 'no', J.str(base, 'train_number', 'KA'));
      const n = legs.length;
      const nums = [];
      for (let k = 0; k < n; k++) {
        const lg = legs[k];
        const own = lg ? J.str(lg, 'no', '') : '';
        nums[k] = own ? own : (k === 0 ? baseNo : baseNo + ' (' + (k + 1) + ')');
      }
      let prevDep = '';
      for (let k = 0; k < n; k++) {
        const lg = legs[k];
        const s = JSON.parse(JSON.stringify(base));
        delete s.legs; delete s.train_number;
        if (k < n - 1) { delete s.fin; delete s.terminate; }
        if (k > 0) {
          for (const key of ['sT', 'sW', 'sb', 'entry_track', 'spawn_time', 'start_at_platform']) delete s[key];
          s.is_leg = true;
          s.leg_spawn = prevDep;
        }
        if (k < n - 1) {
          delete s.xT; delete s.exit_track;
          s.partial = true;
          s.next_leg = nums[k + 1];
        }
        if (lg && typeof lg === 'object') {
          for (const p of this.PAIRS) if (J.has(lg, p[0])) delete s[p[1]];
          if (J.has(lg, 'tT') || J.has(lg, 'target_platform')) delete s.target_platforms;
          for (const key of Object.keys(lg)) s[key] = JSON.parse(JSON.stringify(lg[key]));
        }
        s.no = nums[k];
        prevDep = toHHmm(J.str(s, 'dT', ''));
        out.push(s);
      }
    }
    data.schedules = out;
  },
};

// =====================================================================
//  SpawnTrackBuilder
// =====================================================================
const SpawnTrackBuilder = {
  TOL: 0.002,
  ensure(data) {
    const tracks = J.arr(data, 'tracks');
    if (!tracks) return;
    let out = J.arr(data, 'spawn-track') || J.arr(data, 'spawn_tracks');
    if (!out) { out = []; data['spawn-track'] = out; }
    for (const t of tracks) {
      if (!t) continue;
      const tt = J.str(t, 'type', '');
      const spawnable = J.eqi(tt, 'SPAWN') || (J.eqi(tt, 'END') && J.bool(t, 'spawn', false));
      if (!spawnable) continue;
      const id = J.int(t, 'id', -1);
      let entry = out.find(e => e && J.int(e, 'id', -1) === id);
      const isNew = !entry;
      if (isNew) entry = {};
      let join = J.int(entry, 'joinWith', J.int(t, 'joinWith', -1));
      if (join === -1) join = this.findJoin(tracks, t);
      if (join === -1) continue;
      let mode = J.str(entry, 'mode', J.str(t, 'mode', ''));
      if (!mode) mode = this.inferMode(tracks, t, join);
      entry.id = id; entry.joinWith = join; entry.mode = mode;
      if (!J.has(entry, 'type')) entry.type = 'ENTRY';
      if (!J.has(entry, 'path')) entry.path = [id, join];
      if (isNew) out.push(entry);
    }
  },
  near(ax, ay, bx, by) { return Math.abs(ax - bx) < this.TOL && Math.abs(ay - by) < this.TOL; },
  pts(t) { return [J.num(t, 'startX'), J.num(t, 'startY'), J.num(t, 'endX'), J.num(t, 'endY')]; },
  shareEnd(a, b) {
    const pa = this.pts(a), pb = this.pts(b);
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++)
      if (this.near(pa[i * 2], pa[i * 2 + 1], pb[j * 2], pb[j * 2 + 1])) return true;
    return false;
  },
  findJoin(tracks, sp) {
    const id = J.int(sp, 'id', -1);
    let found = -1;
    for (const t of tracks) {
      if (!t) continue;
      const tid = J.int(t, 'id', -1);
      if (tid === id || !this.shareEnd(sp, t)) continue;
      if (found !== -1 && found !== tid) return -1;
      found = tid;
    }
    return found;
  },
  inferMode(tracks, sp, joinId) {
    const join = tracks.find(t => t && J.int(t, 'id', -1) === joinId);
    const [sx, sy, ex, ey] = this.pts(sp);
    let joinY, farY;
    if (join) {
      const [jsx, jsy, jex, jey] = this.pts(join);
      if (this.near(sx, sy, jsx, jsy) || this.near(sx, sy, jex, jey)) { joinY = sy; farY = ey; }
      else if (this.near(ex, ey, jsx, jsy) || this.near(ex, ey, jex, jey)) { joinY = ey; farY = sy; }
      else { joinY = (jsy + jey) / 2; farY = (sy + ey) / 2; }
    } else return 'NORMAL';
    if (Math.abs(farY - joinY) < 1e-6) return 'NORMAL';
    return farY < joinY ? 'NORMAL' : 'REVERSE';
  },
};

// =====================================================================
//  Geo: cache koordinat, panjang, indeks sinyal/peron, SwitchUtil
// =====================================================================
class Geo {
  constructor(data) {
    this.data = data;
    this.tracks = new Map();
    this.coords = new Map();
    this.len = new Map();
    this.sigIdx = new Map();
    this.sigById = new Map();
    this.platIdx = new Map();
    this.brCache = new Map();
    this.zoneCache = new Map();
    for (const t of (J.arr(data, 'tracks') || [])) {
      if (!t) continue;
      const id = J.int(t, 'id', -1);
      this.tracks.set(id, t);
      this.coords.set(id, [J.num(t, 'startX'), J.num(t, 'startY'), J.num(t, 'endX'), J.num(t, 'endY')]);
      const m = J.num(t, 'length', 50);
      this.len.set(id, m > 0 ? m : 50);
    }
    for (const s of (J.arr(data, 'signals') || [])) {
      if (!s) continue;
      const tid = J.int(s, 'onTrack', -1);
      if (!this.sigIdx.has(tid)) this.sigIdx.set(tid, []);
      this.sigIdx.get(tid).push(s);
      const k = J.str(s, 'id', '').toUpperCase();
      if (!this.sigById.has(k)) this.sigById.set(k, s);
    }
    for (const p of (J.arr(data, 'platforms') || [])) {
      if (!p) continue;
      const tid = J.int(p, 'onTrack', -1);
      if (!this.platIdx.has(tid)) this.platIdx.set(tid, p);
    }
  }
  track(id) { return this.tracks.get(id) || null; }
  c(id) { return this.coords.get(id) || null; }
  meters(id) { const m = this.len.get(id); return m != null ? m : 50; }
  onTrack(id) { return this.sigIdx.get(id) || []; }
  signal(id) { return id == null ? null : (this.sigById.get(String(id).toUpperCase()) || null); }
  type(id) { const t = this.tracks.get(id); return t ? J.str(t, 'type', '') : ''; }
  isEnd(id) { return J.eqi(this.type(id), 'END'); }
  hasBuffer(id) { const t = this.tracks.get(id); return !!t && J.bool(t, 'buffer', false); }
  speed(id) { const t = this.tracks.get(id); const v = t ? J.int(t, 'speed', 30) : 30; return v; }
  platform(id) { return this.platIdx.get(id) || null; }
  platName(id) { const p = this.platform(id); return p == null ? String(id) : J.str(p, 'name', J.str(p, 'no', String(id))); }
  platStation(id) { const p = this.platform(id); return p == null ? '' : J.str(p, 'station', ''); }
  platLabel(id) { const st = this.platStation(id); return (st ? st + ' ' : '') + 'P' + this.platName(id); }

  // ---- SwitchUtil ----
  pivot(br) {
    if (br.length < 2) return null;
    const a = this.c(br[0]), b = this.c(br[1]);
    if (!a || !b) return null;
    let best = Infinity, pv = null;
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      const d = Math.hypot(a[i * 2] - b[j * 2], a[i * 2 + 1] - b[j * 2 + 1]);
      if (d < best) { best = d; pv = [a[i * 2], a[i * 2 + 1]]; }
    }
    return pv;
  }
  farEnd(id, pv) {
    const c = this.c(id);
    if (!c || !pv) return null;
    const d0 = Math.hypot(c[0] - pv[0], c[1] - pv[1]), d1 = Math.hypot(c[2] - pv[0], c[3] - pv[1]);
    return d0 > d1 ? [c[0], c[1]] : [c[2], c[3]];
  }
  branches(sw) {
    let hit = this.brCache.get(sw);
    if (hit) return hit;
    let br = [];
    const arr = J.arr(sw, 'branches');
    if (arr && arr.length >= 2) {
      for (let i = 0; i < arr.length; i++) br.push(J.int(arr, i, -1));
      const pv = this.pivot(br);
      if (pv) br.sort((a, b) => {
        const fa = this.farEnd(a, pv), fb = this.farEnd(b, pv);
        if (!fa || !fb) return 0;
        return fa[0] - fb[0];
      });
    } else {
      br.push(J.int(sw, 'normal', -1));
      br.push(J.int(sw, 'diverge', -1));
    }
    this.brCache.set(sw, br);
    return br;
  }
  activeIndex(sw, count) {
    if (J.has(sw, 'branches')) {
      const def = count >= 3 ? Math.floor(count / 2) : 0;
      const p = J.int(sw, 'pos', def);
      return Math.max(0, Math.min(count - 1, p));
    }
    return J.eqi(J.str(sw, 'state', 'NORMAL'), 'DIVERGE') ? 1 : 0;
  }
  setActiveIndex(sw, idx) {
    if (J.has(sw, 'branches')) sw.pos = idx;
    else sw.state = idx === 0 ? 'NORMAL' : 'DIVERGE';
  }
  activeBranch(sw) {
    const br = this.branches(sw);
    const idx = this.activeIndex(sw, br.length);
    return idx < br.length ? br[idx] : -1;
  }
  posLabel(idx, count) {
    if (count === 2) return idx === 0 ? 'lurus' : 'belok';
    if (count === 3) return idx === 0 ? 'kiri' : (idx === 1 ? 'tengah' : 'kanan');
    return 'cabang ' + (idx + 1);
  }
  touches(id, p) {
    const c = this.c(id);
    if (!c || !p) return false;
    return (Math.abs(c[0] - p[0]) < 0.002 && Math.abs(c[1] - p[1]) < 0.002)
      || (Math.abs(c[2] - p[0]) < 0.002 && Math.abs(c[3] - p[1]) < 0.002);
  }
  usedBranch(path, br, pv) {
    for (let i = 0; i < path.length; i++) {
      const id = path[i];
      if (!br.includes(id)) continue;
      if (pv == null) return id;
      if (i > 0 && this.touches(path[i - 1], pv)) return id;
      if (i + 1 < path.length && this.touches(path[i + 1], pv)) return id;
    }
    return -1;
  }
  zone(sw) {
    let z = this.zoneCache.get(sw);
    if (z) return z;
    const br = this.branches(sw);
    z = br.slice();
    const pv = this.pivot(br);
    if (pv) for (const id of this.tracks.keys()) if (!z.includes(id) && this.touches(id, pv)) z.push(id);
    this.zoneCache.set(sw, z);
    return z;
  }
  // Posisi sinyal pada track (0..1) searah gerak (Train.getSignalProgress)
  sigProgress(sig, trackId, down) {
    const c = this.c(trackId);
    if (!c) return 0.87;
    const dx = c[2] - c[0], dy = c[3] - c[1], len2 = dx * dx + dy * dy;
    if (len2 === 0) return 0.87;
    let pf = ((J.num(sig, 'x') - c[0]) * dx + (J.num(sig, 'y') - c[1]) * dy) / len2;
    pf = Math.max(0, Math.min(1, pf));
    return (!down && c[1] < c[3]) ? 1 - pf : pf;
  }
}

const sigDown = s => !J.eqi(J.str(s, 'facing', 'NORMAL'), 'REVERSE');
const sigType = s => J.str(s, 'type', '').toUpperCase();
const isAutoSig = s => { const t = sigType(s); return t === 'REPEATER' || t === 'DISTANT' || t === 'BLOCK'; };

// =====================================================================
//  PathBuilder
// =====================================================================
class PathBuilder {
  constructor(geo) {
    this.geo = geo;
    this.nodes = new Map();
    for (const [id, c] of geo.coords) {
      this.addNode(PathBuilder.key(c[0], c[1]), id);
      this.addNode(PathBuilder.key(c[2], c[3]), id);
    }
  }
  static key(x, y) { return Math.round(x * 1000) + '|' + Math.round(y * 1000); }
  has(id) { return this.geo.tracks.has(id); }
  addNode(k, id) { if (!this.nodes.has(k)) this.nodes.set(k, []); this.nodes.get(k).push(id); }
  static allows(track, down) {
    if (!track) return true;
    const d = J.str(track, 'dir', 'BOTH');
    if (J.eqi(d, 'NORMAL')) return down;
    if (J.eqi(d, 'REVERSE')) return !down;
    return true;
  }
  exitPoint(id, down) {
    const c = this.geo.c(id);
    const [sx, sy, ex, ey] = c;
    let startIsExit;
    if (Math.abs(ey - sy) < 1e-6) startIsExit = !down;
    else startIsExit = down ? (sy > ey) : (sy < ey);
    return startIsExit ? [sx, sy] : [ex, ey];
  }
  otherEnd(id, nk) {
    const c = this.geo.c(id);
    if (PathBuilder.key(c[0], c[1]) === nk) return [c[2], c[3]];
    return [c[0], c[1]];
  }
  signalFacing(trackId, down) {
    for (const s of this.geo.onTrack(trackId)) {
      const t = sigType(s);
      if (t === 'DISTANT' || t === 'REPEATER') continue;
      if (sigDown(s) === down) return J.str(s, 'id', '');
    }
    return null;
  }
  nextTrack(cur, down, seen, allowWrong = false) {
    if (!this.has(cur)) return -1;
    const ep = this.exitPoint(cur, down);
    const nk = PathBuilder.key(ep[0], ep[1]);
    const inc = this.nodes.get(nk);
    if (!inc) return -1;
    const tp = J.int(this.geo.track(cur), down ? 'teleportNormal' : 'teleportReverse', -1);
    if (tp !== -1 && this.has(tp) && !seen.has(tp) && (allowWrong || PathBuilder.allows(this.geo.track(tp), down))) return tp;
    const cand = [];
    for (const id of inc) {
      if (id === cur || seen.has(id)) continue;
      if (!allowWrong && !PathBuilder.allows(this.geo.track(id), down)) continue;
      const o = this.otherEnd(id, nk);
      const ahead = down ? (o[1] > ep[1] + 1e-6) : (o[1] < ep[1] - 1e-6);
      if (ahead) cand.push(id);
    }
    if (!cand.length) return -1;
    if (cand.length === 1) return cand[0];
    return this.choose(cand, nk, ep[0], down);
  }
  choose(cand, nk, nodeX, down) {
    for (const s of (J.arr(this.geo.data, 'switches') || [])) {
      if (!s) continue;
      const br = this.geo.branches(s);
      if (!br.every(b => cand.includes(b))) continue;
      const active = this.geo.activeBranch(s);
      if (active !== -1) return active;
    }
    const pref = cand.filter(id => PathBuilder.allows(this.geo.track(id), down));
    const pool = pref.length ? pref : cand;
    let best = pool[0], bestDx = Infinity;
    for (const id of pool) {
      const dx = Math.abs(this.otherEnd(id, nk)[0] - nodeX);
      if (dx < bestDx - 1e-9 || (Math.abs(dx - bestDx) < 1e-9 && id < best)) { best = id; bestDx = dx; }
    }
    return best;
  }
  backPath(headTrack, down, metersNeeded) {
    const back = [];
    if (!this.has(headTrack)) return back;
    const seen = new Set([headTrack]);
    let cur = headTrack, acc = 0;
    for (let g = 0; g < this.geo.tracks.size && acc < metersNeeded; g++) {
      const prev = this.nextTrack(cur, !down, seen, true);
      if (prev === -1) break;
      back.unshift(prev);
      seen.add(prev);
      acc += this.geo.meters(prev);
      cur = prev;
    }
    return back;
  }
  build(sig, allowWrong = false) {
    if (!sig) return null;
    return this.walk(J.int(sig, 'onTrack', -1), sigDown(sig), allowWrong);
  }
  buildFromTrack(start, down) { const r = this.walk(start, down, false); return r ? r.path : null; }
  walk(start, down, allowWrong) {
    if (!this.has(start)) return null;
    const startWrong = !PathBuilder.allows(this.geo.track(start), down);
    if (startWrong && !allowWrong) return null;
    const r = { path: [start], endType: 'BUNTU', endSignalId: null, wrongWay: startWrong ? [start] : [] };
    const seen = new Set([start]);
    let cur = start;
    for (let g = 0; g < this.geo.tracks.size; g++) {
      if (r.path.length > 1) {
        if (this.geo.isEnd(cur)) { r.endType = 'END'; break; }
        const sg = this.signalFacing(cur, down);
        if (sg != null) { r.endType = 'SINYAL'; r.endSignalId = sg; break; }
      }
      const next = this.nextTrack(cur, down, seen, allowWrong);
      if (next === -1) break;
      r.path.push(next);
      if (!PathBuilder.allows(this.geo.track(next), down)) r.wrongWay.push(next);
      seen.add(next);
      cur = next;
    }
    return r.path.length >= 2 ? r : null;
  }
  findSignalAhead(from) {
    if (!from) return null;
    const start = J.int(from, 'onTrack', -1);
    if (!this.has(start)) return null;
    const down = sigDown(from);
    const same = this.signalAheadOnTrack(start, down, from);
    if (same != null) return same;
    const seen = new Set([start]);
    let cur = start;
    for (let g = 0; g < this.geo.tracks.size; g++) {
      const next = this.nextTrack(cur, down, seen);
      if (next === -1) return null;
      seen.add(next);
      const sg = this.signalFacing(next, down);
      if (sg != null) return sg;
      if (this.geo.isEnd(next)) return null;
      cur = next;
    }
    return null;
  }
  signalAheadOnTrack(trackId, down, from) {
    const fy = J.num(from, 'y');
    const fromId = J.str(from, 'id', '');
    let best = null, bestY = 0;
    for (const s of (J.arr(this.geo.data, 'signals') || [])) {
      if (!s || J.int(s, 'onTrack', -1) !== trackId) continue;
      if (J.eqi(fromId, J.str(s, 'id', ''))) continue;
      const t = sigType(s);
      if (t === 'DISTANT' || t === 'REPEATER') continue;
      if (sigDown(s) !== down) continue;
      const sy = J.num(s, 'y');
      if (down ? sy <= fy : sy >= fy) continue;
      if (best == null || (down ? sy < bestY : sy > bestY)) { best = J.str(s, 'id', ''); bestY = sy; }
    }
    return best;
  }
  nextAfter(prefix, down) {
    if (!prefix.length || !this.has(prefix[prefix.length - 1])) return -1;
    return this.nextTrack(prefix[prefix.length - 1], down, new Set(prefix), true);
  }
  extendFrom(prefix, down) {
    const out = prefix.slice();
    if (!out.length || !this.has(out[out.length - 1])) return out;
    const seen = new Set(prefix);
    let cur = out[out.length - 1];
    for (let g = 0; g < this.geo.tracks.size; g++) {
      if (out.length > 1) {
        if (this.geo.isEnd(cur)) break;
        if (this.signalFacing(cur, down) != null) break;
      }
      const next = this.nextTrack(cur, down, seen, true);
      if (next === -1) break;
      out.push(next); seen.add(next); cur = next;
    }
    return out;
  }
}

// =====================================================================
//  Traction: daya (HP) & rem per jadwal (port Traction.java)
//   "lk" jenis loko (preset) · "hp" daya · "bk" rem m/s² · "lt" berat loko (t) · "ct" berat per kereta (t) · "ton" berat total
//   Tanpa lk/hp: akselerasi lama (penumpang 2,1 / barang 1,05 km/j/s).
//   Rem tanpa bk: preset lk; penumpang 0,70 m/s², barang 0,35 m/s². Rem udara punya jeda 1–6 detik.
// =====================================================================
const Traction = {
  GAME_K: 1.085, MAX_ACCEL_MS2: 0.9, PASSENGER_CAR_TON: 40, FREIGHT_CAR_TON: 60,
  PASSENGER_BRAKE: 0.70, FREIGHT_BRAKE: 0.35, EMERGENCY_FACTOR: 1.8, LEGACY_BRAKE_KMH_S: 2.7,
  // id: [hp, berat loko (EMU/DMU: per kereta), rem m/s², multiple unit]
  PRESETS: {
    CC201: [1950, 84, 0.70, false], CC203: [2150, 90, 0.70, false], CC204: [2250, 90, 0.70, false],
    CC206: [2250, 90, 0.70, false], CC300: [2000, 90, 0.70, false], CC205: [3300, 132, 0.35, false],
    BB303: [1550, 52, 0.70, false], BB304: [1550, 56, 0.70, false], D301: [340, 28, 0.60, false],
    KRL: [270, 35, 1.00, true], KRD: [330, 40, 0.85, true],
  },
  preset(id) {
    if (id == null) return null;
    const k = String(id).trim().toUpperCase().replace(/ /g, '');
    const p = this.PRESETS[k];
    return p ? { id: k, hp: p[0], locoTon: p[1], brake: p[2], multiple: p[3] } : null;
  },
  // akselerasi (km/j per detik permainan)
  accelKmhS(hp, driveTon, trainTon, vKmh) {
    if (hp <= 0 || trainTon <= 0) return 0;
    const m = trainTon * 1000;
    const adhesion = Math.max(1, driveTon) * 1000 * 9.81 * 0.25;
    const power = hp * 745.7 * 0.82;
    const v = Math.max(1.5, vKmh / 3.6);
    const tractive = Math.min(adhesion, power / v);
    const resist = m * 9.81 * (0.0012 + 0.00000035 * vKmh * vKmh);
    let a = (tractive - resist) / (m * 1.06);
    a = Math.min(a, this.MAX_ACCEL_MS2);
    if (vKmh < 5) a = Math.max(a, 0.05);
    return Math.max(0, a * 3.6 * this.GAME_K);
  },
  brakeKmhS(ms2) { return ms2 <= 0 ? this.LEGACY_BRAKE_KMH_S : Math.max(1, ms2 * 3.6 * this.GAME_K); },
  brakeLagSec(multiple, freight, cars) {
    if (multiple) return 1.0;
    if (cars <= 0) return 1.5;
    return Math.min(6.0, 2.0 + (freight ? 0.08 : 0.03) * cars);
  },
};

// =====================================================================
//  Masinis
// =====================================================================
const BRAKE_KMH_PER_S = 2.7, MASINIS_TIME_SCALE = 2.0;
class Masinis {
  constructor() { this.reset(); }
  reset() { this.seenDistantId = null; this.seenDistantYellow = false; this.cautionMainId = null; }
  // kecepatan maks pada jarak distM agar mencapai targetKmh di titik tujuan (rem brake km/j/s)
  static curve(targetKmh, distM, brake = BRAKE_KMH_PER_S) {
    const a = Math.max(0.5, brake) / 3.6, vt = targetKmh / 3.6;
    return Math.sqrt(vt * vt + 2 * a * Math.max(0, distM) / MASINIS_TIME_SCALE) * 3.6;
  }
  // jarak (m) untuk turun dari vKmh ke targetKmh
  static stopDistM(vKmh, targetKmh, brake) {
    if (vKmh <= targetKmh) return 0;
    const a = Math.max(0.5, brake) / 3.6, v = vKmh / 3.6, vt = targetKmh / 3.6;
    return (v * v - vt * vt) / (2 * a) * MASINIS_TIME_SCALE;
  }
  advise(t, geo, limitKmh) {
    let allowed = limitKmh;
    if (!t || !geo) return allowed;
    const ahead = this.scanAhead(t, geo);
    let nextDistant = null, nextMain = null;
    for (const s of ahead) {
      if (s.type === 'DISTANT') { if (!nextDistant) nextDistant = s; }
      else { nextMain = s; break; }
    }
    if (this.seenDistantId != null && (nextDistant == null || !J.eqi(this.seenDistantId, nextDistant.id))) {
      if (this.seenDistantYellow && nextMain) this.cautionMainId = nextMain.id;
      this.seenDistantId = null; this.seenDistantYellow = false;
    }
    if (nextDistant) { this.seenDistantId = nextDistant.id; this.seenDistantYellow = !J.eqi(nextDistant.state, 'GREEN'); }
    if (this.cautionMainId != null) {
      const still = nextMain && J.eqi(this.cautionMainId, nextMain.id);
      if (!still || J.eqi(nextMain.state, 'GREEN')) this.cautionMainId = null;
      else allowed = Math.min(allowed, 40);
    }
    // masinis hafal lintas: jarak pandang minimal sejauh jarak pengereman kereta ini (+ jeda rem)
    const br = t.decel, lead = t.brakeLeadM();
    const sightMain = Math.max(300, Masinis.stopDistM(t.speed, 0, br) + lead + 60);
    const sightDistant = Math.max(900, Masinis.stopDistM(t.speed, 40, br) + lead + 100);
    if (nextDistant && this.seenDistantYellow && nextDistant.distM <= sightDistant) allowed = Math.min(allowed, Masinis.curve(40, Math.max(0, nextDistant.distM - lead), br));
    if (nextMain && nextMain.distM <= sightMain) {
      if (J.eqi(nextMain.state, 'RED')) {
        t.checkEmergency(nextMain.distM);
        const v = nextMain.distM <= 0.5 ? 0 : Math.max(4, Masinis.curve(0, Math.max(0, nextMain.distM - lead), br));
        allowed = Math.min(allowed, v);
      } else if (J.eqi(nextMain.state, 'YELLOW')) {
        const vt = nextMain.type === 'BLOCK' ? 60 : 25;
        allowed = Math.min(allowed, Masinis.curve(vt, Math.max(0, nextMain.distM - lead), br));
      }
    }
    return allowed;
  }
  scanAhead(t, geo) {
    const out = [];
    const path = t.path, down = t.mode !== 'REVERSE', cur = t.idx;
    let base = 0;
    for (let i = cur; i < path.length; i++) {
      const tid = path[i];
      const c = geo.c(tid);
      if (!c) break;
      const len = geo.meters(tid);
      if (i === cur) base = -t.prog * len;
      for (const s of geo.onTrack(tid)) {
        if (sigDown(s) !== down) continue;
        const type = sigType(s);
        if (type === 'REPEATER') continue;
        const distant = type === 'DISTANT';
        if (!distant && t.isStopPlatform(tid)) continue;
        if (!distant && t.isPermitted && t.isPermitted(J.str(s, 'id', ''))) continue;   // diizinkan lewat
        const prog = geo.sigProgress(s, tid, down);
        if (i === cur && t.prog > prog + 0.02) continue;
        const stop = distant ? prog : Math.min(0.82, prog - 0.03);
        out.push({ id: J.str(s, 'id', ''), type, state: J.str(s, 'state', 'RED'), distM: base + stop * len });
      }
      base += len;
      if (base > 2000) break;
    }
    out.sort((a, b) => a.distM - b.distM);
    return out;
  }
}

// =====================================================================
//  Bagian 2: Train (port Train.java)
// =====================================================================
const PASSENGER_CARS = 12, FREIGHT_CARS = 16;
const PERMIT_KMH = 15.0, SHUNT_KMH_T = 15.0;
const TAIL_MARGIN_M = 5.0, BUFFER_STOP_M = 2.0, PLATFORM_END_MARGIN_M = 1.0, SIGNAL_STOP_MARGIN_M = 2.0;

class Train {
  constructor(no, name, arr, dep, path, mode, target) {
    this.no = no; this.name = name; this.arr = arr || '--:--'; this.dep = dep || '--:--';
    this.path = path || []; this.mode = mode || 'NORMAL'; this.target = target;
    this.idx = 0; this.prog = 0; this.x = 0; this.y = 0;
    this.speed = 10; this.accel = 2.1; this.decel = Traction.LEGACY_BRAKE_KMH_S;
    // traksi dari jadwal (lihat Traction)
    this.powerHp = -1; this.locoTon = -1; this.carTon = -1; this.tonO = -1; this.mu = false; this.unitHp = -1; this.trId = '';
    this.brakeLevel = 0; this.emerg = false; this.horn = '';
    this.stationStop = target !== -1; this.dwell = false; this.waitDep = false; this.waitSig = false;
    this.finished = false; this.stopped = false; this.lastSim = ''; this.departedFlag = false; this.hasDeparted = false;
    this.turnback = false; this.exitTrack = -1; this.reversed = false;
    this.hasLoco = true; this.manual = false; this.manualDir = 0; this.manualKmh = 15; this.facingFwd = true; this.spad = null;
    this.masinis = new Masinis();
    this.locoM = 17; this.carM = 20; this.gapM = 1; this.freight = false; this.cars = PASSENGER_CARS;
    this.held = 0; this.arrivedFlag = false; this.arrPlat = -1; this.arrOver = 0; this.speedCap = 0; this.locoRear = false;
    this.scheduled = false; this.schedPlat = -1; this.terminate = false; this.ranOff = false;
    this.alt = new Set(); this.altFor = -2; this.altForNo = null; this.served = -1;
    this.passages = [];
    this.permitSig = null; this.permitUntil = -1; this.sightCap = -1;
    this.shuntPlan = null; this.shuntMove = 0; this.shuntStarted = false; this.shuntStopIdx = -1; this.shuntStopProg = 1;
    this.shuntCap = -1; this.shuntHold = false; this.shuntStatus = '';
    this.game = null;
  }
  // ---- getter singkat ----
  get curId() { return this.idx < this.path.length ? this.path[this.idx] : -1; }
  get nextId() { return this.idx + 1 < this.path.length ? this.path[this.idx + 1] : -1; }
  isDwelling() { return this.dwell || this.waitDep; }
  coachCount() { return this.hasLoco ? this.cars - 1 : this.cars; }
  log(time, text, color) { if (this.game) this.game.log(time, text, color); }

  setFreight(f) {
    this.freight = f; this.cars = f ? FREIGHT_CARS : PASSENGER_CARS; this.carM = f ? 15 : 20; this.accel = f ? 1.05 : 2.1;
    this.decel = Traction.brakeKmhS(f ? Traction.FREIGHT_BRAKE : Traction.PASSENGER_BRAKE);
  }
  // ---- traksi (HP & rem) ----
  setTraction(id, hp, brakeMs2, locoT, carT, tonTotal) {
    const sp = Traction.preset(id);
    this.trId = sp ? sp.id : (id ? String(id).trim().toUpperCase() : '');
    this.mu = !!(sp && sp.multiple);
    if (sp) { if (this.mu) { this.unitHp = sp.hp; this.carTon = sp.locoTon; this.locoTon = sp.locoTon; } else { this.powerHp = sp.hp; this.locoTon = sp.locoTon; } }
    if (hp > 0) { if (this.mu) this.unitHp = hp; else this.powerHp = hp; }
    if (locoT > 0) this.locoTon = locoT;
    if (carT > 0) this.carTon = carT;
    if (tonTotal > 0) this.tonO = tonTotal;
    if (this.mu) this.powerHp = Math.max(1, this.unitHp) * Math.max(1, this.cars);
    let brake = brakeMs2;
    if (!(brake > 0)) {
      brake = sp ? sp.brake : (this.freight ? Traction.FREIGHT_BRAKE : Traction.PASSENGER_BRAKE);
      if (this.freight && !this.mu) brake = Math.min(brake, Traction.FREIGHT_BRAKE);
    }
    this.decel = Traction.brakeKmhS(brake);
  }
  hasTraction() { return this.powerHp > 0; }
  trainTon() {
    if (this.tonO > 0 && this.hasLoco) return this.tonO;
    const car = this.carTon > 0 ? this.carTon : (this.freight ? Traction.FREIGHT_CAR_TON : Traction.PASSENGER_CAR_TON);
    const loco = this.locoTon > 0 ? this.locoTon : 90;
    return this.hasLoco ? loco + this.coachCount() * car : this.coachCount() * car;
  }
  accelNow() {
    if (this.powerHp <= 0 || !this.hasLoco) return this.accel * Math.max(0.35, 1 - this.speed / 150);
    const ton = this.trainTon();
    const drive = this.mu ? ton * 0.5 : (this.locoTon > 0 ? this.locoTon : 90);
    return Traction.accelKmhS(this.powerHp, drive, ton, this.speed);
  }
  tractionLabel() {
    if (this.powerHp <= 0) return '';
    return (this.trId ? this.trId + ' · ' : '') + Math.round(this.powerHp) + ' HP · ' + Math.round(this.trainTon()) + ' t · rem '
      + (this.decel / 3.6 / Traction.GAME_K).toFixed(2) + ' m/s²';
  }
  // jeda rem udara (detik)
  brakeLagSec() { return Traction.brakeLagSec(this.mu, this.freight, this.hasLoco ? this.coachCount() : Math.max(1, this.coachCount())); }
  // jarak (satuan Masinis.curve) yang terpakai sebelum rem bekerja penuh
  brakeLeadM() { return (this.speed / 3.6) * 2 * this.brakeLagSec() * (1 - this.brakeLevel) * 0.5; }
  applyBrake(dt) {
    const lag = this.brakeLagSec() * (this.emerg ? 0.6 : 1);
    this.brakeLevel = Math.min(1, this.brakeLevel + (lag > 0 ? dt / lag : 1));
    return this.decel * Math.max(0.15, this.brakeLevel) * (this.emerg ? Traction.EMERGENCY_FACTOR : 1);
  }
  releaseBrake(dt) { this.brakeLevel = Math.max(0, this.brakeLevel - dt / 1.5); this.emerg = false; }
  // rem darurat bila rem layanan tidak cukup untuk berhenti dalam distM
  checkEmergency(distM) {
    if (this.speed < 8) { this.emerg = false; return; }
    if (Masinis.stopDistM(this.speed, 0, this.decel) + this.brakeLeadM() > distM * 1.05) this.emerg = true;
  }
  setCarCount(n) { if (n >= 0) this.cars = n + 1; }
  setLengths(loco, car, gap) { if (loco > 0) this.locoM = loco; if (car > 0) this.carM = car; if (gap >= 0) this.gapM = gap; }
  markScheduled() { this.scheduled = true; this.schedPlat = this.target; }
  setTurnback(tb, exit) { this.turnback = tb; this.exitTrack = exit; }

  consumeArrived() { const a = this.arrivedFlag; this.arrivedFlag = false; return a; }
  consumeDeparted() { const d = this.departedFlag; this.departedFlag = false; return d; }
  consumeRanOff() { const r = this.ranOff; this.ranOff = false; return r; }
  consumeSpad() { const s = this.spad; this.spad = null; return s; }

  isLocoIndex(i) { return this.hasLoco && (this.locoRear ? i === this.cars - 1 : i === 0); }
  vehLen(i) { return this.isLocoIndex(i) ? this.locoM : this.carM; }
  centerBack(i) { let d = 0; for (let k = 0; k < i; k++) d += this.vehLen(k) + this.gapM; return d + this.vehLen(i) / 2; }
  totalLen() { let d = 0; for (let k = 0; k < this.cars; k++) d += this.vehLen(k); return d + Math.max(0, this.cars - 1) * this.gapM; }

  // ---- peron ----
  notePlatformEntry(geo, tid) {
    if (tid <= 0 || !geo.platform(tid)) return;
    this.passages.push({ trackId: tid, time: (this.lastSim || '--:--').substring(0, 5), stopped: false });
  }
  notePlatformStop(tid) {
    for (let i = this.passages.length - 1; i >= 0; i--) if (this.passages[i].trackId === tid) { this.passages[i].stopped = true; return; }
    this.passages.push({ trackId: tid, time: (this.lastSim || '--:--').substring(0, 5), stopped: true });
  }
  resolveStopPlatforms(geo) {
    this.alt.clear();
    if (this.target <= 0) return;
    const listed = SN.allowedPlatforms(this.no);
    if (listed.length > 1 && listed.includes(this.target)) { listed.forEach(x => this.alt.add(x)); return; }
    const tp = geo.platform(this.target);
    if (!tp) return;
    const st = J.str(tp, 'station', '');
    for (const p of (J.arr(geo.data, 'platforms') || [])) {
      if (!p || !J.eqi(st, J.str(p, 'station', ''))) continue;
      const tid = J.int(p, 'onTrack', -1);
      if (tid > 0) this.alt.add(tid);
    }
  }
  isStopPlatform(tid) {
    if (!this.stationStop || tid <= 0 || tid === this.served) return false;
    if (this.shuntPlan && tid !== this.shuntPlan.target) return false;   // langsir: hanya peron tujuan
    if (tid === this.target) return true;
    if (!this.alt.has(tid)) return false;
    const xi = this.path.indexOf(tid), ti = this.path.indexOf(this.target);
    return !(ti > xi);
  }
  markArrival(geo, tid) {
    const len = geo.meters(tid);
    this.arrPlat = tid;
    this.arrOver = Math.max(0, this.totalLen() - this.prog * len);
    this.arrivedFlag = true;
    this.notePlatformStop(tid);
  }

  makeRake(coaches) {
    this.hasLoco = false; this.locoRear = false; this.cars = Math.max(1, coaches);
    this.manual = false; this.manualDir = 0; this.target = -1; this.stationStop = false;
    this.dwell = false; this.waitDep = false; this.speed = 0; this.stopped = true;
  }
  placeStandby(path, head) { this.path = path.slice(); this.idx = this.path.length - 1; this.prog = Math.max(0, Math.min(1, head)); this.speed = 0; this.stopped = true; }
  placeStandbyOnTrack(geo, path, head, stopTrack) {
    this.path = path.slice(); this.idx = this.path.length - 1; this.prog = Math.max(0, Math.min(1, head));
    this.target = stopTrack; this.speed = 0; this.stationStop = true; this.dwell = true;
    if (geo.platform(stopTrack)) this.markArrival(geo, stopTrack);
  }
  startAtLineSpeed(geo, limit) {
    let v = limit > 0 ? limit : 30;
    if (geo) v = Math.min(v, this.masinis.advise(this, geo, Math.round(v)));
    this.speed = Math.max(0, v);
  }
  crashStop() { this.speed = 0; this.stopped = true; this.manual = false; this.manualDir = 0; }

  appendExitPath(tracks) {
    if (this.manual || this.stopped) return;
    if (this.shuntPlan) return;   // langsir: jalur ditentukan rencana langsir
    let added = 0;
    for (const id of tracks) if (!this.path.includes(id)) { this.path.push(id); added++; }
    this.waitDep = false;
    // Java selalu menambah 0.01; di sini hanya bila jalur benar-benar bertambah,
    // agar kereta yang menunggu tidak "merayap" melewati ujung track (progress > 1)
    if (added > 0) this.prog = Math.min(1, this.prog + 0.01);
  }
  nextSignalObject(geo) {
    const cur = this.curId;
    if (cur === -1) return null;
    const down = this.mode === 'NORMAL';
    for (const s of geo.onTrack(cur)) {
      if (sigType(s) === 'DISTANT') continue;
      if (sigDown(s) !== down) continue;
      if (this.prog > geo.sigProgress(s, cur, this.mode !== 'REVERSE') + 0.02) continue;
      return s;
    }
    return null;
  }
  nextSignalAspect(geo) {
    const cur = this.curId;
    if (cur === -1) return 'GREEN';
    const down = this.mode === 'NORMAL';
    for (const s of geo.onTrack(cur)) {
      const t = sigType(s);
      if (t === 'DISTANT' || t === 'REPEATER') continue;
      if (sigDown(s) !== down) continue;
      if (this.prog > geo.sigProgress(s, cur, this.mode !== 'REVERSE') + 0.02) continue;
      return J.str(s, 'state', 'RED');
    }
    return 'GREEN';
  }
  platformStopProgress(geo, tid, up) {
    const p = geo.platform(tid), c = geo.c(tid);
    if (!p || !c || Math.abs(c[3] - c[1]) < 1e-6) return -1;
    const edgeY = up ? J.num(p, 'topY') : J.num(p, 'botY');
    const pf = (edgeY - c[1]) / (c[3] - c[1]);
    const flip = this.mode === 'REVERSE' && c[1] < c[3];
    const prog = (flip ? 1 - pf : pf) - PLATFORM_END_MARGIN_M / geo.meters(tid);
    return Math.max(0.05, Math.min(0.99, prog));
  }
  signalStopLimit(geo, tid, from) {
    let lim = 1.0;
    const len = geo.meters(tid);
    const down = this.mode === 'NORMAL';
    for (const s of geo.onTrack(tid)) {
      const t = sigType(s);
      if (t === 'DISTANT' || t === 'REPEATER') continue;
      if (sigDown(s) !== down) continue;
      const sp = geo.sigProgress(s, tid, this.mode !== 'REVERSE');
      if (sp < 0.25 || sp + 0.02 < from) continue;
      lim = Math.min(lim, sp - SIGNAL_STOP_MARGIN_M / len);

    return lim;
  }
  placeAtPlatform(geo, tid, pb) {
    if (tid <= 0) return false;
    const up = this.mode === 'REVERSE';
    const len = geo.meters(tid);
    const sigLimit = this.signalStopLimit(geo, tid, 0);
    let stop = this.platformStopProgress(geo, tid, up);
    const path = [];
    if (stop >= 0) {
      stop = Math.min(stop, sigLimit);
      const missing = this.totalLen() + TAIL_MARGIN_M - stop * len;
      if (missing > 0 && pb) path.push(...pb.backPath(tid, !up, missing));
    } else {
      stop = up ? 0.75 : 0.25;
      const minHead = (this.totalLen() + TAIL_MARGIN_M) / len;
      if (stop < minHead) stop = minHead;
      stop = Math.min(stop, Math.min(0.80, sigLimit));
    }
    stop = Math.max(0.02, stop);
    path.push(tid);
    this.path = path; this.target = tid; this.idx = path.length - 1; this.prog = stop;
    this.speed = 0; this.stationStop = true; this.dwell = true;
    this.markArrival(geo, tid);
    return true;
  }

  // ---- izin lewat sinyal merah & langsir otomatis ----
  clearPermit() { this.permitSig = null; this.permitUntil = -1; this.sightCap = -1; }
  hasPermit() { return this.permitSig != null; }
  isPermitted(id) { return this.permitSig != null && id != null && J.eqi(this.permitSig, id); }
  // Izin melewati sinyal sigId (di track sigTrack: track sekarang/berikut). ext = track tambahan jalur.
  grantPermit(sigId, sigTrack, ext) {
    let extended = false;
    for (const id of (ext || [])) if (!this.path.includes(id)) { this.path.push(id); extended = true; }
    let sigIdx = this.idx;
    for (let i = this.idx; i < this.path.length; i++) if (this.path[i] === sigTrack) { sigIdx = i; break; }
    this.permitSig = sigId;
    this.permitUntil = extended ? Math.max(sigIdx + 1, this.path.length - 1) : sigIdx + 1;
    this.waitSig = false; this.masinis.reset();
  }
  isShunting() { return this.shuntPlan != null; }
  shuntTarget() { return this.shuntPlan ? this.shuntPlan.target : -1; }
  startShunt(plan) {
    this.shuntPlan = plan; this.shuntMove = 0; this.shuntStarted = false; this.shuntStopIdx = -1;
    this.shuntHold = false; this.shuntCap = 0; this.shuntStatus = 'Langsir ke T' + plan.target;
    this.clearPermit(); this.waitSig = false;
  }
  endShunt() { this.shuntPlan = null; this.shuntStarted = false; this.shuntStopIdx = -1; this.shuntHold = false; this.shuntCap = -1; this.shuntStatus = ''; }
  holdShunt(status) { this.shuntHold = true; this.shuntCap = 0; this.shuntStatus = status; }
  nextShuntMove() { this.shuntMove++; this.shuntStarted = false; this.shuntStopIdx = -1; }
  applyShuntMove(moveTracks, stopIdxInMove, stopProg) {
    this.path.length = this.idx + 1;
    for (let i = 1; i < moveTracks.length; i++) this.path.push(moveTracks[i]);
    this.shuntStopIdx = stopIdxInMove < 0 ? -1 : this.idx + stopIdxInMove;
    this.shuntStopProg = stopProg; this.shuntStarted = true; this.waitDep = false; this.masinis.reset();
  }
  // Sinyal utama searah terdekat di track sekarang yang belum dilewati (tanpa DISTANT/REPEATER)
  nextMainSignal(geo) {
    const cur = this.curId;
    if (cur === -1) return null;
    const down = this.mode === 'NORMAL';
    for (const s of geo.onTrack(cur)) {
      const t = sigType(s);
      if (t === 'DISTANT' || t === 'REPEATER') continue;
      if (sigDown(s) !== down) continue;
      if (this.prog > geo.sigProgress(s, cur, this.mode !== 'REVERSE') + 0.02) continue;
      return s;
    }
    return null;
  }
  // Sinyal utama searah pertama di track lain (dari awal track, arah gerak)
  firstMainSignalOn(geo, tid) {
    const down = this.mode === 'NORMAL';
    let best = null, bp = Infinity;
    for (const s of geo.onTrack(tid)) {
      const t = sigType(s);
      if (t === 'DISTANT' || t === 'REPEATER') continue;
      if (sigDown(s) !== down) continue;
      const p = geo.sigProgress(s, tid, this.mode !== 'REVERSE');
      if (p < bp) { bp = p; best = s; }
    }
    return best;
  }

  // ---- gerak otomatis ----
  advanceProgress(trackLength, limit, dt, nextOccupied, geo, simTime) {
    if (this.finished || this.stopped) return;
    this.lastSim = simTime;
    if (this.altFor !== this.target || String(this.no) !== this.altForNo) {
      this.resolveStopPlatforms(geo); this.altFor = this.target; this.altForNo = String(this.no);
    }
    if (this.permitSig != null && this.idx >= this.permitUntil) this.clearPermit();
    const mainSig = this.nextMainSignal(geo);
    let aspect = mainSig ? J.str(mainSig, 'state', 'RED') : 'GREEN';
    if (this.permitSig != null && mainSig && J.eqi(aspect, 'RED') && this.isPermitted(J.str(mainSig, 'id', ''))) aspect = 'YELLOW';
    const pathEndsHere = this.nextId === -1 && !geo.isEnd(this.curId);
    const sigRed = J.eqi(aspect, 'RED');
    const approachingRed = sigRed || pathEndsHere;
    // titik berhenti = posisi tiang sinyal sebenarnya (maks 0.82)
    let redStop = 0.82;
    if (sigRed && mainSig) redStop = Math.max(0, Math.min(0.82, geo.sigProgress(mainSig, this.curId, this.mode !== 'REVERSE') - 0.03));
    const holdStop = approachingRed ? redStop : 0.82;
    const shuntStopHere = this.shuntPlan != null && this.shuntStopIdx >= 0 && this.idx === this.shuntStopIdx;
    const atPlatformStop = this.isStopPlatform(this.curId) && !geo.isEnd(this.curId);
    if (atPlatformStop) this.waitSig = false;
    else if (approachingRed || (nextOccupied && this.shuntPlan == null)) {
      if (this.prog >= Math.min(0.65, holdStop - 0.17)) {
        this.waitSig = true;
        const lenM = trackLength > 0 ? trackLength : 50;
        const distM = Math.max(0, (holdStop - this.prog) * lenM);
        this.checkEmergency(distM);
        const bt = Math.min(limit, Math.max(3, Masinis.curve(0, Math.max(0, distM - this.brakeLeadM()), this.decel)));
        if (this.speed > bt) { this.speed -= this.applyBrake(dt) * 1.5 * dt; if (this.speed < bt) this.speed = bt; }
        if (this.prog >= holdStop || this.speed <= 0.5) { this.speed = 0; return; }
      }
    } else if (J.eqi(aspect, 'YELLOW')) { this.waitSig = false; limit = Math.min(limit, 25); }
    else this.waitSig = false;

    if (this.dwell || this.waitDep) {
      this.speed = 0;
      if (isTimeReached(simTime, this.dep)) {
        if (J.eqi(aspect, 'GREEN') || J.eqi(aspect, 'YELLOW')) {
          this.dwell = false; this.waitDep = false; this.departedFlag = true; this.hasDeparted = true; this.stationStop = false;
        } else { this.waitDep = true; return; }
      } else return;
    }
    if (trackLength <= 0) trackLength = 50;
    if (limit <= 0) limit = 30;
    const cur = this.curId;
    let eff = limit;
    if (this.isStopPlatform(cur) && !geo.isEnd(cur)) {
      const up = this.mode === 'REVERSE';
      const tl = geo.meters(cur);
      const sigLimit = this.signalStopLimit(geo, cur, this.prog);
      const pStop = this.platformStopProgress(geo, cur, up);
      let stopPoint, overshoot = false;
      if (pStop >= 0) stopPoint = Math.min(pStop, sigLimit);
      else {
        stopPoint = up ? 0.75 : 0.25;
        const tailMargin = (this.turnback && !this.reversed) ? 0.18 : TAIL_MARGIN_M / tl;
        const minHead = this.totalLen() / tl + tailMargin;
        if (stopPoint < minHead) { stopPoint = minHead; overshoot = true; }
        stopPoint = Math.min(stopPoint, Math.min(0.80, sigLimit));
      }
      stopPoint = Math.max(0.02, stopPoint);
      if (this.prog < stopPoint && !this.dwell) {
        const distM = (stopPoint - this.prog) * tl;
        eff = Math.min(eff, 30);
        eff = Math.min(eff, Math.max(4, Masinis.curve(0, Math.max(0, distM - this.brakeLeadM()), this.decel)));
      }
      if (this.prog >= stopPoint) {
        this.prog = stopPoint; this.speed = 0;
        if (!this.dwell) {
          this.dwell = true;
          this.markArrival(geo, cur);
          this.log(simTime, `[${this.no} ${this.name}] Tiba di ${geo.platLabel(cur)}` + (overshoot ? ' (melewati ujung peron agar rangkaian masuk)' : ''), 'yellow');
          if (this.game) this.game.onArrived(this, cur);
        }
        return;
      }
    }
    eff = Math.min(eff, this.masinis.advise(this, geo, limit));
    if (this.speedCap > 0) eff = Math.min(eff, this.speedCap);
    if (this.permitSig != null) { eff = Math.min(eff, PERMIT_KMH); if (this.sightCap >= 0) eff = Math.min(eff, this.sightCap); }
    if (this.shuntPlan != null) { eff = Math.min(eff, SHUNT_KMH_T); if (this.shuntCap >= 0) eff = Math.min(eff, this.shuntCap); }
    if (this.speed < eff) {
      this.releaseBrake(dt);
      this.speed += this.accelNow() * dt; if (this.speed > eff) this.speed = eff;
    } else if (this.speed > eff + 0.3) {

      if (this.speed > eff) this.speed = eff;

      this.prog = before < redStop ? redStop : before;

      return;
    }
    if (shuntStopHere && this.prog >= this.shuntStopProg) {
