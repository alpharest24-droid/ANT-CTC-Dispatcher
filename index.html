<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<title>ANT Dispatcher CTC</title>
<style>
:root{
  --bg:#0b1016; --panel:#121a23; --panel2:#18222e; --line:#263445; --text:#d7e1ea; --muted:#8193a5;
  --accent:#00e5ff; --green:#2ee66b; --yellow:#ffd23f; --red:#ff4d4d; --orange:#ff7711; --pink:#e49199;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 var(--sans);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:#3a4d63}
button:active{transform:translateY(1px)}
button.on{background:#0f3a44;border-color:var(--accent);color:#fff}
button.danger{background:#3a1416;border-color:#7a2a2e}
button.primary{background:#0d4a3a;border-color:#1f9c74;color:#eafff6}
button:disabled{opacity:.4;cursor:default}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
#app>*{min-width:0}
/* ---- bar atas ---- */
#top{display:flex;align-items:center;gap:8px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);min-height:46px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#mapName{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28vw;color:var(--muted)}
#clock{font:600 22px/1 var(--mono);color:#fff;letter-spacing:1px;padding:4px 10px;background:#05080c;border:1px solid var(--line);border-radius:6px;min-width:112px;text-align:center}
#clock.paused{color:var(--yellow)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;padding:6px 9px;background:var(--panel2);font-weight:600;font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:#0f3a44;color:var(--accent)}
#score{font:600 14px var(--mono);white-space:nowrap;color:var(--green)}
.spacer{flex:1}
.ico{width:34px;height:34px;padding:0;display:grid;place-items:center;flex:none}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---- kanvas ---- */
#stage{position:relative;overflow:hidden;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
#hud{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;background:rgba(18,26,35,.85);border:1px solid var(--line);border-radius:14px;padding:3px 9px;font-size:11px;color:var(--muted);backdrop-filter:blur(4px)}
.chip b{color:var(--text)}
.chip.alert{border-color:var(--red);color:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#5a1418}}
#zoomBtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#zoomBtns button{width:36px;height:36px;padding:0;font-size:18px;background:rgba(24,34,46,.9)}
/* ---- panel kontrol manual ---- */
#manual{position:absolute;left:8px;right:8px;margin:0 auto;bottom:10px;background:rgba(18,26,35,.95);border:1px solid var(--accent);border-radius:10px;padding:8px;display:none;gap:6px;flex-direction:column;align-items:stretch;max-width:520px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#manual.show{display:flex}
#manual .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#manual .row button{flex:1;min-width:54px;font-weight:600;font-size:12px}
#manualInfo{display:flex;justify-content:space-between;gap:8px;font:12px var(--mono);color:var(--muted)}
#manualInfo b{color:#fff}
/* ---- panel bawah ---- */
#panel{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;height:34vh;min-height:44px;transition:height .2s;padding-bottom:env(safe-area-inset-bottom)}
#panel.min{height:44px}
#tabs{display:flex;gap:4px;padding:5px 6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap}
#tabs .grow{flex:1}
#tabBody{flex:1;overflow:auto;min-height:0;padding:6px 8px}
@media (max-width:640px){
  #mapName{display:none}
  #clock{font-size:17px;min-width:92px;padding:4px 6px}
  .seg button{padding:6px 7px;font-size:11px}
  #btnEnd .long{display:none}
  #btnEnd{padding:6px 8px;font-size:11px}
  #score{font-size:12px}
  #top{gap:5px}
}
@media (min-width:1000px){
  #app{grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:auto minmax(0,1fr)}
  #top{grid-column:1/3}
  #panel{grid-row:2;grid-column:2;height:auto!important;border-top:0;border-left:1px solid var(--line)}
  #panelToggle{display:none}
}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 6px;border-bottom:1px solid #1d2835;text-align:left;white-space:nowrap}
th{position:sticky;top:-6px;background:var(--panel);color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;z-index:1}
tr.click{cursor:pointer}
tr.click:hover td{background:#16212c}
td.mono,.mono{font-family:var(--mono)}
.st-run{color:var(--green)} .st-wait{color:var(--yellow)} .st-held{color:var(--red)} .st-done{color:var(--muted)} .st-plat{color:var(--accent)}
.log{font:12px/1.45 var(--mono)}
.log div{padding:1px 0;border-bottom:1px dashed #18222d}
.log .t{color:var(--muted);margin-right:6px}
.c-red{color:#ff6b6b}.c-green{color:#4cec86}.c-yellow{color:#ffd84d}.c-cyan{color:#38e8ff}.c-white{color:#dfe8f0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.ind{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;background:var(--panel2)}
.ind .code{font:700 15px var(--mono)}
.ind .n{font:600 22px var(--mono);color:var(--muted)}
.ind.held .n{color:var(--yellow)}
.ind.alert{border-color:var(--red);animation:blink 1s steps(2) infinite}
.lamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.lamp{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.lamp i{width:14px;height:14px;border-radius:50%;background:#2a3542;box-shadow:inset 0 0 0 1px #000}
.lamp.ok i{background:var(--green);box-shadow:0 0 8px var(--green)}
.lamp.warn i{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.lamp.bad i{background:var(--red);box-shadow:0 0 8px var(--red)}
.bar{height:12px;border-radius:6px;background:#0a0f14;border:1px solid var(--line);overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,#1f9c74,#2ee66b)}
.muted{color:var(--muted)}
h4{margin:10px 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
/* ---- dialog ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;max-height:calc(100% - 24px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg header{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.dlg .body{padding:12px 14px;overflow:auto;white-space:pre-wrap}
.dlg .body.html{white-space:normal}
.dlg footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg.warn{border-color:var(--orange)}
.dlg input[type=password],.dlg input[type=text]{width:100%;padding:9px;border-radius:6px;border:1px solid var(--line);background:#0a0f14;color:var(--text);font:inherit}
#toast{position:fixed;left:50%;bottom:calc(34vh + 14px);transform:translateX(-50%);background:#222e3b;color:#fff;padding:8px 14px;border-radius:18px;border:1px solid #3a4b5e;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (min-width:1000px){#toast{bottom:20px}}
/* ---- layar awal ---- */
#start{position:fixed;inset:0;z-index:40;background:radial-gradient(1200px 600px at 30% 20%,#13243a 0,#0b1016 60%);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#start .card{max-width:520px;width:100%;background:rgba(18,26,35,.92);border:1px solid var(--line);border-radius:14px;padding:20px}
#start h1{margin:0 0 4px;font-size:22px;letter-spacing:.5px}
#start h1 span{color:var(--accent)}
#start p{color:var(--muted);margin:0 0 14px}
#start .btns{display:flex;flex-direction:column;gap:8px}
#start .btns button{padding:12px;font-size:14px;text-align:left}
#saves{margin-top:12px;display:flex;flex-direction:column;gap:6px}
#saves .sv{display:flex;gap:6px;align-items:center}
#saves .sv button:first-child{flex:1;text-align:left}
.drop{outline:2px dashed var(--accent);outline-offset:-10px}
.menu{position:fixed;z-index:55;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;min-width:230px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.menu button{border:0;background:transparent;text-align:left;padding:9px 10px}
.menu button:hover{background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.kv span:nth-child(odd){color:var(--muted)}
.badge{display:inline-block;padding:1px 6px;border-radius:9px;font-size:11px;border:1px solid var(--line)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ico" id="btnMenu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div id="mapName">ANT Dispatcher CTC</div>
    <div id="clock">--:--:--</div>

      <button data-s="0">JEDA</button><button data-s="1">1X</button><button data-s="2">2X</button><button data-s="4">4X</button><button data-s="8">8X</button>
    </div>
    <div id="score">0</div>
    <div class="spacer"></div>
    <button id="btnEnd" class="danger" style="white-space:nowrap" title="Selesaikan dinas">🏁 <span class="long">SELESAIKAN DINAS</span></button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="zoomBtns"><button id="zIn">+</button><button id="zOut">−</button><button id="zFit" title="Tampilkan semua">⤢</button></div>

      <div class="row"><button data-m="5" id="mCtx">LEPAS</button><button data-m="6" id="mAuto">OTOMATIS</button><button data-m="9">TUTUP</button></div>

  </div>
  <div id="panel">
    <div id="tabs">
      <button data-t="jadwal" class="on">Jadwal</button><button data-t="log">Log</button><button data-t="ind">Indikator</button><button data-t="power">Catudaya</button><button data-t="skor">Skor</button><button data-t="bantuan">Bantuan</button>
      <span class="grow"></span><button id="panelToggle" class="ico" title="Ciutkan">▾</button>
    </div>
    <div id="tabBody"></div>
  </div>
</div>
<div id="toast"></div>
<div id="start">
  <div class="card">
    <h1>ANT <span>Dispatcher</span> CTC</h1>
    <p>Versi HTML · simulasi pengaturan perjalanan kereta. Buka peta <b>.antd</b> / <b>.json</b> dan jadwal <b>.ants</b> (boleh sekaligus).</p>
    <div class="btns">
      <button id="sOpen" class="primary">📂 Buka berkas peta / jadwal…</button>
      <button id="sSample">🚆 Main peta contoh: DAOP 1 THB–JNG</button>
    </div>
    <div id="saves"></div>
    <p style="margin-top:14px;font-size:12px">Tips: seret berkas ke jendela ini. Berkas .antd/.ants terenkripsi akan meminta secret bila diperlukan.</p>
  </div>
</div>

// ---------- Perilaku opt*() org.json ----------
const J = {
  has(o, k) { return o != null && typeof o === 'object' && Object.prototype.hasOwnProperty.call(o, k) && o[k] !== undefined && o[k] !== null; },
  int(o, k, d = -1) {
    if (o == null) return d;
    const v = o[k];
    if (typeof v === 'number') return Number.isFinite(v) ? Math.trunc(v) : d;
    if (typeof v === 'string') { const s = v.trim(); if (s === '') return d; const n = Number(s); return Number.isFinite(n) ? Math.trunc(n) : d; }
    return d;
  },
  num(o, k, d = NaN) {
    if (o == null) return d;
    const v = o[k];
    if (typeof v === 'number') return v;
    if (typeof v === 'string') { const s = v.trim(); if (s === '') return d; const n = Number(s); return Number.isNaN(n) ? d : n; }
    return d;
  },
  str(o, k, d = '') {
    if (o == null) return d;
    const v = o[k];
    if (v === undefined || v === null) return d;
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  },
  bool(o, k, d = false) {
    if (o == null) return d;
    const v = o[k];
    if (typeof v === 'boolean') return v;
    if (typeof v === 'string') { const s = v.toLowerCase(); if (s === 'true') return true; if (s === 'false') return false; }
    return d;
  },
  arr(o, k) { const v = o ? o[k] : null; return Array.isArray(v) ? v : null; },
  eqi(a, b) { return a != null && b != null && String(a).toUpperCase() === String(b).toUpperCase(); },
};

function toHHmm(raw) {
  if (raw == null) return '';
  raw = String(raw).trim();
  if (raw === '' || raw.includes(':')) return raw;
  while (raw.length < 4) raw = '0' + raw;
  return raw.substring(0, 2) + ':' + raw.substring(2, 4);
}

// ScoreManager.parseTimeToSeconds (0 bila gagal)
function parseSec(t) {
  if (t == null) return 0;
  const p = String(t).split(':');
  if (p.length < 2) return 0;
  const a = parseInt(p[0], 10), b = parseInt(p[1], 10);
  if (!/^-?\d+$/.test(p[0].trim()) || !/^-?\d+$/.test(p[1].trim())) return 0;
  let s = a * 3600 + b * 60;
  if (p.length > 2) { const c = parseInt(p[2], 10); if (Number.isNaN(c)) return 0; s += c; }
  return s;
}

// SimulationClock.calculateTimeDiffInSeconds (-999 bila gagal)
function timeDiff(cur, tar) {
  if (cur == null || tar == null) return -999;
  const a = String(cur).split(':'), b = String(tar).split(':');
  if (a.length < 2 || b.length < 2) return -999;
  const ok = x => /^\s*-?\d+\s*$/.test(x);
  if (!ok(a[0]) || !ok(a[1]) || !ok(b[0]) || !ok(b[1])) return -999;
  let cs = parseInt(a[0], 10) * 3600 + parseInt(a[1], 10) * 60;
  if (a.length > 2) { if (!ok(a[2])) return -999; cs += parseInt(a[2], 10); }
  let ts = parseInt(b[0], 10) * 3600 + parseInt(b[1], 10) * 60;
  if (b.length > 2) { if (!ok(b[2])) return -999; ts += parseInt(b[2], 10); }
  return ts - cs;
}

function isTimeReached(cur, tar) {
  if (cur == null || tar == null || tar === '--:--') return true;
  const d = timeDiff(cur, tar.length > 5 ? tar.substring(0, 5) : tar);
  if (d === -999) return true;
  return d <= 0;
}

function fmtTime(sec, withSec) {
  sec = ((Math.floor(sec) % 86400) + 86400) % 86400;
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return withSec ? `${p(h)}:${p(m)}:${p(s)}` : `${p(h)}:${p(m)}`;
}

      const ci = (f, t) => { if (J.has(s, f) && !J.has(s, t)) s[t] = J.int(s, f, -1); };
      const cd = (f, t) => { if (J.has(s, f) && !J.has(s, t)) s[t] = J.num(s, f, 0); };
      const cs = (f, t) => { if (J.has(s, f) && !J.has(s, t)) s[t] = J.str(s, f, ''); };
      const cb = (f, t) => { if (J.has(s, f) && !J.has(s, t)) s[t] = J.bool(s, f, false); };
      const ct = (f, t) => { if (J.has(s, f) && !J.has(s, t)) s[t] = toHHmm(J.str(s, f, '')); };
      ci('nc', 'cars'); cd('ll', 'loco_length'); cd('cl', 'car_length'); cd('cg', 'car_gap');
      cs('no', 'train_number'); cs('n', 'train_name'); cs('t', 'type'); cs('m', 'mode');
      ci('sT', 'entry_track');
      // tT: angka atau array
      let list = null;
      const lv = s.target_platform, sv = s.tT;
      if (Array.isArray(lv)) list = lv; else if (lv == null && Array.isArray(sv)) list = sv;
      if (list) {
        const clean = [];
        for (let k = 0; k < list.length; k++) { const v = J.int(list, k, -1); if (v > 0) clean.push(v); }
        s.target_platform = clean.length ? clean[0] : -1;
        s.target_platforms = clean;
      } else ci('tT', 'target_platform');
      ci('xT', 'exit_track');
      ct('sW', 'spawn_time'); ct('aT', 'arr_time'); ct('dT', 'dep_time');
      cb('tb', 'turnback'); cb('sb', 'start_at_platform'); cb('fin', 'terminate');
      if (!J.has(s, 'is_through') && J.eqi(J.str(s, 'type', ''), 'LANGSUNG')) s.is_through = true;
      const pl = this.platformsOf(s);
      const no = J.str(s, 'train_number', '');
      if (pl.length > 1 && no) this.allowed.set(no.toUpperCase(), pl);
    }
  },
  expandLegs(data) {
    const arr = J.arr(data, 'schedules');
    if (!arr) return;
    const out = [];
    for (const base of arr) {
      if (!base || typeof base !== 'object') continue;
      const legs = J.arr(base, 'legs');
      if (!legs || legs.length === 0) { out.push(base); continue; }
      const baseNo = J.str(base, 'no', J.str(base, 'train_number', 'KA'));
      const n = legs.length;
      const nums = [];
      for (let k = 0; k < n; k++) {
        const lg = legs[k];
        const own = lg ? J.str(lg, 'no', '') : '';
        nums[k] = own ? own : (k === 0 ? baseNo : baseNo + ' (' + (k + 1) + ')');
      }
      let prevDep = '';
      for (let k = 0; k < n; k++) {
        const lg = legs[k];
        const s = JSON.parse(JSON.stringify(base));
        delete s.legs; delete s.train_number;
        if (k < n - 1) { delete s.fin; delete s.terminate; }
        if (k > 0) {
          for (const key of ['sT', 'sW', 'sb', 'entry_track', 'spawn_time', 'start_at_platform']) delete s[key];
          s.is_leg = true;
          s.leg_spawn = prevDep;
        }
        if (k < n - 1) {
          delete s.xT; delete s.exit_track;
          s.partial = true;
          s.next_leg = nums[k + 1];
        }
        if (lg && typeof lg === 'object') {
          for (const p of this.PAIRS) if (J.has(lg, p[0])) delete s[p[1]];
          if (J.has(lg, 'tT') || J.has(lg, 'target_platform')) delete s.target_platforms;
          for (const key of Object.keys(lg)) s[key] = JSON.parse(JSON.stringify(lg[key]));
        }
        s.no = nums[k];
        prevDep = toHHmm(J.str(s, 'dT', ''));
        out.push(s);
      }
    }
    data.schedules = out;
  },
};

// =====================================================================
//  SpawnTrackBuilder
// =====================================================================
const SpawnTrackBuilder = {
  TOL: 0.002,
  ensure(data) {
    const tracks = J.arr(data, 'tracks');
    if (!tracks) return;
    let out = J.arr(data, 'spawn-track') || J.arr(data, 'spawn_tracks');
    if (!out) { out = []; data['spawn-track'] = out; }
    for (const t of tracks) {
      if (!t) continue;
      const tt = J.str(t, 'type', '');
      const spawnable = J.eqi(tt, 'SPAWN') || (J.eqi(tt, 'END') && J.bool(t, 'spawn', false));
      if (!spawnable) continue;
      const id = J.int(t, 'id', -1);
      let entry = out.find(e => e && J.int(e, 'id', -1) === id);
      const isNew = !entry;
      if (isNew) entry = {};
      let join = J.int(entry, 'joinWith', J.int(t, 'joinWith', -1));
      if (join === -1) join = this.findJoin(tracks, t);
      if (join === -1) continue;
      let mode = J.str(entry, 'mode', J.str(t, 'mode', ''));
      if (!mode) mode = this.inferMode(tracks, t, join);
      entry.id = id; entry.joinWith = join; entry.mode = mode;
      if (!J.has(entry, 'type')) entry.type = 'ENTRY';
      if (!J.has(entry, 'path')) entry.path = [id, join];
      if (isNew) out.push(entry);
    }
  },
  near(ax, ay, bx, by) { return Math.abs(ax - bx) < this.TOL && Math.abs(ay - by) < this.TOL; },
  pts(t) { return [J.num(t, 'startX'), J.num(t, 'startY'), J.num(t, 'endX'), J.num(t, 'endY')]; },
  shareEnd(a, b) {
    const pa = this.pts(a), pb = this.pts(b);
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++)
      if (this.near(pa[i * 2], pa[i * 2 + 1], pb[j * 2], pb[j * 2 + 1])) return true;
    return false;
  },
  findJoin(tracks, sp) {
    const id = J.int(sp, 'id', -1);
    let found = -1;
    for (const t of tracks) {
      if (!t) continue;
      const tid = J.int(t, 'id', -1);
      if (tid === id || !this.shareEnd(sp, t)) continue;
      if (found !== -1 && found !== tid) return -1;
      found = tid;
    }
    return found;
  },
  inferMode(tracks, sp, joinId) {
    const join = tracks.find(t => t && J.int(t, 'id', -1) === joinId);
    const [sx, sy, ex, ey] = this.pts(sp);
    let joinY, farY;
    if (join) {
      const [jsx, jsy, jex, jey] = this.pts(join);
      if (this.near(sx, sy, jsx, jsy) || this.near(sx, sy, jex, jey)) { joinY = sy; farY = ey; }
      else if (this.near(ex, ey, jsx, jsy) || this.near(ex, ey, jex, jey)) { joinY = ey; farY = sy; }
      else { joinY = (jsy + jey) / 2; farY = (sy + ey) / 2; }
    } else return 'NORMAL';
    if (Math.abs(farY - joinY) < 1e-6) return 'NORMAL';
    return farY < joinY ? 'NORMAL' : 'REVERSE';
  },
};

// =====================================================================
//  Geo: cache koordinat, panjang, indeks sinyal/peron, SwitchUtil
// =====================================================================
class Geo {
  constructor(data) {
    this.data = data;
    this.tracks = new Map();
    this.coords = new Map();
    this.len = new Map();
    this.sigIdx = new Map();
    this.sigById = new Map();
    this.platIdx = new Map();
    this.brCache = new Map();
    this.zoneCache = new Map();
    for (const t of (J.arr(data, 'tracks') || [])) {
      if (!t) continue;
      const id = J.int(t, 'id', -1);
      this.tracks.set(id, t);
      this.coords.set(id, [J.num(t, 'startX'), J.num(t, 'startY'), J.num(t, 'endX'), J.num(t, 'endY')]);
      const m = J.num(t, 'length', 50);
      this.len.set(id, m > 0 ? m : 50);
    }
    for (const s of (J.arr(data, 'signals') || [])) {
      if (!s) continue;
      const tid = J.int(s, 'onTrack', -1);
      if (!this.sigIdx.has(tid)) this.sigIdx.set(tid, []);
      this.sigIdx.get(tid).push(s);
      const k = J.str(s, 'id', '').toUpperCase();
      if (!this.sigById.has(k)) this.sigById.set(k, s);
    }
    for (const p of (J.arr(data, 'platforms') || [])) {
      if (!p) continue;
      const tid = J.int(p, 'onTrack', -1);
      if (!this.platIdx.has(tid)) this.platIdx.set(tid, p);
    }
  }
  track(id) { return this.tracks.get(id) || null; }
  c(id) { return this.coords.get(id) || null; }
  meters(id) { const m = this.len.get(id); return m != null ? m : 50; }
  onTrack(id) { return this.sigIdx.get(id) || []; }
  signal(id) { return id == null ? null : (this.sigById.get(String(id).toUpperCase()) || null); }
  type(id) { const t = this.tracks.get(id); return t ? J.str(t, 'type', '') : ''; }
  isEnd(id) { return J.eqi(this.type(id), 'END'); }
  hasBuffer(id) { const t = this.tracks.get(id); return !!t && J.bool(t, 'buffer', false); }
  speed(id) { const t = this.tracks.get(id); const v = t ? J.int(t, 'speed', 30) : 30; return v; }
  platform(id) { return this.platIdx.get(id) || null; }
  platName(id) { const p = this.platform(id); return p == null ? String(id) : J.str(p, 'name', J.str(p, 'no', String(id))); }
  platStation(id) { const p = this.platform(id); return p == null ? '' : J.str(p, 'station', ''); }
  platLabel(id) { const st = this.platStation(id); return (st ? st + ' ' : '') + 'P' + this.platName(id); }

  // ---- SwitchUtil ----
  pivot(br) {
    if (br.length < 2) return null;
    const a = this.c(br[0]), b = this.c(br[1]);
    if (!a || !b) return null;
    let best = Infinity, pv = null;
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      const d = Math.hypot(a[i * 2] - b[j * 2], a[i * 2 + 1] - b[j * 2 + 1]);
      if (d < best) { best = d; pv = [a[i * 2], a[i * 2 + 1]]; }
    }
    return pv;
  }
  farEnd(id, pv) {
    const c = this.c(id);
    if (!c || !pv) return null;
    const d0 = Math.hypot(c[0] - pv[0], c[1] - pv[1]), d1 = Math.hypot(c[2] - pv[0], c[3] - pv[1]);
    return d0 > d1 ? [c[0], c[1]] : [c[2], c[3]];
  }
  branches(sw) {
    let hit = this.brCache.get(sw);
    if (hit) return hit;
    let br = [];
    const arr = J.arr(sw, 'branches');
    if (arr && arr.length >= 2) {
      for (let i = 0; i < arr.length; i++) br.push(J.int(arr, i, -1));
      const pv = this.pivot(br);
      if (pv) br.sort((a, b) => {
        const fa = this.farEnd(a, pv), fb = this.farEnd(b, pv);
        if (!fa || !fb) return 0;
        return fa[0] - fb[0];
      });
    } else {
      br.push(J.int(sw, 'normal', -1));
      br.push(J.int(sw, 'diverge', -1));
    }
    this.brCache.set(sw, br);
    return br;
  }
  activeIndex(sw, count) {
    if (J.has(sw, 'branches')) {
      const def = count >= 3 ? Math.floor(count / 2) : 0;
      const p = J.int(sw, 'pos', def);
      return Math.max(0, Math.min(count - 1, p));
    }
    return J.eqi(J.str(sw, 'state', 'NORMAL'), 'DIVERGE') ? 1 : 0;
  }
  setActiveIndex(sw, idx) {
    if (J.has(sw, 'branches')) sw.pos = idx;
    else sw.state = idx === 0 ? 'NORMAL' : 'DIVERGE';
  }
  activeBranch(sw) {
    const br = this.branches(sw);
    const idx = this.activeIndex(sw, br.length);
    return idx < br.length ? br[idx] : -1;
  }
  posLabel(idx, count) {
    if (count === 2) return idx === 0 ? 'lurus' : 'belok';
    if (count === 3) return idx === 0 ? 'kiri' : (idx === 1 ? 'tengah' : 'kanan');
    return 'cabang ' + (idx + 1);
  }
  touches(id, p) {
    const c = this.c(id);
    if (!c || !p) return false;
    return (Math.abs(c[0] - p[0]) < 0.002 && Math.abs(c[1] - p[1]) < 0.002)
      || (Math.abs(c[2] - p[0]) < 0.002 && Math.abs(c[3] - p[1]) < 0.002);
  }
  usedBranch(path, br, pv) {
    for (let i = 0; i < path.length; i++) {
      const id = path[i];
      if (!br.includes(id)) continue;
      if (pv == null) return id;
      if (i > 0 && this.touches(path[i - 1], pv)) return id;
      if (i + 1 < path.length && this.touches(path[i + 1], pv)) return id;
    }
    return -1;
  }
  zone(sw) {
    let z = this.zoneCache.get(sw);
    if (z) return z;
    const br = this.branches(sw);
    z = br.slice();
    const pv = this.pivot(br);
    if (pv) for (const id of this.tracks.keys()) if (!z.includes(id) && this.touches(id, pv)) z.push(id);
    this.zoneCache.set(sw, z);
    return z;
  }
  // Posisi sinyal pada track (0..1) searah gerak (Train.getSignalProgress)
  sigProgress(sig, trackId, down) {
    const c = this.c(trackId);
    if (!c) return 0.87;
    const dx = c[2] - c[0], dy = c[3] - c[1], len2 = dx * dx + dy * dy;
    if (len2 === 0) return 0.87;
    let pf = ((J.num(sig, 'x') - c[0]) * dx + (J.num(sig, 'y') - c[1]) * dy) / len2;
    pf = Math.max(0, Math.min(1, pf));
    return (!down && c[1] < c[3]) ? 1 - pf : pf;
  }
}

const sigDown = s => !J.eqi(J.str(s, 'facing', 'NORMAL'), 'REVERSE');
const sigType = s => J.str(s, 'type', '').toUpperCase();
const isAutoSig = s => { const t = sigType(s); return t === 'REPEATER' || t === 'DISTANT' || t === 'BLOCK'; };

// =====================================================================
//  PathBuilder
// =====================================================================
class PathBuilder {
  constructor(geo) {
    this.geo = geo;
    this.nodes = new Map();
    for (const [id, c] of geo.coords) {
      this.addNode(PathBuilder.key(c[0], c[1]), id);
      this.addNode(PathBuilder.key(c[2], c[3]), id);
    }
  }
  static key(x, y) { return Math.round(x * 1000) + '|' + Math.round(y * 1000); }
  has(id) { return this.geo.tracks.has(id); }
  addNode(k, id) { if (!this.nodes.has(k)) this.nodes.set(k, []); this.nodes.get(k).push(id); }
  static allows(track, down) {
    if (!track) return true;
    const d = J.str(track, 'dir', 'BOTH');
    if (J.eqi(d, 'NORMAL')) return down;
    if (J.eqi(d, 'REVERSE')) return !down;
    return true;
  }
  exitPoint(id, down) {
    const c = this.geo.c(id);
    const [sx, sy, ex, ey] = c;
    let startIsExit;
    if (Math.abs(ey - sy) < 1e-6) startIsExit = !down;
    else startIsExit = down ? (sy > ey) : (sy < ey);
    return startIsExit ? [sx, sy] : [ex, ey];
  }
  otherEnd(id, nk) {
    const c = this.geo.c(id);
    if (PathBuilder.key(c[0], c[1]) === nk) return [c[2], c[3]];
    return [c[0], c[1]];
  }
  signalFacing(trackId, down) {
    for (const s of this.geo.onTrack(trackId)) {
      const t = sigType(s);
      if (t === 'DISTANT' || t === 'REPEATER') continue;
      if (sigDown(s) === down) return J.str(s, 'id', '');
    }
    return null;
  }
  nextTrack(cur, down, seen, allowWrong = false) {
    if (!this.has(cur)) return -1;
    const ep = this.exitPoint(cur, down);
    const nk = PathBuilder.key(ep[0], ep[1]);
    const inc = this.nodes.get(nk);
    if (!inc) return -1;
    const tp = J.int(this.geo.track(cur), down ? 'teleportNormal' : 'teleportReverse', -1);
    if (tp !== -1 && this.has(tp) && !seen.has(tp) && (allowWrong || PathBuilder.allows(this.geo.track(tp), down))) return tp;
    const cand = [];
    for (const id of inc) {
      if (id === cur || seen.has(id)) continue;
      if (!allowWrong && !PathBuilder.allows(this.geo.track(id), down)) continue;
      const o = this.otherEnd(id, nk);
      const ahead = down ? (o[1] > ep[1] + 1e-6) : (o[1] < ep[1] - 1e-6);
      if (ahead) cand.push(id);
    }
    if (!cand.length) return -1;
    if (cand.length === 1) return cand[0];
    return this.choose(cand, nk, ep[0], down);
  }
  choose(cand, nk, nodeX, down) {
    for (const s of (J.arr(this.geo.data, 'switches') || [])) {
      if (!s) continue;
      const br = this.geo.branches(s);
      if (!br.every(b => cand.includes(b))) continue;
      const active = this.geo.activeBranch(s);
      if (active !== -1) return active;
    }
    const pref = cand.filter(id => PathBuilder.allows(this.geo.track(id), down));
    const pool = pref.length ? pref : cand;
    let best = pool[0], bestDx = Infinity;
    for (const id of pool) {
      const dx = Math.abs(this.otherEnd(id, nk)[0] - nodeX);
      if (dx < bestDx - 1e-9 || (Math.abs(dx - bestDx) < 1e-9 && id < best)) { best = id; bestDx = dx; }
    }
    return best;
  }
  backPath(headTrack, down, metersNeeded) {
    const back = [];
    if (!this.has(headTrack)) return back;
    const seen = new Set([headTrack]);
    let cur = headTrack, acc = 0;
    for (let g = 0; g < this.geo.tracks.size && acc < metersNeeded; g++) {
      const prev = this.nextTrack(cur, !down, seen, true);
      if (prev === -1) break;
      back.unshift(prev);
      seen.add(prev);
      acc += this.geo.meters(prev);
      cur = prev;
    }
    return back;
  }
  build(sig, allowWrong = false) {
    if (!sig) return null;
    return this.walk(J.int(sig, 'onTrack', -1), sigDown(sig), allowWrong);
  }
  buildFromTrack(start, down) { const r = this.walk(start, down, false); return r ? r.path : null; }
  walk(start, down, allowWrong) {
    if (!this.has(start)) return null;
    const startWrong = !PathBuilder.allows(this.geo.track(start), down);
    if (startWrong && !allowWrong) return null;
    const r = { path: [start], endType: 'BUNTU', endSignalId: null, wrongWay: startWrong ? [start] : [] };
    const seen = new Set([start]);
    let cur = start;
    for (let g = 0; g < this.geo.tracks.size; g++) {
      if (r.path.length > 1) {
        if (this.geo.isEnd(cur)) { r.endType = 'END'; break; }
        const sg = this.signalFacing(cur, down);
        if (sg != null) { r.endType = 'SINYAL'; r.endSignalId = sg; break; }
      }
      const next = this.nextTrack(cur, down, seen, allowWrong);
      if (next === -1) break;
      r.path.push(next);
      if (!PathBuilder.allows(this.geo.track(next), down)) r.wrongWay.push(next);
      seen.add(next);
      cur = next;
    }
    return r.path.length >= 2 ? r : null;
  }
  findSignalAhead(from) {
    if (!from) return null;
    const start = J.int(from, 'onTrack', -1);
    if (!this.has(start)) return null;
    const down = sigDown(from);
    const same = this.signalAheadOnTrack(start, down, from);
    if (same != null) return same;
    const seen = new Set([start]);
    let cur = start;
    for (let g = 0; g < this.geo.tracks.size; g++) {
      const next = this.nextTrack(cur, down, seen);
      if (next === -1) return null;
      seen.add(next);
      const sg = this.signalFacing(next, down);
      if (sg != null) return sg;
      if (this.geo.isEnd(next)) return null;
      cur = next;
    }
    return null;
  }
  signalAheadOnTrack(trackId, down, from) {
    const fy = J.num(from, 'y');
    const fromId = J.str(from, 'id', '');
    let best = null, bestY = 0;
    for (const s of (J.arr(this.geo.data, 'signals') || [])) {
      if (!s || J.int(s, 'onTrack', -1) !== trackId) continue;
      if (J.eqi(fromId, J.str(s, 'id', ''))) continue;
      const t = sigType(s);
      if (t === 'DISTANT' || t === 'REPEATER') continue;
      if (sigDown(s) !== down) continue;
      const sy = J.num(s, 'y');
      if (down ? sy <= fy : sy >= fy) continue;
      if (best == null || (down ? sy < bestY : sy > bestY)) { best = J.str(s, 'id', ''); bestY = sy; }
    }
    return best;
  }
  nextAfter(prefix, down) {
    if (!prefix.length || !this.has(prefix[prefix.length - 1])) return -1;
    return this.nextTrack(prefix[prefix.length - 1], down, new Set(prefix), true);
  }
  extendFrom(prefix, down) {
    const out = prefix.slice();
    if (!out.length || !this.has(out[out.length - 1])) return out;
    const seen = new Set(prefix);
    let cur = out[out.length - 1];
    for (let g = 0; g < this.geo.tracks.size; g++) {
      if (out.length > 1) {
        if (this.geo.isEnd(cur)) break;
        if (this.signalFacing(cur, down) != null) break;
      }
      const next = this.nextTrack(cur, down, seen, true);
      if (next === -1) break;
      out.push(next); seen.add(next); cur = next;
    }
    return out;
  }
}

// =====================================================================
//  Masinis
// =====================================================================
class Masinis {
  constructor() { this.reset(); }
  reset() { this.seenDistantId = null; this.seenDistantYellow = false; this.cautionMainId = null; }
  static curve(targetKmh, distM) {
    const a = 5.0 / 3.6, vt = targetKmh / 3.6;
    return Math.sqrt(vt * vt + 2 * a * Math.max(0, distM) / 2.0) * 3.6;
  }
  advise(t, geo, limitKmh) {
    let allowed = limitKmh;
    if (!t || !geo) return allowed;
    const ahead = this.scanAhead(t, geo);
    let nextDistant = null, nextMain = null;
    for (const s of ahead) {
      if (s.type === 'DISTANT') { if (!nextDistant) nextDistant = s; }
      else { nextMain = s; break; }
    }
    if (this.seenDistantId != null && (nextDistant == null || !J.eqi(this.seenDistantId, nextDistant.id))) {
      if (this.seenDistantYellow && nextMain) this.cautionMainId = nextMain.id;
      this.seenDistantId = null; this.seenDistantYellow = false;
    }
    if (nextDistant) { this.seenDistantId = nextDistant.id; this.seenDistantYellow = !J.eqi(nextDistant.state, 'GREEN'); }
    if (this.cautionMainId != null) {
      const still = nextMain && J.eqi(this.cautionMainId, nextMain.id);
      if (!still || J.eqi(nextMain.state, 'GREEN')) this.cautionMainId = null;
      else allowed = Math.min(allowed, 40);
    }
    if (nextDistant && this.seenDistantYellow && nextDistant.distM <= 900) allowed = Math.min(allowed, Masinis.curve(40, nextDistant.distM));
    if (nextMain && nextMain.distM <= 300) {
      if (J.eqi(nextMain.state, 'RED')) {
        const v = nextMain.distM <= 0.5 ? 0 : Math.max(4, Masinis.curve(0, nextMain.distM));
        allowed = Math.min(allowed, v);
      } else if (J.eqi(nextMain.state, 'YELLOW')) {
        const vt = nextMain.type === 'BLOCK' ? 60 : 25;
        allowed = Math.min(allowed, Masinis.curve(vt, nextMain.distM));
      }
    }
    return allowed;
  }
  scanAhead(t, geo) {
    const out = [];
    const path = t.path, down = t.mode !== 'REVERSE', cur = t.idx;
    let base = 0;
    for (let i = cur; i < path.length; i++) {
      const tid = path[i];
      const c = geo.c(tid);
      if (!c) break;
      const len = geo.meters(tid);
      if (i === cur) base = -t.prog * len;
      for (const s of geo.onTrack(tid)) {
        if (sigDown(s) !== down) continue;
        const type = sigType(s);
        if (type === 'REPEATER') continue;
        const distant = type === 'DISTANT';
        if (!distant && t.isStopPlatform(tid)) continue;
        const prog = geo.sigProgress(s, tid, down);
        if (i === cur && t.prog > prog + 0.02) continue;
        const stop = distant ? prog : Math.min(0.82, prog - 0.03);
        out.push({ id: J.str(s, 'id', ''), type, state: J.str(s, 'state', 'RED'), distM: base + stop * len });
      }
      base += len;
      if (base > 2000) break;
    }
    out.sort((a, b) => a.distM - b.distM);
    return out;
  }
}

// =====================================================================
//  Bagian 2: Train (port Train.java)
// =====================================================================
const PASSENGER_CARS = 12, FREIGHT_CARS = 16;
const TAIL_MARGIN_M = 5.0, BUFFER_STOP_M = 2.0, PLATFORM_END_MARGIN_M = 1.0, SIGNAL_STOP_MARGIN_M = 2.0;

class Train {
  constructor(no, name, arr, dep, path, mode, target) {
    this.no = no; this.name = name; this.arr = arr || '--:--'; this.dep = dep || '--:--';
    this.path = path || []; this.mode = mode || 'NORMAL'; this.target = target;
    this.idx = 0; this.prog = 0; this.x = 0; this.y = 0;
    this.speed = 10; this.accel = 3; this.decel = 5;
    this.stationStop = target !== -1; this.dwell = false; this.waitDep = false; this.waitSig = false;
    this.finished = false; this.stopped = false; this.lastSim = ''; this.departedFlag = false; this.hasDeparted = false;
    this.turnback = false; this.exitTrack = -1; this.reversed = false;
    this.hasLoco = true; this.manual = false; this.manualDir = 0; this.manualKmh = 15; this.facingFwd = true; this.spad = null;
    this.masinis = new Masinis();
    this.locoM = 17; this.carM = 20; this.gapM = 1; this.freight = false; this.cars = PASSENGER_CARS;
    this.held = 0; this.arrivedFlag = false; this.arrPlat = -1; this.arrOver = 0; this.speedCap = 0; this.locoRear = false;
    this.scheduled = false; this.schedPlat = -1; this.terminate = false; this.ranOff = false;
    this.alt = new Set(); this.altFor = -2; this.altForNo = null; this.served = -1;
    this.passages = [];
    this.game = null;
  }
  // ---- getter singkat ----
  get curId() { return this.idx < this.path.length ? this.path[this.idx] : -1; }
  get nextId() { return this.idx + 1 < this.path.length ? this.path[this.idx + 1] : -1; }
  isDwelling() { return this.dwell || this.waitDep; }
  coachCount() { return this.hasLoco ? this.cars - 1 : this.cars; }
  log(time, text, color) { if (this.game) this.game.log(time, text, color); }

  setFreight(f) { this.freight = f; this.cars = f ? FREIGHT_CARS : PASSENGER_CARS; this.carM = f ? 15 : 20; this.accel = f ? 1.5 : 3; }
  setCarCount(n) { if (n >= 0) this.cars = n + 1; }
  setLengths(loco, car, gap) { if (loco > 0) this.locoM = loco; if (car > 0) this.carM = car; if (gap >= 0) this.gapM = gap; }
  markScheduled() { this.scheduled = true; this.schedPlat = this.target; }
  setTurnback(tb, exit) { this.turnback = tb; this.exitTrack = exit; }

  consumeArrived() { const a = this.arrivedFlag; this.arrivedFlag = false; return a; }
  consumeDeparted() { const d = this.departedFlag; this.departedFlag = false; return d; }
  consumeRanOff() { const r = this.ranOff; this.ranOff = false; return r; }
  consumeSpad() { const s = this.spad; this.spad = null; return s; }

  isLocoIndex(i) { return this.hasLoco && (this.locoRear ? i === this.cars - 1 : i === 0); }
  vehLen(i) { return this.isLocoIndex(i) ? this.locoM : this.carM; }
  centerBack(i) { let d = 0; for (let k = 0; k < i; k++) d += this.vehLen(k) + this.gapM; return d + this.vehLen(i) / 2; }
  totalLen() { let d = 0; for (let k = 0; k < this.cars; k++) d += this.vehLen(k); return d + Math.max(0, this.cars - 1) * this.gapM; }

  // ---- peron ----
  notePlatformEntry(geo, tid) {
    if (tid <= 0 || !geo.platform(tid)) return;
    this.passages.push({ trackId: tid, time: (this.lastSim || '--:--').substring(0, 5), stopped: false });
  }
  notePlatformStop(tid) {
    for (let i = this.passages.length - 1; i >= 0; i--) if (this.passages[i].trackId === tid) { this.passages[i].stopped = true; return; }
    this.passages.push({ trackId: tid, time: (this.lastSim || '--:--').substring(0, 5), stopped: true });
  }
  resolveStopPlatforms(geo) {
    this.alt.clear();
    if (this.target <= 0) return;
    const listed = SN.allowedPlatforms(this.no);
    if (listed.length > 1 && listed.includes(this.target)) { listed.forEach(x => this.alt.add(x)); return; }
    const tp = geo.platform(this.target);
    if (!tp) return;
    const st = J.str(tp, 'station', '');
    for (const p of (J.arr(geo.data, 'platforms') || [])) {
      if (!p || !J.eqi(st, J.str(p, 'station', ''))) continue;
      const tid = J.int(p, 'onTrack', -1);
      if (tid > 0) this.alt.add(tid);
    }
  }
  isStopPlatform(tid) {
    if (!this.stationStop || tid <= 0 || tid === this.served) return false;
    if (tid === this.target) return true;
    if (!this.alt.has(tid)) return false;
    const xi = this.path.indexOf(tid), ti = this.path.indexOf(this.target);
    return !(ti > xi);
  }
  markArrival(geo, tid) {
    const len = geo.meters(tid);
    this.arrPlat = tid;
    this.arrOver = Math.max(0, this.totalLen() - this.prog * len);
    this.arrivedFlag = true;
    this.notePlatformStop(tid);
  }

  makeRake(coaches) {
    this.hasLoco = false; this.locoRear = false; this.cars = Math.max(1, coaches);
    this.manual = false; this.manualDir = 0; this.target = -1; this.stationStop = false;
    this.dwell = false; this.waitDep = false; this.speed = 0; this.stopped = true;
  }
  placeStandby(path, head) { this.path = path.slice(); this.idx = this.path.length - 1; this.prog = Math.max(0, Math.min(1, head)); this.speed = 0; this.stopped = true; }
  placeStandbyOnTrack(geo, path, head, stopTrack) {
    this.path = path.slice(); this.idx = this.path.length - 1; this.prog = Math.max(0, Math.min(1, head));
    this.target = stopTrack; this.speed = 0; this.stationStop = true; this.dwell = true;
    if (geo.platform(stopTrack)) this.markArrival(geo, stopTrack);
  }
  startAtLineSpeed(geo, limit) {
    let v = limit > 0 ? limit : 30;
    if (geo) v = Math.min(v, this.masinis.advise(this, geo, Math.round(v)));
    this.speed = Math.max(0, v);
  }
  crashStop() { this.speed = 0; this.stopped = true; this.manual = false; this.manualDir = 0; }

  appendExitPath(tracks) {
    if (this.manual || this.stopped) return;
    let added = 0;
    for (const id of tracks) if (!this.path.includes(id)) { this.path.push(id); added++; }
    this.waitDep = false;
    // Java selalu menambah 0.01; di sini hanya bila jalur benar-benar bertambah,
    // agar kereta yang menunggu tidak "merayap" melewati ujung track (progress > 1)
    if (added > 0) this.prog = Math.min(1, this.prog + 0.01);
  }
  nextSignalObject(geo) {
    const cur = this.curId;
    if (cur === -1) return null;
    const down = this.mode === 'NORMAL';
    for (const s of geo.onTrack(cur)) {
      if (sigType(s) === 'DISTANT') continue;
      if (sigDown(s) !== down) continue;
      if (this.prog > geo.sigProgress(s, cur, this.mode !== 'REVERSE') + 0.02) continue;
      return s;
    }
    return null;
  }
  nextSignalAspect(geo) {
    const cur = this.curId;
    if (cur === -1) return 'GREEN';
    const down = this.mode === 'NORMAL';
    for (const s of geo.onTrack(cur)) {
      const t = sigType(s);
      if (t === 'DISTANT' || t === 'REPEATER') continue;
      if (sigDown(s) !== down) continue;
      if (this.prog > geo.sigProgress(s, cur, this.mode !== 'REVERSE') + 0.02) continue;
      return J.str(s, 'state', 'RED');
    }
    return 'GREEN';
  }
  platformStopProgress(geo, tid, up) {
    const p = geo.platform(tid), c = geo.c(tid);
    if (!p || !c || Math.abs(c[3] - c[1]) < 1e-6) return -1;
    const edgeY = up ? J.num(p, 'topY') : J.num(p, 'botY');
    const pf = (edgeY - c[1]) / (c[3] - c[1]);
    const flip = this.mode === 'REVERSE' && c[1] < c[3];
    const prog = (flip ? 1 - pf : pf) - PLATFORM_END_MARGIN_M / geo.meters(tid);
    return Math.max(0.05, Math.min(0.99, prog));
  }
  signalStopLimit(geo, tid, from) {
    let lim = 1.0;
    const len = geo.meters(tid);
    const down = this.mode === 'NORMAL';
    for (const s of geo.onTrack(tid)) {
      const t = sigType(s);
      if (t === 'DISTANT' || t === 'REPEATER') continue;
      if (sigDown(s) !== down) continue;
      const sp = geo.sigProgress(s, tid, this.mode !== 'REVERSE');
      if (sp < 0.25 || sp + 0.02 < from) continue;
      lim = Math.min(lim, sp - SIGNAL_STOP_MARGIN_M / len);
    }
    return lim;
  }
  placeAtPlatform(geo, tid, pb) {
    if (tid <= 0) return false;
    const up = this.mode === 'REVERSE';
    const len = geo.meters(tid);
    const sigLimit = this.signalStopLimit(geo, tid, 0);
    let stop = this.platformStopProgress(geo, tid, up);
    const path = [];
    if (stop >= 0) {
      stop = Math.min(stop, sigLimit);
      const missing = this.totalLen() + TAIL_MARGIN_M - stop * len;
      if (missing > 0 && pb) path.push(...pb.backPath(tid, !up, missing));
    } else {
      stop = up ? 0.75 : 0.25;
      const minHead = (this.totalLen() + TAIL_MARGIN_M) / len;
      if (stop < minHead) stop = minHead;
      stop = Math.min(stop, Math.min(0.80, sigLimit));
    }
    stop = Math.max(0.02, stop);
    path.push(tid);
    this.path = path; this.target = tid; this.idx = path.length - 1; this.prog = stop;
    this.speed = 0; this.stationStop = true; this.dwell = true;
    this.markArrival(geo, tid);
    return true;
  }

  // ---- gerak otomatis ----
  advanceProgress(trackLength, limit, dt, nextOccupied, geo, simTime) {
    if (this.finished || this.stopped) return;
    this.lastSim = simTime;
    if (this.altFor !== this.target || String(this.no) !== this.altForNo) {
      this.resolveStopPlatforms(geo); this.altFor = this.target; this.altForNo = String(this.no);
    }
    const oldTail = this.tailPos(geo)[0];
    const aspect = this.nextSignalAspect(geo);
    const pathEndsHere = this.nextId === -1 && !geo.isEnd(this.curId);
    const approachingRed = J.eqi(aspect, 'RED') || pathEndsHere;
    const atPlatformStop = this.isStopPlatform(this.curId) && !geo.isEnd(this.curId);
    if (atPlatformStop) this.waitSig = false;
    else if (approachingRed || nextOccupied) {
      if (this.prog >= 0.65) {
        this.waitSig = true;
        const lenM = trackLength > 0 ? trackLength : 50;
        const distM = Math.max(0, (0.82 - this.prog) * lenM);
        const bt = Math.min(limit, Math.max(3, Masinis.curve(0, distM)));
        if (this.speed > bt) { this.speed -= this.decel * 1.5 * dt; if (this.speed < bt) this.speed = bt; }
        if (this.prog >= 0.82 || this.speed <= 0.5) { this.speed = 0; return; }
      }
    } else if (J.eqi(aspect, 'YELLOW')) { this.waitSig = false; limit = Math.min(limit, 25); }
    else this.waitSig = false;

    if (this.dwell || this.waitDep) {
      this.speed = 0;
      if (isTimeReached(simTime, this.dep)) {
        if (J.eqi(aspect, 'GREEN') || J.eqi(aspect, 'YELLOW')) {
          this.dwell = false; this.waitDep = false; this.departedFlag = true; this.hasDeparted = true; this.stationStop = false;
        } else { this.waitDep = true; return; }
      } else return;
    }
    if (trackLength <= 0) trackLength = 50;
    if (limit <= 0) limit = 30;
    const cur = this.curId;
    let eff = limit;
    if (this.isStopPlatform(cur) && !geo.isEnd(cur)) {
      const up = this.mode === 'REVERSE';
      const tl = geo.meters(cur);
      const sigLimit = this.signalStopLimit(geo, cur, this.prog);
      const pStop = this.platformStopProgress(geo, cur, up);
      let stopPoint, overshoot = false;
      if (pStop >= 0) stopPoint = Math.min(pStop, sigLimit);
      else {
        stopPoint = up ? 0.75 : 0.25;
        const tailMargin = (this.turnback && !this.reversed) ? 0.18 : TAIL_MARGIN_M / tl;
        const minHead = this.totalLen() / tl + tailMargin;
        if (stopPoint < minHead) { stopPoint = minHead; overshoot = true; }
        stopPoint = Math.min(stopPoint, Math.min(0.80, sigLimit));
      }
      stopPoint = Math.max(0.02, stopPoint);
      if (this.prog < stopPoint && !this.dwell) {
        const distM = (stopPoint - this.prog) * tl;
        eff = Math.min(eff, 30);
        eff = Math.min(eff, Math.max(4, Masinis.curve(0, distM)));
      }
      if (this.prog >= stopPoint) {
        this.prog = stopPoint; this.speed = 0;
        if (!this.dwell) {
          this.dwell = true;
          this.markArrival(geo, cur);
          this.log(simTime, `[${this.no} ${this.name}] Tiba di ${geo.platLabel(cur)}` + (overshoot ? ' (melewati ujung peron agar rangkaian masuk)' : ''), 'yellow');
          if (this.game) this.game.onArrived(this, cur);
        }
        return;
      }
    }
    eff = Math.min(eff, this.masinis.advise(this, geo, limit));
    if (this.speedCap > 0) eff = Math.min(eff, this.speedCap);
    if (this.speed < eff) {
      const a = this.accel * Math.max(0.35, 1 - this.speed / 150);
      this.speed += a * dt; if (this.speed > eff) this.speed = eff;
    } else if (this.speed > eff) {
      this.speed -= this.decel * dt; if (this.speed < eff) this.speed = eff;
    }
    const mps = this.speed * 1000 / 3600;
    const dp = (mps / trackLength) * dt * 2;
    this.prog += dp;
    if (!atPlatformStop && approachingRed && this.prog >= 0.82) {
      const before = this.prog - dp;
      this.prog = before < 0.82 ? 0.82 : before;
      this.speed = 0;
      return;
    }
    if (this.prog >= 1) {
      const last = this.idx + 1 >= this.path.length;
      if (last) { this.prog = 1; this.speed = 0; }
      else { this.prog = 0; this.idx++; this.notePlatformEntry(geo, this.curId); }
      if (last) {
        this.finished = true;
        this.log(simTime, `[${this.no} ${this.name}] Keluar seksi stasiun`, 'green');
        if (this.game) this.game.onFinished(this);
      }
    }
  }

  // ---- posisi gerbong ----
  locate(geo, metersBack) {
    let off = this.prog, ti = this.idx;
    while (metersBack > 0 && ti >= 0 && ti < this.path.length) {
      const len = geo.meters(this.path[ti]);
      const av = off * len;
      if (metersBack <= av) { off -= metersBack / len; metersBack = 0; }
      else { metersBack -= av; ti--; off = 1; }
    }
    return [ti, Math.max(0, off)];
  }
  tailPos(geo) { return this.locate(geo, this.totalLen()); }
  occupied(geo) {
    const out = [];
    let tail = this.tailPos(geo)[0];
    if (tail < 0) tail = 0;
    for (let i = tail; i <= this.idx && i < this.path.length; i++) out.push(this.path[i]);
    return out;
  }
  posOnTrack(geo, tid, p) {
    const c = geo.c(tid);
    if (!c) return null;
    const flip = this.mode === 'REVERSE' && c[1] < c[3];
    const q = flip ? 1 - p : p;
    const sg = flip ? -1 : 1;
    return { x: c[0] + (c[2] - c[0]) * q, y: c[1] + (c[3] - c[1]) * q, dx: (c[2] - c[0]) * sg, dy: (c[3] - c[1]) * sg };
  }
  carPositions(geo) {
    const out = [];
    for (let i = 0; i < this.cars; i++) {
      const [ti, off] = this.locate(geo, this.centerBack(i));
      if (ti >= 0 && ti < this.path.length) {
        const tid = this.path[ti];
        const p = this.posOnTrack(geo, tid, off);
        if (p) { p.trackId = tid; p.loco = this.isLocoIndex(i); p.body = this.vehLen(i); out.push(p); }
      }
    }
    if (!out.length) out.push({ x: this.x, y: this.y, dx: 0, dy: 1, trackId: -1, loco: true, body: 20 });
    return out;
  }
  updateCoords(geo) {
    const p = this.posOnTrack(geo, this.curId, this.prog);
    if (p) { this.x = p.x; this.y = p.y; }
  }

  // ---- rute & leg ----
  reverseOnto(exitPath, geo) {
    if (!exitPath || !exitPath.length) return false;
    if (exitPath[0] !== this.curId) return false;
    const tail = this.tailPos(geo);
    const tailProg = tail[0] >= this.idx ? tail[1] : 0;
    this.mode = this.mode === 'NORMAL' ? 'REVERSE' : 'NORMAL';
    this.path = exitPath.slice(); this.idx = 0; this.prog = Math.min(0.82, 1 - tailProg);
    this.speed = 0; this.stationStop = false; this.reversed = true; this.masinis.reset();
    return true;
  }
  startLeg(no, name, arr, dep, platform, tb, exit) {
    this.no = no; this.name = name; this.arr = arr; this.dep = dep; this.target = platform;
    this.stationStop = platform > 0; this.hasDeparted = false; this.reversed = false; this.held = 0;
    this.turnback = tb; this.exitTrack = exit; this.terminate = false; this.masinis.reset();
  }
  followSwitches(pb) {
    if (this.manual || this.stopped || !pb || this.finished) return;
    const i = this.idx;
    if (i < 0 || i + 1 >= this.path.length) return;
    const down = this.mode === 'NORMAL';
    const prefix = this.path.slice(0, i + 1);
    const planned = this.path[i + 1];
    const actual = pb.nextAfter(prefix, down);
    if (actual === -1 || actual === planned) return;
    prefix.push(actual);
    this.path = pb.extendFrom(prefix, down);
  }
  cancelExitPath(routeTracks) {
    if (!routeTracks || !routeTracks.length) return;
    const first = this.path.indexOf(routeTracks[0]);
    const cut = Math.max(first, this.idx) + 1;
    if (this.path.length > cut) this.path.length = cut;
  }

  // ---- lepas / sambung loko & manual ----
  flip(geo) {
    const tail = this.tailPos(geo);
    let ti = tail[0], tp = tail[1];
    if (ti < 0) { ti = 0; tp = 0; }
    const hi = Math.min(this.idx, this.path.length - 1);
    const np = [];
    for (let i = hi; i >= ti; i--) np.push(this.path[i]);
    this.mode = this.mode === 'NORMAL' ? 'REVERSE' : 'NORMAL';
    if (this.hasLoco && this.cars > 1) this.locoRear = !this.locoRear;
    this.path = np; this.idx = np.length - 1; this.prog = Math.max(0, Math.min(1, 1 - tp));
    this.speed = 0; this.masinis.reset();
  }
  splitLoco(geo) {
    if (!this.hasLoco || this.cars <= 1 || this.finished) return null;
    const total = this.totalLen();
    const loco = new Train('LOK ' + this.no, 'Lokomotif', '--:--', '--:--', this.path.slice(), this.mode, -1);
    loco.cars = 1; loco.locoM = this.locoM; loco.carM = this.carM; loco.gapM = this.gapM;
    loco.freight = this.freight; loco.accel = this.accel; loco.x = this.x; loco.y = this.y; loco.game = this.game;
    if (this.locoRear) {
      let [ti, off] = this.locate(geo, total - this.locoM);
      if (ti < 0) { ti = 0; off = 0; }
      if (loco.path.length > ti + 1) loco.path.length = ti + 1;
      loco.idx = ti; loco.prog = off;
    } else {
      loco.idx = this.idx; loco.prog = this.prog;
      let [ti, off] = this.locate(geo, this.locoM + this.gapM);
      if (ti < 0) { ti = 0; off = 0; }
      if (this.path.length > ti + 1) this.path.length = ti + 1;
      this.idx = ti; this.prog = off;
    }
    loco.beginManual();
    this.hasLoco = false; this.locoRear = false; this.cars -= 1; this.manual = false; this.manualDir = 0;
    this.stopped = true; this.waitSig = false; this.speed = 0;
    return loco;
  }
  mergeLoco(loco, merged, headIdx, headProg) {
    this.path = merged; this.idx = headIdx; this.prog = headProg;
    this.locoM = loco.locoM; this.gapM = loco.gapM; this.accel = loco.accel;
    this.hasLoco = true; this.cars += 1; this.stopped = false; this.locoRear = false;
    this.manual = false; this.manualDir = 0; this.speed = 0; this.masinis.reset();
  }
  beginManual() {
    if (this.scheduled && this.target > 0) this.schedPlat = this.target;
    this.manual = true; this.manualDir = 0; this.facingFwd = true; this.waitSig = false; this.stopped = false; this.speed = 0;
    if (this.coachCount() === 0) {
      this.stationStop = false; this.served = this.curId; this.dwell = false; this.waitDep = false; this.target = -1;
    }
    if (this.path.length > this.idx + 1) this.path.length = this.idx + 1;
  }
  endManual() { if (this.locoRear) return false; this.manual = false; this.manualDir = 0; this.speed = 0; return true; }
  setManualDir(d) { this.manualDir = Math.max(-1, Math.min(1, d)); }
  changeManualKmh(d) { this.manualKmh = Math.max(5, Math.min(40, this.manualKmh + d)); }
  manualPrepare(geo) {
    if (this.manualDir !== 0 && this.facingFwd !== (this.manualDir > 0) && this.speed < 0.3) {
      this.flip(geo); this.facingFwd = this.manualDir > 0;
    }
  }
  advanceManual(geo, pb, limit, dt, gapAhead, couplable, simTime) {
    if (this.finished) return;
    this.lastSim = simTime;
    const down = this.mode === 'NORMAL';
    let tailIdx = this.tailPos(geo)[0];
    while (tailIdx > 1 && this.idx > 0) { this.path.shift(); this.idx--; tailIdx--; }
    if (this.path.length > this.idx + 1) this.path.length = this.idx + 1;
    const nx = pb ? pb.nextAfter(this.path, down) : -1;
    if (nx !== -1) this.path.push(nx);
    const cur = this.curId;
    const len = geo.meters(cur);
    const onEnd = geo.isEnd(cur);
    const deadEnd = nx === -1 && !onEnd;
    const buffered = deadEnd && geo.hasBuffer(cur);
    const stopProg = Math.max(0, 1 - BUFFER_STOP_M / len);
    const wantMove = this.manualDir !== 0 && this.facingFwd === (this.manualDir > 0);
    let target = wantMove ? Math.min(this.manualKmh, limit > 0 ? limit : 30) : 0;
    if (gapAhead < 1e8) {
      const room = gapAhead - (couplable ? 0.5 : 2.0);
      target = Math.min(target, room <= 0 ? 0 : Masinis.curve(0, room));
    }
    if (buffered) target = Math.min(target, Masinis.curve(0, Math.max(0, (stopProg - this.prog) * len)));
    if (this.speed < target) { const a = this.accel * Math.max(0.35, 1 - this.speed / 150); this.speed = Math.min(target, this.speed + a * dt); }
    else if (this.speed > target) this.speed = Math.max(target, this.speed - this.decel * 1.5 * dt);
    if (this.speed < 0.01) { this.speed = 0; return; }
    const sig = this.nextSignalObject(geo);
    const sigProg = sig ? geo.sigProgress(sig, cur, this.mode !== 'REVERSE') : 0;
    const preIdx = this.idx;
    this.prog += (this.speed / 3.6 / len) * dt * 2;
    if (buffered && this.prog >= stopProg) { this.prog = stopProg; this.speed = 0; }
    if (this.prog >= 1) {
      if (this.idx + 1 < this.path.length) { this.prog = 0; this.idx++; this.notePlatformEntry(geo, this.curId); }
      else if (onEnd) { this.prog = 1; this.speed = 0; this.finished = true; this.log(simTime, `[${this.no}] Keluar seksi stasiun`, 'green'); }
      else if (buffered) { this.prog = stopProg; this.speed = 0; }
      else { this.prog = 1; this.speed = 0; this.ranOff = true; }
    }
    if (sig && sigType(sig) !== 'REPEATER') {
      const st = J.str(sig, 'state', 'RED');
      const red = !J.eqi(st, 'GREEN') && !J.eqi(st, 'YELLOW');
      const passed = this.idx !== preIdx || this.prog > sigProg + 0.02;
      if (red && passed) this.spad = J.str(sig, 'id', '?');
    }
  }

  // ---- simpan / muat ----
  toJson() {
    return {
      no: this.no, name: this.name, arr: this.arr, dep: this.dep, mode: this.mode, path: this.path.slice(), idx: this.idx, prog: this.prog,
      x: this.x, y: this.y, spd: this.speed, accel: this.accel, decel: this.decel, plat: this.target, stationStop: this.stationStop,
      dwell: this.dwell, waitDep: this.waitDep, waitSig: this.waitSig, finished: this.finished, stopped: this.stopped, lastSim: this.lastSim,
      departed: this.hasDeparted, turnback: this.turnback, exitTrack: this.exitTrack, reversed: this.reversed, hasLoco: this.hasLoco,
      manual: this.manual, manualDir: this.manualDir, manualKmh: this.manualKmh, facingFwd: this.facingFwd, locoRear: this.locoRear,
      locoM: this.locoM, carM: this.carM, gapM: this.gapM, freight: this.freight, cars: this.cars, held: this.held, arrPlat: this.arrPlat,
      arrOver: this.arrOver, scheduled: this.scheduled, schedPlat: this.schedPlat, served: this.served, terminate: this.terminate,
      pass: this.passages.map(p => ({ t: p.trackId, at: p.time, s: p.stopped })),
    };
  }
  static fromJson(o) {
    const t = new Train(J.str(o, 'no', 'KA'), J.str(o, 'name', ''), J.str(o, 'arr', '--:--'), J.str(o, 'dep', '--:--'),
      (J.arr(o, 'path') || []).map(v => Number(v)), J.str(o, 'mode', 'NORMAL'), J.int(o, 'plat', -1));
    const n = (k, d) => J.num(o, k, d), b = (k, d) => J.bool(o, k, d);
    t.idx = J.int(o, 'idx', 0); t.prog = n('prog', 0); t.x = n('x', 0); t.y = n('y', 0); t.speed = n('spd', 0);
    t.accel = n('accel', 3); t.decel = n('decel', 5); t.stationStop = b('stationStop', false); t.dwell = b('dwell', false);
    t.waitDep = b('waitDep', false); t.waitSig = b('waitSig', false); t.finished = b('finished', false); t.stopped = b('stopped', false);
    t.lastSim = J.str(o, 'lastSim', ''); t.hasDeparted = b('departed', false); t.turnback = b('turnback', false);
    t.exitTrack = J.int(o, 'exitTrack', -1); t.reversed = b('reversed', false); t.hasLoco = b('hasLoco', true); t.manual = b('manual', false);
    t.manualDir = J.int(o, 'manualDir', 0); t.manualKmh = n('manualKmh', 15); t.facingFwd = b('facingFwd', true); t.locoRear = b('locoRear', false);
    t.locoM = n('locoM', 17); t.carM = n('carM', 20); t.gapM = n('gapM', 1); t.freight = b('freight', false); t.cars = J.int(o, 'cars', PASSENGER_CARS);
    t.held = n('held', 0); t.arrPlat = J.int(o, 'arrPlat', -1); t.arrOver = n('arrOver', 0); t.scheduled = b('scheduled', false);
    t.schedPlat = J.int(o, 'schedPlat', -1); t.served = J.int(o, 'served', -1); t.terminate = b('terminate', false);
    for (const p of (J.arr(o, 'pass') || [])) t.passages.push({ trackId: J.int(p, 't', -1), time: J.str(p, 'at', '--:--'), stopped: J.bool(p, 's', false) });
    return t;
  }
}

// =====================================================================
//  Coupling
// =====================================================================
const Coupling = {
  GAP_M: 1.5,
  toS(geo, id, p, rev) { const c = geo.c(id); return (c && rev && c[1] < c[3]) ? 1 - p : p; },
  sign(geo, id, rev) { const c = geo.c(id); return (c && rev && c[1] < c[3]) ? -1 : 1; },
  spans(t, geo) {
    const m = new Map();
    const p = t.path, rev = t.mode === 'REVERSE';
    const head = Math.min(t.idx, p.length - 1);
    let [tail, tailProg] = t.tailPos(geo);
    if (tail < 0) { tail = 0; tailProg = 0; }
    for (let i = tail; i <= head; i++) {
      const lo = i === tail ? tailProg : 0, hi = i === head ? t.prog : 1;
      const a = this.toS(geo, p[i], lo, rev), b = this.toS(geo, p[i], hi, rev);
      m.set(p[i], [Math.min(a, b), Math.max(a, b)]);
    }
    return m;
  },
  isHeadEnd(o, tid, nearS, geo) {
    const rev = o.mode === 'REVERSE';
    let dHead = 9, dTail = 9;
    if (o.curId === tid) dHead = Math.abs(nearS - this.toS(geo, tid, o.prog, rev));
    let [ti, tp] = o.tailPos(geo);
    if (ti < 0) { ti = 0; tp = 0; }
    if (ti < o.path.length && o.path[ti] === tid) dTail = Math.abs(nearS - this.toS(geo, tid, tp, rev));
    return dHead <= dTail;
  },
  gapTo(loco, other, geo) {
    const lp = loco.path, cur = loco.idx;
    if (cur < 0 || cur >= lp.length) return null;
    const rev = loco.mode === 'REVERSE';
    const sp = this.spans(other, geo);
    let acc = 0;
    for (let i = cur; i < lp.length; i++) {
      const id = lp[i], len = geo.meters(id), sg = this.sign(geo, id, rev);
      const sCur = i === cur ? this.toS(geo, id, loco.prog, rev) : (sg > 0 ? 0 : 1);
      const s = sp.get(id);
      if (s) {
        const ahead = sg > 0 ? s[1] >= sCur - 1e-9 : s[0] <= sCur + 1e-9;
        if (ahead) {
          const nearS = sg > 0 ? Math.max(s[0], sCur) : Math.min(s[1], sCur);
          return { meters: acc + Math.abs(nearS - sCur) * len, other, pathIdx: i, nearIsHead: this.isHeadEnd(other, id, nearS, geo) };
        }
      }
      acc += (sg > 0 ? 1 - sCur : sCur) * len;
    }
    return null;
  },
  nearestAhead(loco, all, geo) {
    let best = { meters: Infinity, other: null, pathIdx: -1, nearIsHead: true };
    for (const o of all) {
      if (o === loco || o.finished) continue;
      const g = this.gapTo(loco, o, geo);
      if (g && g.meters < best.meters) best = g;
    }
    return best;
  },
  couple(loco, g, geo) {
    if (!loco || !g || !g.other) return false;
    const rake = g.other;
    const lp = loco.path.slice(), cur = loco.idx, idxR = g.pathIdx;
    if (idxR < cur || idxR >= lp.length) return false;
    if (!g.nearIsHead) rake.flip(geo);
    loco.flip(geo);
    const merged = rake.path.slice(0, rake.idx + 1);
    for (let k = idxR - 1; k > cur; k--) merged.push(lp[k]);
    const lf = loco.path;
    for (let i = 0; i < lf.length; i++) {
      if (i === 0 && merged.length && merged[merged.length - 1] === lf[0]) continue;
      merged.push(lf[i]);
    }
    rake.mergeLoco(loco, merged, merged.length - 1, loco.prog);
    return true;
  },
};

// =====================================================================
//  AxleCounter (okupansi titik pangkal wesel)
// =====================================================================
const AxleCounter = {
  occupancy(trains, geo) {
    const m = new Map();
    for (const t of trains) {
      if (t.finished || !t.path.length) continue;
      const rev = t.mode === 'REVERSE';
      const head = Math.min(t.idx, t.path.length - 1);
      let [tail, tp] = t.tailPos(geo);
      if (tail < 0) { tail = 0; tp = 0; }
      for (let i = tail; i <= head; i++) {
        const lo = i === tail ? tp : 0, hi = i === head ? t.prog : 1;
        const id = t.path[i];
        const a = Coupling.toS(geo, id, lo, rev), b = Coupling.toS(geo, id, hi, rev);
        if (!m.has(id)) m.set(id, []);
        m.get(id).push([Math.min(a, b), Math.max(a, b), t]);
      }
    }
    return m;
  },
  nearPivot(occ, geo, tid, pv, marginM) {
    const l = occ.get(tid);
    if (!l || !pv) return false;
    const c = geo.c(tid);
    if (!c) return false;
    const d0 = Math.hypot(c[0] - pv[0], c[1] - pv[1]), d1 = Math.hypot(c[2] - pv[0], c[3] - pv[1]);
    const sp = d0 <= d1 ? 0 : 1;
    const ms = marginM / geo.meters(tid);
    for (const r of l) if (r[1] >= sp - ms && r[0] <= sp + ms) return true;
    return false;
  },
};

// =====================================================================
//  Bagian 3: ScoreManager, TrainLogger, PowerSupply, BlockSignal, AspectCascade
// =====================================================================
class Perf {
  constructor(no, name) {
    this.no = no; this.name = name;
    this.schSpawn = 0; this.schArr = 0; this.schDep = 0; this.target = -1; this.schExit = -1; this.through = false; this.partial = false;
    this.spawn = -1; this.arr = -1; this.dep = -1; this.exit = -1; this.plat = -1; this.exitTrack = -1; this.overhang = 0; this.heldSec = 0;
    this.closed = false; this.bonus = 0; this.score = 0; this.fb = [];
  }
  maxScore() { let m = 50; if (!this.partial) { m += 100; if (this.schExit > 0) m += 50; } if (!this.through) m += 400; return m; }
  platformOk() { if (this.target <= 0) return true; return this.plat === this.target || SN.isAllowedPlatform(this.no, this.plat); }
  isOnTime() {
    if (this.heldSec > 30) return false;
    if (this.schExit > 0 && this.exitTrack !== this.schExit) return false;
    if (this.through) return true;
    if (this.arr === -1 || this.dep === -1) return false;
    if (Math.abs(this.arr - this.schArr) > 30) return false;
    if (Math.abs(this.dep - this.schDep) > 15) return false;
    return this.platformOk();
  }
  add(p, l) { this.score += p; this.fb.push(l + ' (' + (p >= 0 ? '+' : '') + p + ')'); }
  calc() {
    this.score = 0; this.fb = [];
    if (this.spawn !== -1) {
      const d = Math.abs(this.spawn - this.schSpawn);
      if (d <= 30) this.add(50, 'Muncul tepat waktu');
      else this.add(Math.max(0, 50 - Math.trunc(d / 10) * 2), 'Muncul terlambat ' + d + 's');
    } else if (this.closed) this.add(-100, 'Tidak terlayani');
    if (!this.through && this.spawn !== -1) {
      if (this.arr !== -1) {
        const d = this.arr - this.schArr, a = Math.abs(d);
        if (a <= 30) this.add(150, 'Tiba tepat waktu');
        else this.add(Math.max(0, 150 - a), 'Tiba ' + (d > 0 ? 'terlambat ' : 'awal ') + a + 's');
      }
      if (this.plat !== -1) {
        if (this.target > 0 && this.plat === this.target) this.add(100, 'Peron benar');
        else if (this.target > 0 && this.platformOk()) this.add(100, 'Peron benar (pilihan T' + this.plat + ')');
        else if (this.target > 0) this.add(-50, 'Salah peron (T' + this.plat + ', jadwal T' + this.target + ')');
        if (this.overhang > 3) this.add(-Math.min(100, Math.trunc((this.overhang - 3) * 5)), 'Rangkaian keluar peron ' + Math.round(this.overhang) + ' m');
      } else if (this.closed) this.add(-200, 'Melewati peron tujuan');
      if (this.dep !== -1) {
        const d = this.dep - this.schDep;
        if (d < -5) this.add(-200, 'PELANGGARAN: berangkat prematur');
        else if (Math.abs(d) <= 15) this.add(150, 'Berangkat tepat waktu');
        else this.add(Math.max(0, 150 - d), 'Berangkat terlambat ' + d + 's');
      }
    }
    if (!this.partial) {
      if (this.exit !== -1) {
        this.add(100, 'Keluar seksi');
        if (this.schExit > 0 && this.exitTrack > 0) {
          if (this.exitTrack === this.schExit) this.add(50, 'Keluar lewat track benar (T' + this.exitTrack + ')');
          else this.add(-200, 'Salah track keluar (T' + this.exitTrack + ', jadwal T' + this.schExit + ')');
        }
        if (this.heldSec > 30) this.add(-Math.min(100, Math.trunc((this.heldSec - 30) / 3)), 'Tertahan sinyal ' + Math.round(this.heldSec) + ' s');
        if (this.bonus > 0) this.add(this.bonus, 'Combo tepat waktu');
      } else if (this.closed && this.spawn !== -1) this.add(-50, 'Belum keluar seksi');
    }
  }
}

class ScoreManager {
  constructor(logger) { this.list = []; this.total = 0; this.streak = 0; this.logger = logger; this.failed = false; this.failReason = ''; }
  fail(r) { this.failed = true; this.failReason = r; this.list.forEach(p => p.calc()); this.recalc(); }
  register(no, name, spawn, arr, dep, target, exit, through) {
    const p = new Perf(no, name);
    p.schSpawn = parseSec(spawn); p.schArr = parseSec(arr); p.schDep = parseSec(dep);
    p.target = target; p.schExit = exit; p.through = through;
    this.list.push(p);
    return p;
  }
  get(no) { return this.list.find(p => J.eqi(p.no, no)) || null; }
  logSpawn(no, t) { const p = this.get(no); if (p && p.spawn === -1) { p.spawn = parseSec(t); this.refresh(p, t); } }
  logArrival(no, t) { const p = this.get(no); if (p && p.arr === -1) { p.arr = parseSec(t); this.refresh(p, t); } }
  logPlatform(no, plat, over, t) { const p = this.get(no); if (p && p.plat === -1) { p.plat = plat; p.overhang = over; this.refresh(p, t); } }
  logDeparture(no, t) { const p = this.get(no); if (p && p.dep === -1) { p.dep = parseSec(t); this.refresh(p, t); } }
  logExitTime(no, t) { const p = this.get(no); if (p && p.exit === -1) p.exit = parseSec(t); }
  logExit(no, t, exitTrack, held) {
    const p = this.get(no);
    if (!p || p.bonus !== 0 || p.exitTrack !== -1) return;
    if (p.exit === -1) p.exit = parseSec(t);
    p.exitTrack = exitTrack; p.heldSec = held;
    if (p.isOnTime()) { this.streak++; p.bonus = this.streak >= 2 ? Math.min(4, this.streak - 1) * 25 : 0; }
    else this.streak = 0;
    this.refresh(p, t);
  }
  finalizeAll() { for (const p of this.list) { p.closed = true; p.calc(); } this.recalc(); }
  refresh(p, t) {
    const before = p.fb.slice();
    p.calc(); this.recalc();
    if (!this.logger) return;
    for (const f of p.fb) {
      if (before.includes(f)) continue;
      const bad = f.includes('(-') || f.startsWith('PELANGGARAN');
      this.logger.add(t, '[' + p.no + '] ' + f, bad ? 'red' : 'green');
    }
  }
  recalc() { this.total = this.list.reduce((a, p) => a + p.score, 0); }
  maxScore() { return this.list.reduce((a, p) => a + p.maxScore(), 0); }
  percent() { const m = this.maxScore(); return m > 0 ? Math.round(this.total * 100 / m) : 0; }
  grade() {
    if (this.failed) return 'GAGAL';
    const p = this.percent();
    if (p >= 90) return 'S (PERFECT DISPATCHER)';
    if (p >= 75) return 'A (EXCELLENT)';
    if (p >= 60) return 'B (GOOD)';
    if (p >= 40) return 'C (SATISFACTORY)';
    return 'D (NEED IMPROVEMENT)';
  }
  toJson() {
    return {
      perf: this.list.map(p => ({ no: p.no, spawn: p.spawn, arr: p.arr, dep: p.dep, exit: p.exit, plat: p.plat, exitTrack: p.exitTrack, overhang: p.overhang, held: p.heldSec, closed: p.closed, bonus: p.bonus })),
      streak: this.streak, failed: this.failed, failReason: this.failReason,
    };
  }
  restore(o) {
    if (!o) return;
    const arr = J.arr(o, 'perf') || [];
    for (let i = 0; i < arr.length && i < this.list.length; i++) {
      const q = arr[i], p = this.list[i];
      if (!q || !J.eqi(p.no, J.str(q, 'no', ''))) continue;
      p.spawn = J.num(q, 'spawn', -1); p.arr = J.num(q, 'arr', -1); p.dep = J.num(q, 'dep', -1); p.exit = J.num(q, 'exit', -1);
      p.plat = J.int(q, 'plat', -1); p.exitTrack = J.int(q, 'exitTrack', -1); p.overhang = J.num(q, 'overhang', 0); p.heldSec = J.num(q, 'held', 0);
      p.closed = J.bool(q, 'closed', false); p.bonus = J.int(q, 'bonus', 0);
    }
    this.streak = J.int(o, 'streak', 0); this.failed = J.bool(o, 'failed', false); this.failReason = J.str(o, 'failReason', '');
    this.list.forEach(p => p.calc()); this.recalc();
  }
}

class TrainLogger {
  constructor() { this.entries = []; this.max = 120; this.version = 0; }
  add(time, text, color) {
    this.entries.unshift({ time: (time || '').substring(0, 5), text, color: color || 'white' });
    if (this.entries.length > this.max) this.entries.length = this.max;
    this.version++;
  }
  clear() { this.entries = []; this.version++; }
  toJson() { return this.entries.slice(0, 60); }
  fromJson(a) { this.entries = Array.isArray(a) ? a.slice() : []; this.version++; }
}

class PowerSupply {
  constructor() { this.load(null); }
  load(data) {
    this.lastData = data; this.events = []; this.pln = true; this.genset = false; this.upsFail = false;
    this.battery = 100; this.batteryMin = 30; this.lastSec = -1; this.message = null; this.warnedEmpty = false;
    const p = data && typeof data.power === 'object' ? data.power : null;
    if (!p) return;
    this.batteryMin = Math.max(1, J.num(p, 'battery_min', 30) || 30);
    for (const o of (J.arr(p, 'events') || [])) {
      if (!o) continue;
      this.events.push({
        sec: parseSec(toHHmm(J.str(o, 't', ''))),
        pln: J.has(o, 'pln') ? J.bool(o, 'pln') : null,
        genset: J.has(o, 'genset') ? J.bool(o, 'genset') : null,
        upsFail: J.has(o, 'ups_fail') ? J.bool(o, 'ups_fail') : null,
        done: false,
      });
    }
  }
  update(now) {
    if (this.lastSec < 0) this.lastSec = now;
    const dt = ((now - this.lastSec) % 86400 + 86400) % 86400;
    this.lastSec = now;
    for (const e of this.events) {
      if (e.done || now < e.sec) continue;
      e.done = true;
      if (e.pln != null) { this.pln = e.pln; this.msg(this.pln ? 'Listrik PLN pulih' : 'Listrik PLN padam'); }
      if (e.genset != null) { this.genset = e.genset; this.msg(this.genset ? 'Genset menyala' : 'Genset mati'); }
      if (e.upsFail != null) { this.upsFail = e.upsFail; this.msg(this.upsFail ? 'UPS gagal' : 'UPS pulih'); }
    }
    if (dt > 0 && dt < 3600 && !this.upsFail) {
      const step = 100 * dt / (this.batteryMin * 60);
      if (this.pln || this.genset) this.battery = Math.min(100, this.battery + step / 2);
      else this.battery = Math.max(0, this.battery - step);
    }
    const empty = !this.pln && !this.genset && this.battery <= 0;
    if (empty && !this.warnedEmpty) { this.warnedEmpty = true; this.msg('Baterai habis, catudaya padam'); }
    if (!empty) this.warnedEmpty = false;
  }
  msg(m) { this.message = this.message == null ? m : this.message + '; ' + m; }
  consume() { const m = this.message; this.message = null; return m; }
  onBattery() { return !this.pln && !this.genset && !this.upsFail && this.battery > 0; }
  upsOn() { return !this.upsFail && (this.pln || this.genset || this.battery > 0); }
  isUpsFail() { return this.upsFail || (!this.pln && !this.genset && this.battery <= 0); }
  isPower() { return this.pln || this.genset || this.onBattery(); }
  isNormal() { return this.pln && !this.upsFail; }
  source() { if (this.pln) return 'PLN'; if (this.genset) return 'GENSET'; if (this.onBattery()) return 'BATERAI'; return 'TIDAK ADA'; }
  toJson() { return { pln: this.pln, genset: this.genset, upsFail: this.upsFail, battery: this.battery, lastSec: this.lastSec, warnedEmpty: this.warnedEmpty, done: this.events.map(e => e.done) }; }
  restore(o) {
    if (!o) return;
    this.pln = J.bool(o, 'pln', true); this.genset = J.bool(o, 'genset', false); this.upsFail = J.bool(o, 'upsFail', false);
    this.battery = J.num(o, 'battery', 100); this.lastSec = J.num(o, 'lastSec', -1); this.warnedEmpty = J.bool(o, 'warnedEmpty', false); this.message = null;
    const d = J.arr(o, 'done') || [];
    for (let i = 0; i < this.events.length && i < d.length; i++) this.events[i].done = !!d[i];
  }
}

// =====================================================================
//  BlockSignalManager
// =====================================================================
class BlockSignalManager {
  constructor(game) { this.g = game; this.tick = 0; }
  update(trains) {
    const g = this.g, geo = g.geo, pb = g.pb;
    if (++this.tick % 4 !== 0) return;
    const sigs = J.arr(geo.data, 'signals') || [];
    const occupied = new Set();
    for (const t of trains) t.occupied(geo).forEach(id => occupied.add(id));
    for (const b of sigs) {
      try {
        if (!b || sigType(b) !== 'BLOCK') continue;
        const tb = J.int(b, 'onTrack', -1), down = sigDown(b);
        const near = this.sameTrackSignalAhead(b, tb, down);
        if (near != null) {
          let aspect = 'RED';
          if (!this.headPast(trains, b, tb, down)) aspect = J.eqi(g.sigState(near), 'RED') ? 'YELLOW' : 'GREEN';
          b.state = aspect;
          continue;
        }
        const res = pb.build(b);
        let aspect = 'RED';
        if (res) {
          let busy = false;
          for (let k = 1; k < res.path.length; k++) if (occupied.has(res.path[k])) { busy = true; break; }
          if (!busy && this.headPast(trains, b, tb, down)) busy = true;
          if (!busy) {
            if (res.endType === 'SINYAL') aspect = J.eqi(g.sigState(res.endSignalId), 'RED') ? 'YELLOW' : 'GREEN';
            else if (res.endType === 'END') aspect = 'GREEN';
          }
          if (aspect !== 'RED' && g.isBlockedByOtherRoute(J.str(b, 'id', ''), res.path)) aspect = 'RED';
        }
        b.state = aspect;
        if (res) {
          let free = true;
          for (let k = 1; k < res.path.length; k++) if (occupied.has(res.path[k])) { free = false; break; }
          if (free && g.isBlockedByOtherRoute(J.str(b, 'id', ''), res.path)) free = false;
          const passed = this.headPast(trains, b, tb, down);
          if (free && (aspect !== 'RED' || passed)) this.extendWaiting(trains, b, tb, down, res.path);
        }
      } catch (e) { console.warn('BLK', e); }
    }
    this.extendUnsignaled(trains, occupied);
  }
  headPast(trains, b, tb, down) {
    const prog = this.g.geo.sigProgress(b, tb, down);
    for (const t of trains) {
      if (t.curId !== tb) continue;
      if ((t.mode === 'NORMAL') !== down) continue;
      if (t.prog > prog + 0.02) return true;
    }
    return false;
  }
  extendWaiting(trains, b, tb, down, path) {
    for (const t of trains) {
      if (t.finished || t.curId !== tb) continue;
      if ((t.mode === 'NORMAL') !== down) continue;
