    }
    if (this.prog >= 1) {
      const last = this.idx + 1 >= this.path.length;
      if (last) { this.prog = 1; this.speed = 0; }
      else { this.prog = 0; this.idx++; this.notePlatformEntry(geo, this.curId); }
      if (last) {
        this.finished = true;
        this.log(simTime, `[${this.no} ${this.name}] Keluar seksi stasiun`, 'green');
        if (this.game) this.game.onFinished(this);
      }
    }
  }

  // ---- posisi gerbong ----
  locate(geo, metersBack) {
    let off = this.prog, ti = this.idx;
    while (metersBack > 0 && ti >= 0 && ti < this.path.length) {
      const len = geo.meters(this.path[ti]);
      const av = off * len;
      if (metersBack <= av) { off -= metersBack / len; metersBack = 0; }
      else { metersBack -= av; ti--; off = 1; }
    }
    return [ti, Math.max(0, off)];
  }
  tailPos(geo) { return this.locate(geo, this.totalLen()); }
  occupied(geo) {
    const out = [];
    let tail = this.tailPos(geo)[0];
    if (tail < 0) tail = 0;
    for (let i = tail; i <= this.idx && i < this.path.length; i++) out.push(this.path[i]);
    return out;
  }
  posOnTrack(geo, tid, p) {
    const c = geo.c(tid);
    if (!c) return null;
    const flip = this.mode === 'REVERSE' && c[1] < c[3];
    const q = flip ? 1 - p : p;
    const sg = flip ? -1 : 1;
    return { x: c[0] + (c[2] - c[0]) * q, y: c[1] + (c[3] - c[1]) * q, dx: (c[2] - c[0]) * sg, dy: (c[3] - c[1]) * sg };
  }
  carPositions(geo) {
    const out = [];
    for (let i = 0; i < this.cars; i++) {
      const [ti, off] = this.locate(geo, this.centerBack(i));
      if (ti >= 0 && ti < this.path.length) {
        const tid = this.path[ti];
        const p = this.posOnTrack(geo, tid, off);
        if (p) { p.trackId = tid; p.loco = this.isLocoIndex(i); p.body = this.vehLen(i); out.push(p); }
      }
    }
    if (!out.length) out.push({ x: this.x, y: this.y, dx: 0, dy: 1, trackId: -1, loco: true, body: 20 });
    return out;
  }
  updateCoords(geo) {
    const p = this.posOnTrack(geo, this.curId, this.prog);
    if (p) { this.x = p.x; this.y = p.y; }
  }

  // ---- rute & leg ----
  reverseOnto(exitPath, geo) {
    if (!exitPath || !exitPath.length) return false;
    if (exitPath[0] !== this.curId) return false;
    const tail = this.tailPos(geo);
    const tailProg = tail[0] >= this.idx ? tail[1] : 0;
    this.mode = this.mode === 'NORMAL' ? 'REVERSE' : 'NORMAL';
    this.path = exitPath.slice(); this.idx = 0; this.prog = Math.min(0.82, 1 - tailProg);
    this.speed = 0; this.stationStop = false; this.reversed = true; this.clearPermit(); this.masinis.reset();
    return true;
  }
  startLeg(no, name, arr, dep, platform, tb, exit) {
    this.no = no; this.name = name; this.arr = arr; this.dep = dep; this.target = platform;
    this.stationStop = platform > 0; this.hasDeparted = false; this.reversed = false; this.held = 0;
    this.turnback = tb; this.exitTrack = exit; this.terminate = false; this.masinis.reset();
  }
  followSwitches(pb) {
    if (this.manual || this.stopped || !pb || this.finished || this.shuntPlan) return;
    const i = this.idx;
    if (i < 0 || i + 1 >= this.path.length) return;
    const down = this.mode === 'NORMAL';
    const prefix = this.path.slice(0, i + 1);
    const planned = this.path[i + 1];
    const actual = pb.nextAfter(prefix, down);
    if (actual === -1 || actual === planned) return;
    prefix.push(actual);
    this.path = pb.extendFrom(prefix, down);
  }
  cancelExitPath(routeTracks) {
    if (!routeTracks || !routeTracks.length) return;
    const first = this.path.indexOf(routeTracks[0]);
    const cut = Math.max(first, this.idx) + 1;
    if (this.path.length > cut) this.path.length = cut;
  }

  // ---- lepas / sambung loko & manual ----
  flip(geo) {
    const tail = this.tailPos(geo);
    let ti = tail[0], tp = tail[1];
    if (ti < 0) { ti = 0; tp = 0; }
    const hi = Math.min(this.idx, this.path.length - 1);
    const np = [];
    for (let i = hi; i >= ti; i--) np.push(this.path[i]);
    this.mode = this.mode === 'NORMAL' ? 'REVERSE' : 'NORMAL';
    if (this.hasLoco && this.cars > 1) this.locoRear = !this.locoRear;
    this.path = np; this.idx = np.length - 1; this.prog = Math.max(0, Math.min(1, 1 - tp));
    this.speed = 0; this.clearPermit(); this.masinis.reset();
  }
  splitLoco(geo) {
    if (!this.hasLoco || this.cars <= 1 || this.finished) return null;
    const total = this.totalLen();
    const loco = new Train('LOK ' + this.no, 'Lokomotif', '--:--', '--:--', this.path.slice(), this.mode, -1);
    loco.cars = 1; loco.locoM = this.locoM; loco.carM = this.carM; loco.gapM = this.gapM;
    loco.freight = this.freight; loco.accel = this.accel; loco.x = this.x; loco.y = this.y; loco.game = this.game;
    loco.decel = this.decel; loco.powerHp = this.mu ? -1 : this.powerHp; loco.locoTon = this.locoTon; loco.trId = this.trId; loco.horn = this.horn;
    if (this.locoRear) {
      let [ti, off] = this.locate(geo, total - this.locoM);
      if (ti < 0) { ti = 0; off = 0; }
      if (loco.path.length > ti + 1) loco.path.length = ti + 1;
      loco.idx = ti; loco.prog = off;
    } else {
      loco.idx = this.idx; loco.prog = this.prog;
      let [ti, off] = this.locate(geo, this.locoM + this.gapM);
      if (ti < 0) { ti = 0; off = 0; }
      if (this.path.length > ti + 1) this.path.length = ti + 1;
      this.idx = ti; this.prog = off;
    }
    loco.beginManual();
    this.hasLoco = false; this.locoRear = false; this.cars -= 1; this.manual = false; this.manualDir = 0;
    this.stopped = true; this.waitSig = false; this.speed = 0;
    return loco;
  }
  mergeLoco(loco, merged, headIdx, headProg) {
    this.path = merged; this.idx = headIdx; this.prog = headProg;
    this.locoM = loco.locoM; this.gapM = loco.gapM; this.accel = loco.accel;
    if (loco.powerHp > 0) { this.powerHp = loco.powerHp; this.locoTon = loco.locoTon; this.trId = loco.trId; this.mu = false; this.decel = Math.min(this.decel, loco.decel); }
    this.hasLoco = true; this.cars += 1; this.stopped = false; this.locoRear = false;
    this.manual = false; this.manualDir = 0; this.speed = 0; this.masinis.reset();
  }
  beginManual() {
    this.endShunt(); this.clearPermit();
    if (this.scheduled && this.target > 0) this.schedPlat = this.target;
    this.manual = true; this.manualDir = 0; this.facingFwd = true; this.waitSig = false; this.stopped = false; this.speed = 0;
    if (this.coachCount() === 0) {
      this.stationStop = false; this.served = this.curId; this.dwell = false; this.waitDep = false; this.target = -1;
    }
    if (this.path.length > this.idx + 1) this.path.length = this.idx + 1;
  }
  endManual() { if (this.locoRear) return false; this.manual = false; this.manualDir = 0; this.speed = 0; return true; }
  setManualDir(d) { this.manualDir = Math.max(-1, Math.min(1, d)); }
  changeManualKmh(d) { this.manualKmh = Math.max(5, Math.min(40, this.manualKmh + d)); }
  manualPrepare(geo) {
    if (this.manualDir !== 0 && this.facingFwd !== (this.manualDir > 0) && this.speed < 0.3) {
      this.flip(geo); this.facingFwd = this.manualDir > 0;
    }
  }
  advanceManual(geo, pb, limit, dt, gapAhead, couplable, simTime) {
    if (this.finished) return;
    this.lastSim = simTime;
    const down = this.mode === 'NORMAL';
    let tailIdx = this.tailPos(geo)[0];
    while (tailIdx > 1 && this.idx > 0) { this.path.shift(); this.idx--; tailIdx--; }
    if (this.path.length > this.idx + 1) this.path.length = this.idx + 1;
    const nx = pb ? pb.nextAfter(this.path, down) : -1;
    if (nx !== -1) this.path.push(nx);
    const cur = this.curId;
    const len = geo.meters(cur);
    const onEnd = geo.isEnd(cur);
    const deadEnd = nx === -1 && !onEnd;
    const buffered = deadEnd && geo.hasBuffer(cur);
    const stopProg = Math.max(0, 1 - BUFFER_STOP_M / len);
    const wantMove = this.manualDir !== 0 && this.facingFwd === (this.manualDir > 0);
    let target = wantMove ? Math.min(this.manualKmh, limit > 0 ? limit : 30) : 0;
    if (gapAhead < 1e8) {
      const room = gapAhead - (couplable ? 0.5 : 2.0);
      target = Math.min(target, room <= 0 ? 0 : Masinis.curve(0, room, this.decel));
    }
    if (buffered) target = Math.min(target, Masinis.curve(0, Math.max(0, (stopProg - this.prog) * len), this.decel));
    if (this.speed < target) this.speed = Math.min(target, this.speed + this.accelNow() * dt);
    else if (this.speed > target) this.speed = Math.max(target, this.speed - this.decel * 1.5 * dt);
    if (this.speed < 0.01) { this.speed = 0; return; }
    const sig = this.nextSignalObject(geo);
    const sigProg = sig ? geo.sigProgress(sig, cur, this.mode !== 'REVERSE') : 0;
    const preIdx = this.idx;
    this.prog += (this.speed / 3.6 / len) * dt * 2;
    if (buffered && this.prog >= stopProg) { this.prog = stopProg; this.speed = 0; }
    if (this.prog >= 1) {
      if (this.idx + 1 < this.path.length) { this.prog = 0; this.idx++; this.notePlatformEntry(geo, this.curId); }
      else if (onEnd) { this.prog = 1; this.speed = 0; this.finished = true; this.log(simTime, `[${this.no}] Keluar seksi stasiun`, 'green'); }
      else if (buffered) { this.prog = stopProg; this.speed = 0; }
      else { this.prog = 1; this.speed = 0; this.ranOff = true; }
    }
    if (sig && sigType(sig) !== 'REPEATER') {
      const st = J.str(sig, 'state', 'RED');
      const red = !J.eqi(st, 'GREEN') && !J.eqi(st, 'YELLOW');
      const passed = this.idx !== preIdx || this.prog > sigProg + 0.02;
      if (red && passed) this.spad = J.str(sig, 'id', '?');
    }
  }

  // ---- simpan / muat ----
  toJson() {
    return {
      no: this.no, name: this.name, arr: this.arr, dep: this.dep, mode: this.mode, path: this.path.slice(), idx: this.idx, prog: this.prog,
      x: this.x, y: this.y, spd: this.speed, accel: this.accel, decel: this.decel, plat: this.target, stationStop: this.stationStop,
      dwell: this.dwell, waitDep: this.waitDep, waitSig: this.waitSig, finished: this.finished, stopped: this.stopped, lastSim: this.lastSim,
      departed: this.hasDeparted, turnback: this.turnback, exitTrack: this.exitTrack, reversed: this.reversed, hasLoco: this.hasLoco,
      manual: this.manual, manualDir: this.manualDir, manualKmh: this.manualKmh, facingFwd: this.facingFwd, locoRear: this.locoRear,
      locoM: this.locoM, carM: this.carM, gapM: this.gapM, freight: this.freight, cars: this.cars, held: this.held, arrPlat: this.arrPlat,
      arrOver: this.arrOver, scheduled: this.scheduled, schedPlat: this.schedPlat, served: this.served, terminate: this.terminate,
      pass: this.passages.map(p => ({ t: p.trackId, at: p.time, s: p.stopped })),
      permit: this.permitSig, permitIdx: this.permitUntil,
      hp: this.powerHp, locoTon: this.locoTon, carTon: this.carTon, tonO: this.tonO, mu: this.mu, unitHp: this.unitHp, trId: this.trId, horn: this.horn,
    };
  }
  static fromJson(o) {
    const t = new Train(J.str(o, 'no', 'KA'), J.str(o, 'name', ''), J.str(o, 'arr', '--:--'), J.str(o, 'dep', '--:--'),
      (J.arr(o, 'path') || []).map(v => Number(v)), J.str(o, 'mode', 'NORMAL'), J.int(o, 'plat', -1));
    const n = (k, d) => J.num(o, k, d), b = (k, d) => J.bool(o, k, d);
    t.idx = J.int(o, 'idx', 0); t.prog = n('prog', 0); t.x = n('x', 0); t.y = n('y', 0); t.speed = n('spd', 0);
    t.accel = n('accel', 2.1); t.decel = n('decel', Traction.LEGACY_BRAKE_KMH_S);
    t.powerHp = n('hp', -1); t.locoTon = n('locoTon', -1); t.carTon = n('carTon', -1); t.tonO = n('tonO', -1); t.mu = b('mu', false); t.unitHp = n('unitHp', -1); t.trId = J.str(o, 'trId', ''); t.horn = J.str(o, 'horn', ''); t.stationStop = b('stationStop', false); t.dwell = b('dwell', false);
    t.waitDep = b('waitDep', false); t.waitSig = b('waitSig', false); t.finished = b('finished', false); t.stopped = b('stopped', false);
    t.lastSim = J.str(o, 'lastSim', ''); t.hasDeparted = b('departed', false); t.turnback = b('turnback', false);
    t.exitTrack = J.int(o, 'exitTrack', -1); t.reversed = b('reversed', false); t.hasLoco = b('hasLoco', true); t.manual = b('manual', false);
    t.manualDir = J.int(o, 'manualDir', 0); t.manualKmh = n('manualKmh', 15); t.facingFwd = b('facingFwd', true); t.locoRear = b('locoRear', false);
    t.locoM = n('locoM', 17); t.carM = n('carM', 20); t.gapM = n('gapM', 1); t.freight = b('freight', false); t.cars = J.int(o, 'cars', PASSENGER_CARS);
    t.held = n('held', 0); t.arrPlat = J.int(o, 'arrPlat', -1); t.arrOver = n('arrOver', 0); t.scheduled = b('scheduled', false);
    t.schedPlat = J.int(o, 'schedPlat', -1); t.served = J.int(o, 'served', -1); t.terminate = b('terminate', false);
    if (J.has(o, 'permit')) { t.permitSig = J.str(o, 'permit'); t.permitUntil = J.int(o, 'permitIdx', -1); }
    for (const p of (J.arr(o, 'pass') || [])) t.passages.push({ trackId: J.int(p, 't', -1), time: J.str(p, 'at', '--:--'), stopped: J.bool(p, 's', false) });
    return t;
  }
}

// =====================================================================
//  Coupling
// =====================================================================
const Coupling = {
  GAP_M: 1.5,
  toS(geo, id, p, rev) { const c = geo.c(id); return (c && rev && c[1] < c[3]) ? 1 - p : p; },
  sign(geo, id, rev) { const c = geo.c(id); return (c && rev && c[1] < c[3]) ? -1 : 1; },
  spans(t, geo) {
    const m = new Map();
    const p = t.path, rev = t.mode === 'REVERSE';
    const head = Math.min(t.idx, p.length - 1);
    let [tail, tailProg] = t.tailPos(geo);
    if (tail < 0) { tail = 0; tailProg = 0; }
    for (let i = tail; i <= head; i++) {
      const lo = i === tail ? tailProg : 0, hi = i === head ? t.prog : 1;
      const a = this.toS(geo, p[i], lo, rev), b = this.toS(geo, p[i], hi, rev);
      m.set(p[i], [Math.min(a, b), Math.max(a, b)]);
    }
    return m;
  },
  isHeadEnd(o, tid, nearS, geo) {
    const rev = o.mode === 'REVERSE';
    let dHead = 9, dTail = 9;
    if (o.curId === tid) dHead = Math.abs(nearS - this.toS(geo, tid, o.prog, rev));
    let [ti, tp] = o.tailPos(geo);
    if (ti < 0) { ti = 0; tp = 0; }
    if (ti < o.path.length && o.path[ti] === tid) dTail = Math.abs(nearS - this.toS(geo, tid, tp, rev));
    return dHead <= dTail;
  },
  gapTo(loco, other, geo) {
    const lp = loco.path, cur = loco.idx;
    if (cur < 0 || cur >= lp.length) return null;
    const rev = loco.mode === 'REVERSE';
    const sp = this.spans(other, geo);
    if (!sp.size) return null;
    let onPath = false;
    for (let i = cur; i < lp.length && !onPath; i++) onPath = sp.has(lp[i]);
    if (!onPath) return null;
    let acc = 0;
    for (let i = cur; i < lp.length; i++) {
      const id = lp[i], len = geo.meters(id), sg = this.sign(geo, id, rev);
      const sCur = i === cur ? this.toS(geo, id, loco.prog, rev) : (sg > 0 ? 0 : 1);
      const s = sp.get(id);
      if (s) {
        const ahead = sg > 0 ? s[1] >= sCur - 1e-9 : s[0] <= sCur + 1e-9;
        if (ahead) {
          const nearS = sg > 0 ? Math.max(s[0], sCur) : Math.min(s[1], sCur);
          return { meters: acc + Math.abs(nearS - sCur) * len, other, pathIdx: i, nearIsHead: this.isHeadEnd(other, id, nearS, geo) };
        }
      }
      acc += (sg > 0 ? 1 - sCur : sCur) * len;
    }
    return null;
  },
  nearestAhead(loco, all, geo) {
    let best = { meters: Infinity, other: null, pathIdx: -1, nearIsHead: true };
    for (const o of all) {
      if (o === loco || o.finished) continue;
      const g = this.gapTo(loco, o, geo);
      if (g && g.meters < best.meters) best = g;
    }
    return best;
  },
  couple(loco, g, geo) {
    if (!loco || !g || !g.other) return false;
    const rake = g.other;
    const lp = loco.path.slice(), cur = loco.idx, idxR = g.pathIdx;
    if (idxR < cur || idxR >= lp.length) return false;
    if (!g.nearIsHead) rake.flip(geo);
    loco.flip(geo);
    const merged = rake.path.slice(0, rake.idx + 1);
    for (let k = idxR - 1; k > cur; k--) merged.push(lp[k]);
    const lf = loco.path;
    for (let i = 0; i < lf.length; i++) {
      if (i === 0 && merged.length && merged[merged.length - 1] === lf[0]) continue;
      merged.push(lf[i]);
    }
    rake.mergeLoco(loco, merged, merged.length - 1, loco.prog);
    return true;
  },
};

// =====================================================================
//  AxleCounter (okupansi titik pangkal wesel)
// =====================================================================
const AxleCounter = {
  occupancy(trains, geo) {
    const m = new Map();
    for (const t of trains) {
      if (t.finished || !t.path.length) continue;
      const rev = t.mode === 'REVERSE';
      const head = Math.min(t.idx, t.path.length - 1);
      let [tail, tp] = t.tailPos(geo);
      if (tail < 0) { tail = 0; tp = 0; }
      for (let i = tail; i <= head; i++) {
        const lo = i === tail ? tp : 0, hi = i === head ? t.prog : 1;
        const id = t.path[i];
        const a = Coupling.toS(geo, id, lo, rev), b = Coupling.toS(geo, id, hi, rev);
        if (!m.has(id)) m.set(id, []);
        m.get(id).push([Math.min(a, b), Math.max(a, b), t]);
      }
    }
    return m;
  },
  nearPivot(occ, geo, tid, pv, marginM) {
    const l = occ.get(tid);
    if (!l || !pv) return false;
    const c = geo.c(tid);
    if (!c) return false;
    const d0 = Math.hypot(c[0] - pv[0], c[1] - pv[1]), d1 = Math.hypot(c[2] - pv[0], c[3] - pv[1]);
    const sp = d0 <= d1 ? 0 : 1;
    const ms = marginM / geo.meters(tid);
    for (const r of l) if (r[1] >= sp - ms && r[0] <= sp + ms) return true;
    return false;
  },
};

// =====================================================================
//  Bagian 3: ScoreManager, TrainLogger, PowerSupply, BlockSignal, AspectCascade
// =====================================================================
class Perf {
  constructor(no, name) {
    this.no = no; this.name = name;
    this.schSpawn = 0; this.schArr = 0; this.schDep = 0; this.target = -1; this.schExit = -1; this.through = false; this.partial = false;
    this.spawn = -1; this.arr = -1; this.dep = -1; this.exit = -1; this.plat = -1; this.exitTrack = -1; this.overhang = 0; this.heldSec = 0;
    this.closed = false; this.bonus = 0; this.score = 0; this.fb = [];
  }
  maxScore() { let m = 50; if (!this.partial) { m += 100; if (this.schExit > 0) m += 50; } if (!this.through) m += 400; return m; }
  platformOk() { if (this.target <= 0) return true; return this.plat === this.target || SN.isAllowedPlatform(this.no, this.plat); }
  isOnTime() {
    if (this.heldSec > 30) return false;
    if (this.schExit > 0 && this.exitTrack !== this.schExit) return false;
    if (this.through) return true;
    if (this.arr === -1 || this.dep === -1) return false;
    if (Math.abs(this.arr - this.schArr) > 30) return false;
    if (Math.abs(this.dep - this.schDep) > 15) return false;
    return this.platformOk();
  }
  add(p, l) { this.score += p; this.fb.push(l + ' (' + (p >= 0 ? '+' : '') + p + ')'); }
  calc() {
    this.score = 0; this.fb = [];
    if (this.spawn !== -1) {
      const d = Math.abs(this.spawn - this.schSpawn);
      if (d <= 30) this.add(50, 'Muncul tepat waktu');
      else this.add(Math.max(0, 50 - Math.trunc(d / 10) * 2), 'Muncul terlambat ' + d + 's');
    } else if (this.closed) this.add(-100, 'Tidak terlayani');
    if (!this.through && this.spawn !== -1) {
      if (this.arr !== -1) {
        const d = this.arr - this.schArr, a = Math.abs(d);
        if (a <= 30) this.add(150, 'Tiba tepat waktu');
        else this.add(Math.max(0, 150 - a), 'Tiba ' + (d > 0 ? 'terlambat ' : 'awal ') + a + 's');
      }
      if (this.plat !== -1) {
        if (this.target > 0 && this.plat === this.target) this.add(100, 'Peron benar');
        else if (this.target > 0 && this.platformOk()) this.add(100, 'Peron benar (pilihan T' + this.plat + ')');
        else if (this.target > 0) this.add(-50, 'Salah peron (T' + this.plat + ', jadwal T' + this.target + ')');
        if (this.overhang > 3) this.add(-Math.min(100, Math.trunc((this.overhang - 3) * 5)), 'Rangkaian keluar peron ' + Math.round(this.overhang) + ' m');
      } else if (this.closed) this.add(-200, 'Melewati peron tujuan');
      if (this.dep !== -1) {
        const d = this.dep - this.schDep;
        if (d < -5) this.add(-200, 'PELANGGARAN: berangkat prematur');
        else if (Math.abs(d) <= 15) this.add(150, 'Berangkat tepat waktu');
        else this.add(Math.max(0, 150 - d), 'Berangkat terlambat ' + d + 's');
      }
    }
    if (!this.partial) {
      if (this.exit !== -1) {
        this.add(100, 'Keluar seksi');
        if (this.schExit > 0 && this.exitTrack > 0) {
          if (this.exitTrack === this.schExit) this.add(50, 'Keluar lewat track benar (T' + this.exitTrack + ')');
          else this.add(-200, 'Salah track keluar (T' + this.exitTrack + ', jadwal T' + this.schExit + ')');
        }
        if (this.heldSec > 30) this.add(-Math.min(100, Math.trunc((this.heldSec - 30) / 3)), 'Tertahan sinyal ' + Math.round(this.heldSec) + ' s');
        if (this.bonus > 0) this.add(this.bonus, 'Combo tepat waktu');
      } else if (this.closed && this.spawn !== -1) this.add(-50, 'Belum keluar seksi');
    }
  }
}

class ScoreManager {
  constructor(logger) { this.list = []; this.total = 0; this.streak = 0; this.logger = logger; this.failed = false; this.failReason = ''; }
  fail(r) { this.failed = true; this.failReason = r; this.list.forEach(p => p.calc()); this.recalc(); }
  register(no, name, spawn, arr, dep, target, exit, through) {
    const p = new Perf(no, name);
    p.schSpawn = parseSec(spawn); p.schArr = parseSec(arr); p.schDep = parseSec(dep);
    p.target = target; p.schExit = exit; p.through = through;
    this.list.push(p);
    return p;
  }
  get(no) { return this.list.find(p => J.eqi(p.no, no)) || null; }
  logSpawn(no, t) { const p = this.get(no); if (p && p.spawn === -1) { p.spawn = parseSec(t); this.refresh(p, t); } }
  logArrival(no, t) { const p = this.get(no); if (p && p.arr === -1) { p.arr = parseSec(t); this.refresh(p, t); } }
  logPlatform(no, plat, over, t) { const p = this.get(no); if (p && p.plat === -1) { p.plat = plat; p.overhang = over; this.refresh(p, t); } }
  logDeparture(no, t) { const p = this.get(no); if (p && p.dep === -1) { p.dep = parseSec(t); this.refresh(p, t); } }
  logExitTime(no, t) { const p = this.get(no); if (p && p.exit === -1) p.exit = parseSec(t); }
  logExit(no, t, exitTrack, held) {
    const p = this.get(no);
    if (!p || p.bonus !== 0 || p.exitTrack !== -1) return;
    if (p.exit === -1) p.exit = parseSec(t);
    p.exitTrack = exitTrack; p.heldSec = held;
    if (p.isOnTime()) { this.streak++; p.bonus = this.streak >= 2 ? Math.min(4, this.streak - 1) * 25 : 0; }
    else this.streak = 0;
    this.refresh(p, t);
  }
  finalizeAll() { for (const p of this.list) { p.closed = true; p.calc(); } this.recalc(); }
  refresh(p, t) {
    const before = p.fb.slice();
    p.calc(); this.recalc();
    if (!this.logger) return;
    for (const f of p.fb) {
      if (before.includes(f)) continue;
      const bad = f.includes('(-') || f.startsWith('PELANGGARAN');
      this.logger.add(t, '[' + p.no + '] ' + f, bad ? 'red' : 'green');
    }
  }
  recalc() { this.total = this.list.reduce((a, p) => a + p.score, 0); }
  maxScore() { return this.list.reduce((a, p) => a + p.maxScore(), 0); }
  percent() { const m = this.maxScore(); return m > 0 ? Math.round(this.total * 100 / m) : 0; }
  grade() {
    if (this.failed) return 'GAGAL';
    const p = this.percent();
    if (p >= 90) return 'S (PERFECT DISPATCHER)';
    if (p >= 75) return 'A (EXCELLENT)';
    if (p >= 60) return 'B (GOOD)';
    if (p >= 40) return 'C (SATISFACTORY)';
    return 'D (NEED IMPROVEMENT)';
  }
  toJson() {
    return {
      perf: this.list.map(p => ({ no: p.no, spawn: p.spawn, arr: p.arr, dep: p.dep, exit: p.exit, plat: p.plat, exitTrack: p.exitTrack, overhang: p.overhang, held: p.heldSec, closed: p.closed, bonus: p.bonus })),
      streak: this.streak, failed: this.failed, failReason: this.failReason,
    };
  }
  restore(o) {
    if (!o) return;
    const arr = J.arr(o, 'perf') || [];
    for (let i = 0; i < arr.length && i < this.list.length; i++) {
      const q = arr[i], p = this.list[i];
      if (!q || !J.eqi(p.no, J.str(q, 'no', ''))) continue;
      p.spawn = J.num(q, 'spawn', -1); p.arr = J.num(q, 'arr', -1); p.dep = J.num(q, 'dep', -1); p.exit = J.num(q, 'exit', -1);
      p.plat = J.int(q, 'plat', -1); p.exitTrack = J.int(q, 'exitTrack', -1); p.overhang = J.num(q, 'overhang', 0); p.heldSec = J.num(q, 'held', 0);
      p.closed = J.bool(q, 'closed', false); p.bonus = J.int(q, 'bonus', 0);
    }
    this.streak = J.int(o, 'streak', 0); this.failed = J.bool(o, 'failed', false); this.failReason = J.str(o, 'failReason', '');
    this.list.forEach(p => p.calc()); this.recalc();
  }
}

class TrainLogger {
  constructor() { this.entries = []; this.max = 120; this.version = 0; }
  add(time, text, color) {
    this.entries.unshift({ time: (time || '').substring(0, 5), text, color: color || 'white' });
    if (this.entries.length > this.max) this.entries.length = this.max;
    this.version++;
  }
  clear() { this.entries = []; this.version++; }
  toJson() { return this.entries.slice(0, 60); }
  fromJson(a) { this.entries = Array.isArray(a) ? a.slice() : []; this.version++; }
}

class PowerSupply {
  constructor() { this.load(null); }
  load(data) {
    this.lastData = data; this.events = []; this.pln = true; this.genset = false; this.upsFail = false;
    this.battery = 100; this.batteryMin = 30; this.lastSec = -1; this.message = null; this.warnedEmpty = false;
    const p = data && typeof data.power === 'object' ? data.power : null;
    if (!p) return;
    this.batteryMin = Math.max(1, J.num(p, 'battery_min', 30) || 30);
    for (const o of (J.arr(p, 'events') || [])) {
      if (!o) continue;
      this.events.push({
        sec: parseSec(toHHmm(J.str(o, 't', ''))),
        pln: J.has(o, 'pln') ? J.bool(o, 'pln') : null,
        genset: J.has(o, 'genset') ? J.bool(o, 'genset') : null,
        upsFail: J.has(o, 'ups_fail') ? J.bool(o, 'ups_fail') : null,
        done: false,
      });
    }
  }
  update(now) {
    if (this.lastSec < 0) this.lastSec = now;
    const dt = ((now - this.lastSec) % 86400 + 86400) % 86400;
    this.lastSec = now;
    for (const e of this.events) {
      if (e.done || now < e.sec) continue;
      e.done = true;
      if (e.pln != null) { this.pln = e.pln; this.msg(this.pln ? 'Listrik PLN pulih' : 'Listrik PLN padam'); }
      if (e.genset != null) { this.genset = e.genset; this.msg(this.genset ? 'Genset menyala' : 'Genset mati'); }
      if (e.upsFail != null) { this.upsFail = e.upsFail; this.msg(this.upsFail ? 'UPS gagal' : 'UPS pulih'); }
    }
    if (dt > 0 && dt < 3600 && !this.upsFail) {
      const step = 100 * dt / (this.batteryMin * 60);
      if (this.pln || this.genset) this.battery = Math.min(100, this.battery + step / 2);
      else this.battery = Math.max(0, this.battery - step);
    }
    const empty = !this.pln && !this.genset && this.battery <= 0;
    if (empty && !this.warnedEmpty) { this.warnedEmpty = true; this.msg('Baterai habis, catudaya padam'); }
    if (!empty) this.warnedEmpty = false;
  }
  msg(m) { this.message = this.message == null ? m : this.message + '; ' + m; }
  consume() { const m = this.message; this.message = null; return m; }
  onBattery() { return !this.pln && !this.genset && !this.upsFail && this.battery > 0; }
  upsOn() { return !this.upsFail && (this.pln || this.genset || this.battery > 0); }
  isUpsFail() { return this.upsFail || (!this.pln && !this.genset && this.battery <= 0); }
  isPower() { return this.pln || this.genset || this.onBattery(); }
  isNormal() { return this.pln && !this.upsFail; }
  source() { if (this.pln) return 'PLN'; if (this.genset) return 'GENSET'; if (this.onBattery()) return 'BATERAI'; return 'TIDAK ADA'; }
  toJson() { return { pln: this.pln, genset: this.genset, upsFail: this.upsFail, battery: this.battery, lastSec: this.lastSec, warnedEmpty: this.warnedEmpty, done: this.events.map(e => e.done) }; }
  restore(o) {
    if (!o) return;
    this.pln = J.bool(o, 'pln', true); this.genset = J.bool(o, 'genset', false); this.upsFail = J.bool(o, 'upsFail', false);
    this.battery = J.num(o, 'battery', 100); this.lastSec = J.num(o, 'lastSec', -1); this.warnedEmpty = J.bool(o, 'warnedEmpty', false); this.message = null;
    const d = J.arr(o, 'done') || [];
    for (let i = 0; i < this.events.length && i < d.length; i++) this.events[i].done = !!d[i];
  }
}

// =====================================================================
//  BlockSignalManager
// =====================================================================
class BlockSignalManager {
  constructor(game) { this.g = game; this.tick = 0; }
  update(trains) {
    const g = this.g, geo = g.geo, pb = g.pb;
    if (++this.tick % 4 !== 0) return;
    const sigs = J.arr(geo.data, 'signals') || [];
    const occupied = new Set();
    for (const t of trains) t.occupied(geo).forEach(id => occupied.add(id));
    for (const b of sigs) {
      try {
        if (!b || sigType(b) !== 'BLOCK') continue;
        const tb = J.int(b, 'onTrack', -1), down = sigDown(b);
        const near = this.sameTrackSignalAhead(b, tb, down);
        if (near != null) {
          let aspect = 'RED';
          if (!this.headPast(trains, b, tb, down)) aspect = J.eqi(g.sigState(near), 'RED') ? 'YELLOW' : 'GREEN';
          b.state = aspect;
          continue;
        }
        const res = pb.build(b);
        let aspect = 'RED';
        if (res) {
          let busy = false;
          for (let k = 1; k < res.path.length; k++) if (occupied.has(res.path[k])) { busy = true; break; }
          if (!busy && this.headPast(trains, b, tb, down)) busy = true;
          if (!busy) {
            if (res.endType === 'SINYAL') aspect = J.eqi(g.sigState(res.endSignalId), 'RED') ? 'YELLOW' : 'GREEN';
            else if (res.endType === 'END') aspect = 'GREEN';
          }
          if (aspect !== 'RED' && g.isBlockedByOtherRoute(J.str(b, 'id', ''), res.path)) aspect = 'RED';
        }
        b.state = aspect;
        if (res) {
          let free = true;
          for (let k = 1; k < res.path.length; k++) if (occupied.has(res.path[k])) { free = false; break; }
          if (free && g.isBlockedByOtherRoute(J.str(b, 'id', ''), res.path)) free = false;
          const passed = this.headPast(trains, b, tb, down);
          if (free && (aspect !== 'RED' || passed)) this.extendWaiting(trains, b, tb, down, res.path);
        }
      } catch (e) { console.warn('BLK', e); }
    }
    this.extendUnsignaled(trains, occupied);
  }
  headPast(trains, b, tb, down) {
    const prog = this.g.geo.sigProgress(b, tb, down);
    for (const t of trains) {
      if (t.curId !== tb) continue;
      if ((t.mode === 'NORMAL') !== down) continue;
      if (t.prog > prog + 0.02) return true;
    }
    return false;
  }
  extendWaiting(trains, b, tb, down, path) {
    for (const t of trains) {
      if (t.finished || t.curId !== tb) continue;
      if ((t.mode === 'NORMAL') !== down) continue;
      if (!t.path.length || t.path[t.path.length - 1] !== tb) continue;
      if (!this.g.createAutoRoute(b, path)) return;
      t.appendExitPath(path);
      return;
    }
  }
  sameTrackSignalAhead(b, tb, down) {
    const geo = this.g.geo;
    const my = geo.sigProgress(b, tb, down);
    let best = null, bp = Infinity;
    for (const s of geo.onTrack(tb)) {
      if (s === b) continue;
      const t = sigType(s);
      if (t === 'DISTANT' || t === 'REPEATER') continue;
      if (sigDown(s) !== down) continue;
      const p = geo.sigProgress(s, tb, down);
      if (p > my + 0.01 && p < bp) { bp = p; best = J.str(s, 'id', ''); }
    }
    return best;
  }
  extendUnsignaled(trains, occupied) {
    const geo = this.g.geo, pb = this.g.pb;
    for (const t of trains) {
      if (t.finished || t.manual || t.stopped) continue;
      const p = t.path;
      if (!p.length || t.idx !== p.length - 1) continue;
      const last = p[p.length - 1];
      if (!pb.has(last)) continue;
      if (t.isStopPlatform(last)) continue;
      if (t.turnback && !t.reversed) continue;
      if (t.terminate) continue;
      const down = t.mode === 'NORMAL';
      let hasSignal = false;
      for (const s of geo.onTrack(last)) {
        const ty = sigType(s);
        if (ty === 'DISTANT' || ty === 'REPEATER') continue;
        if (sigDown(s) === down) { hasSignal = true; break; }
      }
      if (hasSignal || geo.isEnd(last)) continue;
      const ext = pb.extendFrom(p, down);
      if (ext.length <= p.length) continue;
      const add = ext.slice(p.length);
      if (add.some(id => occupied.has(id))) continue;
      t.appendExitPath(add);
    }
  }
}

// =====================================================================
//  AspectCascadeManager
// =====================================================================
class AspectCascade {
  constructor(game) { this.g = game; this.tick = 0; }
  dirSignal(tid, mode) {
    const down = mode === 'NORMAL';
    for (const s of this.g.geo.onTrack(tid)) {
      if (isAutoSig(s)) continue;
      if (down === !sigDown(s)) continue;
      return J.str(s, 'id', null);
    }
    return null;
  }
  blockSignal(tid, mode) {
    const down = mode !== 'REVERSE';
    for (const s of this.g.geo.onTrack(tid)) {
      if (sigType(s) !== 'BLOCK') continue;
      if (sigDown(s) === down) return J.str(s, 'id', null);
    }
    return null;
  }
  set(route, id, state) { if (route.isReleased(id)) return; this.g.setSignal(id, state); }
  updateRoutes(routes, trains) {
    const geo = this.g.geo;
    for (const r of routes) {
      if (r.locking || r.cancelling) continue;
      if (J.eqi(r.sigType, 'BLOCK')) continue;
      const cur = r.signalId, path = r.path;
      if (cur == null || !path.length) continue;
      let owner = null;
      for (const t of trains) if (path.includes(t.curId)) { owner = t; break; }
      let other = false;
      for (const t of trains) { if (t === owner) continue; if (path.includes(t.curId)) { other = true; break; } }
      if (other) { this.set(r, cur, 'RED'); continue; }
      if (J.eqi(r.sigType, 'SHUNT')) { this.set(r, cur, 'GREEN'); continue; }
      const dest = path[path.length - 1];
      if (J.eqi(r.sigType, 'LANGSUNG') || geo.isEnd(dest)) {
        this.set(r, cur, 'GREEN');
        for (let i = 0; i < path.length - 1; i++) {
          const ex = this.dirSignal(path[i], r.mode);
          if (ex != null && !J.eqi(ex, cur)) this.set(r, ex, 'GREEN');
        }
      } else {
        let next = this.dirSignal(dest, r.mode);
        if (next == null) next = this.blockSignal(dest, r.mode);
        if (next != null && !J.eqi(next, cur)) {
          const ns = this.g.sigState(next);
          this.set(r, cur, (J.eqi(ns, 'GREEN') || J.eqi(ns, 'YELLOW')) ? 'GREEN' : 'YELLOW');
        } else this.set(r, cur, 'YELLOW');
      }
    }
  }
  updateDistant() {
    if (++this.tick % 5 !== 0) return;
    for (const d of (J.arr(this.g.geo.data, 'signals') || [])) {
      if (!d) continue;
      const t = sigType(d), distant = t === 'DISTANT', rep = t === 'REPEATER';
      if (!distant && !rep) continue;
      let ahead = J.str(d, 'protects', '');
      if (!ahead) ahead = this.g.pb.findSignalAhead(d);
      let aspect = distant ? 'GREEN' : 'RED';
      if (ahead) {
        const m = this.g.geo.signal(ahead);
        if (m) {
          const ms = J.str(m, 'state', 'RED').toUpperCase();
          if (rep) aspect = ms; else if (ms !== 'GREEN') aspect = 'YELLOW';
        }
      }
      d.state = aspect;
    }
  }
}

// =====================================================================
//  ActiveRoute
// =====================================================================
class ActiveRoute {
  constructor(id, signalId, sigType, target, path, conflicts) {
    this.id = id; this.signalId = signalId; this.sigType = sigType; this.target = target;
    this.path = path || []; this.conflicts = conflicts || [];
    this.locking = false; this.mode = 'NORMAL'; this.entered = false; this.cancelling = false; this.cancelStart = -1;
    this.released = new Set(); this.lockUntil = 0;
  }
  get cancelPending() { return this.cancelStart >= 0; }
  isReleased(id) { return id != null && this.released.has(String(id).toUpperCase()); }
  markReleased(id) { if (id != null) this.released.add(String(id).toUpperCase()); }
  toJson() { return { id: this.id, sig: this.signalId, type: this.sigType, target: this.target, path: this.path.slice(), conf: this.conflicts.slice(), mode: this.mode, entered: this.entered, cancelStart: this.cancelStart, released: [...this.released] }; }
  static fromJson(o) {
    const r = new ActiveRoute(J.str(o, 'id', ''), J.has(o, 'sig') ? J.str(o, 'sig') : null, J.str(o, 'type', 'ENTRY'), J.int(o, 'target', -1),
      (J.arr(o, 'path') || []).map(Number), (J.arr(o, 'conf') || []).map(String));
    r.mode = J.str(o, 'mode', 'NORMAL'); r.entered = J.bool(o, 'entered', false); r.cancelStart = J.num(o, 'cancelStart', -1);
    for (const s of (J.arr(o, 'released') || [])) r.released.add(String(s).toUpperCase());
    return r;
  }
}

// =====================================================================
//  Bagian 4: TrainSpawner
// =====================================================================
class Spawner {
  constructor(game) { this.g = game; this.rakesSpawned = new Set(); this.rakeTick = 0; this.warned = new Set(); this.warnSink = null; }
  get geo() { return this.g.geo; }
  get pb() { return this.g.pb; }
  spawnArr() { const d = this.geo.data; return J.arr(d, 'spawn-track') || J.arr(d, 'spawn_tracks'); }
  lenOf(id) { const t = this.geo.track(id); if (!t) return -1; const m = J.num(t, 'length', 50); return m > 0 ? m : 50; }
  speedOf(id) { const t = this.geo.track(id); const v = t ? J.int(t, 'speed', 30) : 30; return v > 0 ? v : 30; }
  buildSpawnPath(id, mode) { return this.pb.buildFromTrack(id, !J.eqi(mode, 'REVERSE')); }
  warn(time, no, msg) {
    if (this.warnSink) { this.warnSink.push(msg); return; }
    const k = no + msg;
    if (!this.warned.has(k)) { this.warned.add(k); this.g.log(time, '[' + no + '] Standby gagal: ' + msg, 'red'); }
  }
  applyConsist(t, sch) {
    if (!t || !sch) return;
    const cat = J.str(sch, 'category', J.str(sch, 'type', ''));
    t.setFreight(J.eqi(cat, 'FREIGHT'));
    const cars = J.int(sch, 'cars', -1);
    if (cars >= 0) t.setCarCount(cars);
    t.setLengths(J.num(sch, 'loco_length', 0), J.num(sch, 'car_length', 0), J.num(sch, 'car_gap', -1));
    // traksi: "lk"/"loco", "hp"/"power_hp", "bk"/"brake", "lt"/"loco_ton", "ct"/"car_ton", "ton"
    const lk = J.str(sch, 'loco', J.str(sch, 'lk', ''));
    const hp = J.num(sch, 'power_hp', J.num(sch, 'hp', -1));
    const bk = J.num(sch, 'brake', J.num(sch, 'bk', -1));
    const lt = J.num(sch, 'loco_ton', J.num(sch, 'lt', -1)), ctn = J.num(sch, 'car_ton', J.num(sch, 'ct', -1)), ton = J.num(sch, 'ton', -1);
    if (lk || hp > 0 || bk > 0 || lt > 0 || ctn > 0 || ton > 0) t.setTraction(lk, hp, bk, lt, ctn, ton);
    t.horn = J.str(sch, 'horn', '');   // suara horn khusus (opsional)
    t.terminate = J.bool(sch, 'terminate', false);
    t.markScheduled();
  }
  isStandby(sch) {
    if (J.bool(sch, 'is_leg', false)) return false;
    return J.bool(sch, 'start_at_platform', false) || J.bool(sch, 'sb', false);
  }
  isSpawnDue(cur, sp) { const d = timeDiff(cur, sp); return d <= 0 && d >= -1200; }
  centerY(id) { const c = this.geo.c(id); return c ? (c[1] + c[3]) / 2 : NaN; }
  inferMode(spawnId, joinId) {
    const a = this.centerY(spawnId), b = this.centerY(joinId);
    if (Number.isNaN(a) || Number.isNaN(b)) return 'NORMAL';
    return a > b ? 'REVERSE' : 'NORMAL';
  }

  checkByTime(time, trains, processed) {
    this.spawnRakes(time, trains);
    const schedules = J.arr(this.geo.data, 'schedules');
    if (!schedules) return;
    for (const sch of schedules) {
      if (!this.isStandby(sch)) continue;
      const n = J.str(sch, 'train_number', '');
      if (!processed.includes(n)) this.spawnStandby(sch, time, trains, processed);
    }
    const active = trains.map(t => t.no);
    for (const sch of schedules) {
      const no = J.str(sch, 'train_number', ''), name = J.str(sch, 'train_name', 'KA');
      const spawnTime = J.str(sch, 'spawn_time', ''), arr = J.str(sch, 'arr_time', '--:--'), dep = J.str(sch, 'dep_time', '--:--');
      const entry = J.int(sch, 'entry_track', -1), plat = J.int(sch, 'target_platform', -1);
      if (processed.includes(no) || active.includes(no)) continue;
      if (!spawnTime || !this.isSpawnDue(time, spawnTime)) continue;
      let spawnId = entry, joinId = entry, spawnMode = null;
      for (const sp of (this.spawnArr() || [])) {
        const id = J.int(sp, 'id', -1), jw = J.int(sp, 'joinWith', -1);
        if (id === entry || jw === entry) { spawnId = id; joinId = jw; spawnMode = J.str(sp, 'mode', 'NORMAL'); break; }
      }
      const mode = spawnMode != null ? spawnMode : this.inferMode(spawnId, joinId);
      let path = this.buildSpawnPath(spawnId, mode);
      if (!path) { path = [spawnId]; if (joinId !== spawnId && joinId !== -1) path.push(joinId); }
      if (trains.some(o => path.includes(o.curId))) continue;
      const t = new Train(no, name, arr, dep, path.slice(), mode, plat);
      t.setTurnback(J.bool(sch, 'turnback', false), J.int(sch, 'exit_track', -1));
      this.applyConsist(t, sch);
      processed.push(no);
      if (this.isStandby(sch)) continue;
      t.startAtLineSpeed(this.geo, this.speedOf(path[0]));
      this.g.score.logSpawn(no, time);
      this.g.log(time, `[${no} ${name}] Auto-Spawn di track ${spawnId} (${Math.round(t.speed)} km/j)`, 'cyan');
      this.g.onTrainSpawned(t);
      break;
    }
  }

  spawnForRoute(route, mode, target, time, processed) {
    let name = null, no = null, arr = '--:--', dep = '--:--', tb = false, exit = -1, plat = target, matched = null;
    const schedules = J.arr(this.geo.data, 'schedules');
    if (schedules) {
      for (const sch of schedules) {
        const tNum = J.str(sch, 'train_number', ''), spawnTime = J.str(sch, 'spawn_time', ''), aTime = J.str(sch, 'arr_time', '00:00');
        const entry = J.int(sch, 'entry_track', -1), schPlat = J.int(sch, 'target_platform', -1);
        if (processed.includes(tNum)) continue;
        let match = false, prepend = null;
        const first = route.path.length ? route.path[0] : -1;
        if (route.path.includes(entry)) match = true;
        else for (const sp of (this.spawnArr() || [])) {
          const spId = J.int(sp, 'id', -1);
          const pre = this.buildSpawnPath(spId, J.str(sp, 'mode', 'NORMAL'));
          if (!pre || first !== pre[pre.length - 1]) continue;
          if (entry === spId || pre.includes(entry)) { match = true; prepend = pre; break; }
        }
        if (match && target !== -1) {
          if (schPlat !== target && schPlat > 0 && !SN.isAllowedPlatform(tNum, target)) match = false;
        }
        if (match) {
          const tt = spawnTime ? spawnTime : aTime;
          const d = timeDiff(time, tt);
          if (d <= 0 && d >= -1200) {
            matched = sch;
            if (prepend) for (let k = prepend.length - 2; k >= 0; k--) { const id = prepend[k]; if (!route.path.includes(id)) route.path.unshift(id); }
            break;
          }
        }
      }
    }
    if (!matched) return false;
    name = J.str(matched, 'train_name', 'KA Express'); no = J.str(matched, 'train_number', 'KA 100');
    arr = J.str(matched, 'arr_time', arr); dep = J.str(matched, 'dep_time', dep);
    tb = J.bool(matched, 'turnback', false); exit = J.int(matched, 'exit_track', -1); plat = J.int(matched, 'target_platform', target);
    if (!processed.includes(no)) processed.push(no);
    this.g.score.logSpawn(no, time);
    this.g.log(time, `[${no} ${name}] Masuk seksi ${route.path.length ? route.path[0] : -1}`, 'cyan');
    const t = new Train(no, name, arr, dep, route.path.slice(), mode, plat);
    t.setTurnback(tb, exit);
    this.applyConsist(t, matched);
    if (route.path.length) t.startAtLineSpeed(this.geo, this.speedOf(route.path[0]));
    this.g.onTrainSpawned(t);
    return true;
  }

  spawnStandby(sch, time, trains, processed) {
    const no = J.str(sch, 'train_number', J.str(sch, 'no', '?'));
    try {
      const name = J.str(sch, 'train_name', J.str(sch, 'n', 'KA'));
      const arr = J.str(sch, 'arr_time', '--:--'), dep = J.str(sch, 'dep_time', '--:--');
      const primary = J.int(sch, 'target_platform', J.int(sch, 'tT', -1));
      const mode = J.eqi(J.str(sch, 'mode', J.str(sch, 'm', 'NORMAL')), 'REVERSE') ? 'REVERSE' : 'NORMAL';
      const cands = SN.platformsOf(sch);
      if (!cands.length && primary > 0) cands.push(primary);
      if (!cands.length) { this.warn(time, no, 'target_platform tidak valid'); return; }
      const t = new Train(no, name, arr, dep, [], mode, cands[0]);
      t.lastSim = time;
      t.setTurnback(J.bool(sch, 'turnback', J.bool(sch, 'tb', false)), J.int(sch, 'exit_track', J.int(sch, 'xT', -1)));
      this.applyConsist(t, sch);
      let where = null;
      const fails = [];
      this.warnSink = fails;
      try { for (const p of cands) { where = this.placeStandby(t, no, p, mode, time, trains); if (where) break; } }
      finally { this.warnSink = null; }
      if (!where) { fails.forEach(f => this.warn(time, no, f)); return; }
      processed.push(no);
      this.g.score.logSpawn(no, arr);
      this.g.score.logArrival(no, arr);
      this.g.log(time, `[${no} ${name}] Standby di ${where}`, 'yellow');
      this.g.onTrainSpawned(t);
    } catch (e) { console.warn(e); this.warn(time, no, 'error ' + e); }
  }
  placeStandby(t, no, platform, mode, time, trains) {
    const geo = this.geo;
    if (platform <= 0) { this.warn(time, no, 'target_platform tidak valid'); return null; }
    const isPlat = !!geo.platform(platform), onBuf = !isPlat && geo.hasBuffer(platform);
    if (!isPlat && !onBuf) { this.warn(time, no, 'tT ' + platform + ' bukan track peron atau track ber-buffer'); return null; }
    if (onBuf) return this.placeAtBuffer(t, no, platform, mode, time, trains) ? 'track ' + platform + ' (buffer stop)' : null;
    for (const o of trains) if (o.curId === platform) { this.warn(time, no, 'peron ' + platform + ' terisi'); return null; }
    if (!t.placeAtPlatform(geo, platform, this.pb)) { this.warn(time, no, 'gagal menempatkan di peron ' + platform); return null; }
    for (const o of trains) {
      const occ = o.occupied(geo);
      for (const tid of t.path) if (occ.includes(tid)) { this.warn(time, no, 'track ' + tid + ' terisi kereta lain'); return null; }
    }
    return geo.platLabel(platform);
  }
  endPoint(tid, down, front) {
    const c = this.geo.c(tid);
    const flip = !down && c[1] < c[3];
    return (front !== flip) ? [c[2], c[3]] : [c[0], c[1]];
  }
  isFreeEnd(self, p) {
    for (const [id, c] of this.geo.coords) {
      if (id === self) continue;
      if ((Math.abs(c[0] - p[0]) < 0.002 && Math.abs(c[1] - p[1]) < 0.002) || (Math.abs(c[2] - p[0]) < 0.002 && Math.abs(c[3] - p[1]) < 0.002)) return false;
    }
    return true;
  }
  headCap(tid, down) {
    let cap = 0.97;
    const c = this.geo.c(tid);
    if (!c) return cap;
    const m = this.geo.meters(tid);
    for (const s of this.geo.onTrack(tid)) {
      const ty = sigType(s);
      if (ty === 'DISTANT' || ty === 'REPEATER') continue;
      if (sigDown(s) !== down) continue;
      const pf = this.geo.sigProgress(s, tid, down);
      if (pf < 0.25) continue;
      cap = Math.min(cap, pf - 2 / m);
    }
    return cap;
  }
  placeAtBuffer(t, no, tid, mode, time, trains) {
    const geo = this.geo, down = mode !== 'REVERSE';
    if (this.lenOf(tid) <= 0 || !geo.c(tid)) { this.warn(time, no, 'track ' + tid + ' tidak ditemukan'); return false; }
    const len = geo.meters(tid), gap = BUFFER_STOP_M, need = t.totalLen();
    const behind = this.isFreeEnd(tid, this.endPoint(tid, down, false));
    const ahead = this.isFreeEnd(tid, this.endPoint(tid, down, true));
    const path = [];
    let head;
    if (behind) {
      head = (need + gap) / len;
      if (head > this.headCap(tid, down)) { this.warn(time, no, `track ${tid} (${Math.round(len)} m) terlalu pendek untuk rangkaian ${Math.round(need)} m`); return false; }
      path.push(tid);
    } else if (ahead) {
      head = Math.max(0, 1 - gap / len);
      const missing = need + 5 - head * len;
      if (missing > 0) path.push(...this.pb.backPath(tid, down, missing));
      path.push(tid);
      let rest = 0;
      for (let k = 0; k < path.length - 1; k++) rest += geo.meters(path[k]);
      if (rest + head * len < need) { this.warn(time, no, `rel di belakang track ${tid} kurang panjang untuk rangkaian ${Math.round(need)} m`); return false; }
    } else { this.warn(time, no, `ujung buffer track ${tid} tidak ditemukan (kedua ujung tersambung)`); return false; }
    for (const o of trains) {
      const occ = o.occupied(geo);
      for (const id of path) if (occ.includes(id)) { this.warn(time, no, 'track ' + id + ' terisi kereta lain'); return false; }
    }
    t.placeStandbyOnTrack(geo, path, head, tid);
    return true;
  }

  spawnRakes(time, trains) {
    const arr = J.arr(this.geo.data, 'rakes');
    if (!arr || !arr.length) return;
    if ((this.rakeTick++ % 2) !== 0) return;
    arr.forEach((r, i) => {
      if (!r) return;
      const id = J.str(r, 'no', J.str(r, 'id', 'RANGKAIAN ' + (i + 1)));
      if (this.rakesSpawned.has(id)) return;
      let sw = J.str(r, 'sW', J.str(r, 'spawn_time', ''));
      if (sw) { sw = toHHmm(sw); if (timeDiff(time, sw) > 0) return; }
      this.spawnRake(r, id, time, trains);
    });
  }
  spawnRake(r, id, time, trains) {
    const geo = this.geo;
    try {
      const name = J.str(r, 'n', J.str(r, 'name', 'Rangkaian'));
      const freight = J.eqi(J.str(r, 't', J.str(r, 'category', 'PASSENGER')), 'FREIGHT');
      const mode = J.eqi(J.str(r, 'm', J.str(r, 'mode', 'NORMAL')), 'REVERSE') ? 'REVERSE' : 'NORMAL';
      const down = mode !== 'REVERSE';
      const t = new Train(id, name, '--:--', '--:--', [], mode, -1);
      t.setFreight(freight);
      t.setLengths(J.num(r, 'll', 0), J.num(r, 'cl', J.num(r, 'car_length', 0)), J.num(r, 'cg', J.num(r, 'car_gap', -1)));
      const defCars = (freight ? FREIGHT_CARS : PASSENGER_CARS) - 1;
      t.makeRake(J.int(r, 'nc', J.int(r, 'cars', defCars)));
      let path = [];
      const pa = J.arr(r, 'path');
      let head;
      if (pa && pa.length) { path = pa.map(v => Number(v)); head = path[path.length - 1]; }
      else head = J.int(r, 'track', J.int(r, 'onTrack', -1));
      const headLen = this.lenOf(head);
      if (headLen <= 0) { this.warn(time, id, 'track ' + head + ' tidak ditemukan'); this.rakesSpawned.add(id); return; }
      for (const tid of path) if (this.lenOf(tid) <= 0) { this.warn(time, id, 'track ' + tid + ' pada path tidak ditemukan'); this.rakesSpawned.add(id); return; }
      let p = J.num(r, 'pos', J.num(r, 'p', 0.5));
      if (Number.isNaN(p)) p = 0.5;
      p = Math.max(0.05, Math.min(0.97, p));
      const need = t.totalLen() + 5;
      if (!path.length) { path.push(head); const miss = need - p * headLen; if (miss > 0) path.unshift(...this.pb.backPath(head, down, miss)); }
      let rest = 0;
      for (let k = 0; k < path.length - 1; k++) rest += this.lenOf(path[k]);
      if (rest + p * headLen < need) {
        p = Math.min(0.97, p + (need - rest - p * headLen) / headLen);
        if (rest + p * headLen < need) this.warn(time, id, 'rel di belakang kurang panjang, ekor terpotong');
      }
      for (const o of trains) { const occ = o.occupied(geo); for (const tid of path) if (occ.includes(tid)) { this.warn(time, id, 'track ' + tid + ' terisi kereta lain'); return; } }
      t.placeStandby(path, p);
      this.rakesSpawned.add(id);
      this.g.log(time, `[${id} ${name}] Rangkaian standby di track ${head}`, 'yellow');
      this.g.onTrainSpawned(t);
    } catch (e) { console.warn(e); this.warn(time, id, 'error ' + e); this.rakesSpawned.add(id); }
  }
}

// =====================================================================
//  Bagian 5: Game (port RouteManager) - inti simulasi
// =====================================================================
const STEP_MS = 33, MAX_STEPS = 48, YX = 2.0;   // YX: skala sumbu Y layar (sama rasio dengan HP potret)
const SHUNT_KMH = 15, DIVERGE_KMH = 30, CANCEL_DELAY_SEC = 120, CANCEL_STEP_MS = 400, SWITCH_MOVE_MS = 1500, SWITCH_ZONE_M = 25;

class Game {
  constructor() {
    this.logger = new TrainLogger();
    this.power = new PowerSupply();
    this.data = null;
    this.hooks = { sound() {}, announce() {}, changed() {} };
    this.reset0();
  }
  reset0() {
    this.routes = []; this.trains = []; this.processed = []; this.timers = [];
    this.moving = new Map(); this.lockedSw = new Set(); this.occSw = new Set();
    this.pendingRoute = null; this.pendingPath = null; this.pendingDesc = ''; this.pendingWrongWay = false;
    this.selSig = null; this.selSigType = null; this.selSigTrack = null;
    this.pendingCancel = null; this.pendingCancelDesc = '';
    this.lastError = null; this.selLoco = null; this.selectedSwitch = null;
    this.collision = false; this.collisionX = 0; this.collisionY = 0; this.collisionText = ''; this.derail = false; this.collCounter = 0;
    this.finished = false; this.lastTrackSeen = new Map(); this.runRoundRake = new Map();
    this.heldCount = new Map(); this.alertStations = new Set(); this.heldSeen = new Set(); this.ackedHeld = new Set();
    this.upcoming = []; this.spawnTick = 0; this.stepCount = 0; this.speed = 1;
    this.crossings = [];
  }

  // ---------- data ----------
  setTrackData(data) {
    this.reset0();
    this.data = data;
    SN.normalize(data); SpawnTrackBuilder.ensure(data); SN.expandLegs(data); SN.normalize(data);
    for (const s of (J.arr(data, 'signals') || [])) if (s && !J.has(s, 'state')) s.state = 'RED';
    this.geo = new Geo(data);
    this.pb = new PathBuilder(this.geo);
    this.logger.clear();
    this.score = new ScoreManager(this.logger);
    this.power.load(data);
    this.spawner = new Spawner(this);
    this.block = new BlockSignalManager(this);
    this.cascade = new AspectCascade(this);
    this.initClock();
    for (const sch of (J.arr(data, 'schedules') || [])) {
      const num = J.str(sch, 'train_number', ''), name = J.str(sch, 'train_name', '');
      const spawn = J.str(sch, 'spawn_time', J.str(sch, 'leg_spawn', J.str(sch, 'arr_time', '00:00')));
      const arr = J.str(sch, 'arr_time', '00:00'), dep = J.str(sch, 'dep_time', '00:00');
      const through = this.platformLabel(sch) === 'LANGSUNG';
      const plat = J.int(sch, 'target_platform', -1), fin = J.bool(sch, 'terminate', false);
      const exitT = through ? plat : (fin ? -1 : J.int(sch, 'exit_track', -1));
      const p = this.score.register(num, name, spawn, arr, dep, through ? -1 : plat, exitT > 0 ? exitT : -1, through);
      if (J.bool(sch, 'partial', false)) p.partial = true;
    }
    this.gapeka = new Gapeka(); this.gapeka.load(data);
    this.initCrossings();
    this.validateEntrySignals();
    this.validateSignalPlacement();
    this.updateSwitchLocks();
  }
  initClock() {
    const st = J.str(this.data, 'startTime', '');
    let sec = 0;
    if (st) sec = parseSec(toHHmm(st));
    else {
      let earliest = '23:59';
      for (const s of (J.arr(this.data, 'schedules') || [])) { const sp = J.str(s, 'spawn_time', ''); if (sp && sp < earliest) earliest = sp; }
      sec = parseSec(earliest) - 120;
      if (sec < 0) sec += 86400;
    }
    this.simMs = sec * 1000;
  }
  simSec() { return Math.floor(this.simMs / 1000); }
  time() { return fmtTime(this.simSec(), true); }
  timeHHmm() { return fmtTime(this.simSec(), false); }
  log(time, text, color) { this.logger.add(time || this.timeHHmm(), text, color); }
  err(m) { this.lastError = m; }
  consumeError() { const e = this.lastError; this.lastError = null; return e; }
  sigState(id) { const s = this.geo.signal(id); return s ? J.str(s, 'state', 'RED') : 'RED'; }
  setSignal(id, st) { const s = this.geo.signal(id); if (s) s.state = st; }
  later(ms, fn) { this.timers.push({ at: this.simMs + ms, fn }); }
  findSchedule(no) { return (J.arr(this.data, 'schedules') || []).find(s => s && J.eqi(no, J.str(s, 'train_number', ''))) || null; }
  stationName(code) { const m = this.data && this.data.station_names; if (m && m[code]) return m[code]; const s = (J.arr(this.data, 'stations') || []).find(x => J.eqi(J.str(x, 'code', ''), code)); return s ? J.str(s, 'name', code) : code; }

  platformLabel(sch) {
    const p = J.int(sch, 'target_platform', -1);
    const through = J.bool(sch, 'is_through', false) || J.eqi(J.str(sch, 'type', ''), 'LANGSUNG') || p <= 0 || J.eqi(this.geo.type(p), 'END') || J.eqi(this.geo.type(p), 'EXIT');
    if (through) return 'LANGSUNG';
    return this.geo.platLabel(p) + (J.bool(sch, 'turnback', false) ? ' (BALIK)' : '');
  }

  validateEntrySignals() {
    const codes = (J.arr(this.data, 'stations') || []).map(o => { let c = J.str(o, 'code', '').trim(); if (!c) c = Game.stationCode(J.str(o, 'name', '')); return c.toUpperCase(); });
    for (const s of (J.arr(this.data, 'signals') || [])) {
      if (!s || sigType(s) !== 'ENTRY') continue;
      const id = J.str(s, 'id', '?'), code = J.str(s, 'station', '').trim().toUpperCase();
      if (!code) this.log(null, `Sinyal masuk ${id} tidak punya field "station"`, 'red');
      else if (!codes.includes(code)) this.log(null, `Sinyal masuk ${id}: stasiun "${code}" tidak ada di daftar stations`, 'red');
    }
  }
  validateSignalPlacement() {
    for (const s of (J.arr(this.data, 'signals') || [])) {
      if (!s) continue;
      const id = J.str(s, 'id', '?'), tid = J.int(s, 'onTrack', -1), c = this.geo.c(tid);
      if (!c) { this.log(null, `Sinyal ${id}: onTrack ${tid} tidak ada`, 'red'); continue; }
      const dx = c[2] - c[0], dy = c[3] - c[1], l2 = dx * dx + dy * dy;
      if (l2 === 0) continue;
      const raw = ((J.num(s, 'x') - c[0]) * dx + (J.num(s, 'y') - c[1]) * dy) / l2;
      const px = c[0] + dx * Math.max(0, Math.min(1, raw)), py = c[1] + dy * Math.max(0, Math.min(1, raw));
      const dist = Math.hypot(J.num(s, 'x') - px, J.num(s, 'y') - py);
      if (dist > 0.04) this.log(null, `Sinyal ${id}: jauh dari track ${tid} (${dist.toFixed(3)})`, 'red');
      if (raw < -0.02 || raw > 1.02) this.log(null, `Sinyal ${id}: di luar rentang track ${tid}`, 'red');
    }
  }
  static stationCode(name) { const a = name.lastIndexOf('('), b = name.lastIndexOf(')'); if (a >= 0 && b > a) return name.substring(a + 1, b).trim().toUpperCase(); return name.trim().toUpperCase(); }

  // ---------- kereta muncul ----------
  onTrainSpawned(t) {
    t.game = this;
    if (t.hasLoco && !t.isDwelling()) this.hooks.sound('spawn');
    this.trains.push(t);
    t.updateCoords(this.geo);
    this.attachWaitingRoutes(t);
  }
  onArrived(t) { this.score.logArrival(t.no, t.lastSim); }
  onFinished(t) { this.score.logExitTime(t.no, t.lastSim); }

  // ---------- loop ----------
  advance(wallMs) {
    if (!this.data || this.finished || this.speed <= 0) return 0;
    this.acc = (this.acc || 0) + Math.min(250, wallMs) * this.speed;
    let steps = 0;
    while (this.acc >= STEP_MS && steps < MAX_STEPS) {
      this.step();
      this.acc -= STEP_MS; steps++;
      if (this.finished) break;
    }
    if (steps >= MAX_STEPS) this.acc = 0;
    return steps;
  }
  step() {
    this.simMs += STEP_MS;
    this.stepCount++;
    // timer permainan
    if (this.timers.length) {
      const due = this.timers.filter(x => x.at <= this.simMs);
      if (due.length) { this.timers = this.timers.filter(x => x.at > this.simMs); due.forEach(x => { try { x.fn(); } catch (e) { console.warn(e); } }); }
    }
    const time = this.time();
    if ((this.spawnTick++ % 15) === 0) this.spawner.checkByTime(this.timeHHmm(), this.trains, this.processed);
    this.checkMissionEnd(time);
    this.block.update(this.trains);
    this.cascade.updateRoutes(this.routes, this.trains);
    this.cascade.updateDistant();
    this.power.update(parseSec(time));
    const pm = this.power.consume();
    if (pm) this.log(null, pm, 'red');

    const dt = 0.033, geo = this.geo, toRemove = [];
    for (const tr of this.trains) {
      this.attachWaitingRoutes(tr);
      let cap = this.shuntCap(tr);
      const dc = this.divergeCap(tr);
      if (dc > 0 && (cap <= 0 || dc < cap)) cap = dc;
      tr.speedCap = cap;
      if (tr.hasPermit()) this.updateSightCap(tr);
    }
    for (const t of this.trains.slice()) {
      if (!this.trains.includes(t)) continue;   // sudah tersambung ke rangkaian lain di langkah ini
      if (t.manual) { this.manualStep(t, dt, time); if (t.finished) toRemove.push(t); continue; }
      if (this.checkTerminate(t, time)) { toRemove.push(t); continue; }
      if (t.isShunting()) this.shuntStep(t, time);   // langsir otomatis: atur jalur & kecepatan
      const cur = t.curId, next = t.nextId;
      t.followSwitches(this.pb);
      let nextOcc = false;
      if (next !== -1) for (const o of this.trains) if (o !== t && o.curId === next) { nextOcc = true; break; }
      if (cur !== -1) {
        const len = Math.round(geo.meters(cur)) || 50;
        const tk = geo.track(cur);
        const sp = tk ? J.int(tk, 'speed', 30) : 30;
        t.advanceProgress(len, sp, dt, nextOcc, geo, time);
        t.updateCoords(geo);
        if (t.speed < 0.5 && !t.isDwelling() && !t.stopped) t.held += dt;
        if (t.consumeArrived()) {
          this.score.logPlatform(t.no, t.arrPlat, t.arrOver, time);
          if (this.speed <= 2) this.hooks.announce(t, this.findSchedule(t.no), t.arrPlat);
        }
        if (t.consumeDeparted()) {
          this.score.logDeparture(t.no, time);
          if (this.hooks.horn) this.hooks.horn(t); else this.hooks.sound('horn');
          this.startNextLeg(t, time);
        }
      }
      if (t.finished) toRemove.push(t);
    }
    this.attachReverseRoutes();
    this.releaseRoutesBehindTrains();
    this.updateCancelTimers();
    if (this.stepCount % 5 === 0) this.updateArrivalIndicators();
    if (this.stepCount % 30 === 0) this.checkUpcomingArrivals();
    for (const t of toRemove) {
      const i = this.trains.indexOf(t);
      if (i >= 0) this.trains.splice(i, 1);
      const exitTrack = t.path.length ? t.path[t.path.length - 1] : -1;
      this.score.logExit(t.no, time, exitTrack, t.held);
      this.hooks.sound('exit');
      const rm = this.routes.filter(r => this.isRouteOwnedBy(t, r));
      for (const r of rm) { if (r.signalId) this.setSignal(r.signalId, 'RED'); }
      this.routes = this.routes.filter(r => !rm.includes(r));
      if (this.selLoco === t) this.selLoco = null;
    }
    this.checkCollisions(time);
    this.checkDerailment(time);
    if (this.stepCount % 6 === 0) { this.updateSwitchLocks(); this.updateCrossings(); }
    if (this.stepCount % 15 === 0 && this.gapeka) this.gapeka.record(this.trains, this.geo, this.simSec());
  }

  shuntCap(t) { for (const r of this.routes) { if (r.locking || !J.eqi(r.sigType, 'SHUNT')) continue; if (this.isRouteOwnedBy(t, r)) return SHUNT_KMH; } return 0; }
  divergeCap(t) { for (const r of this.routes) { if (r.locking || !J.eqi(r.sigType, 'ENTRY')) continue; if (this.isRouteOwnedBy(t, r) && this.routeDiverges(r.path)) return DIVERGE_KMH; } return 0; }
  routeDiverges(path) {
    if (!path || !path.length) return false;
    if (!this._divC || this._divFor !== this.data) { this._divC = new WeakMap(); this._divFor = this.data; }
    const c = this._divC.get(path);
    if (c && c[0] === path.length) return c[1];
    const r = this.routeDivergesScan(path);
    this._divC.set(path, [path.length, r]);
    return r;
  }
  // indeks wesel per track (dipakai langsir tiap langkah)
  switchesOn(tid) {
    if (!this._swIdx || this._swIdxFor !== this.data) {
      this._swIdx = new Map(); this._swIdxFor = this.data;
      for (const sw of (J.arr(this.data, 'switches') || [])) {
        if (!sw) continue;
        for (const id of this.geo.branches(sw)) { if (!this._swIdx.has(id)) this._swIdx.set(id, []); const l = this._swIdx.get(id); if (!l.includes(sw)) l.push(sw); }
      }
    }
    return this._swIdx.get(tid) || [];
  }
  routeDivergesScan(path) {
    for (const s of (J.arr(this.data, 'switches') || [])) {
      if (!s) continue;
      const br = this.geo.branches(s);
      const used = this.geo.usedBranch(path, br, this.geo.pivot(br));
      if (used === -1) continue;
      const idx = br.indexOf(used);
      const straight = br.length === 3 ? idx === 1 : idx === 0;
      if (!straight) return true;
    }
    return false;
  }
  routeIndicator(sigId) {
    for (const r of this.routes) {
      if (r.locking || !J.eqi(sigId, r.signalId)) continue;
      return this.routeDiverges(r.path) ? String(Math.trunc(DIVERGE_KMH / 10)) : null;
    }
    return null;
  }

  checkTerminate(t, time) {
    if (!t.terminate || t.manual || t.stopped || t.finished) return false;
    if (!t.isDwelling()) return false;
    const dep = t.dep;
    if (dep && dep !== '--:--' && timeDiff(time, dep) > 0) return false;
    const plat = t.curId;
    this.score.logDeparture(t.no, time);
    this.score.logExit(t.no, time, plat, t.held);
    this.log(null, `[${t.no}] Perjalanan berakhir di ${this.geo.platLabel(plat)}`, 'cyan');
    this.lastTrackSeen.delete(t);
    return true;
  }
  startNextLeg(t, time) {
    const cur = this.findSchedule(t.no);
    if (!cur) return;
    const nextNo = J.str(cur, 'next_leg', '');
    const nx = nextNo ? this.findSchedule(nextNo) : null;
    if (!nx) return;
    const oldNo = t.no, newNo = J.str(nx, 'train_number', nextNo);
    t.startLeg(newNo, J.str(nx, 'train_name', t.name), J.str(nx, 'arr_time', '--:--'), J.str(nx, 'dep_time', '--:--'),
      J.int(nx, 'target_platform', -1), J.bool(nx, 'turnback', false), J.int(nx, 'exit_track', -1));
    t.terminate = J.bool(nx, 'terminate', false);
    if (!this.processed.includes(newNo)) this.processed.push(newNo);
    this.score.logSpawn(newNo, time);
    this.log(time, `[${oldNo}] berangkat sebagai [${newNo}]`, 'cyan');
  }
  checkMissionEnd(time) {
    if (this.finished) return;
    const sch = J.arr(this.data, 'schedules');
    if (!sch || !sch.length) return;
    let running = 0;
    for (const t of this.trains) if (t.hasLoco || !t.stopped) running++;
    const allDone = this.processed.length >= sch.length && running === 0;
    let timeUp = false;
    let end = J.str(this.data, 'endTime', '');
    if (end) { if (!end.includes(':') && end.length === 4) end = end.substring(0, 2) + ':' + end.substring(2); timeUp = timeDiff(time, end) <= 0; }
    if (allDone || timeUp) { this.finished = true; this.score.finalizeAll(); this.hooks.changed('finished'); }
  }
  endMission() { if (this.finished) return; this.finished = true; this.score.finalizeAll(); this.hooks.changed('finished'); }

  // ---------- manual ----------
  manualStep(t, dt, time) {
    t.manualPrepare(this.geo);
    const g = Coupling.nearestAhead(t, this.trains, this.geo);
    const couplable = t.coachCount() === 0 && g.other && !g.other.hasLoco && g.other.stopped;
    const tk = this.geo.track(t.curId);
    const limit = tk ? J.int(tk, 'speed', 30) : 30;
    t.advanceManual(this.geo, this.pb, limit, dt, g.other ? g.meters : Infinity, couplable, time);
    t.updateCoords(this.geo);
    if (t.consumeRanOff()) { this.onRunOff(t, time); return; }
    const spad = t.consumeSpad();
    if (spad) this.log(time, `[${t.no}] Menerobos sinyal ${spad}`, 'red');
  }
  selectLoco(t) { if (this.selLoco) this.selLoco.setManualDir(0); this.selLoco = t === this.selLoco ? null : t; }
  startManual(t) {
    if (!t || !this.trains.includes(t) || !t.hasLoco) return;
    if (t.speed > 0.5) { this.err('Kereta harus berhenti dulu'); return; }
    if (!t.manual) t.beginManual();
    if (this.selLoco && this.selLoco !== t) this.selLoco.setManualDir(0);
    this.selLoco = t;
  }
  manualCommand(cmd) {
    const l = this.selLoco;
    if (!l || !this.trains.includes(l)) { this.selLoco = null; return; }
    switch (cmd) {
      case 0: l.changeManualKmh(-5); break;
      case 1: l.setManualDir(-1); break;
      case 2: l.setManualDir(0); break;
      case 3: l.setManualDir(1); break;
      case 4: l.changeManualKmh(5); break;
      case 5: if (l.coachCount() >= 1) this.decouple(l); else this.coupleSelected(l); break;
      case 6:
        if (l.coachCount() < 1) break;
        if (l.speed > 0.5) { this.err('Kereta harus berhenti dulu'); break; }
        if (!l.endManual()) { this.err('Loko harus di depan (tekan MAJU dulu)'); break; }
        this.selLoco = null; break;
    }
  }
  contextReady() {
    const l = this.selLoco;
    if (!l || l.speed > 0.5) return false;
    if (l.coachCount() >= 1) return !l.mu;
    const g = Coupling.nearestAhead(l, this.trains, this.geo);
    return g.other && !g.other.hasLoco && g.other.stopped && g.meters <= Coupling.GAP_M;
  }
  decouple(t) {
    if (!t.hasLoco || t.coachCount() < 1) { this.err('Tidak ada gerbong yang bisa dilepas'); return; }
    if (t.mu) { this.err(t.trId + ' tidak punya lokomotif yang bisa dilepas'); return; }
    if (t.speed > 0.5) { this.err('Kereta harus berhenti dulu'); return; }
    const loco = t.splitLoco(this.geo);
    if (!loco) { this.err('Gagal melepas lokomotif'); return; }
    loco.game = this;
    this.trains.push(loco);
    if (this.selLoco) this.selLoco.setManualDir(0);
    this.selLoco = loco;
    t.updateCoords(this.geo); loco.updateCoords(this.geo);
    this.log(null, `[${t.no}] Lokomotif dilepas`, 'yellow');
  }
  coupleSelected(l) {
    if (l.coachCount() !== 0) { this.err('Lokomotif sudah tersambung'); return; }
    if (l.speed > 0.5) { this.err('Berhenti dulu untuk menyambung'); return; }
    const g = Coupling.nearestAhead(l, this.trains, this.geo);
    if (!g.other || g.other.hasLoco || !g.other.stopped) { this.err('Tidak ada rangkaian tanpa loko di depan'); return; }
    if (g.meters > Coupling.GAP_M) { this.err('Terlalu jauh (' + Math.round(g.meters) + ' m), dekatkan lagi'); return; }
    const rake = g.other;
    const takeId = l.scheduled;
    const info = { no: l.no, name: l.name, arr: l.arr, dep: l.dep, plat: l.schedPlat, exit: l.exitTrack, tb: l.turnback };
    const rakeNo = rake.no;
    if (!Coupling.couple(l, g, this.geo)) { this.err('Gagal menyambung'); return; }
    this.trains.splice(this.trains.indexOf(l), 1);
    this.selLoco = null;
    if (takeId) {
      rake.startLeg(info.no, info.name, info.arr, info.dep, info.plat, info.tb, info.exit);
      this.log(null, `[${rakeNo}] tersambung loko, menjadi [${info.no} ${info.name}]`, 'cyan');

  }

  // ---------- anjlok & tabrakan ----------
  onRunOff(t, time) {
    this.derail = true; this.collision = true; this.collisionX = t.x; this.collisionY = t.y;
    this.collisionText = `${t.no} di ujung track ${t.curId} tanpa buffer stop`;
    this.trains.forEach(o => o.crashStop());
    this.log(time, `ANJLOK! [${t.no}] keluar rel di ujung track ${t.curId} (tanpa buffer stop)`, 'red');
    this.hooks.sound('crash');
    this.score.fail('Anjlok ' + this.collisionText);
    this.speed = 0; this.finished = true; this.hooks.changed('finished');
  }
  checkDerailment(time) {
    if (this.finished || this.collision) return;
    const sws = J.arr(this.data, 'switches') || [];
    for (const t of this.trains) {
      if (t.finished) continue;
      const p = t.path, i = t.idx;
      if (i <= 0 || i >= p.length) continue;
      const cur = p[i], prev = p[i - 1];
      const last = this.lastTrackSeen.get(t);
      this.lastTrackSeen.set(t, cur);
      if (last == null || last === cur) continue;
      for (const sw of sws) {
        if (!sw) continue;
        const br = this.geo.branches(sw);
        if (!br.includes(prev) || br.includes(cur)) continue;
        const pv = this.geo.pivot(br);
        if (!pv || !this.geo.touches(cur, pv) || !this.geo.touches(prev, pv)) continue;
        const active = this.geo.activeBranch(sw);
        if (active === prev) continue;
        this.derail = true; this.collision = true; this.collisionX = pv[0]; this.collisionY = pv[1];
        this.collisionText = `${t.no} di wesel ${J.str(sw, 'id', '?')}`;
        this.trains.forEach(o => o.crashStop());
        this.log(time, `ANJLOK! [${t.no}] melindas wesel ${J.str(sw, 'id', '?')} (dari T${prev}, wesel ke T${active})`, 'red');
        this.hooks.sound('crash');
        this.score.fail('Anjlok ' + this.collisionText);
        this.speed = 0; this.finished = true; this.hooks.changed('finished');
        return;
      }
    }
  }
  pxPerMeter(tid) { const c = this.geo.c(tid); if (!c) return 0; return Math.hypot(c[2] - c[0], (c[3] - c[1]) * YX) / this.geo.meters(tid); }
  checkCollisions(time) {
    if (this.finished || this.collision || this.trains.length < 2) return;

    const cars = this.trains.map(t => t.finished ? [] : t.carPositions(this.geo));
    const n = this.trains.length;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      for (const a of cars[i]) {

        for (const b of cars[j]) {

          const dm = Math.hypot(a.x - b.x, (a.y - b.y) * YX) / pxm;

            this.log(time, `TABRAKAN! [${A.no}] dengan [${B.no}]`, 'red');
            this.hooks.sound('crash');
            this.score.fail('Tabrakan ' + this.collisionText);
            this.speed = 0; this.finished = true; this.hooks.changed('finished');
            return;
          }
        }
      }
    }
  }

  // ---------- wesel ----------
  updateSwitchLocks() {
    this.lockedSw.clear(); this.occSw.clear();

    const occ = AxleCounter.occupancy(this.trains, this.geo);
    for (const s of (J.arr(this.data, 'switches') || [])) {
      if (!s) continue;
      const br = this.geo.branches(s), pv = this.geo.pivot(br), key = J.str(s, 'id', '').toUpperCase();
      let routed = false;

      let busy = false;
      if (pv) { const zone = J.num(s, 'zone', SWITCH_ZONE_M) || SWITCH_ZONE_M; for (const id of this.geo.zone(s)) if (AxleCounter.nearPivot(occ, this.geo, id, pv, zone)) { busy = true; break; } }

  handleSwitchTouch(swId) {

    if (!s) return false;
    const group = this.switchGroup(s);
    for (const g of group) {
      if (this.isSwitchMoving(g)) { this.err(`Wesel ${J.str(g, 'id', '?')} sedang bergerak`); return false; }
      if (this.isSwitchLocked(g)) { this.err(`Wesel ${J.str(g, 'id', '?')} terkunci`); return false; }
    }
    const cnt = this.geo.branches(s).length;

    }
    keys.forEach((k, i) => this.moving.set(k, nexts[i]));

    this.hooks.sound('switch');
    this.later(SWITCH_MOVE_MS, () => {
      if (!keys.some(k => this.moving.has(k))) return;
      keys.forEach(k => this.moving.delete(k));
      this.updateSwitchLocks();
      if (!moved.some(g => this.isSwitchLocked(g))) moved.forEach((g, i) => this.geo.setActiveIndex(g, nexts[i]));
      else this.err(`Wesel ${J.str(s, 'id', '?')} batal: terkunci`);
    });
    return true;
  }

  // ---------- rute ----------
  isBlockedByOtherRoute(ownSig, path) {
    for (const ar of this.routes) {

      const ap = ar.path;
      for (const t of path) {
        if (!ap.includes(t)) continue;
        const handover = ap.length && path.length && ((t === path[0] && t === ap[ap.length - 1]) || (t === path[path.length - 1] && t === ap[0]));
        if (handover) continue;

    return false;
  }

    for (const ar of this.routes) {

      const ap = ar.path;
      for (const t of newPath) {
        if (!ap.includes(t)) continue;
        const handover = ap.length && newPath.length && ((t === newPath[0] && t === ap[ap.length - 1]) || (t === newPath[newPath.length - 1] && t === ap[0]));
        if (!handover) return true;
      }
    }
    return false;
  }
  createAutoRoute(sig, path) {
    if (this.isBlockedByOtherRoute(J.str(sig, 'id', ''), path)) return false;
    const r = new ActiveRoute('R_' + J.str(sig, 'id', '') + '_' + path[path.length - 1], J.str(sig, 'id', ''), 'BLOCK', path[path.length - 1], path.slice(), []);
    r.locking = false; r.mode = J.str(sig, 'facing', 'NORMAL');

    return true;
  }

    if (!this.data) return false;
    if (this.pendingRoute || this.pendingCancel) return true;
    this.selectedSwitch = null;
    const sig = this.geo.signal(signalId);
    if (!sig) return false;
    if (isAutoSig(sig)) { this.err('Sinyal ini bekerja otomatis'); return false; }
    const existing = this.findRouteBySignal(J.str(sig, 'id', signalId));
    if (existing) {
      if (existing.cancelling || existing.cancelPending) return this.handleRouteCancel(existing);
      this.pendingCancel = existing;
      this.pendingCancelDesc = this.describeCancel(existing);
      return true;
    }
    const res = this.pb.build(sig, true);
    if (!res) { this.err('Tidak ada jalur di depan sinyal ' + signalId); return false; }
    const e = this.validateRoute(sig, res.path);

  }
  validateRoute(sig, path) {
    const sigId = J.str(sig, 'id', '');
    for (const r of this.routes) if (J.eqi(sigId, r.signalId)) return `Sinyal ${sigId} sudah memiliki rute aktif`;
    if (this.isRouteConflicting('R_' + sigId + '_' + path[path.length - 1], [], path)) return 'Jalur bertabrakan dengan rute aktif';
    for (const s of (J.arr(this.data, 'switches') || [])) {
      if (!s) continue;
      const br = this.geo.branches(s);
      const used = this.geo.usedBranch(path, br, this.geo.pivot(br));
      if (used === -1) continue;
      if (this.isSwitchMoving(s)) return `Wesel ${J.str(s, 'id', '?')} sedang bergerak`;
      if (used !== this.geo.activeBranch(s)) return `Wesel ${J.str(s, 'id', '?')} harus ${this.geo.posLabel(br.indexOf(used), br.length)}`;
    }
    for (let i = 1; i < path.length; i++) for (const t of this.trains) if (t.occupied(this.geo).includes(path[i])) return `Track ${path[i]} sedang ditempati kereta`;
    return null;
  }
  describeRoute(sig, res) {
    const down = sigDown(sig);
    let s = `Sinyal ${J.str(sig, 'id', '?')} ${down ? '(arah ke bawah / kanan)' : '(arah ke atas / kiri)'}\n\nJalur: ${res.path.join(' → ')}`;
    const last = res.path[res.path.length - 1];
    s += '\n\nTujuan: ';
    if (res.endType === 'END') s += `keluar stasiun (track ${last})`;
    else if (res.endType === 'SINYAL') s += `sinyal ${res.endSignalId} (track ${last})`;
    else s += `ujung jalur (track ${last})`;
    const w = [];
    for (const sw of (J.arr(this.data, 'switches') || [])) {
      if (!sw) continue;
      const br = this.geo.branches(sw);
      const used = this.geo.usedBranch(res.path, br, this.geo.pivot(br));
      if (used === -1) continue;
      w.push(J.str(sw, 'id', '?') + ' ' + this.geo.posLabel(br.indexOf(used), br.length));
    }
    if (w.length) s += '\n\nWesel: ' + w.join(', ');
    if (sigType(sig) === 'SHUNT') s += '\n\nRute langsir, maks 15 km/j';
    if (res.wrongWay.length) s += `\n\n⚠ PERINGATAN: rute melawan arah di track ${res.wrongWay.join(', ')}.\nLanjutkan?`;

  }
  cancelPendingRoute() { this.pendingRoute = null; this.pendingPath = null; this.pendingDesc = ''; this.selSig = null; this.selSigType = null; this.selSigTrack = null; }
  confirmPendingRoute() {
    if (!this.pendingRoute) return;
    const ro = this.pendingRoute, path = this.pendingPath;
    this.pendingRoute = null; this.pendingPath = null; this.pendingDesc = '';
    const sig = this.geo.signal(this.selSig);

  }
  activateRoute(ro) {

    const r = new ActiveRoute(ro.id, sigId, sType, ro.destination, path, ro.conflicts.slice());

        if (!attachTo(waiting)) this.spawner.spawnForRoute(r, mode, -1, this.time(), this.processed);
      } else if (J.eqi(sType, 'EXIT')) {
        this.setSignal(sigId, 'GREEN');
        attachTo(t => !t.turnback && (t.curId === sTrack || t.target === sTrack || this.isTrainWaitingAtSignalTrack(t, sTrack)));
      } else if (J.eqi(sType, 'SHUNT')) {

  }
  isTrainWaitingAtSignalTrack(t, st) { const i = t.path.indexOf(st); return i !== -1 && i === t.path.length - 1 && t.idx <= i; }

    const rp = r.path;

    const tp = t.path;
